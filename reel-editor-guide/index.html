<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動画編集ツール 使い方</title>
<style>
:root{--bg:#0a0c11;--panel:#141821;--line:#232936;--ink:#e8eaf0;--dim:#8b93a7;--ac:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;display:flex;min-height:100vh}
aside{width:320px;flex:0 0 320px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 0}
aside h1{font-size:15px;margin:0 20px 4px}
aside .sub{font-size:11.5px;color:var(--dim);margin:0 20px 18px;line-height:1.6}
.it{display:flex;gap:11px;padding:12px 20px;cursor:pointer;border-left:3px solid transparent}
.it:hover,.it.on{background:#1b2130}.it.on{border-left-color:var(--ac)}
.it .n{font-size:11px;color:var(--dim);padding-top:2px;min-width:20px}
.it .t{font-size:13px;font-weight:600;line-height:1.45}
.it .d{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5}
.it .dot{width:7px;height:7px;border-radius:50%;background:#2c3444;margin-top:5px;flex:0 0 7px}
.it.seen .dot{background:var(--ac)}
main{flex:1;min-width:0;display:flex;flex-direction:column;padding:28px 32px;gap:14px}
video{width:100%;max-height:74vh;background:#000;border-radius:10px;border:1px solid var(--line)}
h2{font-size:18px;margin:0} p.d{margin:0;color:var(--dim);font-size:13px}
.nav{display:flex;gap:10px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--ac)}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--line);max-height:38vh}main{padding:18px 16px}}
</style></head><body>
<aside><h1>動画編集ツール 使い方</h1>
<p class="sub">撮った動画を入れて、直して、書き出すまで。上から順に見てください。<br>全 5 本 ／ 約 4 分</p>
<div id="list"></div></aside>
<main><video id="vid" controls playsinline></video>
<h2 id="ttl"></h2><p class="d" id="dsc"></p>
<div class="nav"><button id="prev">← 前</button><button id="next">次 →</button></div></main>
<script>
const ITEMS=[{"id":"01-hajimeru","title":"01 撮った動画から自動で作る","desc":"「新しい動画」に入れるだけで、カット・字幕・演出まで自動","file":"v/01-hajimeru.mp4","webm":"v/01-hajimeru.webm"},{"id":"02-telop-timing","title":"02 テロップの出るタイミングを直す","desc":"1コマずつ後ろ・前へ。全部まとめてずらすこともできる","file":"v/02-telop-timing.mp4","webm":"v/02-telop-timing.webm"},{"id":"03-jetcut","title":"03 ジェットカットの詰め具合を直す","desc":"つなぎ目ごとに「もっと残す」「詰める」","file":"v/03-jetcut.mp4","webm":"v/03-jetcut.webm"},{"id":"04-moji","title":"04 文字の間違いを直す","desc":"直すとツールが覚えて、次の動画から最初から正しく出る","file":"v/04-moji.mp4","webm":"v/04-moji.webm"},{"id":"05-check-kakidashi","title":"05 チェックして書き出す","desc":"11項目の自動チェック → 完成動画を書き出す","file":"v/05-check-kakidashi.mp4","webm":"v/05-check-kakidashi.webm"}];
const L=document.getElementById('list'),V=document.getElementById('vid');
let cur=0,seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem('rf-seen')||'[]'));cur=+(localStorage.getItem('rf-cur')||0)||0;}catch(e){}
L.innerHTML=ITEMS.map((x,i)=>'<div class="it" data-i="'+i+'"><div class="dot"></div><div class="n">'+String(i+1).padStart(2,'0')+'</div><div><div class="t">'+x.title.replace(/^\d+\s*/,'')+'</div><div class="d">'+x.desc+'</div></div></div>').join('');
function paint(){[...L.children].forEach((e,i)=>{e.classList.toggle('on',i===cur);e.classList.toggle('seen',seen.has(ITEMS[i].id));});}
function load(i){cur=Math.max(0,Math.min(ITEMS.length-1,i));const x=ITEMS[cur];
  V.removeAttribute('src');V.innerHTML='';
  const s=document.createElement('source');s.src=x.webm;s.type='video/webm';V.appendChild(s);
  const m=document.createElement('source');m.src=x.file;m.type='video/mp4';V.appendChild(m);V.load();
  document.getElementById('ttl').textContent=x.title;document.getElementById('dsc').textContent=x.desc;
  paint();try{localStorage.setItem('rf-cur',cur);}catch(e){}}
L.addEventListener('click',e=>{const d=e.target.closest('.it');if(d)load(+d.dataset.i);});
V.addEventListener('ended',()=>{seen.add(ITEMS[cur].id);try{localStorage.setItem('rf-seen',JSON.stringify([...seen]));}catch(e){}paint();if(cur<ITEMS.length-1){load(cur+1);V.play().catch(()=>{});}});
document.getElementById('prev').onclick=()=>load(cur-1);document.getElementById('next').onclick=()=>load(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')load(cur+1);if(e.key==='ArrowLeft')load(cur-1);});
load(cur);
</script></body></html>
