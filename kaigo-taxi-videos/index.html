<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>かもめケアタクシー 運行日報・請求システム｜使い方動画</title>
<style>
:root{--brand:#1c55af;--brand-50:#eff5fd;--brand-100:#dce8f9;--ink:#0f172a;--sub:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;background:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 4px}
.brand img{height:38px;width:auto}
.brand b{display:block;font-size:15px;line-height:1.35}
.brand span{display:block;font-size:12px;color:var(--sub)}
.prog{margin:14px 6px 6px;font-size:12px;color:var(--sub);font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--brand-100);margin:6px 6px 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.g{margin:16px 6px 6px;font-size:12px;font-weight:700;color:var(--brand)}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:9px 10px;margin:2px 0}
.item:hover{background:#f8fafc}
.item.on{background:var(--brand-50);border-color:var(--brand-100)}
.dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #cbd5e1;margin-top:3px}
.item.seen .dot{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.item .t{flex:1;font-weight:700;font-size:14px;line-height:1.45}
.item .l{flex:none;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;margin-top:2px}
main{padding:28px clamp(16px,4vw,48px) 60px;max-width:1240px;width:100%}
.crumb{font-size:13px;font-weight:700;color:var(--brand)}
h1{font-size:clamp(20px,2.4vw,28px);margin:4px 0 6px;line-height:1.4}
.desc{color:#334155;margin:0 0 16px;max-width:60em}
video{display:block;width:100%;aspect-ratio:16/10;background:#f1f5f9;border:1px solid var(--line);border-radius:16px}
video.phone{width:auto;max-width:100%;height:min(78vh,820px);aspect-ratio:390/844;margin:0 auto;border-radius:24px;border:1px solid var(--line);box-shadow:0 8px 30px rgba(15,23,42,.08)}
.navs{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.navs button{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.navs button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.navs button:disabled{opacity:.35;cursor:default}
.note{margin-top:18px;font-size:13px;color:var(--sub)}
.top{display:none}
@media (max-width:900px){
 .app{display:block}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 12px 10px}
 .list{display:none}.list.open{display:block}
 .top{display:flex;width:100%;min-height:46px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;margin-top:8px}
 main{padding:18px 14px 50px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><img src="logo-mark.svg" alt=""><div><b>運行日報・請求システム</b><span>かもめケアタクシー｜使い方動画</span></div></div>
  <div class="prog" id="prog"></div><div class="bar"><i id="bar"></i></div>
  <button class="top" id="toggle" type="button">動画の一覧を開く</button>
  <div class="list" id="list"></div>
</aside>
<main>
  <div class="crumb" id="crumb"></div>
  <h1 id="title"></h1>
  <p class="desc" id="desc"></p>
  <video id="vid" controls playsinline preload="metadata"></video>
  <div class="navs"><button id="prev" type="button">前の動画</button><button id="next" class="pri" type="button">次の動画</button></div>
  <p class="note">画面のお名前や金額は、説明用の見本です。キーボードの左右の矢印でも、前後の動画に移れます。</p>
</main>
</div>
<script>
const VIDEOS=[{"id":"gaiyou","group":"はじめに","title":"このシステムでできること（全体のご紹介）","desc":"運行日報の入力から、予約、月の集計、請求書までの全体を2分ほどでご紹介します。","file":"gaiyou.mp4","len":"0:57","phone":false},{"id":"d-start","group":"ドライバー（スマホ）","title":"1日のスタート（始まりのメーター）","desc":"朝いちばんにやることは、車のメーターの数字を入れて「スタート」を押すことだけです。","file":"d-start.mp4","len":"0:35","phone":true},{"id":"d-unkou","group":"ドライバー（スマホ）","title":"予定から運行を入力する（乗車・降車・料金）","desc":"予定を押すと、1画面に1つずつ聞かれます。入れていない項目があると「次へ」は押せません。","file":"d-unkou.mp4","len":"1:05","phone":true},{"id":"d-tochu","group":"ドライバー（スマホ）","title":"乗せたところで一度閉じる（着いてから続きを入れる）","desc":"乗せたときのメーターだけ入れて閉じ、着いてから降車の続きを入れられます。","file":"d-tochu.mp4","len":"0:23","phone":true},{"id":"d-tsuika","group":"ドライバー（スマホ）","title":"予定にない運行を追加する","desc":"急な依頼など、予定に入っていない運行は「運行を追加」から入力します。","file":"d-tsuika.mp4","len":"0:32","phone":true},{"id":"d-option","group":"ドライバー（スマホ）","title":"細かい項目（介護保険・迎車・割引・介助料・付添・支払い）","desc":"介護保険、迎車料金、障害者割引、介助料などの追加、付添、支払い方法の選び方をまとめて説明します。","file":"d-option.mp4","len":"1:01","phone":true},{"id":"d-kaeri","group":"ドライバー（スマホ）","title":"帰りの運行と、次回の予約を入れる","desc":"「保存＋帰り」で帰りの入力に続けて進めます。ご自宅へお送りしたときは、次回の予約をその場で入れられます。","file":"d-kaeri.mp4","len":"0:48","phone":true},{"id":"d-owari","group":"ドライバー（スマホ）","title":"1日の終わりと、事務所への送信","desc":"帰ってきたら終わりのメーターを入れて、日報を事務所へ送信します。","file":"d-owari.mp4","len":"0:30","phone":true},{"id":"yoyaku-matome","group":"予約と送迎","title":"来月の予約をまとめて入れる","desc":"カレンダーで日付をいくつも選んで、同じ内容の予約を一度に登録できます。帰りの予約も同時に作れます。","file":"yoyaku-matome.mp4","len":"0:54","phone":false},{"id":"sougei-list","group":"予約と送迎","title":"明日の送迎リストを見る","desc":"担当ごとに、お迎えの時刻の順番で並んだリストを確認できます。そのまま印刷もできます。","file":"sougei-list.mp4","len":"0:37","phone":false},{"id":"gcal","group":"予約と送迎","title":"Googleカレンダーとの連携と、スタッフへの共有","desc":"予約を保存すると、Googleカレンダーに自動で入ります。連携の確認のしかたと、スタッフのスマホで見られるようにする共有の手順です。","file":"gcal.mp4","len":"1:14","phone":false},{"id":"cancel","group":"予約と送迎","title":"キャンセルの入れ方と見え方","desc":"予約のキャンセルと、当日のキャンセルの入れ方です。キャンセルは消えずに、赤い表示で残ります。","file":"cancel.mp4","len":"0:48","phone":false},{"id":"shukei","group":"事務所の月の作業","title":"月次集計と検算、Excel出力","desc":"日報が自動で集計されます。3つの合計が1円単位で合っているかを画面が確かめ、Excelにも出せます。","file":"shukei.mp4","len":"0:47","phone":false},{"id":"seikyu","group":"事務所の月の作業","title":"請求書と領収書を出す","desc":"利用者ごとの請求書が自動で作られます。プレビューで確認して、まとめて印刷できます。","file":"seikyu.mp4","len":"0:52","phone":false},{"id":"ticket","group":"事務所の月の作業","title":"チケットの集計表を出す","desc":"タクシーチケットの利用を、市ごとに自動で集計します。提出用にそのまま印刷やExcel出力ができます。","file":"ticket.mp4","len":"0:28","phone":false},{"id":"karte","group":"事務所の月の作業","title":"利用者カルテで履歴を見る","desc":"利用者ごとに、今後の予約と、これまでの乗車の履歴をまとめて確認できます。","file":"karte.mp4","len":"0:32","phone":false},{"id":"master","group":"はじめの設定","title":"利用者・場所・料金を登録する","desc":"ここで登録した内容が、日報や予約で選ぶときの選択肢になります。","file":"master.mp4","len":"0:44","phone":false},{"id":"admin","group":"はじめの設定","title":"ユーザーの追加と、バックアップ","desc":"ログインできる人の追加と権限の決め方、バックアップの取り方と戻し方です。管理者だけが使える画面です。","file":"admin.mp4","len":"1:10","phone":false}];const VER=1795735791693;
const $=(i)=>document.getElementById(i);const KEY='kamome-videos-seen';
let seen=[];try{seen=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let cur=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(seen));localStorage.setItem(KEY+'-last',VIDEOS[cur].id)}catch(e){}}
function draw(){
  let h='',g='';
  VIDEOS.forEach((v,i)=>{if(v.group!==g){g=v.group;h+='<div class="g">'+g+'</div>'}
    h+='<button type="button" class="item'+(i===cur?' on':'')+(seen.includes(v.id)?' seen':'')+'" data-i="'+i+'"><span class="dot"></span><span class="t">'+v.title+'</span><span class="l">'+v.len+'</span></button>'});
  $('list').innerHTML=h;
  const n=VIDEOS.filter(v=>seen.includes(v.id)).length;$('prog').textContent='見た動画 '+n+' / '+VIDEOS.length+' 本';$('bar').style.width=(n/VIDEOS.length*100)+'%';
}
function show(i,play){cur=Math.max(0,Math.min(VIDEOS.length-1,i));const v=VIDEOS[cur];
  $('crumb').textContent=v.group+'　'+(cur+1)+' / '+VIDEOS.length;$('title').textContent=v.title;$('desc').textContent=v.desc;
  const el=$('vid');el.className=v.phone?'phone':'';el.src=v.file+'?v='+VER;el.load();if(play)el.play().catch(()=>{});
  $('prev').disabled=cur===0;$('next').disabled=cur===VIDEOS.length-1;history.replaceState(null,'','#'+v.id);save();draw();$('list').classList.remove('open')}
$('list').addEventListener('click',(e)=>{const b=e.target.closest('.item');if(b)show(+b.dataset.i,true)});
$('prev').onclick=()=>show(cur-1,true);$('next').onclick=()=>show(cur+1,true);
$('toggle').onclick=()=>$('list').classList.toggle('open');
$('vid').addEventListener('ended',()=>{const id=VIDEOS[cur].id;if(!seen.includes(id))seen.push(id);save();draw()});
document.addEventListener('keydown',(e)=>{if(e.target.tagName==='VIDEO')return;if(e.key==='ArrowRight')show(cur+1,true);if(e.key==='ArrowLeft')show(cur-1,true)});
let start=VIDEOS.findIndex(v=>'#'+v.id===location.hash);
if(start<0){try{start=VIDEOS.findIndex(v=>v.id===localStorage.getItem(KEY+'-last'))}catch(e){}}
show(start<0?0:start,false);
</script>
</body>
</html>
