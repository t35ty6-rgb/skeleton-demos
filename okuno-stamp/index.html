<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おくの電化 押印ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="押印ツール">
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<style>
:root{
  --accent:#1D9BF0;--accent-ink:#0B7EC8;--accent-soft:#E8F5FE;
  --ground:#F4F8FB;--surface:#FFFFFF;--line:#E1E8ED;
  --ink:#0F1419;--ink-2:#536471;--ink-3:#8B98A5;--red:#D92A22;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto}
.brand img{width:34px;height:34px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);color:#fff}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.line{background:#06C755;border-color:#06C755;color:#fff;font-weight:700}
.btn.line:hover{background:#05B34C;border-color:#05B34C;color:#fff}
.dock{display:none}
.btn.add{padding-left:10px}
.btn.add img{width:22px;height:22px;margin-right:2px}
.inkans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.inkans figure{margin:0;text-align:center}
.inkans .inkan{margin-bottom:0}
.inkans figcaption{font-size:13px;font-weight:500;margin:8px 0 6px}
.inkans .btn{font-size:12px;padding:6px 12px}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.size input[type=range]{width:110px;accent-color:var(--accent)}
.size b{color:var(--ink);font-weight:700;min-width:44px;display:inline-block}
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}

/* 最初の画面 */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
.drop{background:var(--surface);border:2px dashed #C5D6E3;border-radius:20px;padding:56px 28px;text-align:center;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin-bottom:18px}
.drop h2{margin:0 0 8px;font-size:22px}
.drop p{margin:0 0 22px;color:var(--ink-2);font-size:14px;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--ink-3);font-size:12px;margin-bottom:16px}
.inkan{display:grid;place-items:center;background:
  linear-gradient(var(--surface),var(--surface)) padding-box;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px;
  background-image:linear-gradient(45deg,#F2F5F8 25%,transparent 25%,transparent 75%,#F2F5F8 75%),linear-gradient(45deg,#F2F5F8 25%,transparent 25%,transparent 75%,#F2F5F8 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
.inkan img{width:120px;height:120px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;font-size:14px;line-height:1.6;padding:6px 0;color:var(--ink-2)}
.steps li::before{content:counter(s);flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}

/* 編集画面 */
.ws{display:none}
.ws.on{display:block}
.tip{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px;display:flex;gap:8px;align-items:center}
.fname{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 40px}
.fname label{font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.fname .in{flex:1;min-width:220px;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}
.fname .in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fname input{flex:1;border:0;outline:0;font:inherit;font-size:15px;padding:10px 0;color:var(--ink);min-width:0;background:transparent}
.fname .ext{color:var(--ink-3);font-size:14px}
.page{position:relative;margin:0 auto 26px;background:#fff;box-shadow:0 1px 2px rgba(15,20,25,.08),0 0 0 1px var(--line);touch-action:pan-y}
.page canvas{display:block;width:100%;height:100%}
.pno{position:absolute;left:-1px;top:-24px;font-size:12px;color:var(--ink-3)}
.st{position:absolute;touch-action:none;cursor:move;user-select:none;-webkit-user-select:none}
.st img{width:100%;height:100%;display:block;mix-blend-mode:multiply;pointer-events:none}
.st .frame{position:absolute;inset:-4px;border:1.5px dashed var(--accent);border-radius:4px;opacity:0;transition:.12s}
.st.sel .frame,.st:hover .frame{opacity:1}
.st .h{position:absolute;right:-12px;bottom:-12px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 1px var(--accent);cursor:nwse-resize;opacity:0;touch-action:none}
.st .x{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-size:14px;line-height:20px;text-align:center;padding:0;opacity:0}
.st.sel .h,.st.sel .x{opacity:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;place-items:center;z-index:40;font-weight:500;color:var(--ink-2)}
.busy.on{display:grid}
@media (max-width:760px){
  header{position:static}
  header #save, header #line{display:none}
  .toast{white-space:nowrap;font-size:13px}
  .dock.on{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .dock .line{flex:1;justify-content:center;font-size:17px;padding:15px 18px}
  .dock .sv{padding:15px 16px}
  main{padding-bottom:120px}
  .toast{bottom:100px}
  .hero{grid-template-columns:1fr}
  .bar{padding:10px 14px;gap:10px}
  .brand{width:100%}
  .size input[type=range]{width:90px}
  main{padding:20px 12px 80px}
  .btn{padding:8px 14px;font-size:13px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span style="width:34px;height:34px;border-radius:10px;background:#1D9BF0;display:grid;place-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 15l2 2 4-4"/></svg></span><div>押印ツール<small>有限会社 おくの電化</small></div></div>
    <div class="size" id="sizebox">大きさ <input type="range" id="size" min="8" max="45" step="0.5" value="21"><b id="sizev">21mm</b></div>
    <button class="btn add" data-k="kaku" disabled><img src="stamp.png" alt="">＋ 角印</button><button class="btn add" data-k="maru" disabled><img src="maru.png" alt="">＋ 奥野</button>
    <button class="btn" id="open">PDFを開く</button>
    <button class="btn line" id="line" data-act="line" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.6 1.6 4.9 4 6.4V21l3.4-2.3c.8.2 1.7.3 2.6.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>LINEで送る</button>
    <button class="btn primary" id="save" data-act="save" disabled>押印したPDFを保存</button>
  </div>
</header>

<main>
  <section id="start">
    <div class="hero">
      <label class="drop" id="drop">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1D9BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
        <h2>PDFをここに入れてください</h2>
        <p>見積書・請求書・納品書などのPDFを<br>ドラッグするか、ボタンから選びます</p>
        <span class="btn primary">PDFを選ぶ</span>
        <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      </label>
      <div class="card">
        <h3>使う印</h3>
        <div class="sub">背景を透明にした印影（朱色）。上の「＋ 角印」「＋ 奥野」で置けます</div>
        <div class="inkans">
          <figure><div class="inkan"><img src="stamp.png" alt="おくの電化 角印"></div><figcaption>角印（社印）</figcaption><button class="btn png" data-k="kaku">画像を保存（PNG）</button></figure>
          <figure><div class="inkan"><img src="maru.png" alt="奥野 丸印"></div><figcaption>丸印（奥野）</figcaption><button class="btn png" data-k="maru">画像を保存（PNG）</button></figure>
        </div>
        <ul class="steps">
          <li>PDFを入れると、1ページ目の右上に角印が置かれます。奥野の丸印は「＋ 奥野」で追加</li>
          <li>印をドラッグして社名の上へ。右下の青い丸で大きさを変えます</li>
          <li>「押印したPDFを保存」で完成。ページをダブルクリックでも印を追加できます</li>
        </ul>
              </div>
    </div>
  </section>

  <section class="ws" id="ws">
    <div class="tip">印はドラッグで移動、右下の青い丸で拡大縮小、× で削除。位置を合わせたら「LINEで送る」を押すだけ。次からは同じ位置に自動で置きます。</div>
    <div class="fname"><label for="outname">保存するファイル名</label><div class="in"><input id="outname" autocomplete="off" spellcheck="false"><span class="ext">.pdf</span></div></div>
    <div id="pages"></div>
  </section>
</main>
<div class="dock" id="dock"><button class="btn line" data-act="line"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.6 1.6 4.9 4 6.4V21l3.4-2.3c.8.2 1.7.3 2.6.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>LINEで送る</button><button class="btn sv" data-act="save">保存</button></div>
<div class="busy" id="busy">読み込み中…</div>
<div class="toast" id="toast"></div>

<script>
const KINDS = {
  kaku:{src:"stamp.png", file:"おくの電化_角印.png", def:21},
  maru:{src:"maru.png",  file:"奥野_丸印.png",     def:12}
};
let kind = "kaku";
const _sb={}; const stampBytes = async (k="kaku") => _sb[k] || (_sb[k] = new Uint8Array(await (await fetch(KINDS[k].src)).arrayBuffer()));
const MM = 72/25.4;            // 1mm = 2.8346pt
const $ = s => document.querySelector(s);
pdfjsLib.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";

// 「_E3_82_A8…」「%E3%82%A8…」のように文字化けした名前を日本語に戻す
function cleanName(n){
  n = n.replace(/\.pdf$/i,"");
  const dec = s => { try{ return decodeURIComponent(s); }catch(e){ return null; } };
  n = n.replace(/(?:%[0-9A-Fa-f]{2})+/g, m => { const d=dec(m); return d && /[^\x00-\x7f]/.test(d) ? d : m; });
  n = n.replace(/(?:_[0-9A-Fa-f]{2}){2,}/g, m => { const d=dec(m.replace(/_/g,"%")); return d && /[^\x00-\x7f]/.test(d) ? d : m; });
  n = n.replace(/_押印(\s*\(\d+\))?$/,"");           // 押印済みを入れ直したとき二重にしない
  n = n.replace(/[\\/:*?"<>|]+/g,"_").replace(/^[\s_]+|[\s_]+$/g,"");
  return n || "書類";
}
function outName(){
  let v = ($("#outname")?.value || "").trim().replace(/\.pdf$/i,"").replace(/[\\/:*?"<>|]+/g,"_");
  return (v || fileName + "_押印") + ".pdf";
}
let pdfBytes = null, fileName = "", pages = [], stamps = [], sel = null;
const SZ = {};
for(const k in KINDS){ SZ[k]=KINDS[k].def; try{ const v=parseFloat(localStorage.getItem("okuno_stamp_mm_"+k) ?? (k==="kaku"?localStorage.getItem("okuno_stamp_mm"):null)); if(v>=8&&v<=60) SZ[k]=v; }catch(e){} }
const saveSZ = k => { try{ localStorage.setItem("okuno_stamp_mm_"+k, SZ[k]); }catch(e){} };
$("#size").value = SZ.kaku; $("#sizev").textContent = SZ.kaku+"mm";

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),2600); }
function busy(on,t){ $("#busy").textContent=t||"読み込み中…"; $("#busy").classList.toggle("on",on); }

/* ---------- ファイル入力 ---------- */
$("#file").addEventListener("change", e => { const f=e.target.files[0]; if(f) loadFile(f); e.target.value=""; });
$("#open").addEventListener("click", () => $("#file").click());
const drop = $("#drop");
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if(ev==="drop"||e.target===drop) drop.classList.remove("over"); }));
document.addEventListener("drop", e => { const f=[...(e.dataTransfer?.files||[])].find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)); if(f) loadFile(f); else if(e.dataTransfer?.files?.length) toast("PDFファイルを入れてください"); });

async function loadFile(f){
  busy(true);
  try{
    const buf = await f.arrayBuffer();
    pdfBytes = new Uint8Array(buf.slice(0));
    fileName = cleanName(f.name);
    const doc = await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    stamps.forEach(s=>s.el.remove()); stamps=[]; pages=[]; sel=null;
    const wrap=$("#pages"); wrap.innerHTML="";
    const maxW = Math.min(wrap.clientWidth || $("main").clientWidth-40, 860);
    for(let i=1;i<=doc.numPages;i++){
      const pg = await doc.getPage(i);
      const vp1 = pg.getViewport({scale:1});
      const scale = maxW / vp1.width;          // 画面px / pt
      const vp = pg.getViewport({scale});
      const dpr = Math.min(window.devicePixelRatio||1, 2.5);
      const box = document.createElement("div"); box.className="page";
      box.style.width=vp.width+"px"; box.style.height=vp.height+"px";
      const lab=document.createElement("div"); lab.className="pno"; lab.textContent=i+" / "+doc.numPages+" ページ"; box.appendChild(lab);
      const cv=document.createElement("canvas"); cv.width=Math.round(vp.width*dpr); cv.height=Math.round(vp.height*dpr);
      box.appendChild(cv); wrap.appendChild(box);
      await pg.render({canvasContext:cv.getContext("2d"), viewport:pg.getViewport({scale:scale*dpr})}).promise;
      const P = {index:i-1, el:box, vp, scale};
      pages.push(P);
      box.addEventListener("dblclick", e => { const r=box.getBoundingClientRect(); const s=SZ[kind]*MM*scale; addStamp(P, e.clientX-r.left-s/2, e.clientY-r.top-s/2); });
      box.addEventListener("pointerdown", e => { if(e.target===cv) select(null); });
    }
    $("#start").style.display="none"; $("#ws").classList.add("on");
    $("#outname").value = fileName + "_押印";
    document.querySelectorAll(".btn.add,[data-act]").forEach(b=>b.disabled=false); $("#dock").classList.add("on");
    if(!restoreLayout()){
      // 1ページ目の右上に1つ置く
      kind="kaku"; const p0=pages[0], s=SZ.kaku*MM*p0.scale;
      addStamp(p0, p0.vp.width - s - 36*MM*p0.scale*0.5 - s*0.6, 28*MM*p0.scale*0.5 + s*0.9);
    } else toast("前回と同じ位置に印を置きました");
    select(null);
    window.scrollTo({top:0});
  }catch(err){
    console.error(err); toast(/password/i.test(err?.name||err?.message||"") ? "パスワード付きのPDFは開けません" : "PDFを開けませんでした");
  }finally{ busy(false); }
}

/* ---------- 印の操作 ---------- */
function addStamp(P, x, y, k=kind){
  kind=k;
  const S = {page:P, x, y, kind:k, mm:SZ[k], el:document.createElement("div")};
  S.el.className="st";
  S.el.innerHTML='<img alt="" src="'+KINDS[k].src+'"><div class="frame"></div><button class="x" title="削除">×</button><div class="h"></div>';
  P.el.appendChild(S.el);
  stamps.push(S); place(S); select(S); bind(S);
  return S;
}
function px(S){ return S.mm*MM*S.page.scale; }
function place(S){
  const s=px(S), W=S.page.vp.width, H=S.page.vp.height;
  S.x=Math.max(-s*0.3,Math.min(W-s*0.7,S.x)); S.y=Math.max(-s*0.3,Math.min(H-s*0.7,S.y));
  Object.assign(S.el.style,{left:S.x+"px",top:S.y+"px",width:s+"px",height:s+"px"});
  markDirty();
}
function select(S){
  stamps.forEach(t=>t.el.classList.toggle("sel",t===S)); sel=S;
  if(S){ kind=S.kind; $("#size").value=S.mm; $("#sizev").textContent=S.mm+"mm"; }
}
function bind(S){
  const el=S.el;
  el.querySelector(".x").addEventListener("pointerdown", e=>e.stopPropagation());
  el.querySelector(".x").addEventListener("click", e=>{ e.stopPropagation(); el.remove(); stamps=stamps.filter(t=>t!==S); if(sel===S) sel=null; markDirty(); });
  el.addEventListener("pointerdown", e=>{
    if(e.target.classList.contains("x")) return;
    e.preventDefault(); select(S);
    const resize = e.target.classList.contains("h");
    const sx=e.clientX, sy=e.clientY, ox=S.x, oy=S.y, om=S.mm;
    el.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(resize){
        const d=(dx+dy)/2/(MM*S.page.scale);
        S.mm=Math.round(Math.max(8,Math.min(60,om+d))*2)/2;
        $("#size").value=Math.min(45,Math.max(12,S.mm)); $("#sizev").textContent=S.mm+"mm";
      } else { S.x=ox+dx; S.y=oy+dy; }
      place(S);
    };
    const up=()=>{ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up); el.removeEventListener("pointercancel",up);
      if(resize){ SZ[S.kind]=S.mm; saveSZ(S.kind); } };
    el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  });
}
document.addEventListener("keydown", e=>{
  if(!sel || /input|textarea/i.test(document.activeElement?.tagName)) return;
  if(e.key==="Delete"||e.key==="Backspace"){ sel.el.remove(); stamps=stamps.filter(t=>t!==sel); sel=null; markDirty(); e.preventDefault(); }
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(k){ const st=e.shiftKey?10:1; sel.x+=k[0]*st; sel.y+=k[1]*st; place(sel); e.preventDefault(); }
});
$("#size").addEventListener("input", e=>{
  const v=parseFloat(e.target.value); $("#sizev").textContent=v+"mm";
  const k = sel ? sel.kind : kind; SZ[k]=v; saveSZ(k);
  if(sel){ const c=px(sel)/2, cx=sel.x+c, cy=sel.y+c; sel.mm=v; const n=px(sel)/2; sel.x=cx-n; sel.y=cy-n; place(sel); }
});
document.querySelectorAll(".btn.add").forEach(btn=>btn.addEventListener("click", ()=>{
  const k=btn.dataset.k;
  if(!pages.length) return;
  // いま画面の中央に一番近いページ
  const mid=innerHeight/2; let best=pages[0], bd=1e9;
  pages.forEach(P=>{ const r=P.el.getBoundingClientRect(); let d=Math.abs((r.top+r.bottom)/2-mid); if(r.top<mid&&r.bottom>mid){d=0;} if(d<bd){bd=d;best=P;} });
  const r=best.el.getBoundingClientRect(), s=SZ[k]*MM*best.scale;
  const y=Math.max(20, Math.min(best.vp.height-s-20, mid-r.top-s/2));
  addStamp(best, best.vp.width/2 - s/2, y, k);
}));

/* ---------- 保存・LINE送信 ---------- */
function offer(name, bytes, mime, msg){
  try{
    const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000); toast(msg||"保存しました");
  }catch(e){ toast("保存できませんでした"); }
}
const canShareFiles = (()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File([new Uint8Array(1)],"a.pdf",{type:"application/pdf"})]})); }catch(e){ return false; } })();

// 前回の印の位置を覚える（ページ内の割合で保存）
const LKEY="okuno_stamp_layout";
function saveLayout(){
  try{ localStorage.setItem(LKEY, JSON.stringify(stamps.map(S=>{ const s=px(S); return {k:S.kind, p:S.page.index, fx:(S.x+s/2)/S.page.vp.width, fy:(S.y+s/2)/S.page.vp.height, mm:S.mm}; }))); }catch(e){}
}
function restoreLayout(){
  let L=null; try{ L=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(e){}
  if(!Array.isArray(L)||!L.length) return false;
  let n=0;
  for(const it of L){ const P=pages[Math.min(it.p, pages.length-1)]; if(!P||!KINDS[it.k]) continue;
    const S=addStamp(P,0,0,it.k); S.mm=it.mm||SZ[it.k]; const s=px(S); S.x=it.fx*P.vp.width-s/2; S.y=it.fy*P.vp.height-s/2; place(S); n++; }
  return n>0;
}

// 印を動かすたびに裏でPDFを作っておく → ボタンを押した瞬間に送れる
let ver=0, ready=null, readyVer=-1, dirtyT=null;
function markDirty(){ ver++; ready=null; clearTimeout(dirtyT); dirtyT=setTimeout(prebuild, 350); }
async function prebuild(){ const v=ver; const o=await build(true); if(o && v===ver){ ready=o; readyVer=v; } }

async function build(quiet){
  if(!pdfBytes) return null;
  if(!stamps.length){ if(!quiet) toast("印が置かれていません"); return null; }
  if(!quiet) busy(true,"PDFを作成中…");
  try{
    const {PDFDocument, degrees, BlendMode} = PDFLib;
    const doc = await PDFDocument.load(pdfBytes, {ignoreEncryption:true});
    const pngs={}; for(const S of stamps){ if(!pngs[S.kind]) pngs[S.kind]=await doc.embedPng(await stampBytes(S.kind)); }
    const pdfPages = doc.getPages();
    for(const S of stamps){
      const P=S.page, vp=P.vp, s=px(S);
      const [blx,bly]=vp.convertToPdfPoint(S.x, S.y+s);
      const [brx,bry]=vp.convertToPdfPoint(S.x+s, S.y+s);
      const ang=Math.atan2(bry-bly, brx-blx)*180/Math.PI;
      const size=S.mm*MM;
      pdfPages[P.index].drawImage(pngs[S.kind],{x:blx,y:bly,width:size,height:size,rotate:degrees(ang),blendMode:BlendMode.Multiply});
    }
    return await doc.save();
  }catch(err){ console.error(err); if(!quiet) toast("PDFを作れませんでした"); return null; }
  finally{ if(!quiet) busy(false); }
}
const current = () => (ready && readyVer===ver) ? ready : null;

async function sendLine(){
  const name=outName();
  if(!canShareFiles){
    const o=current()||await build(); if(!o) return;
    saveLayout(); offer(name,o,"application/pdf","保存しました。LINEのトークにこのPDFをドラッグして送ってください"); return;
  }
  let o=current(), waited=false;
  if(!o){ o=await build(); waited=true; if(!o) return; ready=o; readyVer=ver; }
  try{
    await navigator.share({files:[new File([o],name,{type:"application/pdf"})]});
    saveLayout();
  }catch(err){
    if(err?.name==="AbortError") return;
    if(err?.name==="NotAllowedError" && waited){ toast("準備できました。もう一度「LINEで送る」を押してください"); return; }
    saveLayout(); offer(name,o,"application/pdf");
  }
}
async function saveFile(){ const o=current()||await build(); if(o){ saveLayout(); offer(outName(), o, "application/pdf"); } }
document.querySelectorAll('[data-act="line"]').forEach(b=>b.addEventListener("click", sendLine));
document.querySelectorAll('[data-act="save"]').forEach(b=>b.addEventListener("click", saveFile));
document.querySelectorAll(".btn.png").forEach(b=>b.addEventListener("click", async e=>{
  e.preventDefault(); const k=b.dataset.k; offer(KINDS[k].file, await stampBytes(k), "image/png");
}));
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
