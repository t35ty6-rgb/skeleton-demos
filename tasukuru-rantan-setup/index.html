<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>らんたん 設定記録</title>
<style>
:root{--bg:#0a0c11;--panel:#141821;--line:#232936;--ink:#e8eaf0;--dim:#8b93a7;--ac:#10b981}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;display:flex;min-height:100vh}
aside{width:320px;flex:0 0 320px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:22px 0}
aside h1{font-size:15px;margin:0 20px 4px;letter-spacing:.02em}
aside .sub{font-size:11.5px;color:var(--dim);margin:0 20px 18px;line-height:1.6}
.it{display:flex;gap:11px;padding:12px 20px;cursor:pointer;border-left:3px solid transparent}
.it:hover{background:#1b2130}
.it.on{background:#1b2130;border-left-color:var(--ac)}
.it .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:2px;min-width:20px}
.it .t{font-size:13px;font-weight:600;line-height:1.45}
.it .d{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5}
.it .dot{width:7px;height:7px;border-radius:50%;background:#2c3444;margin-top:5px;flex:0 0 7px}
.it.seen .dot{background:var(--ac)}
main{flex:1;min-width:0;display:flex;flex-direction:column;padding:28px 32px;gap:16px}
video{width:100%;max-height:74vh;background:#000;border-radius:10px;border:1px solid var(--line)}
h2{font-size:18px;margin:0}
p.d{margin:0;color:var(--dim);font-size:13px}
.nav{display:flex;gap:10px;margin-top:4px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--ac)}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;flex:none;border-right:none;border-bottom:1px solid var(--line);max-height:38vh}main{padding:18px 16px}}
</style></head><body>
<aside><h1>らんたん 設定記録</h1>
<p class="sub">らんたん さん の LINE を どう 設定 した か。 上 から 順に 見て ください。<br>全 13 本 ／ 合計 17 分 28 秒</p>
<div id="list"></div></aside>
<main>
<video id="vid" controls playsinline></video>
<h2 id="ttl"></h2><p class="d" id="dsc"></p>
<div class="nav"><button id="prev">← 前</button><button id="next">次 →</button></div>
</main>
<script>
const ITEMS=[{"id":"s-01-structure","title":"01 4つの箱の関係","desc":"ここを取り違えると全部が動かない。","file":"v/s-01-structure.mp4","sec":74},{"id":"s-02-connect","title":"02 LINEをつなぐ","desc":"4つの値を貼る。ここが最初の関門。","file":"v/s-02-connect.mp4","sec":86},{"id":"s-03-reserve","title":"03 予約を作る","desc":"4コース・昼夜2部制・団体20〜60名。","file":"v/s-03-reserve.mp4","sec":85},{"id":"s-04-reserve-ops","title":"04 予約が入ったら","desc":"どこを見て、何を押すか。","file":"v/s-04-reserve-ops.mp4","sec":94},{"id":"s-r1-open","title":"05 リッチメニュー① 画面の見方","desc":"どこにあって、編集画面はどう分かれているか。","file":"v/s-r1-open.mp4","sec":82},{"id":"s-r2-image","title":"06 リッチメニュー② 分割と画像","desc":"6分割・2500×1686・背景画像の入れ方。","file":"v/s-r2-image.mp4","sec":94},{"id":"s-r3-links","title":"07 リッチメニュー③ 6つの飛び先","desc":"エリア1から6まで、1つずつ。","file":"v/s-r3-links.mp4","sec":88},{"id":"s-r4-props","title":"08 リッチメニュー④ 表示の条件と保存","desc":"誰に出すか、何と書くか、そして保存。","file":"v/s-r4-props.mp4","sec":83},{"id":"s-r5-deploy","title":"09 リッチメニュー⑤ デプロイと差し替え","desc":"押して初めて出る。一番多いミス。","file":"v/s-r5-deploy.mp4","sec":81},{"id":"s-05-autoreply","title":"10 自動応答を作る","desc":"らんたんは6本。キーワードと差し込み。","file":"v/s-05-autoreply.mp4","sec":68},{"id":"s-06-tag","title":"11 タグと流入経路を作る","desc":"7経路。QRを置き場所ごとに分ける。","file":"v/s-06-tag.mp4","sec":72},{"id":"s-07-step","title":"12 ステップ配信を作る","desc":"タグをきっかけに、順番に送る。","file":"v/s-07-step.mp4","sec":78},{"id":"s-08-check","title":"13 できあがりを確認する","desc":"設定後に見る場所と、残る作業。","file":"v/s-08-check.mp4","sec":63}];
const L=document.getElementById('list'),V=document.getElementById('vid');
let cur=0, seen=new Set();
try{ seen=new Set(JSON.parse(localStorage.getItem('tsk-seen')||'[]')); cur=+(localStorage.getItem('tsk-cur')||0)||0; }catch(e){}
L.innerHTML=ITEMS.map((x,i)=>'<div class="it" data-i="'+i+'"><div class="dot"></div><div class="n">'+String(i).padStart(2,'0')+'</div><div><div class="t">'+x.title.replace(/^\d+\s*/,'')+'</div><div class="d">'+x.desc+'</div></div></div>').join('');
function paint(){ [...L.children].forEach((e,i)=>{ e.classList.toggle('on',i===cur); e.classList.toggle('seen',seen.has(ITEMS[i].id)); }); }
function load(i){ cur=Math.max(0,Math.min(ITEMS.length-1,i)); const x=ITEMS[cur];
  V.src=x.file; document.getElementById('ttl').textContent=x.title; document.getElementById('dsc').textContent=x.desc;
  paint(); try{ localStorage.setItem('tsk-cur',cur); }catch(e){}
  L.children[cur].scrollIntoView({block:'nearest'}); }
L.addEventListener('click',e=>{ const d=e.target.closest('.it'); if(d) load(+d.dataset.i); });
V.addEventListener('ended',()=>{ seen.add(ITEMS[cur].id); try{ localStorage.setItem('tsk-seen',JSON.stringify([...seen])); }catch(e){} paint(); if(cur<ITEMS.length-1) load(cur+1); });
document.getElementById('prev').onclick=()=>load(cur-1);
document.getElementById('next').onclick=()=>load(cur+1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')load(cur+1); if(e.key==='ArrowLeft')load(cur-1); });
load(cur);
</script></body></html>
