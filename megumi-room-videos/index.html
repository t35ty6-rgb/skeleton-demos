<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>めぐみの部屋 使い方 動画</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #FFFFFF; color: #2D1F26; font-family: "Noto Sans JP", sans-serif; font-weight: 500; -webkit-font-smoothing: antialiased; }
  body { padding: 40px 24px 60px; min-height: 100vh; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .brand { font-size: 11px; font-weight: 700; color: #7B6570; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 16px; }
  h1 { font-size: 32px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 8px; line-height: 1.15; }
  .sub { font-size: 15px; color: #524049; margin-bottom: 28px; line-height: 1.7; }
  video { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 20px 60px -12px rgba(122,37,63,0.15); background: #000; }
  .meta { margin-top: 20px; display: flex; gap: 20px; font-size: 12.5px; color: #7B6570; font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
  .foot { margin-top: 40px; padding-top: 24px; border-top: 1px solid #E9D5DE; font-size: 13px; color: #524049; line-height: 1.75; }
  .foot a { color: #EC4899; text-decoration: none; font-weight: 700; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Skeleton · Salonworks · めぐみの部屋</div>
  <h1>動画 を アップロード する 方法</h1>
  <div class="sub">admin から YouTube URL を 貼り付け、 会員 に すぐ 見せる まで。</div>
  <video src="mroom-video-upload.mp4" controls preload="metadata" playsinline></video>
  <div class="meta">
    <span>約 33 秒</span>
    <span>1920 × 1080</span>
    <span>音声 あり</span>
  </div>
  <div class="foot">
    実際 の 管理画面: <a href="https://skeleton-femoon-saas.web.app/admin?tenant=bup-gym-online" target="_blank">skeleton-femoon-saas.web.app/admin</a><br>
    客側 の 会員 チャット: <a href="https://skeleton-femoon-saas.web.app/megumi-room/bup-gym-online?preview=1" target="_blank">/megumi-room/bup-gym-online?preview=1</a>
  </div>
</div>
</body>
</html>
