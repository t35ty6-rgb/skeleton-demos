<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkelFit admin | ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
body {
  background: var(--ink);
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
body::before {
  content: "";
  position: absolute;
  top: -20%; right: -10%;
  width: 60%; height: 60%;
  background: radial-gradient(circle, var(--vital-ring), transparent 70%);
  pointer-events: none;
}
.card {
  width: 100%;
  max-width: 400px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--rad-4);
  padding: 40px 32px;
  position: relative;
  backdrop-filter: saturate(180%) blur(20px);
  z-index: 1;
}
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 900; font-size: 18px; letter-spacing: -0.02em;
  margin-bottom: 24px;
}
.brand svg { width: 22px; height: 22px; color: var(--vital); }
h1 {
  font-size: 24px; font-weight: 900; letter-spacing: -0.02em;
  margin: 0 0 8px;
}
.subtitle {
  font-size: 14px; color: rgba(255,255,255,0.6);
  margin-bottom: 28px;
}
.field {
  margin-bottom: 16px;
}
.field label {
  display: block; font-size: 12px; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: rgba(255,255,255,0.7); margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 12px 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: var(--rad-2);
  color: #fff;
  font-size: 15px;
  font-family: inherit;
  transition: border-color 120ms, background 120ms;
}
.field input::placeholder { color: rgba(255,255,255,0.35); }
.field input:hover { border-color: rgba(255,255,255,0.42); }
.field input:focus {
  outline: none;
  border-color: var(--vital);
  background: rgba(255,255,255,0.10);
  box-shadow: 0 0 0 3px rgba(0,201,106,0.30);
}
.btn {
  width: 100%;
  padding: 14px;
  background: var(--vital);
  color: var(--ink);
  border: none;
  border-radius: var(--rad-2);
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: transform 120ms;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: transparent;
  color: #fff;
  border: 1px solid rgba(255,255,255,0.16);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-ghost svg { width: 18px; height: 18px; }
.separator {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0;
  font-size: 11px; color: rgba(255,255,255,0.4);
  letter-spacing: 0.1em; text-transform: uppercase;
}
.separator::before, .separator::after {
  content: ""; flex: 1;
  height: 1px; background: rgba(255,255,255,0.08);
}
.error {
  padding: 10px 12px;
  background: rgba(239,68,68,0.14);
  border: 1px solid rgba(239,68,68,0.4);
  border-radius: var(--rad-2);
  font-size: 13px; color: #fca5a5;
  margin-bottom: 16px;
  display: none;
}
.error.show { display: block; }
.status {
  margin-top: 24px;
  padding: 12px 14px;
  background: rgba(0,201,106,0.08);
  border: 1px solid rgba(0,201,106,0.3);
  border-radius: var(--rad-2);
  font-size: 12px; color: rgba(255,255,255,0.8);
  line-height: 1.6;
}
.status .l { color: var(--vital); font-weight: 700; }
.foot {
  margin-top: 20px;
  font-size: 12px; color: rgba(255,255,255,0.4);
  text-align: center;
}
.foot a { color: var(--vital-hi); text-decoration: underline; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="skel-logo" viewBox="0 0 24 24">
      <path d="M2 12 L6 12 L8 6 L11 18 L14 8 L16 14 L18 12 L22 12"
        fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="card">
  <div class="brand">
    <svg><use href="#skel-logo"/></svg>
    SkelFit
  </div>
  <h1>おかえりなさい。</h1>
  <p class="subtitle">トレーナー admin に ログイン。</p>

  <div id="err" class="error"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">メール アドレス</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="submitBtn">ログイン</button>
  </form>

  <div class="separator">or</div>

  <button type="button" class="btn btn-ghost" id="googleBtn">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" opacity="0.9"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" opacity="0.8"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z" opacity="0.7"/></svg>
    Google で ログイン
  </button>

  <div class="foot">
    β 招待 URL を お持ちの方 は <a href="#" id="inviteLink">こちら</a>
  </div>

  <div class="status" id="mode-hint"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="../assets/firebase-config.js"></script>
<script src="../assets/skelfit-sdk.js"></script>
<script>
(function () {
  const errEl = document.getElementById("err");
  const modeHint = document.getElementById("mode-hint");
  const emailIn = document.getElementById("email");
  const passIn = document.getElementById("password");
  const submitBtn = document.getElementById("submitBtn");
  const googleBtn = document.getElementById("googleBtn");
  const form = document.getElementById("loginForm");

  const configured = window.SKELFIT_IS_CONFIGURED && window.SKELFIT_IS_CONFIGURED();

  if (!configured) {
    modeHint.innerHTML = `
      <span class="l">Demo mode (Firebase 未設定)</span>
      任意 の email / password で ログイン ボタン を 押すと、
      demo トレーナー ダッシュボード に 遷移します。
      本番 は assets/firebase-config.js に 実 config を 埋めてください。
    `;
  } else {
    modeHint.innerHTML = `
      <span class="l">Live mode</span>
      Project: ${window.SKELFIT_FIREBASE_CONFIG.projectId}
    `;
  }

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.classList.add("show");
  }
  function clearErr() {
    errEl.classList.remove("show");
    errEl.textContent = "";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErr();
    submitBtn.disabled = true;
    submitBtn.textContent = "ログイン中...";
    try {
      if (!configured) {
        // demo bounce
        setTimeout(() => (location.href = "index.html"), 400);
        return;
      }
      await window.SkelFitSDK.loginAdminEmail(emailIn.value.trim(), passIn.value);
      location.href = "index.html";
    } catch (e) {
      showErr(e.message || "ログイン失敗");
      submitBtn.disabled = false;
      submitBtn.textContent = "ログイン";
    }
  });

  googleBtn.addEventListener("click", async () => {
    clearErr();
    if (!configured) {
      setTimeout(() => (location.href = "index.html"), 200);
      return;
    }
    try {
      await window.SkelFitSDK.loginAdminGoogle();
      location.href = "index.html";
    } catch (e) {
      showErr(e.message || "Google ログイン失敗");
    }
  });

  document.getElementById("inviteLink").addEventListener("click", (e) => {
    e.preventDefault();
    alert("β 招待 URL は 招待 メール 内 の リンク です。 URL を 直接 開いてください。");
  });
})();
</script>

</body>
</html>
