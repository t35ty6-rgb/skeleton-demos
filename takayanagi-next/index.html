<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>次回のお打ち合わせ｜理学整体院たかやなぎ様</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 白地・ひまわりオレンジ。丸ゴシックのみ（明朝体なし） */
:root{--ink:#3A2A1E;--mut:#7A6656;--or:#EE8A2A;--ord:#B0560A;--soft:#FFF1E0;--line:#F2DFC6;--green:#06C755}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#fff;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-size:16px;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px}
.eb{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:2px 14px}
h1{font-size:26px;line-height:1.4;margin:12px 0 6px;font-weight:900}
.lead{color:var(--mut);margin:0 0 20px;font-size:15px}
.info{background:var(--soft);border-radius:16px;padding:14px 18px;font-size:14px;margin-bottom:22px}
.info b{color:var(--ord)}
.slots{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;font:inherit;color:inherit;cursor:pointer;text-decoration:none;transition:border-color .2s}
.slot:hover,.slot:focus-visible{border-color:var(--or);outline:none}
.slot .no{flex:none;width:40px;height:40px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.slot .d{font-size:20px;font-weight:900;line-height:1.3}
.slot .t{font-size:15px;color:var(--mut)}
.slot .go{margin-left:auto;flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--green);border-radius:999px;padding:6px 14px;white-space:nowrap}
.how{font-size:13px;color:var(--mut);margin:14px 4px 0}
.alt{margin-top:28px;border-top:1.5px dashed var(--line);padding-top:20px}
.alt h2{font-size:16px;margin:0 0 10px}
.alt a{display:block;text-align:center;border:2px solid var(--line);border-radius:999px;padding:12px;color:var(--ink);text-decoration:none;font-weight:700}
.alt p{font-size:13px;color:var(--mut);margin:10px 0 0}
footer{margin-top:32px;font-size:12px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<main>
  <span class="eb">スケルトン株式会社より</span>
  <h1>高柳先生、次回のお打ち合わせの日程です</h1>
  <p class="lead">ご都合のよい日時を押してください。そのまま予約が入ります。</p>
  <div class="info"><b>内容</b>　確認シートを一緒に見ながら、メニュー・料金・写真を決めます<br><b>時間</b>　60分<br><b>場所</b>　院にお伺いします（オンラインも可）</div>

  <div class="slots" id="slots"></div>
  <p class="how">押すとGoogleカレンダーが開きます。「保存」を押すと、先生のカレンダーに入り、こちらにも予約のお知らせが届きます。</p>

  <div class="alt">
    <h2>どの日時も合わないときは</h2>
    <a id="mail" href="#">ご都合のよい日時を送る</a>
    <p>メールが開きます。送り先：t3.5ty6@gmail.com</p>
  </div>
  <footer>スケルトン株式会社　吉田</footer>
</main>
<script>
{
const ME='t3.5ty6@gmail.com';
const S=[
  {d:'12月2日（水）',t:'10:00〜11:00',s:'20261202T100000',e:'20261202T110000'},
  {d:'12月2日（水）',t:'14:00〜15:00',s:'20261202T140000',e:'20261202T150000'},
  {d:'12月9日（水）',t:'10:00〜11:00',s:'20261209T100000',e:'20261209T110000'},
];
const title='理学整体院たかやなぎ × スケルトン 打ち合わせ';
const details='確認シートを一緒に見ながら、メニュー・料金・写真を決めます。\n場所：理学整体院たかやなぎ（オンラインの場合はURLをお送りします）';
const url=x=>'https://calendar.google.com/calendar/render?action=TEMPLATE'
  +'&text='+encodeURIComponent(title)
  +'&dates='+x.s+'/'+x.e+'&ctz=Asia/Tokyo'
  +'&details='+encodeURIComponent(details)
  +'&location='+encodeURIComponent('理学整体院たかやなぎ 富山県富山市下新本町3-3-2')
  +'&add='+encodeURIComponent(ME);
document.getElementById('slots').innerHTML=S.map((x,i)=>`<a class="slot" href="${url(x)}" target="_blank" rel="noopener"><span class="no">${i+1}</span><span><span class="d">${x.d}</span><br><span class="t">${x.t}</span></span><span class="go">この日時で予約</span></a>`).join('');
document.getElementById('mail').href='mailto:'+ME+'?subject='+encodeURIComponent('次回のお打ち合わせの日程（理学整体院たかやなぎ）')+'&body='+encodeURIComponent('吉田さん\n\n次回のお打ち合わせ、以下の日時でお願いします。\n\n第1希望：\n第2希望：\n\n理学整体院たかやなぎ　高柳');
}
</script>
</body>
</html>
