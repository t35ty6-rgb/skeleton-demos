<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- モニター本体 -->
  <rect x="100" y="40" width="200" height="130" rx="6" fill="none" stroke="#1a1a1a" stroke-width="10"/>
  <!-- モニター画面内のベン図 -->
  <circle cx="170" cy="105" r="40" fill="#7CA3CC" opacity=".75"/>
  <circle cx="230" cy="105" r="40" fill="#8E6FB5" opacity=".75"/>
  <!-- ベン図中央のシェアノードアイコン -->
  <g stroke="#fff" stroke-width="2.5" fill="#fff" stroke-linejoin="round">
    <circle cx="200" cy="98" r="3.5"/>
    <circle cx="194" cy="113" r="3.5"/>
    <circle cx="206" cy="113" r="3.5"/>
    <path d="M200 98 L194 113 L206 113 Z" fill="none"/>
  </g>
  <!-- スタンド -->
  <rect x="180" y="170" width="40" height="14" fill="#1a1a1a"/>
  <ellipse cx="200" cy="190" rx="55" ry="6" fill="#1a1a1a"/>
  <!-- テキスト -->
  <text x="200" y="240" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#1a1a1a" letter-spacing="2">SALON WORKS</text>
</svg>
