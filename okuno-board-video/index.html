<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>おくの電化 案件ボード — 使い方動画</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;color:#111418;font-family:"Zen Kaku Gothic New","Hiragino Sans",Meiryo,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 6px}
p{color:#4A5560;margin:0 0 18px;font-size:16px;line-height:1.7}
video{width:100%;border-radius:14px;box-shadow:0 2px 4px rgba(16,24,40,.06),0 10px 30px rgba(16,24,40,.10);background:#fff}
.list{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.list button{border:0;background:#F4F7FB;border-left:5px solid #1D9BF0;border-radius:10px;padding:12px 14px;text-align:left;font:inherit;font-size:15px;cursor:pointer}
.list button:hover{background:#EAF5FE}
.list b{display:block;color:#0B7EC8;font-size:13px}
</style></head><body><div class="wrap">
<h1>案件ボードの使い方</h1>
<p>案件の登録から、工程の進め方・戻し方、工事写真、工事写真台帳まで。見たいところを下から選べます。</p>
<video id="v" controls playsinline preload="metadata">
  <source src="anken-board-tsukaikata-explainer.webm" type="video/webm">
  <source src="anken-board-tsukaikata-explainer.mp4" type="video/mp4">
</video>
<div class="list" id="list"></div>
</div>
<script>
const CH=[{"t": 0, "l": "まとめ画面の見方"}, {"t": 17.7, "l": "自分のやることを出す"}, {"t": 25.3, "l": "新しい案件を登録する"}, {"t": 45.0, "l": "工程を進める・戻す"}, {"t": 58.0, "l": "作業にチェックを付ける"}, {"t": 64.5, "l": "工事写真を追加する"}, {"t": 71.9, "l": "工事写真台帳を作る"}, {"t": 86.1, "l": "カレンダー"}, {"t": 92.8, "l": "担当者別のやること"}];
const v=document.getElementById('v'), L=document.getElementById('list');
const f=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
CH.forEach(c=>{ const b=document.createElement('button'); b.innerHTML=`<b>${f(c.t)}</b>${c.l}`; b.onclick=()=>{ v.currentTime=c.t; v.play() }; L.appendChild(b) });
</script></body></html>
