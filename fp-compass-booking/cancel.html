<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ご予約のキャンセル — FP Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F5; --paper:#FFFFFF;
    --ink:#0A0A0A; --ink2:#3F3F46; --ink3:#6B6B6B; --muted:#9A9A9A;
    --accent:#5B5BF0; --accent-2:#4242C9; --accent-3:#7878F5;
    --accent-soft:#EEF1FE; --accent-faint:#F5F7FF;
    --line:#ECECEA; --line-2:#DCDCD8;
    --ok:#047647; --ok-soft:#ECFDF3;
    --warn:#B5530F; --warn-soft:#FFF6E5;
    --critical:#DC2B2B; --critical-soft:#FEF1F1;
    --font-display:"Manrope","Noto Sans JP",-apple-system,sans-serif;
    --font-body:"Noto Sans JP","Manrope",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);min-height:100vh;color:var(--ink);font-family:var(--font-body);line-height:1.65;letter-spacing:0;font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;padding:36px 18px 80px}
  .hd{text-align:center;margin-bottom:24px}
  .hd .salon{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid #DDE1FB;padding:4px 12px;border-radius:100px;display:inline-block;margin-bottom:14px}
  .hd h1{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.025em;color:var(--ink);margin:0 0 6px}
  .hd .sub{font-size:13px;color:var(--ink3)}

  .card{background:var(--paper);border-radius:14px;padding:24px 22px;border:1px solid var(--line);box-shadow:0 1px 0 rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.04);margin-bottom:16px}

  .summary{background:var(--accent-faint);padding:18px 20px;border-radius:10px;border:1px solid #DDE1FB;margin-bottom:18px}
  .summary .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #DDE1FB;font-size:13.5px}
  .summary .row:last-child{border-bottom:none}
  .summary .row .k{color:var(--ink3);font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-family:var(--font-display)}
  .summary .row .v{color:var(--ink);font-weight:600;font-family:var(--font-display)}
  .summary .row .v.big{font-family:var(--font-display);font-size:17px;color:var(--accent-2);letter-spacing:-.012em;font-weight:700}

  .status-banner{padding:14px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;font-weight:500;text-align:center;line-height:1.7;font-family:var(--font-body)}
  .status-ok{background:var(--ok-soft);color:var(--ok);border:1px solid #ABEFC6}
  .status-warn{background:var(--warn-soft);color:var(--warn);border:1px solid #F7D8AE}
  .status-neutral{background:var(--bg);color:var(--ink3);border:1px solid var(--line-2)}
  .status-banner strong{font-weight:700}

  .btn{display:block;width:100%;padding:14px 18px;border:none;border-radius:10px;font-family:var(--font-display);font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:0;margin-bottom:10px;text-align:center;text-decoration:none}
  .btn-danger{background:var(--critical);background-image:linear-gradient(180deg,#E94E4E,#DC2B2B);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 4px 12px rgba(220,43,43,.25)}
  .btn-danger:hover{background-image:linear-gradient(180deg,#DC2B2B,#B91C1C);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 22px rgba(220,43,43,.35)}
  .btn-danger:disabled{background:#ccc;background-image:none;cursor:wait;box-shadow:none}
  .btn-alt{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
  .btn-alt:hover{background:var(--bg);border-color:var(--ink3)}
  .btn-line{background:#06c755;color:#fff}
  .btn-line:hover{background:#04a045}

  .msg{padding:14px 16px;border-radius:10px;font-size:12.5px;line-height:1.7;margin-bottom:14px;font-family:var(--font-body)}
  .msg-info{background:var(--accent-faint);color:var(--accent-2);border:1px solid #DDE1FB}

  .loader{text-align:center;padding:36px;color:var(--ink3);font-family:var(--font-body);font-size:13px}
  .loader::after{content:"⋯";font-size:24px;animation:pulse 1s infinite;margin-left:4px}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;font-family:var(--font-body)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="salon">FP COMPASS</div>
    <h1 id="page-title">ご予約のキャンセル</h1>
    <div class="sub">ファイナンシャルプランナー Zoom 相談</div>
  </div>

  <div class="card" id="root">
    <div class="loader">予約情報を確認中</div>
  </div>

  <div class="footer">
    ご不明点は LINE 公式アカウントまでお気軽にどうぞ
  </div>
</div>

<script>
// FP Compass GAS Web App URL (deploy時に確定値で更新する)
const GAS_ENDPOINT = window.GAS_ENDPOINT || 'https://script.google.com/macros/s/AKfycbyLNGMrDyEvPg0FBTiRdfAF3fEyhoW6mWBT2S81ytnRQl_b_trAP8GSJ8Alkg7zpFU7kw/exec';
const LINE_FRIEND_URL = 'https://line.me/R/ti/p/@511thleq';

const params = new URLSearchParams(location.search);
const RES_ID = params.get('id') || '';
const TOKEN = params.get('t') || '';

const root = document.getElementById('root');

function renderError(msg){
  root.innerHTML = `<div class="status-banner status-warn">${msg}</div>
    <a href="${LINE_FRIEND_URL}" class="btn btn-line">📩 LINE公式アカウントで連絡する</a>`;
}

function fmtDate(s){
  if(!s) return '-';
  const m = String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(!m) return s;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  const WD = ['日','月','火','水','木','金','土'];
  return `${m[1]}年${Number(m[2])}月${Number(m[3])}日(${WD[d.getDay()]})`;
}

function summaryHtml(d){
  return `
    <div class="summary">
      <div class="row"><span class="k">お客様</span><span class="v">${d.name||'-'} 様</span></div>
      <div class="row"><span class="k">日付</span><span class="v big">${fmtDate(d.date)}</span></div>
      <div class="row"><span class="k">時間</span><span class="v big">${d.slot||'-'}〜</span></div>
      <div class="row"><span class="k">形式</span><span class="v">Zoom オンライン相談</span></div>
    </div>`;
}

async function loadPreview(){
  if(!RES_ID || !TOKEN){ renderError('リンクが正しくありません (パラメータ不足)'); return; }
  try{
    const r = await fetch(`${GAS_ENDPOINT}?cmd=cancel_preview&id=${encodeURIComponent(RES_ID)}&t=${encodeURIComponent(TOKEN)}`, {redirect:'follow'});
    const j = await r.json();
    if(!j.ok){
      if(j.error === 'invalid_token') renderError('リンクが正しくありません (無効なトークン)');
      else if(j.error === 'not_found') renderError('予約が見つかりませんでした');
      else renderError('読み込みエラー: ' + (j.error||'unknown'));
      return;
    }
    renderPreview(j);
  }catch(e){
    renderError('通信エラー: ' + e.message);
  }
}

function renderPreview(d){
  let html = summaryHtml(d);
  if(d.alreadyCancelled){
    html += `<div class="status-banner status-neutral">このご予約はすでにキャンセル済みです</div>
      <a href="${LINE_FRIEND_URL}" class="btn btn-line">LINEに戻る</a>`;
  } else if(d.tooLate){
    const h = Math.max(0, Math.round(d.hoursUntil));
    html += `
      <div class="status-banner status-warn">
        ⚠ 面談まで <strong>${h}時間</strong> を切っています<br>
        セルフキャンセル受付期限 (24時間前) を過ぎているため、お手数ですが LINE 公式アカウントから<br>
        直接ご連絡くださいませ。
      </div>
      <a href="${LINE_FRIEND_URL}" class="btn btn-line">📩 LINEで連絡する</a>
    `;
  } else if(d.canSelfCancel){
    const h = Math.round(d.hoursUntil);
    html += `
      <div class="status-banner status-ok">
        ✅ キャンセル可能です (面談まで約${h}時間)
      </div>
      <div class="msg msg-info">
        ボタンを押すと、ご予約が即時キャンセルされます。<br>
        担当FPにも同時に通知が届きます。
      </div>
      <button class="btn btn-danger" id="cancel-btn" onclick="doCancel()">この予約をキャンセルする</button>
      <a href="${LINE_FRIEND_URL}" class="btn btn-alt">やめる(LINEに戻る)</a>
    `;
  } else {
    html += `<div class="status-banner status-warn">操作できない状態です</div>`;
  }
  root.innerHTML = html;
}

async function doCancel(){
  const btn = document.getElementById('cancel-btn');
  if(!btn) return;
  if(!confirm('本当にこのご予約をキャンセルしますか？\n\n(キャンセル後の取り消しはできません)')) return;
  btn.disabled = true;
  btn.textContent = 'キャンセル処理中...';
  try{
    const r = await fetch(`${GAS_ENDPOINT}?cmd=cancel&id=${encodeURIComponent(RES_ID)}&t=${encodeURIComponent(TOKEN)}`, {redirect:'follow'});
    const j = await r.json();
    if(!j.ok){
      alert('キャンセルできませんでした: ' + (j.error||'unknown') + '\n\nお手数ですがLINEで直接ご連絡ください。');
      btn.disabled = false;
      btn.textContent = 'この予約をキャンセルする';
      return;
    }
    root.innerHTML = `
      <div class="status-banner status-ok" style="font-size:14px;padding:24px">
        ✅ キャンセルを承りました<br>
        <small style="font-weight:400;color:#666;display:block;margin-top:8px">${j.name||''} 様<br>${fmtDate(j.date)} ${j.slot||''}〜</small>
      </div>
      <div class="msg msg-info">
        ご連絡ありがとうございました。<br>またのご予約を心よりお待ちしております。
      </div>
      <a href="${LINE_FRIEND_URL}" class="btn btn-line">LINEに戻る</a>
    `;
  }catch(e){
    alert('通信エラー: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'この予約をキャンセルする';
  }
}

loadPreview();
</script>
</body>
</html>
