<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サロンワークス 使い方動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --bg-2:#0f1117;
    --surface:#151821;
    --surface-2:#1a1e28;
    --surface-3:#232734;
    --rule:#1f2937;
    --rule-2:#2a3140;
    --ink:#f3f4f6;
    --ink-2:#d1d5db;
    --dim:#9ca3af;
    --muted:#6b7280;
    --accent:#ec4899;
    --accent-2:#f472b6;
    --primary:#db2777;
    --primary-soft:rgba(219,39,119,0.16);
    --danger:#ef4444;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    --sidebar-w:320px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter','Noto Sans JP',system-ui,-apple-system,sans-serif;min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

  .sidebar{
    background:var(--bg-2);
    border-right:1px solid var(--rule);
    position:sticky;top:0;height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px}
  .sidebar::-webkit-scrollbar-track{background:transparent}

  .sb-head{padding:22px 22px 18px;border-bottom:1px solid var(--rule)}
  .sb-title{font-size:15px;font-weight:800;letter-spacing:.01em}
  .sb-sub{font-size:11px;color:var(--dim);margin-top:3px;font-weight:500}

  .sb-progress{padding:16px 22px 14px;border-bottom:1px solid var(--rule)}
  .sb-progress-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:8px}
  .sb-progress-count{color:var(--accent);font-weight:700}
  .sb-progress-bar{height:4px;background:var(--surface);border-radius:2px;overflow:hidden}
  .sb-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;transition:width .3s ease;width:0%}

  .sb-nav{flex:1;padding:14px 0}
  .sb-group{margin-bottom:8px}
  .sb-group-title{padding:12px 22px 8px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;display:flex;justify-content:space-between;align-items:center}
  .sb-group-count{font-size:9px;color:var(--dim);font-weight:600;background:var(--surface);padding:2px 6px;border-radius:8px;letter-spacing:.02em;text-transform:none}

  .sb-item{
    display:flex;align-items:center;gap:11px;padding:8px 22px;
    cursor:pointer;transition:background .15s,color .15s;
    border-left:3px solid transparent;
    color:var(--ink-2);
    -webkit-tap-highlight-color:transparent;
  }
  .sb-item:hover{background:var(--surface)}
  .sb-item.active{background:var(--primary-soft);border-left-color:var(--primary);color:#fff}
  .sb-item.active .sb-item-name{color:#fff;font-weight:700}

  .sb-item-dot{width:7px;height:7px;border-radius:50%;background:var(--rule-2);flex-shrink:0;transition:background .2s,box-shadow .2s}
  .sb-item.visited .sb-item-dot{background:var(--accent);box-shadow:0 0 6px rgba(236,72,153,0.5)}
  .sb-item.active .sb-item-dot{background:var(--primary);box-shadow:0 0 6px rgba(219,39,119,0.6)}

  .sb-item-body{flex:1;min-width:0}
  .sb-item-name{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .sb-item-len{font-size:10px;font-weight:600;color:var(--muted);flex-shrink:0;padding:2px 6px;background:var(--surface);border-radius:10px}
  .sb-item.active .sb-item-len{background:rgba(255,255,255,0.14);color:#fff}

  .sb-foot{padding:14px 22px;border-top:1px solid var(--rule);font-size:10px;color:var(--muted);font-weight:500}

  .main{padding:32px 40px 60px;max-width:1400px;margin:0 auto;width:100%}
  .main-head{margin-bottom:24px}
  .mh-crumb{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
  h1.mh-title, h2.mh-title{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--ink);font-family:'Inter','Noto Sans JP',system-ui,sans-serif}
  .mh-desc{font-size:14px;color:var(--dim);margin-top:8px;line-height:1.75;max-width:700px}
  .mh-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--rule);font-size:11px;font-weight:600;color:var(--dim)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  .player{background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--rule);position:relative;aspect-ratio:16/9}
  .player video{width:100%;height:100%;display:block}

  .actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s;font-family:inherit}
  .btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--rule-2);color:#fff}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:#be185d;border-color:#be185d}
  .btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 24px;text-align:center;color:var(--dim)}
  .empty .big{font-size:32px;margin-bottom:14px;font-weight:800;color:var(--accent);letter-spacing:.06em}
  .empty h3{font-size:16px;font-weight:700;color:var(--ink-2);margin-bottom:6px}

  .mobile-topbar{display:none;position:sticky;top:0;z-index:20;background:rgba(10,12,17,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding:12px 16px;align-items:center;gap:12px}
  .mobile-topbar .mt-title{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-toggle{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--rule);border-radius:8px;cursor:pointer;color:var(--ink)}
  .mobile-toggle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:29}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;z-index:30;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
    .sidebar.open{transform:translateX(0)}
    .mobile-topbar{display:flex}
    .scrim.open{display:block}
    .main{padding:20px 16px 40px}
    h1.mh-title, h2.mh-title{font-size:22px}
    .actions{margin-top:16px}
    .btn{flex:1;justify-content:center}
    .actions > div{display:none}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-title">サロンワークス</div>
      <div class="sb-sub">機能別 使い方動画 · 全 12 本</div>
    </div>
    <div class="sb-progress">
      <div class="sb-progress-label"><span>視聴 進捗</span><span><span class="sb-progress-count" id="progress-count">0</span> / 12 本</span></div>
      <div class="sb-progress-bar"><div class="sb-progress-fill" id="progress-fill"></div></div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">v12 recipe · 1920×1080 · Neural2-C</div>
  </aside>

  <div>
    <div class="mobile-topbar">
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Open menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="mt-title" id="mt-title">動画を選択</div>
    </div>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <div class="empty">
        <div class="big">SALONWORKS</div>
        <h3>左メニューから 動画を選択</h3>
        <p>スマホ の 場合 は 左上 メニュー ボタン から</p>
      </div>
    </main>
  </div>
</div>

<script>
  const VIDEOS = [
    { id:'dashboard-overview', group:'ダッシュボード', title:'画面 の 見方',
      desc:'ログイン 直後 の トップ 画面。 本日 の 予約数、 売上、 新規客数、 今月 の 累計 が ひと目 で 分かる 経営 サマリー の 見方 を 解説。',
      file:'dashboard-overview-explainer.mp4' },

    { id:'schedule-overview', group:'予約管理', title:'予約 一覧 の 見方',
      desc:'当日 と これから の 予約 を 時系列 で 表示。 顧客名、 メニュー、 施術時間、 スタッフ の 割り当て、 ステータス chip の 意味 を 解説。',
      file:'schedule-overview-explainer.mp4' },
    { id:'schedule-new-booking', group:'予約管理', title:'予約 を 新規 追加',
      desc:'新規予約 ボタン → 顧客 選択 → 日時 → メニュー → スタッフ 割当 → 保存 まで の 完全 フロー を 実演。',
      file:'schedule-new-booking-explainer.mp4' },

    { id:'customers-overview', group:'顧客管理', title:'顧客 一覧 の 見方',
      desc:'全顧客 の 一覧 テーブル。 顧客名、 電話番号、 タグ、 累計 来店回数、 累計 売上、 最終 来店日 の 6 列 が 何 を 示す か を 解説。',
      file:'customers-overview-explainer.mp4' },
    { id:'customers-search', group:'顧客管理', title:'検索 と フィルタ',
      desc:'検索欄 で 名前 部分一致、 タグ フィルタ で VIP や 会員 だけ を 絞り込み、 並び替え で 累計 売上 順 に 並べる 手順 を 実演。',
      file:'customers-search-explainer.mp4' },

    { id:'customer-modal-open', group:'顧客カルテ', title:'カルテ を 開く',
      desc:'顧客 行 を クリック → カルテ モーダル。 プロフィール、 タグ、 来店履歴、 メモ 欄、 施術履歴 が 一箇所 に まとまる 画面 の 使い方。',
      file:'customer-modal-open-explainer.mp4' },
    { id:'customer-modal-tickets', group:'顧客カルテ', title:'回数券 タブ',
      desc:'カルテ 内 の 回数券 タブ。 保有中 の 回数券、 残 回数、 使用 履歴 が 表示。 消化 ボタン で 1 回 分 消費 する 手順 も 実演。',
      file:'customer-modal-tickets-explainer.mp4' },

    { id:'messages-overview', group:'LINE 配信', title:'メッセージ 画面 の 見方',
      desc:'配信 履歴 の 一覧、 種別 chip (一斉 / セグメント / 自動)、 配信 対象人数、 開封率 が 並ぶ 画面 の 見方 を 解説。',
      file:'messages-overview-explainer.mp4' },
    { id:'messages-broadcast', group:'LINE 配信', title:'一斉配信 を 送る',
      desc:'新規配信 → 対象 選択 (全顧客 / セグメント) → 本文 入力 → プレビュー → 送信 まで の 完全 フロー を 実演。',
      file:'messages-broadcast-explainer.mp4' },

    { id:'ec-overview', group:'物販 EC', title:'物販 画面 の 見方',
      desc:'サロン 独自 EC ストア の 管理 画面。 商品 一覧、 注文 履歴、 在庫 数、 売上 が サロンワークス 内 で 見られる 統合 画面 を 解説。',
      file:'ec-overview-explainer.mp4' },

    { id:'sales-overview', group:'売上 分析', title:'売上 画面 の 見方',
      desc:'月次 の 総 売上、 メニュー 別 内訳、 スタッフ 別 内訳、 客単価、 リピート率 など、 経営 に 効く 指標 が 一画面 で 見られる。',
      file:'sales-overview-explainer.mp4' },

    { id:'settings-overview', group:'設定', title:'設定 画面 の 見方',
      desc:'店舗 情報、 営業 時間、 メニュー マスタ、 スタッフ 登録、 LINE 連携、 通知 設定 など、 サロン 運営 に 必要 な 各種 設定 の 全体像。',
      file:'settings-overview-explainer.mp4' },
  ];

  const LS_VISITED = 'salonworks-videos-visited-v1';
  const LS_CURRENT = 'salonworks-videos-current-v1';

  const state = {
    visited: new Set(JSON.parse(localStorage.getItem(LS_VISITED) || '[]')),
    currentId: null,
    durs: {},
  };

  function renderSidebar(){
    const nav = document.getElementById('sb-nav');
    const groups = {};
    VIDEOS.forEach(v => { (groups[v.group] = groups[v.group] || []).push(v); });

    nav.innerHTML = Object.entries(groups).map(([groupName, items], gi) => `
      <div class="sb-group">
        <div class="sb-group-title">
          <span>${gi+1}. ${groupName}</span>
          <span class="sb-group-count">${items.length} 本</span>
        </div>
        ${items.map(v => `
          <div class="sb-item ${state.visited.has(v.id) ? 'visited' : ''} ${state.currentId === v.id ? 'active' : ''}" data-id="${v.id}">
            <div class="sb-item-dot"></div>
            <div class="sb-item-body">
              <div class="sb-item-name">${v.title}</div>
            </div>
            <div class="sb-item-len" data-len-for="${v.id}">${state.durs[v.id] ? formatDur(state.durs[v.id]) : '—'}</div>
          </div>
        `).join('')}
      </div>
    `).join('');

    nav.querySelectorAll('.sb-item').forEach(el => {
      el.addEventListener('click', () => {
        select(el.dataset.id);
        closeMobileDrawer();
      });
    });

    const done = state.visited.size;
    document.getElementById('progress-count').textContent = done;
    document.getElementById('progress-fill').style.width = (done / VIDEOS.length * 100) + '%';
  }

  function formatDur(sec){
    sec = Math.round(sec);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s}秒`;
  }

  function select(id){
    const v = VIDEOS.find(x => x.id === id);
    if (!v) return;
    state.currentId = id;
    state.visited.add(id);
    localStorage.setItem(LS_VISITED, JSON.stringify([...state.visited]));
    localStorage.setItem(LS_CURRENT, id);
    location.hash = id;
    renderMain(v);
    renderSidebar();
    window.scrollTo({top:0, behavior:'smooth'});
    document.getElementById('mt-title').textContent = v.title;
  }

  function renderMain(v){
    const idx = VIDEOS.findIndex(x => x.id === v.id);
    const prev = VIDEOS[idx - 1];
    const next = VIDEOS[idx + 1];
    const durLabel = state.durs[v.id] ? formatDur(state.durs[v.id]) : '—';

    document.getElementById('main').innerHTML = `
      <div class="main-head">
        <div class="mh-crumb">${v.group}</div>
        <h1 class="mh-title">${v.title}</h1>
        <p class="mh-desc">${v.desc}</p>
        <div class="mh-meta">
          <span class="chip"><span class="dot"></span><span id="main-dur">${durLabel}</span></span>
          <span class="chip">1920×1080</span>
          <span class="chip">v12 recipe</span>
          <span class="chip">${idx + 1} / ${VIDEOS.length}</span>
        </div>
      </div>
      <div class="player">
        <video controls autoplay preload="metadata" playsinline id="main-video">
          <source src="${v.file}" type="video/mp4">
        </video>
      </div>
      <div class="actions">
        ${prev ? `
          <button class="btn" id="prev-btn">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            <span>前へ： ${prev.title}</span>
          </button>
        ` : ''}
        <div style="flex:1"></div>
        ${next ? `
          <button class="btn btn-primary" id="next-btn">
            <span>次へ： ${next.title}</span>
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        ` : `
          <button class="btn btn-primary" id="restart-btn">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
            <span>最初 に 戻る</span>
          </button>
        `}
      </div>
    `;

    const p = document.getElementById('prev-btn');
    const n = document.getElementById('next-btn');
    const r = document.getElementById('restart-btn');
    if (p) p.addEventListener('click', () => select(prev.id));
    if (n) n.addEventListener('click', () => select(next.id));
    if (r) r.addEventListener('click', () => select(VIDEOS[0].id));

    const video = document.getElementById('main-video');
    video.addEventListener('loadedmetadata', () => {
      if (!isNaN(video.duration)) {
        state.durs[v.id] = video.duration;
        const cell = document.querySelector(`[data-len-for="${v.id}"]`);
        if (cell) cell.textContent = formatDur(video.duration);
        const mainDur = document.getElementById('main-dur');
        if (mainDur) mainDur.textContent = formatDur(video.duration);
      }
    });
  }

  function openMobileDrawer(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('scrim').classList.add('open');
  }
  function closeMobileDrawer(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
  }
  document.getElementById('mobile-toggle').addEventListener('click', openMobileDrawer);
  document.getElementById('scrim').addEventListener('click', closeMobileDrawer);

  renderSidebar();

  const initId = location.hash.replace('#','') || localStorage.getItem(LS_CURRENT);
  if (initId && VIDEOS.find(v => v.id === initId)) {
    select(initId);
  }

  window.addEventListener('keydown', (e) => {
    if (!state.currentId) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const idx = VIDEOS.findIndex(x => x.id === state.currentId);
    if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); select(VIDEOS[idx - 1].id); }
    if (e.key === 'ArrowRight' && idx < VIDEOS.length - 1) { e.preventDefault(); select(VIDEOS[idx + 1].id); }
  });
</script>
</body>
</html>
