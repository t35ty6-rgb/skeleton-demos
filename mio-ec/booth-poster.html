<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5eb9d6">
<title>ルーレット実施中｜MIO × TOKYO OUTDOOR SHOW タイアップ記念</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky-light:#7ec8e3;
  --sky:#5eb9d6;
  --sky-deep:#3a9bc0;
  --sky-deeper:#2a7a98;
  --ink:#0f2a3a;
  --ink-2:#4a6b7c;
  --ink-3:#8a9eaa;
  --paper:#ffffff;
  --line-green:#06c755;
  --hair:#d8e6ee;
  --shadow:0 28px 60px -22px rgba(8,40,60,.45),0 10px 24px -10px rgba(8,40,60,.18);
  --sans:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'Inter','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;color:var(--ink);
  font-family:var(--sans);font-weight:500;font-feature-settings:"palt";
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow:hidden;
}

/* ============== Stage: 2-section split ============== */
.poster{
  position:relative;width:100vw;height:100vh;overflow:hidden;
  display:grid;grid-template-rows:1fr 1fr;
  background:#fff;
}

/* ============== HERO (upper half — sky + mountains + event title) ============== */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:
    linear-gradient(180deg, rgba(42,122,152,.05) 0%, rgba(42,122,152,.32) 100%),
    linear-gradient(180deg, var(--sky-light) 0%, var(--sky) 50%, var(--sky-deep) 100%);
  display:flex;flex-direction:column;
}
.mountains{
  position:absolute;left:0;right:0;bottom:0;height:80%;
  pointer-events:none;z-index:1;
}
.mountains svg{width:100%;height:100%;display:block}
.stars{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:
    radial-gradient(1px 1px at 18% 14%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 18%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 42% 28%, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 22%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 30% 9%, rgba(255,255,255,.5) 50%, transparent 51%);
  opacity:.8;
}
.hero-inner{
  position:relative;z-index:2;flex:1;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:34px 56px 28px;
}

/* ============== ACTION (lower half — white card surface) ============== */
.action{
  position:relative;background:#fff;
  padding:30px 56px 22px;
  display:grid;grid-template-rows:1fr auto auto;gap:18px;
}

/* ============== Top thin bar ============== */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.top-l{
  font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.32em;
  color:rgba(255,255,255,.78);text-transform:uppercase;
  display:flex;align-items:center;gap:14px;
}
.top-l::after{content:"";width:50px;height:1px;background:rgba(255,255,255,.4)}
.top-r{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  padding:9px 18px;border-radius:99px;
  border:1px solid rgba(255,255,255,.22);
}
.top-r .label{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.3em;color:#fff;text-transform:uppercase}
.top-r .dot{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}

/* ============== Event headline (centered in hero) ============== */
.event{
  text-align:center;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.event-logos{
  display:flex;align-items:center;justify-content:center;gap:20px;
  margin-bottom:20px;
}
.event-logos img.mio-big{height:60px;width:auto;display:block}
.event-logos .x{
  font-family:var(--mono);font-weight:300;font-size:30px;line-height:1;
  color:rgba(255,255,255,.7);
}
.tos-block{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(255,255,255,.96);
  padding:11px 18px;border-radius:10px;
  box-shadow:0 10px 22px -8px rgba(8,40,60,.3);
}
.tos-row{display:flex;gap:5px;line-height:1;font-family:var(--mono);font-weight:900;font-size:15px}
.tos-row .tt{color:#1a2e63}
.tos-row .to{color:#d63a1e}
.tos-row .ts{color:#2d8a3e}
.tos-block .yr{font-family:var(--mono);font-size:8.5px;letter-spacing:.26em;color:#6a7180;font-weight:800;text-transform:uppercase}

.event-eye{
  display:inline-block;font-size:13px;font-weight:700;letter-spacing:.32em;
  color:rgba(255,255,255,.96);margin-bottom:16px;
  padding:7px 20px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.45);border-radius:99px;
  backdrop-filter:blur(6px);
}
.event-title{
  font-weight:900;letter-spacing:.02em;line-height:1;
  font-size:clamp(54px,8.5vmin,90px);
  color:#fff;margin-bottom:14px;
  text-shadow:0 4px 24px rgba(8,40,60,.3);
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
}
.event-title .now{
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;color:var(--sky-deeper);
  padding:6px 16px 9px;border-radius:8px;
  text-shadow:none;
  box-shadow:0 10px 22px -6px rgba(8,40,60,.45);
  transform:rotate(-1.5deg);
  font-size:.82em;
}
.event-sub{
  font-size:16px;font-weight:500;color:rgba(255,255,255,.95);letter-spacing:.06em;line-height:1.7;
  max-width:540px;
}
.event-sub b{font-weight:900;color:#fff}
.event-sub b .pct{font-family:var(--mono);font-weight:900;font-size:1.18em;letter-spacing:-.02em;margin:0 2px}

/* ============== QR card (centered in action panel) ============== */
.qr-card{
  background:#fff;border-radius:18px;padding:0;
  align-self:center;width:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;
}
.qr-img{width:220px;height:220px;display:block;border:1px solid var(--hair);padding:10px;border-radius:8px;background:#fff}
.qr-eye{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10.5px;font-weight:800;letter-spacing:.3em;
  color:var(--line-green);text-transform:uppercase;
}
.qr-eye::before{
  content:"L";display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:5px;background:var(--line-green);color:#fff;
  font-family:var(--mono);font-weight:900;font-size:13px;letter-spacing:0;
}
.qr-card h2{
  font-size:22px;font-weight:900;letter-spacing:.04em;color:var(--ink);line-height:1.45;
}
.qr-card h2 b{color:var(--line-green)}

/* ============== Steps row (on white action panel) ============== */
.steps{
  list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin:0;
}
.steps li{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:#f5fafd;border:1px solid var(--hair);border-radius:10px;
}
.steps .n{
  flex:0 0 auto;width:32px;height:32px;border-radius:50%;
  background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:900;font-size:14px;
}
.steps .t{font-weight:700;font-size:14px;color:var(--ink);line-height:1.4;letter-spacing:.02em}
.steps .t small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-2);margin-top:2px;letter-spacing:.04em}

/* ============== Brand band (on white action panel) ============== */
.brand-band{
  display:flex;align-items:center;gap:22px;color:var(--ink);
}
.brand-band .ln{flex:1;height:1px;background:var(--hair)}
.brand-band .txt{text-align:center}
.brand-band .jp{font-size:14px;font-weight:700;letter-spacing:.24em;line-height:1.4;color:var(--ink)}
.brand-band .en{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.32em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}

/* ============== iPad mini (768) ============== */
@media (max-width:800px){
  .hero-inner{padding:28px 40px 22px}
  .action{padding:24px 40px 18px}
  .event-logos img.mio-big{height:52px}
  .event-logos{gap:16px;margin-bottom:16px}
  .event-logos .x{font-size:26px}
  .event-title{font-size:clamp(44px,8vmin,76px)}
  .event-sub{font-size:14px}
  .qr-img{width:200px;height:200px}
  .qr-card h2{font-size:20px}
}

/* ============== iPad landscape (left=hero, right=action) ============== */
@media (orientation:landscape){
  .poster{grid-template-rows:none;grid-template-columns:1fr 1fr}
  .hero-inner{padding:24px 40px 20px}
  .action{padding:24px 40px 18px;grid-template-rows:1fr auto auto;gap:14px}
  .event-logos img.mio-big{height:48px}
  .event-logos{gap:14px;margin-bottom:14px}
  .event-logos .x{font-size:22px}
  .tos-block{padding:9px 14px}
  .tos-row{font-size:13px}
  .tos-block .yr{font-size:7.5px}
  .event-eye{font-size:11.5px;padding:6px 16px;margin-bottom:12px;letter-spacing:.28em}
  .event-title{font-size:clamp(40px,6.5vmin,72px);margin-bottom:12px}
  .event-sub{font-size:13.5px;max-width:none}
  .qr-img{width:180px;height:180px}
  .qr-card h2{font-size:18px}
  .steps{gap:8px}
  .steps li{padding:11px 12px;gap:10px}
  .steps .t{font-size:13px}
  .steps .t small{font-size:10px}
  .brand-band{gap:18px}
  .brand-band .jp{font-size:13px;letter-spacing:.2em}
}
</style>
</head>
<body>

<div class="poster">

  <!-- ============ HERO (sky + mountains + event headline) ============ -->
  <section class="hero">
    <div class="stars" aria-hidden="true"></div>
    <svg class="mountains" viewBox="0 0 1600 600" preserveAspectRatio="none" aria-hidden="true">
      <!-- Mio HP と同じ 3層山シルエット (奥越の雲海・山々) -->
      <path d="M0,600 L0,360 C160,300 300,330 400,290 C520,250 620,290 760,250 C880,220 1000,260 1140,230 C1280,210 1420,250 1600,220 L1600,600 Z" fill="rgba(255,255,255,.22)"/>
      <path d="M0,600 L0,440 C140,390 280,410 420,370 C560,340 700,380 840,350 C980,330 1120,360 1280,340 C1440,330 1540,360 1600,350 L1600,600 Z" fill="rgba(255,255,255,.34)"/>
      <path d="M0,600 L0,510 C200,490 400,500 600,480 C800,470 1000,490 1200,470 C1400,470 1500,490 1600,480 L1600,600 Z" fill="rgba(255,255,255,.52)"/>
    </svg>
    <div class="hero-inner">

      <header class="top">
        <div class="top-l">TOKYO BIG SIGHT ／ 2026</div>
        <div class="top-r">
          <span class="dot"></span>
          <span class="label">EVENT IN PROGRESS</span>
        </div>
      </header>

      <div class="event">
        <div class="event-logos">
          <img class="mio-big" src="assets/img/logo-mio-white.png" alt="MIO ／ Made in Ono">
          <span class="x" aria-hidden="true">×</span>
          <div class="tos-block" aria-label="Tokyo Outdoor Show">
            <div class="tos-row">
              <span class="tt">TOKYO</span><span class="to">OUTDOOR</span><span class="ts">SHOW</span>
            </div>
            <div class="yr">2026</div>
          </div>
        </div>
        <div class="event-eye">タイアップ記念イベント</div>
        <h1 class="event-title">
          <span>ルーレット</span>
          <span class="now">実施中</span>
        </h1>
        <p class="event-sub">
          参加された方全員に、<b>最大<span class="pct">20%</span>OFF</b> のオンラインストアクーポンを抽選プレゼント。
        </p>
      </div>

      <span></span><!-- spacer for hero-inner space-between -->
    </div>
  </section>

  <!-- ============ ACTION (white panel — QR + steps + brand) ============ -->
  <section class="action">

    <div class="qr-card">
      <img class="qr-img" src="assets/img/booth/line-qr.png" alt="MIO 公式 LINE 友だち追加 QR コード">
      <div class="qr-eye">Scan ／ こちらを読み取り</div>
      <h2>QRを読み取って<br><b>LINE で友だち追加</b></h2>
    </div>

    <ol class="steps">
      <li><span class="n">1</span><span class="t">LINE 友だち追加<small>QR をスマホで読み取り</small></span></li>
      <li><span class="n">2</span><span class="t">アンケート回答<small>所要 30 秒・タップだけ</small></span></li>
      <li><span class="n">3</span><span class="t">ルーレットで抽選<small>5% / 10% / 20% OFF</small></span></li>
    </ol>

    <div class="brand-band">
      <div class="ln"></div>
      <div class="txt">
        <div class="jp">大野の匠を、全国に。</div>
        <div class="en">MIO ／ Made in Ono ・ 大野商工会議所</div>
      </div>
      <div class="ln"></div>
    </div>

  </section>

</div>

</body>
</html>
