<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Appearance Care Academy — 教材 (mock v0.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF7F1;
    --bg-card: #FFFFFF;
    --bg-soft: #F4ECDE;
    --line: #E6DCC9;
    --line-soft: #EFE7D6;
    --ink: #1E2A38;
    --ink-soft: #4F5A66;
    --ink-mute: #8A8170;
    --accent: #B47B6A;
    --accent-deep: #8C5848;
    --sage: #7E9982;
    --sage-deep: #4E6B57;
    --warn: #C78E5D;
    --serif: 'Shippori Mincho','Cormorant Garamond',serif;
    --sans: 'Noto Sans JP', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ===== Login gate ===== */
  #gate {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(180deg, #1E2A38 0%, #2A3848 100%);
    display: none; align-items: center; justify-content: center;
    font-family: var(--sans);
  }
  #gate .panel {
    max-width: 420px; width: calc(100% - 40px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(180,123,106,0.35);
    padding: 56px 40px 44px;
    color: #F5EFE4;
    text-align: center;
  }
  #gate .mark { font-family: var(--serif); font-size: 11px; letter-spacing: 6px; color: var(--accent); margin-bottom: 12px; }
  #gate .rule { width: 28px; height: 1px; background: var(--accent); margin: 0 auto 24px; }
  #gate h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 8px; letter-spacing: .1em; }
  #gate .sub { font-size: 12px; color: rgba(245,239,228,0.65); letter-spacing: .12em; margin-bottom: 32px; }
  #gate label { display: block; text-align: left; font-size: 11px; letter-spacing: .15em; color: rgba(245,239,228,0.7); margin-bottom: 6px; }
  #gate input { width: 100%; padding: 12px 14px; margin-bottom: 16px; background: rgba(0,0,0,0.25); color: #F5EFE4; border: 1px solid rgba(245,239,228,0.18); font-family: inherit; font-size: 14px; outline: none; }
  #gate input:focus { border-color: var(--accent); }
  #gate button { width: 100%; padding: 14px; background: var(--accent); color: #1E2A38; border: none; font-family: var(--serif); letter-spacing: .25em; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
  #gate button:hover { background: var(--accent-deep); color: #F5EFE4; }
  #gate .err { color: #E6A0A0; font-size: 12px; margin-top: 14px; min-height: 16px; }
  #gate .foot { margin-top: 36px; font-size: 10px; color: rgba(245,239,228,0.4); letter-spacing: .15em; }

  /* ===== Layout ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(251,247,241,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 28px; display: flex; align-items: center; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark { font-family: var(--serif); font-size: 11px; letter-spacing: .5em; color: var(--accent); }
  .brand-bar { width: 1px; height: 18px; background: var(--line); }
  .brand-name { font-family: var(--serif); font-size: 15px; letter-spacing: .15em; color: var(--ink); }
  .brand-app { font-size: 11px; color: var(--ink-mute); letter-spacing: .1em; margin-left: 4px; }
  .top-progress { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ink-soft); }
  .top-progress .bar { width: 140px; height: 4px; background: var(--bg-soft); position: relative; overflow: hidden; }
  .top-progress .bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sage); transition: width .3s ease; }
  .top-user { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-soft); }
  .top-user .av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--serif); font-size: 13px; }
  .top-user button { background: none; border: 1px solid var(--line); padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--ink-soft); letter-spacing: .1em; }
  .top-user button:hover { border-color: var(--accent); color: var(--accent-deep); }

  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }

  /* ===== Sidebar ===== */
  .side {
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, #FBF7F1 0%, #F6EFE0 100%);
    padding: 28px 0;
    overflow-y: auto;
  }
  .side h2 { font-family: var(--serif); font-size: 11px; letter-spacing: .35em; color: var(--ink-mute); margin: 0 28px 16px; text-transform: uppercase; }
  .side ol { list-style: none; padding: 0; margin: 0; }
  .side li { }
  .side a {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 13px 28px; text-decoration: none; color: var(--ink-soft);
    border-left: 3px solid transparent;
    transition: background .15s, color .15s, border-color .15s;
    cursor: pointer;
  }
  .side a:hover { background: rgba(180,123,106,0.06); color: var(--ink); }
  .side a.active { background: rgba(180,123,106,0.1); color: var(--ink); border-left-color: var(--accent); }
  .side .num { font-family: var(--serif); font-size: 12px; color: var(--accent); min-width: 22px; padding-top: 2px; }
  .side .title { font-size: 13.5px; line-height: 1.55; letter-spacing: .02em; }
  .side .check { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); flex-shrink: 0; margin-top: 4px; }
  .side a.done .check { background: var(--sage); border-color: var(--sage); position: relative; }
  .side a.done .check::after { content:''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .side-footer { padding: 24px 28px; font-size: 10px; color: var(--ink-mute); letter-spacing: .15em; border-top: 1px solid var(--line); margin-top: 24px; }

  /* ===== Main ===== */
  .main { padding: 56px 64px 120px; max-width: 880px; }
  .breadcrumbs { font-size: 11px; letter-spacing: .15em; color: var(--ink-mute); margin-bottom: 16px; }
  .breadcrumbs .accent { color: var(--accent); }
  .lesson-head { border-bottom: 1px solid var(--line); padding-bottom: 28px; margin-bottom: 36px; }
  .lesson-num { font-family: var(--serif); font-size: 12px; letter-spacing: .4em; color: var(--accent); margin-bottom: 10px; }
  .lesson-title { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.35; letter-spacing: .04em; margin: 0 0 14px; color: var(--ink); }
  .lesson-lead { font-size: 15px; color: var(--ink-soft); line-height: 1.85; max-width: 640px; }
  .lesson-body h3 { font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: .04em; margin: 48px 0 16px; color: var(--ink); position: relative; padding-left: 18px; }
  .lesson-body h3::before { content: ''; position: absolute; left: 0; top: 14px; width: 8px; height: 8px; background: var(--accent); }
  .lesson-body h4 { font-family: var(--serif); font-size: 16px; font-weight: 600; margin: 32px 0 10px; letter-spacing: .03em; color: var(--ink); }
  .lesson-body p { margin: 0 0 16px; color: var(--ink); }
  .lesson-body ul { padding-left: 1.2em; }
  .lesson-body li { margin-bottom: 6px; }
  .lesson-body em.q { font-style: normal; font-family: var(--serif); color: var(--accent-deep); font-weight: 500; }

  .pull {
    background: var(--bg-soft); border-left: 3px solid var(--accent);
    padding: 20px 24px; margin: 28px 0; font-family: var(--serif); font-size: 17px; line-height: 1.85; color: var(--ink);
  }
  .pull .label { display: block; font-family: var(--sans); font-size: 10px; letter-spacing: .3em; color: var(--accent); margin-bottom: 8px; }

  .note {
    background: #F1F5EE; border-left: 3px solid var(--sage);
    padding: 16px 20px; margin: 20px 0; font-size: 14px; color: var(--ink-soft);
  }
  .note .label { display: block; font-size: 10px; letter-spacing: .25em; color: var(--sage-deep); margin-bottom: 4px; font-weight: 600; }

  /* 5領域カード */
  .domain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 24px 0 32px; }
  .domain { background: var(--bg-card); border: 1px solid var(--line); padding: 22px 22px 24px; }
  .domain .num { font-family: var(--serif); font-size: 11px; letter-spacing: .3em; color: var(--accent); margin-bottom: 6px; }
  .domain .ttl { font-family: var(--serif); font-size: 18px; font-weight: 500; margin: 0 0 10px; }
  .domain ul { font-size: 13px; color: var(--ink-soft); padding-left: 1em; margin: 0 0 12px; }
  .domain ul li { margin-bottom: 2px; }
  .domain .role { font-size: 11.5px; color: var(--sage-deep); letter-spacing: .04em; border-top: 1px dashed var(--line-soft); padding-top: 10px; }

  /* サービス5本柱テーブル */
  .service-table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 14px; }
  .service-table th, .service-table td { text-align: left; padding: 14px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .service-table th { font-family: var(--serif); font-weight: 500; color: var(--accent-deep); font-size: 12px; letter-spacing: .15em; border-bottom: 2px solid var(--line); background: var(--bg-soft); }
  .service-table .badge { display: inline-block; font-family: var(--serif); padding: 3px 8px; background: var(--accent); color: #fff; font-size: 11px; letter-spacing: .15em; margin-right: 6px; }
  .service-table .price { font-family: var(--serif); color: var(--accent-deep); font-size: 13px; }

  /* ジャーニー */
  .journey { display: flex; flex-direction: column; gap: 0; margin: 24px 0 12px; position: relative; }
  .journey-step { display: flex; gap: 20px; padding: 18px 0; border-bottom: 1px dashed var(--line); position: relative; }
  .journey-step:last-child { border-bottom: none; }
  .journey-step .stepnum { width: 38px; height: 38px; border: 1px solid var(--accent); color: var(--accent-deep); font-family: var(--serif); font-size: 14px; display: grid; place-items: center; flex-shrink: 0; background: var(--bg-card); }
  .journey-step .stepbody { flex: 1; }
  .journey-step .stepttl { font-family: var(--serif); font-size: 17px; font-weight: 500; margin-bottom: 4px; }
  .journey-step .stepsub { font-size: 13px; color: var(--ink-soft); }
  .journey-step .stepmeta { margin-top: 6px; font-size: 12px; color: var(--ink-mute); }

  /* check list */
  .checklist { background: var(--bg-card); border: 1px solid var(--line); padding: 20px 24px; margin: 24px 0; }
  .checklist h4 { margin: 0 0 12px; font-family: var(--serif); font-size: 15px; font-weight: 600; color: var(--accent-deep); letter-spacing: .04em; }
  .checklist label { display: flex; gap: 10px; padding: 6px 0; font-size: 13.5px; align-items: flex-start; cursor: pointer; }
  .checklist input[type="checkbox"] { margin-top: 5px; accent-color: var(--sage); }

  /* lesson footer */
  .lesson-foot { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .btn { font-family: var(--serif); letter-spacing: .15em; font-size: 12px; padding: 12px 22px; border: 1px solid var(--accent); background: transparent; color: var(--accent-deep); cursor: pointer; transition: all .15s; }
  .btn:hover { background: var(--accent); color: #fff; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-deep); }
  .btn.ghost { border-color: var(--line); color: var(--ink-soft); }
  .btn.ghost:hover { border-color: var(--ink-soft); color: var(--ink); background: transparent; }
  .btn.done { background: var(--sage); border-color: var(--sage); color: #fff; }
  .nav-bar { margin-left: auto; display: flex; gap: 12px; }

  /* mobile */
  .menu-btn { display: none; }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 56px; bottom: 0; width: 86%; max-width: 320px; z-index: 40; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 0 8px 24px rgba(30,42,56,0.12); }
    .side.open { transform: translateX(0); }
    .scrim { position: fixed; inset: 56px 0 0 0; background: rgba(30,42,56,0.35); z-index: 35; display: none; }
    .scrim.show { display: block; }
    .main { padding: 32px 22px 100px; }
    .lesson-title { font-size: 26px; }
    .topbar { padding: 12px 16px; gap: 12px; }
    .menu-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--line); background: var(--bg-card); cursor: pointer; }
    .menu-btn svg { width: 18px; height: 18px; }
    .top-progress .bar { width: 90px; }
    .brand-app { display: none; }
    .top-user .name { display: none; }
  }
  @media (max-width: 440px) {
    .lesson-title { font-size: 22px; }
    .topbar { padding: 10px 12px; }
    .top-progress { gap: 8px; font-size: 11px; }
    .top-progress .label { display: none; }
  }
</style>
</head>

<!-- ===== Auth ===== -->
<script>
(function(){
  const VALID = new Set([
    'a6992708d599d658223df89acf889195d9d25432f6bcdf06c0249c013bd7e2b7', // tsukasa:skeleton2026
    'd92ac4eda6000cfe5dc20925bc0c514eddae928e84a2fb3982e36ac6f3844ca6', // asakawa:appcare2026
    '07f9fd18bcdc7fd3ce318d4abb7045916fecc2cedbc27f3145c53e630a47e27b'  // demo:demo2026
  ]);
  async function sha256(text){
    const buf = new TextEncoder().encode(text);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const gate = document.getElementById('gate');
  function show(){ document.body.style.overflow='hidden'; gate.style.display='flex'; setTimeout(()=>document.getElementById('g-id').focus(),60); }
  function hide(){ document.body.style.overflow=''; gate.style.display='none'; }
  async function check(){
    const id = document.getElementById('g-id').value.trim();
    const pw = document.getElementById('g-pw').value;
    if(!id || !pw) return;
    const h = await sha256(id + ':' + pw);
    if (VALID.has(h)) {
      sessionStorage.setItem('aca_auth', h);
      sessionStorage.setItem('aca_user', id);
      document.getElementById('username').textContent = id;
      document.getElementById('avatar').textContent = id[0].toUpperCase();
      hide();
    } else {
      document.getElementById('g-err').textContent = 'ID または パスワードが違います';
      document.getElementById('g-pw').value = '';
    }
  }
  const saved = sessionStorage.getItem('aca_auth');
  const savedUser = sessionStorage.getItem('aca_user');
  if (saved && VALID.has(saved)) {
    if (savedUser) {
      document.getElementById('username').textContent = savedUser;
      document.getElementById('avatar').textContent = savedUser[0].toUpperCase();
    }
  } else {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
  }
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('g-submit').addEventListener('click', check);
    document.getElementById('g-pw').addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
    document.getElementById('g-id').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('g-pw').focus(); });
    document.getElementById('signout').addEventListener('click', ()=>{
      sessionStorage.removeItem('aca_auth'); sessionStorage.removeItem('aca_user'); location.reload();
    });
  });
})();
</script>

<!-- ===== Content & app ===== -->
<script>
const LESSONS = [
  {

    num: 'CHAPTER 01',
    title: 'はじめに — アピアランスケアとは',
    lead: 'この教材は、がん患者さんとそのご家族に「自分らしさ」を取り戻していただくための、看護師による伴走ケアを学ぶための入門です。',

  {

    lead: 'アピアランスケアの中核フレームワーク。見た目だけでなく、内面・心・経済・社会との繋がりまでを 5 領域で統合的に整えます。',
    body: `
      <h3>全体像</h3>

      <div class="domain-grid">

          <div class="num">DOMAIN 01</div>

          <ul><li>肌・髪・体型</li><li>清潔感・若々しさ</li><li>第一印象</li></ul>
          <div class="role">▶ 社会との接点をつくる入口</div>
        </div>

const STORAGE_KEY = 'aca_progress_v1';
let progress = {};
try { progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e){ progress = {}; }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

let currentIdx = parseInt(sessionStorage.getItem('aca_lesson') || '0', 10);
if (currentIdx < 0 || currentIdx >= LESSONS.length) currentIdx = 0;

function renderSidebar(){
  const ol = document.getElementById('lessons');
  ol.innerHTML = LESSONS.map((l, i) => `
    <li>
      <a data-i="${i}" class="${i===currentIdx?'active':''} ${progress[l.id]?'done':''}">
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <span class="title">${l.title}</span>
        <span class="check"></span>
      </a>
    </li>
  `).join('');
  ol.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => { currentIdx = parseInt(a.dataset.i,10); sessionStorage.setItem('aca_lesson', currentIdx); render(); closeSide(); });
  });
}

function renderProgress(){
  const done = LESSONS.filter(l => progress[l.id]).length;
  const pct = Math.round(done / LESSONS.length * 100);
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ptext').textContent = pct + '%';
}

function renderLesson(){
  const l = LESSONS[currentIdx];
  const isDone = !!progress[l.id];
  document.getElementById('main').innerHTML = `
    <div class="breadcrumbs">CURRICULUM <span class="accent">/</span> ${l.num}</div>
    <div class="lesson-head">
      <div class="lesson-num">${l.num}</div>
      <h1 class="lesson-title">${l.title}</h1>
      <p class="lesson-lead">${l.lead}</p>
    </div>
    <div class="lesson-body">${l.body}</div>
    <div class="lesson-foot">
      <button class="btn ${isDone?'done':'primary'}" id="markdone">${isDone?'✓ 受講済み':'この章を完了にする'}</button>
      <div class="nav-bar">
        <button class="btn ghost" id="prev" ${currentIdx===0?'disabled style="opacity:.4;cursor:not-allowed"':''}>← 前の章</button>
        <button class="btn ghost" id="next" ${currentIdx===LESSONS.length-1?'disabled style="opacity:.4;cursor:not-allowed"':''}>次の章 →</button>
      </div>
    </div>
  `;
  // checkbox state restore
  document.querySelectorAll('.checklist input[type="checkbox"]').forEach(cb => {
    const k = 'cb:' + cb.dataset.q;
    if (progress[k]) cb.checked = true;
    cb.addEventListener('change', () => { progress[k] = cb.checked; save(); });
  });
  document.getElementById('markdone').addEventListener('click', () => {
    progress[l.id] = !progress[l.id];
    save(); renderSidebar(); renderProgress(); renderLesson();
  });
  document.getElementById('prev').addEventListener('click', () => { if (currentIdx>0){ currentIdx--; sessionStorage.setItem('aca_lesson', currentIdx); render(); window.scrollTo({top:0,behavior:'smooth'}); }});
  document.getElementById('next').addEventListener('click', () => { if (currentIdx<LESSONS.length-1){ currentIdx++; sessionStorage.setItem('aca_lesson', currentIdx); render(); window.scrollTo({top:0,behavior:'smooth'}); }});
}

function render(){ renderSidebar(); renderProgress(); renderLesson(); }

// mobile drawer
function openSide(){ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('show'); }
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); }

document.addEventListener('DOMContentLoaded', () => {
  render();
  document.getElementById('menu-btn').addEventListener('click', () => {
    const open = document.getElementById('side').classList.contains('open');
    open ? closeSide() : openSide();
  });
  document.getElementById('scrim').addEventListener('click', closeSide);
});
</script>
