<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C · SWIPE-DECK · 福鉄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171826;
  --bg-2:#20223a;
  --paper:#fafafd;
  --ink:#0f1220;
  --dim:#767a91;
  --accent:#ff7854;
  --accent-2:#fd267a;
  --green:#4fd97b;
  --yellow:#ffb84a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--paper);font-family:"Poppins","Noto Sans JP",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;line-height:1.4;overflow:hidden;height:100vh}
.app{max-width:420px;margin:0 auto;height:100vh;background:linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 100%);position:relative;overflow:hidden;display:flex;flex-direction:column}

/* ─── TOP: progress dots + counter ─── */
.top{padding:16px 20px 12px;flex-shrink:0}
.top-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top-row1 .brand{font-family:"Poppins",sans-serif;font-weight:800;font-size:14px;letter-spacing:.02em}
.top-row1 .brand span{color:var(--accent)}
.top-row1 .avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.dots{display:flex;gap:4px}
.dot{flex:1;height:3px;border-radius:2px;background:oklch(1 0 0 / .12)}
.dot.done{background:var(--green)}
.dot.now{background:var(--accent)}

/* ─── CARD STACK CENTER ─── */
.deck{flex:1;position:relative;padding:16px 20px 8px;display:flex;align-items:center;justify-content:center}
.card{position:absolute;left:20px;right:20px;background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 20px 40px -12px oklch(0 0 0 / .5),0 0 0 1px oklch(1 0 0 / .08);transition:transform .3s cubic-bezier(.2,.9,.2,1)}
.card.back-2{transform:translateY(24px) scale(.9);opacity:.6}
.card.back-1{transform:translateY(12px) scale(.95);opacity:.85}
.card.front{transform:translateY(0) scale(1);z-index:2}
.card-im{aspect-ratio:1;background:linear-gradient(135deg,oklch(0.75 0.15 40) 0%,oklch(0.55 0.24 30) 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-im .kanji{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:180px;color:oklch(1 0 0 / .95);letter-spacing:-.05em;text-shadow:0 8px 30px oklch(0 0 0 / .4)}
.card-im::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 20%,oklch(1 0 0 / .3) 0%,transparent 60%)}
.card-tags{position:absolute;top:16px;left:16px;display:flex;gap:6px}
.card-tag{background:oklch(0 0 0 / .5);color:var(--paper);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.05em;backdrop-filter:blur(6px)}
.card-tag.dist{background:var(--green);color:var(--paper)}
.card-info{padding:20px 22px 22px}
.card-info .co{font-family:"Poppins",sans-serif;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.card-info h2{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.card-info .sub{font-family:"Noto Sans JP",sans-serif;font-size:13px;color:var(--dim);font-weight:500;margin-top:6px;line-height:1.6}

/* ─── SWIPE ACTION BUTTONS ─── */
.swipe-actions{padding:12px 20px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0}
.swipe-btn{width:60px;height:60px;border-radius:50%;background:oklch(1 0 0 / .08);border:1.5px solid oklch(1 0 0 / .15);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:transform .15s}
.swipe-btn:active{transform:scale(.92)}
.swipe-btn.center{width:82px;height:82px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);border:none;box-shadow:0 8px 24px -4px oklch(0.6 0.2 30 / .6)}
.swipe-btn.center svg{width:32px;height:32px;stroke-width:2.4}
.swipe-btn.skip{background:transparent;color:var(--dim)}
.swipe-btn.info{background:transparent;color:var(--yellow)}
.swipe-btn.map{background:transparent;color:oklch(0.6 0.15 220)}

/* ─── BOTTOM META ─── */
.meta-bar{padding:8px 20px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-top:1px solid oklch(1 0 0 / .08)}
.meta-count{display:flex;align-items:center;gap:8px}
.meta-count .n{font-family:"Poppins",sans-serif;font-size:22px;font-weight:900;color:var(--paper);letter-spacing:-.02em}
.meta-count .n small{font-size:12px;color:var(--dim);font-weight:600}
.meta-count .lbl{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.meta-tabs{display:flex;gap:6px;background:oklch(1 0 0 / .08);padding:4px;border-radius:12px}
.meta-tabs button{background:none;border:none;color:var(--dim);padding:6px 12px;border-radius:8px;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer;letter-spacing:.02em}
.meta-tabs button.on{background:var(--paper);color:var(--ink)}
</style>
</head>
<body>

<div class="app">
  <!-- TOP: brand + progress dots -->
  <div class="top">
    <div class="top-row1">
      <div class="brand">FUKUBU<span>.</span>DECK</div>
      <div class="avatar">明</div>
    </div>
    <div class="dots">
      <div class="dot done"></div><div class="dot done"></div><div class="dot done"></div>
      <div class="dot now"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <!-- CENTER: card stack -->
  <div class="deck">
    <div class="card back-2">
      <div class="card-im"><span class="kanji">城</span></div>
      <div class="card-info"><div class="co">SP-06 · CH.3 FUKUI</div><h2>福井城址</h2></div>
    </div>
    <div class="card back-1">
      <div class="card-im" style="background:linear-gradient(135deg,#3b6c78 0%,#1c2d4f 100%)"><span class="kanji">花</span></div>
      <div class="card-info"><div class="co">SP-04 · CH.2 SABAE</div><h2>西山公園</h2></div>
    </div>
    <div class="card front">
      <div class="card-im" style="background:linear-gradient(135deg,#dcaf3d 0%,#c85a2a 100%)">
        <div class="card-tags"><span class="card-tag">SP-05</span><span class="card-tag dist">圏内 · 押印可</span></div>
        <span class="kanji">鏡</span>
      </div>
      <div class="card-info">
        <div class="co">CH.2 SABAE · 神明駅</div>
        <h2>めがねミュージアム</h2>
        <div class="sub">鯖江眼鏡 の 全て が ここに。 工房で 手作り体験、 掘り出し物 を 探す。</div>
      </div>
    </div>
  </div>

  <!-- SWIPE ACTION BUTTONS -->
  <div class="swipe-actions">
    <button class="swipe-btn skip" title="次へ"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <button class="swipe-btn info" title="詳細"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></button>
    <button class="swipe-btn center" title="押印!">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </button>
    <button class="swipe-btn map" title="地図"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C7 2 5 6 5 10c0 5 7 12 7 12s7-7 7-12c0-4-2-8-7-8z"/><circle cx="12" cy="10" r="3"/></svg></button>
    <button class="swipe-btn skip" title="巻き戻し"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 019-9v0a9 9 0 018 5"/><polyline points="19 3 20 8 15 8"/></svg></button>
  </div>

  <!-- META BAR: count + tabs -->
  <div class="meta-bar">
    <div class="meta-count">
      <div class="n">3<small> / 10</small></div>
      <div class="lbl">Collected</div>
    </div>
    <div class="meta-tabs">
      <button class="on">Deck</button>
      <button>Map</button>
      <button>Book</button>
      <button>Prize</button>
    </div>
  </div>
</div>
</body></html>
