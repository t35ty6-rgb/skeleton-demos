<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#fbf7ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ふくてつ · さんぽ帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
   Scene: 60代 女性 が 一人で 週末 の 福鉄 に乗り、
   沿線の 神社 · 商店街 を 巡り、 手に持った スマホ に
   静かな 相棒 が 話しかけてくる。 明るい夏の朝の光。
   Strategy: committed (Fukubu orange 30-40%).
   ═══════════════════════════════════════ */
:root{
  /* Warm off-white body (not cream: chroma toward orange hue) */
  --bg:oklch(0.985 0.008 60);
  --bg-sink:oklch(0.965 0.011 65);
  --surface:oklch(1 0 0);
  --surface-2:oklch(0.98 0.006 82);
  --surface-3:oklch(0.94 0.012 78);
  --hair:oklch(0.9 0.01 78);
  --hair-2:oklch(0.82 0.012 74);

  /* Ink ramp */
  --ink:oklch(0.19 0.02 50);
  --ink-1:oklch(0.28 0.02 50);
  --ink-2:oklch(0.42 0.018 55);
  --ink-3:oklch(0.55 0.014 60);
  --ink-4:oklch(0.68 0.01 65);

  /* Sky world (upper board) */
  --sky-1:oklch(0.92 0.045 235);
  --sky-2:oklch(0.87 0.06 220);
  --sky-3:oklch(0.82 0.075 210);

  /* Grass world (lower board) */
  --grass-1:oklch(0.82 0.1 148);
  --grass-2:oklch(0.72 0.13 148);
  --grass-3:oklch(0.6 0.14 148);

  /* Brand · Fukubu orange */
  --brand:oklch(0.62 0.185 40);
  --brand-hi:oklch(0.7 0.19 42);
  --brand-lo:oklch(0.5 0.17 38);
  --brand-tint:oklch(0.95 0.03 42);

  /* States */
  --done:oklch(0.58 0.14 148);
  --done-hi:oklch(0.68 0.14 148);
  --done-lo:oklch(0.44 0.13 148);
  --locked:oklch(0.68 0.03 55);
  --locked-hi:oklch(0.76 0.03 55);
  --lens:oklch(0.5 0.15 235);  /* chat me */
  --lens-hi:oklch(0.62 0.16 235);
  --gold:oklch(0.82 0.11 82);
  --sakura:oklch(0.86 0.07 15);

  /* Semantic z-index */
  --z-board:0;
  --z-sheet:10;
  --z-header:20;
  --z-toast:30;
  --z-fab:35;
  --z-backdrop:40;
  --z-modal:50;

  /* Motion */
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:cubic-bezier(0.65,0,0.35,1);
  --dur-1:180ms;
  --dur-2:260ms;
  --dur-3:420ms;

  /* Spacing scale */
  --s-1:4px;
  --s-2:8px;
  --s-3:12px;
  --s-4:16px;
  --s-5:24px;
  --s-6:32px;

  /* Radii */
  --r-1:8px;
  --r-2:14px;
  --r-3:20px;
  --r-4:28px;

  /* Safe area */
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}

@media (prefers-color-scheme: dark){
  /* Kept light per product register: cream/paper aesthetic is core identity */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Nunito",system-ui,-apple-system,sans-serif;
  font-weight:500;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
  font-optical-sizing:auto;
  user-select:none;
}
button,input{font-family:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input{outline:0}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* ═══════════════════════════════════════
   APP SHELL
   ═══════════════════════════════════════ */
.app{
  position:fixed;
  inset:0;
  max-width:440px;
  margin:0 auto;
  background:var(--bg);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ─────── Sticky header ─────── */
.app-header{
  z-index:var(--z-header);
  padding:calc(var(--safe-top) + 10px) 14px 12px;
  background:oklch(from var(--bg) l c h / 0.72);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:12px;
  border-bottom:0.5px solid oklch(from var(--ink) l c h / 0.08);
  flex-shrink:0;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(158deg,var(--brand-hi) 0%,var(--brand) 55%,var(--brand-lo) 100%);
  display:grid;
  place-items:center;
  color:oklch(1 0 0);
  font-family:"Nunito",sans-serif;
  font-weight:900;
  font-size:15px;
  letter-spacing:-0.03em;
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 0.28),
    inset 0 -1px 0 oklch(0 0 0 / 0.14),
    0 2px 6px -1px oklch(from var(--brand) l c h / 0.35);
  position:relative;
}
.brand-mark::after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid oklch(1 0 0 / 0.22);
  border-radius:6px;
  pointer-events:none;
}
.brand-mark span{position:relative;z-index:1}
.brand-text .brand-name{
  font-family:"Nunito",sans-serif;
  font-weight:800;
  font-size:15.5px;
  letter-spacing:-0.015em;
  line-height:1.1;
  color:var(--ink);
}
.brand-text .brand-sub{
  font-size:11px;
  font-weight:600;
  color:var(--ink-3);
  letter-spacing:0.02em;
  line-height:1.15;
  margin-top:1px;
}

/* Center progress pill */
.progress-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 6px 6px 12px;
  background:var(--surface);
  border-radius:22px;
  box-shadow:
    0 1px 2px oklch(0 0 0 / 0.06),
    0 4px 12px -6px oklch(0 0 0 / 0.12),
    inset 0 0 0 1px var(--hair);
  justify-self:center;
}
.progress-pill .p-num{
  font-family:"Nunito",sans-serif;
  font-weight:800;
  font-size:16px;
  letter-spacing:-0.015em;
  color:var(--ink);
  font-feature-settings:"tnum";
  line-height:1;
}
.progress-pill .p-num em{
  font-style:normal;
  color:var(--ink-3);
  font-weight:600;
  font-size:12.5px;
}
.progress-pill .p-track{
  width:56px;
  height:8px;
  background:var(--surface-3);
  border-radius:4px;
  overflow:hidden;
  position:relative;
}
.progress-pill .p-fill{
  position:absolute;
  inset:0;
  width:30%;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand-hi) 100%);
  border-radius:4px;
  box-shadow:inset 0 -1px 0 oklch(from var(--brand-lo) l c h / 0.45);
}

/* Header actions */
.header-actions{
  display:flex;
  align-items:center;
  gap:4px;
}
.icon-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:var(--ink-1);
  position:relative;
  transition:background var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out);
}
.icon-btn:active{background:var(--surface-3);transform:scale(0.94)}
.icon-btn svg{width:22px;height:22px;stroke-width:1.7}
.icon-btn .streak-flame{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
}
.icon-btn .streak-count{
  font-family:"Nunito",sans-serif;
  font-weight:800;
  font-size:12.5px;
  color:var(--brand);
  position:absolute;
  bottom:2px;
  right:2px;
  background:var(--surface);
  border-radius:8px;
  padding:0px 5px;
  line-height:14px;
  box-shadow:0 1px 2px oklch(0 0 0 / 0.14);
  min-width:16px;
  text-align:center;
}
.icon-btn.notif::after{
  content:"";
  position:absolute;
  top:6px;
  right:8px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--brand);
  box-shadow:0 0 0 2px var(--bg);
}

/* ═══════════════════════════════════════
   BOARD CANVAS (main scrollable)
   ═══════════════════════════════════════ */
.canvas{
  position:relative;
  overflow:hidden;
  flex:1;
  min-height:0;
  background:linear-gradient(180deg,
    var(--sky-1) 0%,
    var(--sky-2) 22%,
    oklch(0.93 0.05 175) 42%,
    var(--grass-1) 65%,
    var(--grass-2) 100%);
}
.canvas-scroll{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  padding-bottom:280px; /* chat peek clearance */
}
.canvas-scroll::-webkit-scrollbar{display:none}

/* Ambient decoration layer */
.canvas-decor{
  position:relative;
  width:100%;
  padding:8px 0 0;
  pointer-events:none;
}
.cloud{position:absolute;color:oklch(1 0 0 / 0.85)}
.cloud svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px oklch(from var(--ink) l c h / 0.05))}
.cloud.c1{top:24px;left:26px;width:88px;height:32px;animation:drift 20s var(--ease-in-out) infinite}
.cloud.c2{top:96px;right:32px;width:72px;height:26px;animation:drift 25s var(--ease-in-out) infinite reverse}
.cloud.c3{top:180px;left:48px;width:52px;height:20px;opacity:0.7;animation:drift 30s var(--ease-in-out) infinite}
@keyframes drift{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(20px)}
}

/* Sun / warm glow */
.sun{
  position:absolute;
  top:36px;
  right:22px;
  width:64px;
  height:64px;
  background:radial-gradient(circle,var(--gold) 20%,oklch(from var(--gold) l c h / 0.5) 40%,transparent 70%);
  border-radius:50%;
  filter:blur(1px);
  opacity:0.7;
}

/* Board SVG */
.board{
  position:relative;
  width:100%;
  height:1180px;
  z-index:1;
}
.board svg{width:100%;height:100%;display:block}

/* Node interaction states */
.node{cursor:pointer;transition:transform var(--dur-2) var(--ease-out)}
.node:active{transform:scale(0.94)}

/* ═══════════════════════════════════════
   CHAT SHEET (bottom, draggable 3-snap)
   ═══════════════════════════════════════ */
.sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:var(--z-sheet);
  background:var(--surface);
  border-top-left-radius:26px;
  border-top-right-radius:26px;
  box-shadow:
    0 -1px 0 var(--hair),
    0 -12px 40px -12px oklch(0 0 0 / 0.18),
    0 -24px 48px -20px oklch(0 0 0 / 0.12);
  transition:height var(--dur-2) var(--ease-out);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  max-height:calc(100vh - 88px - var(--safe-top));
}
.sheet[data-snap="peek"]{height:calc(268px + var(--safe-bottom))}
.sheet[data-snap="half"]{height:calc(52vh + var(--safe-bottom))}
.sheet[data-snap="full"]{height:calc(85vh + var(--safe-bottom))}

.sheet-handle{
  height:24px;
  display:grid;
  place-items:center;
  padding-top:8px;
  cursor:grab;
  flex-shrink:0;
  width:100%;
}
.sheet-handle:active{cursor:grabbing}
.handle-grip{
  width:38px;
  height:5px;
  border-radius:3px;
  background:var(--hair-2);
  transition:background var(--dur-1) var(--ease-out),width var(--dur-1) var(--ease-out);
}
.sheet-handle:hover .handle-grip,.sheet-handle:active .handle-grip{background:var(--ink-3);width:46px}

/* Agent header */
.agent-bar{
  padding:6px 16px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
  border-bottom:0.5px solid var(--hair);
}
.agent-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(160deg,oklch(0.92 0.07 42) 0%,var(--brand-hi) 60%,var(--brand) 100%);
  display:grid;
  place-items:center;
  position:relative;
  box-shadow:
    inset 0 1.5px 0 oklch(1 0 0 / 0.35),
    inset 0 -1.5px 0 oklch(from var(--brand-lo) l c h / 0.35),
    0 3px 8px -2px oklch(from var(--brand) l c h / 0.3);
  flex-shrink:0;
}
.agent-avatar svg{width:26px;height:26px;color:oklch(1 0 0)}
.agent-online{
  position:absolute;
  bottom:1px;
  right:1px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:oklch(0.72 0.16 150);
  border:2.5px solid var(--surface);
  box-shadow:0 0 8px oklch(from var(--done) l c h / 0.4);
}
.agent-online::after{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:50%;
  background:oklch(0.72 0.16 150 / 0.35);
  animation:ping 2.4s var(--ease-in-out) infinite;
}
@keyframes ping{
  0%{transform:scale(1);opacity:0.6}
  100%{transform:scale(1.8);opacity:0}
}
.agent-info{flex:1;min-width:0}
.agent-name{
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:-0.01em;
  color:var(--ink);
  line-height:1.2;
}
.agent-status{
  font-size:11.5px;
  color:oklch(0.5 0.13 150);
  font-weight:600;
  letter-spacing:0.005em;
  margin-top:1px;
  display:flex;
  align-items:center;
  gap:5px;
}
.agent-status::before{
  content:"";
  width:5px;
  height:5px;
  background:oklch(0.62 0.16 150);
  border-radius:50%;
  display:inline-block;
}
.agent-actions{display:flex;gap:2px}
.agent-actions .icon-btn{width:36px;height:36px;color:var(--ink-2)}

/* Chat log */
.chat-log{
  flex:1;
  overflow-y:auto;
  padding:14px 14px 6px;
  display:flex;
  flex-direction:column;
  gap:8px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.chat-log::-webkit-scrollbar{width:3px}
.chat-log::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:2px}

.chat-time{
  align-self:center;
  font-size:11px;
  font-weight:600;
  color:var(--ink-3);
  letter-spacing:0.02em;
  padding:6px 0 2px;
}

.msg{
  max-width:84%;
  padding:9px 13px 10px;
  border-radius:18px;
  font-size:14px;
  line-height:1.55;
  font-weight:500;
  color:var(--ink);
  letter-spacing:0.005em;
  animation:msg-in var(--dur-3) var(--ease-out);
  word-wrap:break-word;
}
@keyframes msg-in{
  from{opacity:0;transform:translateY(6px) scale(0.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.msg.bot{
  background:var(--surface-3);
  border-bottom-left-radius:6px;
  align-self:flex-start;
}
.msg.me{
  background:linear-gradient(180deg,var(--lens-hi) 0%,var(--lens) 100%);
  color:oklch(1 0 0);
  border-bottom-right-radius:6px;
  align-self:flex-end;
  font-weight:600;
  box-shadow:0 1px 2px oklch(0 0 0 / 0.08);
}
.msg strong{font-weight:700;color:var(--ink)}
.msg.me strong{color:oklch(1 0 0)}
.msg em{
  font-style:normal;
  font-weight:800;
  color:var(--brand);
}
.msg.me em{color:oklch(0.98 0.05 65)}

/* Spot card in chat */
.spot-card{
  align-self:flex-start;
  width:min(320px,86%);
  background:var(--surface);
  border-radius:18px;
  overflow:hidden;
  box-shadow:
    0 1px 2px oklch(0 0 0 / 0.06),
    0 8px 24px -8px oklch(0 0 0 / 0.14),
    inset 0 0 0 1px var(--hair);
  cursor:pointer;
  transition:transform var(--dur-2) var(--ease-out);
  animation:msg-in var(--dur-3) var(--ease-out);
}
.spot-card:active{transform:scale(0.985)}
.spot-card-media{
  aspect-ratio:16/9;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,var(--gold) 0%,oklch(0.62 0.15 65) 45%,var(--brand) 100%);
}
.spot-card-media svg{position:absolute;inset:0;width:100%;height:100%}
.spot-card-media .glyph{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:900;
  font-size:88px;
  color:oklch(1 0 0 / 0.95);
  letter-spacing:-0.05em;
  line-height:0.9;
  text-shadow:0 6px 24px oklch(0 0 0 / 0.25);
}
.spot-card-media .badge{
  position:absolute;
  top:10px;
  left:10px;
  padding:5px 10px 5px 8px;
  background:oklch(0 0 0 / 0.55);
  backdrop-filter:blur(8px);
  color:oklch(1 0 0);
  border-radius:10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.02em;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.spot-card-media .badge svg{width:12px;height:12px;stroke-width:2.2}
.spot-card-body{
  padding:12px 14px 10px;
}
.spot-card-body h4{
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:-0.015em;
  color:var(--ink);
  line-height:1.3;
}
.spot-card-meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:3px;
  font-size:11.5px;
  color:var(--ink-3);
  font-weight:600;
}
.spot-card-meta .sep{width:2px;height:2px;background:var(--ink-3);border-radius:50%;opacity:0.7}
.spot-card-cta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 14px;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand-hi) 100%);
  color:oklch(1 0 0);
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:0.005em;
  border-top:1px solid var(--hair);
}
.spot-card-cta svg{width:16px;height:16px;stroke-width:2.4}

/* Typing indicator */
.typing{
  align-self:flex-start;
  display:flex;
  align-items:center;
  gap:3px;
  padding:12px 14px;
  background:var(--surface-3);
  border-radius:18px;
  border-bottom-left-radius:6px;
  animation:msg-in var(--dur-3) var(--ease-out);
}
.typing span{
  width:6px;
  height:6px;
  background:var(--ink-3);
  border-radius:50%;
  opacity:0.3;
  animation:type-bob 1.2s var(--ease-in-out) infinite;
}
.typing span:nth-child(2){animation-delay:0.12s}
.typing span:nth-child(3){animation-delay:0.24s}
@keyframes type-bob{
  0%,60%,100%{opacity:0.3;transform:translateY(0)}
  30%{opacity:0.9;transform:translateY(-4px)}
}

/* Quick reply chips */
.chip-row{
  padding:10px 12px 8px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  flex-shrink:0;
  mask:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);
}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  padding:9px 14px;
  border-radius:14px;
  background:var(--surface);
  color:var(--ink);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:-0.005em;
  white-space:nowrap;
  flex-shrink:0;
  box-shadow:
    0 1px 1px oklch(0 0 0 / 0.05),
    inset 0 0 0 1px var(--hair);
  scroll-snap-align:start;
  transition:transform var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.chip:active{transform:scale(0.96);background:var(--surface-3)}
.chip svg{width:14px;height:14px;stroke-width:2}
.chip.primary{
  background:linear-gradient(180deg,var(--brand-hi) 0%,var(--brand) 100%);
  color:oklch(1 0 0);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 0.28),
    inset 0 -1px 0 oklch(from var(--brand-lo) l c h / 0.5),
    0 3px 8px -3px oklch(from var(--brand) l c h / 0.4);
}

/* Input bar */
.input-bar{
  padding:10px 12px calc(14px + var(--safe-bottom));
  display:grid;
  grid-template-columns:36px 1fr 36px;
  gap:8px;
  align-items:center;
  background:var(--bg-sink);
  border-top:0.5px solid var(--hair);
  flex-shrink:0;
}
.input-bar .attach{
  width:36px;
  height:36px;
  border-radius:12px;
  background:var(--surface);
  color:var(--ink-2);
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 0 1px var(--hair);
  transition:transform var(--dur-1) var(--ease-out);
}
.input-bar .attach:active{transform:scale(0.92)}
.input-bar .attach svg{width:18px;height:18px;stroke-width:2}
.input-bar .field{
  height:38px;
  padding:0 14px;
  background:var(--surface);
  border-radius:19px;
  font-size:14px;
  font-weight:500;
  color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--hair);
  width:100%;
}
.input-bar .field::placeholder{color:var(--ink-3);font-weight:500}
.input-bar .send{
  width:36px;
  height:36px;
  border-radius:12px;
  background:linear-gradient(180deg,var(--lens-hi) 0%,var(--lens) 100%);
  color:oklch(1 0 0);
  display:grid;
  place-items:center;
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 0.28),
    0 3px 8px -3px oklch(from var(--lens) l c h / 0.4);
  transition:transform var(--dur-1) var(--ease-out);
}
.input-bar .send:active{transform:scale(0.92)}
.input-bar .send svg{width:16px;height:16px;stroke-width:2.4}

/* Floating action: current spot beacon */
.beacon-fab{
  position:absolute;
  bottom:calc(288px + var(--safe-bottom));
  right:16px;
  z-index:var(--z-fab);
  padding:10px 14px 10px 12px;
  background:var(--surface);
  color:var(--ink);
  border-radius:22px;
  box-shadow:
    0 1px 2px oklch(0 0 0 / 0.08),
    0 6px 24px -4px oklch(0 0 0 / 0.2),
    inset 0 0 0 1px var(--hair);
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700;
  letter-spacing:-0.005em;
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out);
}
.beacon-fab .beacon-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--brand);
  box-shadow:0 0 0 3px oklch(from var(--brand) l c h / 0.2);
  animation:ping 1.6s var(--ease-in-out) infinite;
}
.beacon-fab:active{transform:scale(0.94)}
.beacon-fab svg{width:14px;height:14px;stroke-width:2.4;color:var(--brand)}

/* Sheet expand-hide beacon */
.sheet[data-snap="full"] ~ .beacon-fab{opacity:0;pointer-events:none}

  .agent-online::after{animation:none !important;display:none}

}

<script>
// ═══════════════════════════════════════
// SHEET: 3-snap drag
// ═══════════════════════════════════════
(function(){
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('handle');
  const beacon = document.getElementById('beacon');
  const snaps = ['peek','half','full'];
  let snap = 0;
  let dragStart = null;

  function setSnap(next){
    snap = Math.max(0, Math.min(snaps.length - 1, next));
    sheet.setAttribute('data-snap', snaps[snap]);
  }

  handle.addEventListener('click', (e) => {
    // If we didn't drag, cycle: peek → half → full → peek
    if (dragStart === null){
      setSnap((snap + 1) % snaps.length);
    }
  });

  handle.addEventListener('pointerdown', (e) => {
    dragStart = e.clientY;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (dragStart === null) return;
    const dy = dragStart - e.clientY;
    if (Math.abs(dy) > 30){
      if (dy > 0) setSnap(snap + 1);
      else setSnap(snap - 1);
      dragStart = null;
    }
  });
  handle.addEventListener('pointerup', (e) => {
    setTimeout(() => { dragStart = null; }, 50);
  });

  // Beacon jumps to full sheet
  beacon.addEventListener('click', () => setSnap(2));
})();

// ═══════════════════════════════════════
// CHIP INTERACTION: send back reply + typing
// ═══════════════════════════════════════
(function(){
  const log = document.getElementById('log');
  const chips = document.querySelectorAll('.chip');
  chips.forEach(chip => chip.addEventListener('click', () => {
    const me = document.createElement('div');
    me.className = 'msg me';
    me.textContent = chip.textContent.trim();
    log.appendChild(me);

    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    log.appendChild(typing);
    log.scrollTop = log.scrollHeight;

    setTimeout(() => {
      typing.remove();
      const bot = document.createElement('div');
      bot.className = 'msg bot';
      bot.textContent = 'わかりました、案内するね。';
      log.appendChild(bot);
      log.scrollTop = log.scrollHeight;
    }, 900);
  }));
})();

// ═══════════════════════════════════════
// AUTO-CENTER board on current node
// ═══════════════════════════════════════
window.addEventListener('load', () => {
  const s = document.getElementById('scroll');
  if (s){
    // Node 5 is at y=650 in the SVG (which is proportionally in board of height 1180)
    const boardH = 1180;
    const targetY = 650;
    const scrollable = s.scrollHeight - s.clientHeight;
    s.scrollTop = Math.max(0, (targetY / boardH) * scrollable - 100);
  }
});
</script>
