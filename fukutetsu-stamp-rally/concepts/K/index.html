<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K · BOARD + CHAT · 福鉄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Inter:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#a5cbe0;
  --sky-2:#7fb4d4;
  --grass:#84c07a;
  --grass-2:#5aa356;
  --earth:#c9a878;
  --earth-2:#a08560;
  --ink:#1e1a17;
  --paper:#fff;
  --cream:#fff7e6;
  --accent:#e64a2c;
  --accent-2:#b83820;
  --gold:#f3cf5a;
  --yellow:#ffe270;
  --pink:#f5c0a8;
  --me:#0284c7;
  --me-2:#026799;
  --bot:#f2eee4;
  --dim:#7a6f5f;
  --line:#e5e0d3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--sky);color:var(--ink);font-family:"Baloo 2","Noto Sans JP",sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;line-height:1.4;overflow:hidden;height:100vh}
.app{max-width:420px;margin:0 auto;height:100vh;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 55%,var(--grass) 100%);position:relative;overflow:hidden}

/* ============ TOP HP BAR ============ */
.hp{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:20;gap:8px}
.hp .card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 var(--ink);flex:1;min-width:0}
.hp .card .avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);border:2px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:900;font-size:15px;flex-shrink:0}
.hp .card .stat{display:flex;align-items:baseline;gap:4px;line-height:1}
.hp .card .n{font-family:"Baloo 2",sans-serif;font-weight:900;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.hp .card .n small{font-size:11px;color:var(--dim);font-weight:700}
.hp .card .l{font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.hp .streak{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink);font-weight:800;font-size:14px;color:var(--ink);flex-shrink:0}
.hp .streak .fire{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-3px) rotate(5deg)}}
.hp .menu{width:44px;height:44px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 var(--ink);cursor:pointer;flex-shrink:0}

/* ============ BOARD (upper part, scrollable) ============ */
.board-wrap{position:absolute;top:76px;left:0;right:0;bottom:238px;overflow:hidden;z-index:1}
.board{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 0 20px}
.board::-webkit-scrollbar{display:none}
.board svg{display:block;margin:0 auto;width:100%;max-width:420px}

/* Cloud decorations */
.cloud1,.cloud2{position:absolute;pointer-events:none;z-index:2}
.cloud1{top:20px;left:20px;font-size:32px;animation:float 8s ease-in-out infinite}
.cloud2{top:70px;right:30px;font-size:26px;animation:float 6s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ============ CHAT SHEET (bottom fixed) ============ */
.chat{position:absolute;bottom:0;left:0;right:0;background:var(--paper);border-top:3px solid var(--ink);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px -8px oklch(0 0 0 / .18);z-index:15;height:238px;display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.9,.2,1)}
.chat.expanded{height:60vh}
.chat .grip{width:44px;height:5px;background:var(--line);border-radius:3px;margin:8px auto 4px;flex-shrink:0}
.chat-hd{padding:2px 16px 8px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.chat-hd .av{width:36px;height:36px;background:linear-gradient(135deg,var(--gold) 0%,var(--accent) 100%);border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:14px;box-shadow:0 2px 0 var(--ink);position:relative}
.chat-hd .av::after{content:"";position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:var(--grass-2);border-radius:50%;border:2px solid var(--paper)}
.chat-hd .who{flex:1;line-height:1.15}
.chat-hd .name{font-size:14px;font-weight:900;letter-spacing:-.005em}
.chat-hd .sub{font-size:10.5px;color:var(--grass-2);font-weight:800;letter-spacing:.02em;font-family:"Baloo 2",sans-serif}
.chat-hd .exp{width:32px;height:32px;background:var(--bot);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;font-weight:800}

.log{flex:1;overflow-y:auto;padding:6px 14px 4px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;font-weight:600;font-family:"Baloo 2","Noto Sans JP",sans-serif;position:relative}
.msg.bot{background:var(--bot);color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--me);color:var(--paper);border-bottom-right-radius:4px;align-self:flex-end;font-weight:700}
.msg em{color:var(--accent);font-style:normal;font-weight:900}
.msg b{font-weight:900}

/* Spot card in chat */
.spot-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:0;overflow:hidden;max-width:260px;align-self:flex-start;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .12s}
.spot-card:active{transform:translate(1px,2px);box-shadow:0 1px 0 var(--ink)}
.spot-card .im{aspect-ratio:16/8;background:linear-gradient(135deg,var(--gold) 0%,var(--accent) 100%);position:relative;display:flex;align-items:center;justify-content:center}
.spot-card .im .k{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:66px;color:oklch(1 0 0 / .95);letter-spacing:-.05em;line-height:1}
.spot-card .im .tag{position:absolute;top:6px;left:6px;background:oklch(0 0 0 / .55);color:var(--paper);padding:3px 9px;border-radius:8px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.spot-card .b{padding:8px 12px 10px}
.spot-card h4{margin:0;font-family:"Baloo 2","Noto Sans JP",sans-serif;font-weight:900;font-size:13.5px;letter-spacing:-.01em;color:var(--ink)}
.spot-card .m{font-size:10.5px;color:var(--dim);font-weight:700;margin-top:2px}
.spot-card .go{background:var(--accent);color:var(--paper);border-top:2.5px solid var(--ink);padding:8px 12px;font-family:inherit;font-weight:900;font-size:12.5px;letter-spacing:.02em;display:flex;justify-content:center;align-items:center;gap:5px}

/* Quick reply chips */
.chips{padding:6px 14px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;border-top:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--paper);border:2px solid var(--ink);color:var(--ink);padding:8px 14px;border-radius:16px;font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:-.005em;cursor:pointer;flex-shrink:0;box-shadow:0 2px 0 var(--ink);transition:transform .12s,box-shadow .12s;font-family:"Baloo 2","Noto Sans JP",sans-serif}
.chip:active{transform:translate(1px,2px);box-shadow:0 0 0 var(--ink)}
.chip.primary{background:var(--accent);color:var(--paper);border-color:var(--ink)}
.chip.gold{background:var(--gold);color:var(--ink);border-color:var(--ink)}

/* Input */
.inp{padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;flex-shrink:0;border-top:1px solid var(--line);background:var(--paper)}
.inp .attach{width:34px;height:34px;background:var(--bot);border:2px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex-shrink:0}
.inp .attach svg{width:16px;height:16px;stroke-width:2.4}
.inp input{flex:1;background:var(--bot);border:2px solid var(--ink);padding:8px 14px;border-radius:16px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);outline:none}
.inp input::placeholder{color:var(--dim);font-weight:600}
.inp .send{width:38px;height:38px;background:var(--me);border:2px solid var(--ink);border-radius:12px;color:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 var(--ink);cursor:pointer;flex-shrink:0}
.inp .send svg{width:18px;height:18px;stroke-width:2.4}

.top-badge{position:absolute;top:76px;right:0;background:var(--ink);color:var(--yellow);padding:4px 10px;font-family:"Baloo 2",sans-serif;font-size:10px;font-weight:900;letter-spacing:.14em;z-index:100;border-radius:12px 0 0 12px}
</style>
</head>
<body>

<div class="app">
  <!-- Clouds -->
  <div class="cloud1">☁️</div>
  <div class="cloud2">☁️</div>

  <!-- TOP HP BAR -->
  <div class="hp">
    <div class="card">
      <div class="avatar">明</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <div class="stat"><div class="n">3<small>/10</small></div></div>
        <div class="l">Collected</div>
      </div>
    </div>
    <div class="streak"><span class="fire">🔥</span> 3</div>
    <div class="menu">☰</div>
  </div>

  <div class="top-badge">K · BOARD × CHAT</div>

  <!-- BOARD -->
  <div class="board-wrap">
    <div class="board">
      <svg viewBox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
        <!-- Distant hills at top -->
        <path d="M0 60 Q60 30 120 50 Q180 20 240 45 Q300 15 360 40 Q400 30 400 60 L400 100 L0 100 Z" fill="#7fb4d4" opacity="0.4"/>

        <!-- Path (winding) -->
        <path d="M340 100 Q260 160 300 220 Q340 280 260 320 Q180 360 220 420 Q260 480 180 520 Q100 560 140 620 Q170 680 100 720"
              stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
        <path d="M340 100 Q260 160 300 220 Q340 280 260 320 Q180 360 220 420 Q260 480 180 520 Q100 560 140 620 Q170 680 100 720"
              stroke="#1e1a17" stroke-width="26" fill="none" stroke-linecap="round" stroke-dasharray="1 13"/>

        <!-- START flag -->
        <g transform="translate(340,100)">
          <rect x="-38" y="-15" width="76" height="30" fill="#fff" stroke="#1e1a17" stroke-width="3" rx="4"/>
          <text x="0" y="6" text-anchor="middle" font-family="Baloo 2" font-size="15" font-weight="800" fill="#1e1a17">START</text>
        </g>

        <!-- Node 1 (越前和紙) DONE -->
        <g transform="translate(305,205)">
          <circle r="34" fill="#5aa356" stroke="#1e1a17" stroke-width="4"/>
          <circle r="34" fill="#84c07a" stroke="#1e1a17" stroke-width="4" transform="translate(0,-4)"/>
          <path d="M-11 -3 L-3 6 L12 -9" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
          <text y="52" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="900" fill="#1e1a17">和紙の里</text>
        </g>

        <!-- Node 2 (サンドーム) DONE -->
        <g transform="translate(295,310)">
          <circle r="34" fill="#5aa356" stroke="#1e1a17" stroke-width="4"/>
          <circle r="34" fill="#84c07a" stroke="#1e1a17" stroke-width="4" transform="translate(0,-4)"/>
          <path d="M-11 -3 L-3 6 L12 -9" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
          <text y="52" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="900" fill="#1e1a17">サンドーム</text>
        </g>

        <!-- Chapter 2 flag -->
        <g transform="translate(240,375)">
          <path d="M-26 -13 L26 -13 L22 0 L26 13 L-26 13 Z" fill="#fff" stroke="#1e1a17" stroke-width="3"/>
          <text y="4" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="800" fill="#1e1a17">CH.2 鯖江</text>
        </g>

        <!-- Node 3 武生 (locked) -->
        <g transform="translate(210,420)">
          <circle r="30" fill="#a08560" stroke="#1e1a17" stroke-width="4"/>
          <circle r="30" fill="#c9a878" stroke="#1e1a17" stroke-width="4" transform="translate(0,-3)"/>
          <text y="6" text-anchor="middle" font-family="Baloo 2" font-size="20" font-weight="900" fill="#fff" transform="translate(0,-3)">3</text>
          <text y="50" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="900" fill="#1e1a17">武生公園</text>
        </g>

        <!-- Node 4 (西山) DONE -->
        <g transform="translate(240,505)">
          <circle r="34" fill="#5aa356" stroke="#1e1a17" stroke-width="4"/>
          <circle r="34" fill="#84c07a" stroke="#1e1a17" stroke-width="4" transform="translate(0,-4)"/>
          <path d="M-11 -3 L-3 6 L12 -9" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
          <text y="52" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="900" fill="#1e1a17">西山公園</text>
        </g>

        <!-- Node 5 めがね (CURRENT · big pulse) -->
        <g transform="translate(175,585)">
          <circle r="48" fill="#e64a2c" opacity="0.25">
            <animate attributeName="r" values="48;62;48" dur="1.6s" repeatCount="indefinite"/>
          </circle>
          <circle r="38" fill="#b83820" stroke="#1e1a17" stroke-width="4"/>
          <circle r="38" fill="#e64a2c" stroke="#1e1a17" stroke-width="4" transform="translate(0,-4)"/>
          <text y="8" text-anchor="middle" font-family="Noto Sans JP" font-size="30" font-weight="900" fill="#fff" transform="translate(0,-4)">鏡</text>
          <text y="58" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="900" fill="#1e1a17">めがね</text>
          <text y="72" text-anchor="middle" font-family="Baloo 2" font-size="10" font-weight="900" fill="#e64a2c">▲ 圏内!</text>
        </g>

        <!-- Chapter 3 flag -->
        <g transform="translate(140,660)">
          <path d="M-26 -13 L26 -13 L22 0 L26 13 L-26 13 Z" fill="#fff" stroke="#1e1a17" stroke-width="3"/>
          <text y="4" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="800" fill="#1e1a17">CH.3 福井</text>
        </g>

        <!-- Node 6 福井城 locked -->
        <g transform="translate(105,725)">
          <circle r="30" fill="#a08560" stroke="#1e1a17" stroke-width="4"/>
          <circle r="30" fill="#c9a878" stroke="#1e1a17" stroke-width="4" transform="translate(0,-3)"/>
          <text y="6" text-anchor="middle" font-family="Baloo 2" font-size="20" font-weight="900" fill="#fff" transform="translate(0,-3)">6</text>
          <text y="50" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="900" fill="#1e1a17">福井城址</text>
        </g>

        <!-- Sparkles -->
        <text x="130" y="180" font-size="16" fill="#ffe270">✦</text>
        <text x="360" y="270" font-size="14" fill="#ffe270">✦</text>
        <text x="90" y="480" font-size="14" fill="#ffe270">✦</text>
        <text x="330" y="580" font-size="16" fill="#ffe270">✦</text>
        <text x="240" y="700" font-size="14" fill="#ffe270">✦</text>
      </svg>
    </div>
  </div>

  <!-- CHAT SHEET -->
  <div class="chat">
    <div class="grip"></div>
    <div class="chat-hd">
      <div class="av">Fk</div>
      <div class="who">
        <div class="name">ふくてつ ガイド</div>
        <div class="sub">● オンライン · あなたの旅の相棒</div>
      </div>
      <div class="exp">▴</div>
    </div>

    <div class="log">
      <div class="msg bot">おかえり 明日香さん! 👋<br>今 <em>神明駅</em> の 近くにいるね。 圏内スポット あるよ:</div>

      <div class="spot-card">
        <div class="im"><span class="tag">📍 圏内</span><span class="k">鏡</span></div>
        <div class="b">
          <h4>めがねミュージアム</h4>
          <div class="m">SP-05 · 章2 鯖江 · 徒歩 6分</div>
        </div>
        <div class="go">▶ 押印して +1</div>
      </div>

      <div class="msg bot"><em>あと 1個</em> で 「ドリンク引換」 GET! 🎁</div>
    </div>

    <div class="chips">
      <div class="chip primary">▶ 押印する</div>
      <div class="chip">📍 経路</div>
      <div class="chip gold">🎁 景品</div>
      <div class="chip">🗺 マップ全画面</div>
    </div>

    <div class="inp">
      <div class="attach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <input placeholder="ガイドに聞く…" />
      <button class="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</div>

<script>
// simple expand toggle on chat header exp button
document.querySelector('.exp').addEventListener('click',()=>{
  document.querySelector('.chat').classList.toggle('expanded');
  const btn = document.querySelector('.exp');
  btn.textContent = document.querySelector('.chat').classList.contains('expanded') ? '▾' : '▴';
});
// tap grip also toggles
document.querySelector('.grip').addEventListener('click',()=>{
  document.querySelector('.chat').classList.toggle('expanded');
});
// auto-scroll board to current node on load
window.addEventListener('load',()=>{
  const board = document.querySelector('.board');
  if (board) board.scrollTop = board.scrollHeight * 0.55;
});
</script>
</body></html>
