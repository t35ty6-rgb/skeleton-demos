<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B · MAP-FIRST · 福鉄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.94 0.03 130);
  --map-land:oklch(0.92 0.04 120);
  --map-water:oklch(0.85 0.08 220);
  --map-road:oklch(0.98 0 0);
  --ink:oklch(0.15 0.006 240);
  --dim:oklch(0.45 0.008 240);
  --paper:oklch(1 0 0);
  --accent:oklch(0.55 0.22 30);
  --green:oklch(0.55 0.16 145);
  --blue:oklch(0.5 0.18 240);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4;overflow:hidden;height:100vh}
.app{max-width:420px;margin:0 auto;height:100vh;background:var(--bg);position:relative;overflow:hidden}

/* ─── FULLSCREEN MAP LAYER ─── */
.map{position:absolute;inset:0;background:var(--map-land);z-index:0}
.map svg{width:100%;height:100%;display:block}
/* Search bar overlay */
.search{position:absolute;top:14px;left:14px;right:14px;background:var(--paper);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px -4px oklch(0 0 0 / .18),0 1px 2px oklch(0 0 0 / .06);z-index:10}
.search .avatar{width:32px;height:32px;background:linear-gradient(135deg,var(--accent) 0%,oklch(0.42 0.2 25) 100%);color:var(--paper);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.search input{flex:1;border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none}
.search input::placeholder{color:var(--dim);font-weight:500}
.search .filter{width:32px;height:32px;background:var(--ink);color:var(--paper);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}

/* Category chips */
.chips{position:absolute;top:66px;left:0;right:0;padding:0 14px;display:flex;gap:8px;overflow-x:auto;z-index:9;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--paper);color:var(--ink);border:1px solid oklch(0.85 0.01 240);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px -2px oklch(0 0 0 / .12);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Right-side action stack */
.action-stack{position:absolute;top:120px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:9}
.action-btn{width:44px;height:44px;background:var(--paper);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px -2px oklch(0 0 0 / .18);color:var(--ink);border:none;cursor:pointer;position:relative}
.action-btn svg{width:20px;height:20px;stroke-width:2}
.action-btn.gps{background:var(--blue);color:var(--paper)}
.action-btn .num{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--paper);width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* Progress ring floating */
.ring-card{position:absolute;top:14px;right:14px;display:none}

/* ─── BOTTOM SHEET ─── */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 32px -8px oklch(0 0 0 / .2);z-index:20;padding-bottom:max(20px,env(safe-area-inset-bottom));height:52vh;overflow-y:auto;transition:height .3s cubic-bezier(.2,.9,.2,1)}
.grip{width:44px;height:5px;background:oklch(0.75 0.01 240);border-radius:3px;margin:10px auto 8px}
.sheet-hd{padding:2px 20px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--paper);z-index:2}
.sheet-hd h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sheet-hd .count{background:var(--ink);color:var(--paper);padding:3px 10px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.02em}

/* Selected spot detail (peek) */
.selected{padding:0 20px 12px;border-bottom:1px solid oklch(0.9 0.01 240)}
.selected .hero{display:grid;grid-template-columns:80px 1fr;gap:14px;padding:12px 0}
.selected .im{width:80px;height:80px;background:linear-gradient(135deg,oklch(0.88 0.06 90) 0%,var(--accent) 100%);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:32px}
.selected .body h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.selected .body .meta{font-size:12px;color:var(--dim);margin-top:4px;font-weight:600;display:flex;gap:8px;align-items:center}
.selected .body .meta .dot{width:3px;height:3px;background:var(--dim);border-radius:50%}
.selected .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.selected .actions button{background:var(--ink);color:var(--paper);border:none;padding:12px;border-radius:12px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.selected .actions button.sec{background:oklch(0.94 0.01 240);color:var(--ink);border:1px solid oklch(0.85 0.01 240)}

/* Nearby list */
.nearby{padding:0 20px 20px}
.nearby h3{margin:14px 0 10px;font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.02em;text-transform:uppercase;font-family:"Inter",sans-serif;font-size:11px;letter-spacing:.14em}
.nearby-item{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer;border-bottom:1px solid oklch(0.94 0.01 240)}
.nearby-item:last-child{border-bottom:none}
.nearby-item .im{width:48px;height:48px;background:oklch(0.9 0.02 240);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nearby-item h4{margin:0;font-size:13px;font-weight:700;letter-spacing:-.005em}
.nearby-item .m{font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.nearby-item .arr{color:var(--dim)}
.nearby-item.done .im{background:var(--green);color:var(--paper)}
.nearby-item.done .im::after{content:"✓"}
.nearby-item.here .im{background:var(--accent);color:var(--paper)}

.top-badge{position:absolute;top:-100px;left:0}

/* MAP style illustrations */
.pin{filter:drop-shadow(0 3px 6px oklch(0 0 0 / .2))}
.pin-lbl{font-family:"Inter",sans-serif;font-weight:800;font-size:10px}
</style>
</head>
<body>

<div class="app">
  <!-- FULLSCREEN MAP -->
  <div class="map">
    <svg viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg">
      <!-- Water bodies -->
      <path d="M-20 620 Q60 600 140 630 Q220 660 300 620 Q380 590 460 620 L460 780 L-20 780 Z" fill="#c8dae0"/>
      <path d="M-20 780 L460 780 L460 920 L-20 920 Z" fill="#b8ccd4"/>
      <!-- Roads (Fukubu Line) -->
      <path d="M40 800 Q60 720 90 650 Q120 580 100 500 Q80 420 130 340 Q180 260 250 240 Q320 220 350 180 Q380 140 380 90" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M40 800 Q60 720 90 650 Q120 580 100 500 Q80 420 130 340 Q180 260 250 240 Q320 220 350 180 Q380 140 380 90" stroke="#e64a2c" stroke-width="3" fill="none" stroke-dasharray="8 6" stroke-linecap="round"/>
      <!-- Secondary roads -->
      <path d="M60 200 Q150 210 240 200 M100 400 Q180 410 260 380 M50 550 Q180 570 320 540" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Park/green -->
      <ellipse cx="90" cy="640" rx="45" ry="30" fill="#c9dab5" opacity="0.7"/>
      <ellipse cx="290" cy="220" rx="40" ry="28" fill="#c9dab5" opacity="0.7"/>
      <!-- Building blocks -->
      <rect x="180" y="330" width="16" height="16" fill="#d4c9b0" opacity="0.65"/>
      <rect x="200" y="345" width="14" height="14" fill="#d4c9b0" opacity="0.65"/>
      <rect x="220" y="330" width="18" height="16" fill="#d4c9b0" opacity="0.65"/>
      <rect x="60" y="480" width="14" height="20" fill="#d4c9b0" opacity="0.6"/>
      <rect x="78" y="490" width="16" height="14" fill="#d4c9b0" opacity="0.6"/>
      <!-- Labels -->
      <text x="290" y="260" fill="#5a6b7c" font-family="Inter" font-size="9" font-weight="700" letter-spacing="1.5">FUKUI</text>
      <text x="140" y="380" fill="#5a6b7c" font-family="Inter" font-size="9" font-weight="700" letter-spacing="1.5">SABAE</text>
      <text x="80" y="580" fill="#5a6b7c" font-family="Inter" font-size="9" font-weight="700" letter-spacing="1.5">ECHIZEN</text>

      <!-- PINS -->
      <!-- Done pin (green) -->
      <g class="pin" transform="translate(60,780)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#55a366"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#55a366" font-family="Inter" font-size="10" font-weight="800">✓</text></g>
      <text x="60" y="808" text-anchor="middle" font-family="Inter" font-size="9" font-weight="800" fill="#333">和紙の里</text>

      <g class="pin" transform="translate(105,690)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#55a366"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#55a366" font-family="Inter" font-size="10" font-weight="800">✓</text></g>
      <text x="105" y="718" text-anchor="middle" font-family="Inter" font-size="9" font-weight="800" fill="#333">サンドーム</text>

      <g class="pin" transform="translate(90,610)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">3</text></g>

      <g class="pin" transform="translate(105,510)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#55a366"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#55a366" font-family="Inter" font-size="10" font-weight="800">✓</text></g>

      <!-- SELECTED (accent, larger) -->
      <g class="pin" transform="translate(130,395)">
        <circle r="22" fill="#e64a2c" opacity="0.15"><animate attributeName="r" values="22;30;22" dur="2s" repeatCount="indefinite"/></circle>
        <path d="M0 -24 C-12 -24 -14 -8 -14 -4 C-14 6 0 18 0 18 C0 18 14 6 14 -4 C14 -8 12 -24 0 -24 Z" fill="#e64a2c"/><circle cx="0" cy="-10" r="7" fill="#fff"/><text x="0" y="-6" text-anchor="middle" fill="#e64a2c" font-family="Inter" font-size="11" font-weight="800">5</text>
      </g>

      <g class="pin" transform="translate(210,340)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">6</text></g>
      <g class="pin" transform="translate(240,280)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">7</text></g>
      <g class="pin" transform="translate(300,220)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">8</text></g>
      <g class="pin" transform="translate(340,170)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">9</text></g>
      <g class="pin" transform="translate(380,110)"><path d="M0 -20 C-10 -20 -12 -8 -12 -4 C-12 4 0 14 0 14 C0 14 12 4 12 -4 C12 -8 10 -20 0 -20 Z" fill="#333"/><circle cx="0" cy="-8" r="6" fill="#fff"/><text x="0" y="-5" text-anchor="middle" fill="#333" font-family="Inter" font-size="10" font-weight="800">10</text></g>

      <!-- Current position (blue dot) -->
      <g transform="translate(130,395)">
        <circle r="14" fill="#3f7ee0" opacity="0.15"><animate attributeName="r" values="14;24;14" dur="2s" repeatCount="indefinite"/></circle>
        <circle r="6" fill="#3f7ee0" stroke="#fff" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <!-- Search overlay -->
  <div class="search">
    <div class="avatar">明</div>
    <input placeholder="スポットを検索 · 越前 / 城 …" value=""/>
    <div class="filter">☰</div>
  </div>

  <!-- Chips -->
  <div class="chips">
    <div class="chip on">近い順</div>
    <div class="chip">越前</div>
    <div class="chip">鯖江</div>
    <div class="chip">福井</div>
    <div class="chip">未集印</div>
    <div class="chip">押印可</div>
  </div>

  <!-- Right-side actions -->
  <div class="action-stack">
    <button class="action-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3l6 3 6-3v15l-6 3-6-3-6 3V6l6-3z"/></svg></button>
    <button class="action-btn gps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="action-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span class="num">1</span></button>
    <button class="action-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg><span class="num">3</span></button>
  </div>

  <!-- BOTTOM SHEET -->
  <div class="sheet">
    <div class="grip"></div>
    <div class="sheet-hd">
      <h2>選択中 · SP-05</h2>
      <span class="count">3 / 10 集印</span>
    </div>

    <div class="selected">
      <div class="hero">
        <div class="im">鏡</div>
        <div class="body">
          <h3>めがねミュージアム</h3>
          <div class="meta"><span>SP-05</span><span class="dot"></span><span style="color:var(--accent);font-weight:800">圏内 · 押印可</span></div>
          <div class="meta"><span>神明駅 · 徒歩 6分</span><span class="dot"></span><span>2章 鯖江</span></div>
        </div>
      </div>
      <div class="actions">
        <button>QR で押印</button>
        <button class="sec">経路案内</button>
      </div>
    </div>

    <div class="nearby">
      <h3>周辺 · 近い順</h3>
      <div class="nearby-item done"><div class="im"></div><div><h4>西山公園</h4><div class="m">SP-04 · 1.2 km</div></div><div class="arr">›</div></div>
      <div class="nearby-item"><div class="im">🏯</div><div><h4>福井城址</h4><div class="m">SP-06 · 8.4 km · 未</div></div><div class="arr">›</div></div>
      <div class="nearby-item"><div class="im">🍵</div><div><h4>養浩館庭園</h4><div class="m">SP-07 · 8.6 km · 未</div></div><div class="arr">›</div></div>
      <div class="nearby-item"><div class="im">⛩</div><div><h4>足羽神社</h4><div class="m">SP-08 · 9.1 km · 未</div></div><div class="arr">›</div></div>
      <div class="nearby-item done"><div class="im"></div><div><h4>越前和紙の里</h4><div class="m">SP-01 · 15 km</div></div><div class="arr">›</div></div>
    </div>
  </div>
</div>
</body></html>
