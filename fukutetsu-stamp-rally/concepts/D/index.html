<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>D · FULL PATH BOARD · 福鉄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:oklch(0.75 0.09 220);
  --sky-2:oklch(0.66 0.11 215);
  --grass:oklch(0.7 0.13 145);
  --grass-2:oklch(0.6 0.14 145);
  --earth:oklch(0.62 0.08 82);
  --earth-2:oklch(0.5 0.09 78);
  --ink:oklch(0.16 0.02 60);
  --paper:oklch(1 0 0);
  --accent:oklch(0.65 0.19 40);
  --gold:oklch(0.82 0.15 88);
  --yellow:oklch(0.88 0.14 88);
  --pink:oklch(0.75 0.13 350);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--sky);color:var(--ink);font-family:"Baloo 2","Noto Sans JP",sans-serif;font-weight:700;-webkit-font-smoothing:antialiased;line-height:1.3;overflow:hidden;height:100vh}
.app{max-width:420px;margin:0 auto;height:100vh;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 40%,var(--grass) 100%);position:relative;overflow:hidden}

/* ─── FLOATING TOP UI ─── */
.top-hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.top-hud > *{pointer-events:auto}
.hp-card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 12px 8px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 var(--ink)}
.hp-card .avatar{width:36px;height:36px;background:var(--accent);border:2.5px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:800;font-size:15px}
.hp-card .stat{display:flex;flex-direction:column;line-height:1}
.hp-card .stat .n{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px;color:var(--ink)}
.hp-card .stat .n small{font-size:11px;color:var(--ink);opacity:.55}
.hp-card .stat .l{font-size:9px;font-weight:700;color:var(--ink);opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.hud-btn{width:44px;height:44px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);cursor:pointer;position:relative}
.hud-btn svg{width:20px;height:20px;stroke-width:2.4}
.hud-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--paper);width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}

/* ─── FULL BOARD MAP ─── */
.board{position:absolute;inset:0;overflow:auto;padding-top:80px;padding-bottom:120px;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{display:none}
.board svg{display:block;margin:0 auto;width:100%;max-width:420px}

/* ─── BOTTOM ENERGY BAR ─── */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent 0%,oklch(0.4 0.09 145) 40%,oklch(0.35 0.08 145) 100%);padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:10}
.bottom-bar .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.next-quest{background:oklch(1 0 0 / .96);border:3px solid var(--ink);border-radius:18px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--ink);flex:1}
.next-quest .im{width:44px;height:44px;background:var(--accent);border:2.5px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:22px;flex-shrink:0}
.next-quest .b{flex:1;min-width:0}
.next-quest h4{margin:0;font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-quest .m{font-size:10.5px;color:var(--ink);opacity:.65;font-weight:700}
.go-btn{background:var(--accent);color:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 20px;font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap;transition:transform .12s,box-shadow .12s}
.go-btn:active{transform:translate(1px,3px);box-shadow:0 1px 0 var(--ink)}

/* Chapter markers */
.chap-flag{fill:var(--paper);stroke:var(--ink);stroke-width:3}
.chap-txt{font-family:"Baloo 2",sans-serif;font-weight:800;fill:var(--ink);font-size:14px;text-anchor:middle}
</style>
</head>
<body>

<div class="app">
  <!-- TOP HUD -->
  <div class="top-hud">
    <div class="hp-card">
      <div class="avatar">明</div>
      <div class="stat"><div class="n">3<small>/10</small></div><div class="l">Collected</div></div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="hud-btn">🔥<span class="badge">3</span></div>
      <div class="hud-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg><span class="badge">1</span></div>
    </div>
  </div>

  <!-- FULL BOARD (winding path with all 10 nodes) -->
  <div class="board">
    <svg viewBox="0 0 400 1200" xmlns="http://www.w3.org/2000/svg">
      <!-- Distant hills -->
      <path d="M0 120 Q50 80 100 100 Q150 60 200 90 Q250 50 300 80 Q350 40 400 70 L400 200 L0 200 Z" fill="oklch(0.68 0.05 220)" opacity="0.5"/>
      <!-- Clouds -->
      <ellipse cx="60" cy="60" rx="30" ry="10" fill="#fff" opacity="0.8"/>
      <ellipse cx="330" cy="90" rx="34" ry="12" fill="#fff" opacity="0.7"/>
      <ellipse cx="200" cy="130" rx="26" ry="8" fill="#fff" opacity="0.65"/>

      <!-- Path (winding) -->
      <path d="M340 180 Q280 240 300 300 Q320 360 260 400 Q200 440 220 500 Q240 560 180 600 Q120 640 140 700 Q160 760 100 800 Q60 840 90 900 Q120 960 80 1010 Q60 1050 100 1100"
            stroke="oklch(1 0 0 / .9)" stroke-width="24" fill="none" stroke-linecap="round"/>
      <path d="M340 180 Q280 240 300 300 Q320 360 260 400 Q200 440 220 500 Q240 560 180 600 Q120 640 140 700 Q160 760 100 800 Q60 840 90 900 Q120 960 80 1010 Q60 1050 100 1100"
            stroke="var(--ink)" stroke-width="24" fill="none" stroke-linecap="round" stroke-dasharray="1 12"/>

      <!-- START -->
      <g transform="translate(340,180)">
        <rect x="-42" y="-14" width="84" height="28" fill="var(--paper)" stroke="var(--ink)" stroke-width="3" rx="4"/>
        <text x="0" y="6" text-anchor="middle" font-family="Baloo 2" font-size="14" font-weight="800" fill="var(--ink)">START</text>
      </g>

      <!-- Node 1 (done) -->
      <g transform="translate(300,290)">
        <circle r="30" fill="var(--grass-2)" stroke="var(--ink)" stroke-width="4"/>
        <circle r="30" fill="var(--grass)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-4)"/>
        <path d="M-10 -3 L-3 6 L11 -8" stroke="var(--paper)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
        <text x="0" y="46" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="800" fill="var(--paper)" style="text-shadow:0 1px 2px oklch(0 0 0 / .6)">和紙の里</text>
      </g>

      <!-- Node 2 (done) -->
      <g transform="translate(268,390)">
        <circle r="30" fill="var(--grass-2)" stroke="var(--ink)" stroke-width="4"/>
        <circle r="30" fill="var(--grass)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-4)"/>
        <path d="M-10 -3 L-3 6 L11 -8" stroke="var(--paper)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
        <text x="0" y="46" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="800" fill="var(--paper)" style="text-shadow:0 1px 2px oklch(0 0 0 / .6)">サンドーム</text>
      </g>

      <!-- Chapter 2 flag -->
      <g transform="translate(300,440)"><path d="M-24 -14 L26 -14 L20 0 L26 14 L-24 14 Z" class="chap-flag"/><text class="chap-txt" y="4">CH.2</text></g>

      <!-- Node 3 (locked, near current) -->
      <g transform="translate(230,490)">
        <circle r="28" fill="var(--earth-2)" stroke="var(--ink)" stroke-width="4"/>
        <circle r="28" fill="var(--earth)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-3)"/>
        <text x="0" y="4" text-anchor="middle" font-family="Baloo 2" font-size="18" font-weight="800" fill="var(--paper)" transform="translate(0,-3)">3</text>
        <text x="0" y="46" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="800" fill="var(--paper)" style="text-shadow:0 1px 2px oklch(0 0 0 / .6)">武生公園</text>
      </g>

      <!-- Node 4 (done) -->
      <g transform="translate(215,570)">
        <circle r="30" fill="var(--grass-2)" stroke="var(--ink)" stroke-width="4"/>
        <circle r="30" fill="var(--grass)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-4)"/>
        <path d="M-10 -3 L-3 6 L11 -8" stroke="var(--paper)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-4)"/>
        <text x="0" y="46" text-anchor="middle" font-family="Baloo 2" font-size="11" font-weight="800" fill="var(--paper)" style="text-shadow:0 1px 2px oklch(0 0 0 / .6)">西山公園</text>
      </g>

      <!-- Node 5 (CURRENT · big) -->
      <g transform="translate(160,640)">
        <circle r="42" fill="var(--accent)" opacity=".3">
          <animate attributeName="r" values="42;54;42" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle r="36" fill="oklch(0.42 0.14 25)" stroke="var(--ink)" stroke-width="4"/>
        <circle r="36" fill="var(--accent)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-4)"/>
        <text x="0" y="7" text-anchor="middle" font-family="Noto Sans JP" font-size="28" font-weight="900" fill="var(--paper)" transform="translate(0,-4)">鏡</text>
        <text x="0" y="54" text-anchor="middle" font-family="Baloo 2" font-size="12" font-weight="800" fill="var(--paper)" style="text-shadow:0 1px 2px oklch(0 0 0 / .8)">めがねミュージアム</text>
      </g>

      <!-- Chapter 3 flag -->
      <g transform="translate(140,700)"><path d="M-24 -14 L26 -14 L20 0 L26 14 L-24 14 Z" class="chap-flag"/><text class="chap-txt" y="4">CH.3</text></g>

      <!-- Nodes 6-10 (locked) -->
      <g transform="translate(90,760)"><circle r="28" fill="var(--earth-2)" stroke="var(--ink)" stroke-width="4"/><circle r="28" fill="var(--earth)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-3)"/><text x="0" y="4" text-anchor="middle" font-family="Baloo 2" font-size="18" font-weight="800" fill="var(--paper)" transform="translate(0,-3)">6</text></g>
      <g transform="translate(120,850)"><circle r="28" fill="var(--earth-2)" stroke="var(--ink)" stroke-width="4"/><circle r="28" fill="var(--earth)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-3)"/><text x="0" y="4" text-anchor="middle" font-family="Baloo 2" font-size="18" font-weight="800" fill="var(--paper)" transform="translate(0,-3)">7</text></g>
      <g transform="translate(80,940)"><circle r="28" fill="var(--earth-2)" stroke="var(--ink)" stroke-width="4"/><circle r="28" fill="var(--earth)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-3)"/><text x="0" y="4" text-anchor="middle" font-family="Baloo 2" font-size="18" font-weight="800" fill="var(--paper)" transform="translate(0,-3)">8</text></g>
      <g transform="translate(90,1040)"><circle r="28" fill="var(--earth-2)" stroke="var(--ink)" stroke-width="4"/><circle r="28" fill="var(--earth)" stroke="var(--ink)" stroke-width="4" transform="translate(0,-3)"/><text x="0" y="4" text-anchor="middle" font-family="Baloo 2" font-size="18" font-weight="800" fill="var(--paper)" transform="translate(0,-3)">9</text></g>

      <!-- GOAL castle -->
      <g transform="translate(100,1130)">
        <path d="M-40 20 L-40 -8 L-30 -8 L-30 -20 L-20 -30 L-10 -20 L-10 -8 L-4 -8 L-4 -30 L14 -30 L14 -8 L20 -8 L20 -20 L30 -30 L40 -20 L40 -8 L50 -8 L50 20 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="-8" y="0" width="10" height="18" fill="var(--ink)"/>
        <text x="4" y="42" text-anchor="middle" font-family="Baloo 2" font-size="14" font-weight="800" fill="var(--ink)">GOAL</text>
      </g>

      <!-- Sparkles -->
      <text x="140" y="580" font-size="14" fill="var(--yellow)">✦</text>
      <text x="260" y="330" font-size="14" fill="var(--yellow)">✦</text>
      <text x="60" y="880" font-size="12" fill="var(--yellow)">✦</text>
    </svg>
  </div>

  <!-- BOTTOM: Next Quest + GO -->
  <div class="bottom-bar">
    <div class="row">
      <div class="next-quest">
        <div class="im">鏡</div>
        <div class="b">
          <h4>次: めがねミュージアム</h4>
          <div class="m">圏内 · タップで押印可能!</div>
        </div>
      </div>
      <button class="go-btn">GO!</button>
    </div>
  </div>
</div>
</body></html>
