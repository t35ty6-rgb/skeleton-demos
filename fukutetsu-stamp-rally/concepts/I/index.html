<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>I · STORYBOOK SLIDES · 福鉄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800;900&family=DM+Serif+Display&family=Noto+Sans+JP:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5eecd;
  --ink:#2a2620;
  --mustard:#dcaf3d;
  --teal:#3b6c78;
  --burnt:#c85a2a;
  --plum:#7a3c58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"DM Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden;height:100vh}
.app{max-width:420px;margin:0 auto;height:100vh;position:relative;overflow:hidden}

/* ─── STORY PROGRESS BAR (top) ─── */
.story-bar{position:absolute;top:0;left:0;right:0;padding:12px 16px 8px;display:flex;gap:5px;z-index:10}
.story-bar span{flex:1;height:3px;background:oklch(1 0 0 / .35);border-radius:2px;position:relative;overflow:hidden}
.story-bar span.done::before{content:"";position:absolute;inset:0;background:oklch(1 0 0 / .95)}
.story-bar span.now::before{content:"";position:absolute;inset:0;background:oklch(1 0 0 / .95);width:60%}

/* Top overlay */
.top-ov{position:absolute;top:26px;left:0;right:0;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;color:oklch(1 0 0 / .95)}
.top-ov .brand{font-family:"DM Sans",sans-serif;font-weight:900;font-size:14px;letter-spacing:.02em}
.top-ov .brand small{opacity:.75;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-left:8px}
.top-ov .actions{display:flex;gap:12px}
.top-ov .actions svg{width:22px;height:22px;stroke-width:2}

/* ─── FULL-BLEED CHAPTER SLIDE ─── */
.slide{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.7) 100%),linear-gradient(135deg,var(--burnt) 0%,var(--plum) 100%);color:oklch(1 0 0 / .98);display:flex;flex-direction:column;padding:80px 26px 100px}
.slide .art{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:320px;color:oklch(1 0 0 / .08);letter-spacing:-.05em;z-index:1;pointer-events:none;line-height:1}

.slide-content{position:relative;z-index:2;margin-top:auto}
.slide .num{font-family:"DM Serif Display",serif;font-size:16px;letter-spacing:.24em;opacity:.8;font-weight:400}
.slide h1{margin:8px 0 4px;font-family:"DM Serif Display",serif;font-size:64px;letter-spacing:-.02em;line-height:.95;font-weight:400}
.slide .en{font-family:"DM Sans",sans-serif;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin-top:4px}
.slide .desc{margin-top:14px;font-family:"DM Sans",sans-serif;font-size:14px;line-height:1.7;font-weight:500;max-width:32ch;opacity:.9}

.slide .chapter-badge{position:absolute;top:80px;left:26px;background:oklch(1 0 0 / .18);backdrop-filter:blur(10px);padding:6px 14px;border-radius:16px;font-family:"DM Sans",sans-serif;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;z-index:3}

.slide .status-pill{margin-top:16px;display:inline-flex;gap:8px;align-items:center;background:var(--mustard);color:var(--ink);padding:8px 16px;border-radius:20px;font-family:"DM Sans",sans-serif;font-weight:800;font-size:13px;letter-spacing:-.005em}
.slide.done .status-pill{background:oklch(0.62 0.14 145);color:oklch(1 0 0)}
.slide.locked .status-pill{background:oklch(1 0 0 / .18);backdrop-filter:blur(10px);color:oklch(1 0 0)}

.slide .cta{margin-top:20px;display:flex;gap:10px}
.slide .cta button{flex:1;background:oklch(1 0 0);color:var(--ink);border:none;padding:15px;border-radius:14px;font-family:"DM Sans",sans-serif;font-weight:900;font-size:15px;letter-spacing:-.01em;cursor:pointer;box-shadow:0 6px 20px -6px oklch(0 0 0 / .3)}
.slide .cta button.sec{background:oklch(1 0 0 / .15);color:oklch(1 0 0);backdrop-filter:blur(10px);border:1px solid oklch(1 0 0 / .25)}

/* Bottom nav (page indicators) */
.slide-nav{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5}
.slide-nav .indi{width:6px;height:6px;background:oklch(1 0 0 / .35);border-radius:50%}
.slide-nav .indi.on{width:24px;border-radius:3px;background:oklch(1 0 0 / .95)}

/* Prev/Next chevrons */
.chev{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;background:oklch(0 0 0 / .3);color:oklch(1 0 0);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;backdrop-filter:blur(6px);border:1px solid oklch(1 0 0 / .15)}
.chev.left{left:12px}
.chev.right{right:12px}
.chev svg{width:22px;height:22px;stroke-width:2.4}

/* Chapter minimap (bottom) */
.mini{position:absolute;bottom:60px;left:0;right:0;padding:0 26px;display:flex;gap:8px;z-index:5;font-family:"DM Sans",sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:oklch(1 0 0 / .7)}
.mini > div{flex:1;padding:6px 10px;background:oklch(0 0 0 / .3);backdrop-filter:blur(6px);border-radius:6px;text-align:center;border:1px solid oklch(1 0 0 / .12)}
.mini .cur{background:oklch(1 0 0 / .95);color:var(--ink);border-color:oklch(1 0 0 / .95)}

.top-badge{position:absolute;top:14px;left:60px;background:var(--mustard);color:var(--ink);padding:4px 10px;font-family:"DM Sans",sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;z-index:100;border-radius:4px}
</style>
</head>
<body>

<div class="app">
  <!-- STORY PROGRESS BAR -->
  <div class="story-bar">
    <span class="done"></span>
    <span class="now"></span>
    <span></span>
  </div>

  <div class="top-badge">I · SLIDES</div>

  <div class="top-ov">
    <div class="brand">FUKUBU<small>CH 2 / 3</small></div>
    <div class="actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    </div>
  </div>

  <!-- CHAPTER SLIDE -->
  <div class="slide">
    <span class="chapter-badge">Chapter 2 · 鯖江</span>
    <div class="art">鏡</div>
    <div class="slide-content">
      <div class="num">02 · SP-05</div>
      <h1>めがね<br>ミュージアム</h1>
      <div class="en">MEGANE MUSEUM · SABAE</div>
      <div class="desc">鯖江眼鏡 の 全て が ここに。 工房で 手作り体験、 ミュージアムショップで 掘り出し物 を 探す。 職人 の 指先 が、 一本 の フレーム を 磨いている。</div>
      <div class="status-pill">📍 圏内 · 押印可能</div>
      <div class="cta">
        <button>QR で 押印</button>
        <button class="sec">経路案内</button>
      </div>
    </div>
  </div>

  <div class="chev left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <div class="chev right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </div>

  <!-- Mini chapter indicator -->
  <div class="mini">
    <div>1<br>越前</div>
    <div class="cur">2<br>鯖江</div>
    <div>3<br>福井</div>
  </div>

  <div class="slide-nav">
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi on"></span>
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi"></span>
    <span class="indi"></span>
  </div>
</div>
</body></html>
