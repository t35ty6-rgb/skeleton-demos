<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 影 -->
  <g opacity="0.15">
    <path d="M22 26 L82 26 L82 44 L22 44 Z" fill="#3a3025" transform="translate(6,52)"/>
  </g>

  <!-- 記念台紙 (下敷き) -->
  <path d="M8 20 L92 20 L92 88 L8 88 Z"
        fill="#e8dcb8" stroke="#1a1712" stroke-width="1.8"/>
  <path d="M12 24 L88 24 L88 84 L12 84 Z" fill="none" stroke="#1a1712" stroke-width="0.5" stroke-dasharray="1.5 1.8"/>

  <!-- 見出し (台紙) -->
  <text x="50" y="30" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#1a1712" letter-spacing="2">硬 券 コンプリート セット</text>

  <!-- 硬券 3枚 (斜めに 束ねて 積んだ 様子) -->
  <!-- 一番奥 (下の 硬券) -->
  <g transform="translate(50,58) rotate(-12)">
    <path d="M-28 -12 L28 -12 L28 12 L-28 12 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="1.4"/>
    <path d="M-24 -8 L24 -8 M-24 -6 L24 -6 M-24 8 L24 8" stroke="#1a1712" stroke-width="0.4"/>
    <text x="-20" y="-2" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#1a1712">越前</text>
    <text x="20" y="-2" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="3.5" font-weight="700" fill="#1a1712">SP-01</text>
    <path d="M-25 -5 L-15 -5 L-15 5 L-25 5 Z" fill="#b8410f" opacity="0.7"/>
    <text x="-20" y="1.5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4" font-weight="900" fill="#f5eddc">硬</text>
    <circle cx="15" cy="0" r="4" fill="none" stroke="#b8410f" stroke-width="0.8"/>
    <text x="15" y="1.5" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="4" fill="#b8410f">壱</text>
  </g>

  <!-- 中央 -->
  <g transform="translate(50,58) rotate(0)">
    <path d="M-30 -12 L30 -12 L30 12 L-30 12 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="1.5"/>
    <path d="M-26 -8 L26 -8 M-26 -6 L26 -6 M-26 8 L26 8" stroke="#1a1712" stroke-width="0.4"/>
    <text x="-22" y="-2" font-family="'Noto Sans JP',sans-serif" font-size="5" font-weight="900" fill="#1a1712">鯖江</text>
    <text x="22" y="-2" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="3.6" font-weight="700" fill="#1a1712">SP-04</text>
    <path d="M-27 -5 L-16 -5 L-16 5 L-27 5 Z" fill="#b8410f" opacity="0.7"/>
    <text x="-21.5" y="1.5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#f5eddc">硬</text>
    <circle cx="16" cy="0" r="4.5" fill="none" stroke="#b8410f" stroke-width="0.9"/>
    <text x="16" y="1.6" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="4.5" fill="#b8410f">弐</text>
  </g>

  <!-- 一番手前 -->
  <g transform="translate(50,58) rotate(12)">
    <path d="M-28 -12 L28 -12 L28 12 L-28 12 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="1.4"/>
    <path d="M-24 -8 L24 -8 M-24 -6 L24 -6 M-24 8 L24 8" stroke="#1a1712" stroke-width="0.4"/>
    <text x="-20" y="-2" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#1a1712">福井</text>
    <text x="20" y="-2" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="3.5" font-weight="700" fill="#1a1712">SP-08</text>
    <path d="M-25 -5 L-15 -5 L-15 5 L-25 5 Z" fill="#b8410f" opacity="0.7"/>
    <text x="-20" y="1.5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4" font-weight="900" fill="#f5eddc">硬</text>
    <circle cx="15" cy="0" r="4" fill="none" stroke="#b8410f" stroke-width="0.8"/>
    <text x="15" y="1.5" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="4" fill="#b8410f">参</text>
  </g>

  <!-- 下部 「10枚 全揃い」 印章 -->
  <g transform="translate(50,80)">
    <rect x="-16" y="-3.5" width="32" height="7" fill="none" stroke="#b8410f" stroke-width="1"/>
    <text x="0" y="1.6" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4.4" font-weight="900" fill="#b8410f" letter-spacing="1">10枚 全揃い · コンプリート</text>
  </g>
</svg>
