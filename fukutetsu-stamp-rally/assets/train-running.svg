<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- 遠景 山並み -->
  <path d="M0 78 L18 62 L34 74 L52 60 L72 72 L92 58 L114 72 L134 60 L156 74 L178 62 L200 76 L200 90 L0 90 Z"
        fill="#e8dcb8" opacity="0.7"/>
  <path d="M0 78 L18 62 L34 74 L52 60 L72 72 L92 58 L114 72 L134 60 L156 74 L178 62 L200 76"
        stroke="#3a3025" stroke-width="0.6" fill="none" opacity="0.5"/>

  <!-- 空 に 雲 -->
  <path d="M40 22 Q46 18 52 22 Q58 20 62 24 Q60 28 54 26 Q48 30 42 26 Q38 26 40 22 Z" fill="#faf5e6" stroke="#3a3025" stroke-width="0.5"/>
  <path d="M138 16 Q144 12 150 16 Q158 14 162 20 Q158 24 152 22 Q146 26 140 22 Q136 22 138 16 Z" fill="#faf5e6" stroke="#3a3025" stroke-width="0.5"/>

  <!-- 桜 の 木 (左端 と 右端) -->
  <g transform="translate(15,68)">
    <path d="M0 20 L0 0" stroke="#3a3025" stroke-width="1.4"/>
    <circle cx="0" cy="-2" r="10" fill="#e8a598" opacity="0.85"/>
    <circle cx="-6" cy="2" r="6" fill="#e8a598" opacity="0.85"/>
    <circle cx="6" cy="2" r="6" fill="#e8a598" opacity="0.85"/>
    <circle cx="-3" cy="-8" r="5" fill="#e8a598" opacity="0.85"/>
    <circle cx="4" cy="-6" r="4" fill="#e8a598" opacity="0.85"/>
  </g>
  <g transform="translate(185,66)">
    <path d="M0 22 L0 0" stroke="#3a3025" stroke-width="1.4"/>
    <circle cx="0" cy="-2" r="9" fill="#e8a598" opacity="0.85"/>
    <circle cx="-5" cy="2" r="5" fill="#e8a598" opacity="0.85"/>
    <circle cx="5" cy="2" r="5" fill="#e8a598" opacity="0.85"/>
    <circle cx="-2" cy="-7" r="4" fill="#e8a598" opacity="0.85"/>
  </g>

  <!-- 橋げた -->
  <path d="M10 92 L190 92" stroke="#1a1712" stroke-width="1.8"/>
  <path d="M12 92 L18 100 M28 92 L34 100 M44 92 L50 100 M60 92 L66 100 M76 92 L82 100 M92 92 L98 100 M108 92 L114 100 M124 92 L130 100 M140 92 L146 100 M156 92 L162 100 M172 92 L178 100" stroke="#1a1712" stroke-width="1.2"/>
  <path d="M10 100 L190 100" stroke="#1a1712" stroke-width="1.6"/>

  <!-- 電車 本体 (オレンジ 手描き 福鉄 車両) -->
  <g transform="translate(72,66)">
    <!-- 車両 -->
    <path d="M0 -2 L0 20 L58 20 L58 -2 Q58 -8 52 -8 L6 -8 Q0 -8 0 -2 Z"
          fill="#d97a3f" stroke="#1a1712" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 上部 車体 白帯 -->
    <path d="M2 4 L56 4" stroke="#faf5e6" stroke-width="2.2"/>
    <path d="M2 6 L56 6" stroke="#1a1712" stroke-width="0.5"/>
    <!-- 前面 窓 -->
    <path d="M6 -5 L22 -5 L22 3 L6 3 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="0.9"/>
    <!-- 側面 窓 (3つ) -->
    <path d="M28 -5 L34 -5 L34 3 L28 3 Z M38 -5 L44 -5 L44 3 L38 3 Z M48 -5 L54 -5 L54 3 L48 3 Z"
          fill="#faf5e6" stroke="#1a1712" stroke-width="0.9"/>
    <!-- ドア -->
    <path d="M24 8 L24 20 M26 8 L26 20" stroke="#1a1712" stroke-width="0.6"/>
    <!-- 車輪 -->
    <circle cx="14" cy="22" r="4" fill="#1a1712"/>
    <circle cx="14" cy="22" r="2" fill="#c9b98f"/>
    <circle cx="44" cy="22" r="4" fill="#1a1712"/>
    <circle cx="44" cy="22" r="2" fill="#c9b98f"/>
    <!-- ヘッドライト -->
    <circle cx="4" cy="8" r="1.6" fill="#f5eddc" stroke="#1a1712" stroke-width="0.5"/>
    <!-- 前面 「福鉄」 プレート -->
    <path d="M8 8 L20 8 L20 14 L8 14 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="0.5"/>
    <text x="14" y="13" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#1a1712">福鉄</text>
  </g>

  <!-- スピード線 -->
  <path d="M60 74 L48 74 M56 78 L44 78 M52 82 L42 82" stroke="#1a1712" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
</svg>
