<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- ソーサー -->
  <ellipse cx="50" cy="82" rx="34" ry="6" fill="#c9b98f" stroke="#1a1712" stroke-width="1.4"/>
  <ellipse cx="50" cy="80" rx="34" ry="5.5" fill="#faf5e6" stroke="#1a1712" stroke-width="1.4"/>
  <ellipse cx="50" cy="80" rx="28" ry="3.5" fill="none" stroke="#1a1712" stroke-width="0.5" stroke-dasharray="1 1.5"/>

  <!-- カップ 本体 -->
  <path d="M22 42 L26 76 Q26 82 32 82 L58 82 Q64 82 64 76 L68 42 Z"
        fill="#faf5e6" stroke="#1a1712" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- 取っ手 -->
  <path d="M68 52 Q80 52 80 62 Q80 72 68 72"
        fill="none" stroke="#1a1712" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M68 56 Q76 56 76 62 Q76 68 68 68"
        fill="none" stroke="#1a1712" stroke-width="1.2" opacity="0.5"/>

  <!-- カップ 上面 (コーヒー液面) -->
  <ellipse cx="45" cy="42" rx="23" ry="4" fill="#3a2416" stroke="#1a1712" stroke-width="1.5"/>
  <ellipse cx="45" cy="40" rx="18" ry="2.5" fill="#5a3a24" opacity="0.6"/>

  <!-- ラテアート ハート -->
  <path d="M45 40 Q41 36 41 40 Q41 42 45 44 Q49 42 49 40 Q49 36 45 40 Z" fill="#faf5e6"/>

  <!-- カップ ロゴ 縦帯 -->
  <path d="M40 50 L50 50 L50 74 L40 74 Z" fill="#e8dcb8" stroke="#1a1712" stroke-width="0.6"/>
  <text x="45" y="65" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="9" font-weight="900" fill="#1a1712">福</text>

  <!-- 湯気 (3本 手描き ゆらぎ) -->
  <path d="M30 34 Q28 28 32 24 Q28 20 32 14 Q28 10 32 6"
        stroke="#1a1712" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M45 32 Q43 26 47 22 Q43 18 47 12 Q43 8 47 4"
        stroke="#1a1712" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M60 34 Q58 28 62 24 Q58 20 62 14 Q58 10 62 6"
        stroke="#1a1712" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- 沿線 印章 (右下) -->
  <g transform="translate(80,90)">
    <rect x="-8" y="-5" width="16" height="10" fill="none" stroke="#b8410f" stroke-width="0.8" transform="rotate(-8)"/>
    <text x="0" y="1" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="4.5" font-weight="900" fill="#b8410f" transform="rotate(-8)">沿線</text>
    <text x="0" y="5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="3.5" font-weight="900" fill="#b8410f" transform="rotate(-8)">カフェ</text>
  </g>
</svg>
