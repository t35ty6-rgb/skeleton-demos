<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" fill="none">
  <!-- 全面 クリーム paper 背景 -->
  <rect width="340" height="340" fill="#f5eddc"/>
  <!-- パラフィン紙 ドット パターン -->
  <pattern id="scandots" width="14" height="14" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="7" r="0.9" fill="#1a1712" opacity="0.08"/>
  </pattern>
  <rect width="340" height="340" fill="url(#scandots)"/>

  <!-- 上部 遠景 山影 -->
  <g opacity="0.35">
    <path d="M0 60 L40 30 L70 50 L110 25 L150 45 L200 20 L240 45 L280 30 L340 55 L340 90 L0 90 Z" fill="#c9dae0"/>
  </g>

  <!-- 左上 桜 -->
  <g transform="translate(46,58)" opacity="0.85">
    <path d="M0 26 L0 -2" stroke="#3a3025" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="12" fill="#e8a598"/>
    <circle cx="-8" cy="4" r="7" fill="#e8a598"/>
    <circle cx="8" cy="4" r="7" fill="#e8a598"/>
    <circle cx="-4" cy="-8" r="6" fill="#e8a598"/>
    <circle cx="5" cy="-7" r="5" fill="#e8a598"/>
  </g>

  <!-- 右上 雲 -->
  <g opacity="0.6">
    <path d="M240 50 Q252 42 268 46 Q278 40 288 50 Q282 58 268 54 Q252 60 240 50 Z" fill="#faf5e6" stroke="#3a3025" stroke-width="0.5"/>
  </g>

  <!-- 中央 硬券 (捲る 前 / 未押印 の 一枚) 手描き -->
  <g transform="translate(170,190)">
    <!-- 硬券 影 -->
    <path d="M-70 -46 L70 -46 L70 46 L-70 46 Z" fill="#1a1712" opacity="0.12" transform="translate(4,4)"/>
    <!-- 硬券 本体 -->
    <path d="M-70 -46 L70 -46 L70 46 L-70 46 Z" fill="#faf5e6" stroke="#1a1712" stroke-width="1.8"/>
    <path d="M-66 -42 L66 -42 L66 42 L-66 42 Z" fill="none" stroke="#1a1712" stroke-width="0.5" stroke-dasharray="1.5 1.8"/>

    <!-- 上部 濃色 帯 -->
    <path d="M-70 -46 L70 -46 L70 -33 L-70 -33 Z" fill="#1a1712"/>
    <text x="0" y="-38" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="7" font-weight="900" fill="#f5eddc" letter-spacing="2">福 鉄 · 集印 硬券</text>

    <!-- 中央 QR 予定エリア -->
    <path d="M-24 -20 L24 -20 L24 28 L-24 28 Z" fill="none" stroke="#1a1712" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- QR プレースホルダ 手描き 記号 -->
    <g opacity="0.6">
      <!-- Position markers 三隅 -->
      <path d="M-20 -16 L-14 -16 L-14 -10 L-20 -10 Z" fill="none" stroke="#1a1712" stroke-width="1.2"/>
      <path d="M-18 -14 L-16 -14 L-16 -12 L-18 -12 Z" fill="#1a1712"/>

      <path d="M14 -16 L20 -16 L20 -10 L14 -10 Z" fill="none" stroke="#1a1712" stroke-width="1.2"/>
      <path d="M16 -14 L18 -14 L18 -12 L16 -12 Z" fill="#1a1712"/>

      <path d="M-20 18 L-14 18 L-14 24 L-20 24 Z" fill="none" stroke="#1a1712" stroke-width="1.2"/>
      <path d="M-18 20 L-16 20 L-16 22 L-18 22 Z" fill="#1a1712"/>

      <!-- QR pattern (ランダム風) -->
      <g fill="#1a1712">
        <rect x="-10" y="-14" width="2" height="2"/>
        <rect x="-6" y="-14" width="2" height="2"/>
        <rect x="-2" y="-14" width="2" height="2"/>
        <rect x="2" y="-14" width="2" height="2"/>
        <rect x="8" y="-14" width="2" height="2"/>

        <rect x="-10" y="-10" width="2" height="2"/>
        <rect x="-4" y="-10" width="2" height="2"/>
        <rect x="0" y="-10" width="2" height="2"/>
        <rect x="6" y="-10" width="2" height="2"/>

        <rect x="-12" y="-6" width="2" height="2"/>
        <rect x="-8" y="-6" width="2" height="2"/>
        <rect x="-2" y="-6" width="2" height="2"/>
        <rect x="4" y="-6" width="2" height="2"/>
        <rect x="10" y="-6" width="2" height="2"/>
        <rect x="14" y="-6" width="2" height="2"/>

        <rect x="-10" y="-2" width="2" height="2"/>
        <rect x="-6" y="-2" width="2" height="2"/>
        <rect x="0" y="-2" width="2" height="2"/>
        <rect x="8" y="-2" width="2" height="2"/>
        <rect x="12" y="-2" width="2" height="2"/>

        <rect x="-14" y="2" width="2" height="2"/>
        <rect x="-8" y="2" width="2" height="2"/>
        <rect x="-2" y="2" width="2" height="2"/>
        <rect x="4" y="2" width="2" height="2"/>
        <rect x="10" y="2" width="2" height="2"/>

        <rect x="-10" y="6" width="2" height="2"/>
        <rect x="-4" y="6" width="2" height="2"/>
        <rect x="2" y="6" width="2" height="2"/>
        <rect x="6" y="6" width="2" height="2"/>
        <rect x="12" y="6" width="2" height="2"/>

        <rect x="-12" y="10" width="2" height="2"/>
        <rect x="-6" y="10" width="2" height="2"/>
        <rect x="0" y="10" width="2" height="2"/>
        <rect x="8" y="10" width="2" height="2"/>
        <rect x="14" y="10" width="2" height="2"/>

        <rect x="-8" y="14" width="2" height="2"/>
        <rect x="-2" y="14" width="2" height="2"/>
        <rect x="6" y="14" width="2" height="2"/>
        <rect x="12" y="14" width="2" height="2"/>
      </g>
    </g>

    <!-- 左下 硬券番号 -->
    <text x="-64" y="38" font-family="'JetBrains Mono',monospace" font-size="6" font-weight="700" fill="#5a4a35" letter-spacing="0.8">No.____ / 3000</text>
    <!-- 右下 日付 -->
    <text x="64" y="38" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="6" font-weight="700" fill="#5a4a35" letter-spacing="0.8">2026 · SUMMER</text>
  </g>

  <!-- 下部 手 (硬券に向かって QR を近づける ジェスチャー) -->
  <g transform="translate(100,270)" opacity="0.9">
    <!-- 腕 · スケッチ -->
    <path d="M-6 30 Q-4 20 0 12 Q6 6 14 4 L20 2 L26 8 L20 14 L16 22 L14 30" fill="#e8dcb8" stroke="#1a1712" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- スマホ本体 -->
    <path d="M20 -14 L46 -14 L46 12 L20 12 Z" fill="#1a1712" stroke="#1a1712" stroke-width="1.4"/>
    <path d="M22 -12 L44 -12 L44 4 L22 4 Z" fill="#5a7788"/>
    <!-- 画面 の 硬券プレビュー 小 -->
    <rect x="26" y="-8" width="14" height="8" fill="#faf5e6" stroke="#1a1712" stroke-width="0.4"/>
    <rect x="28" y="-6" width="4" height="4" fill="#1a1712"/>
    <text x="33" y="8" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="3.5" fill="#f5eddc" letter-spacing="0.4">FUKUBU</text>
  </g>

  <!-- 動きの 線 (QR を 読み取る 動作 の 弧) -->
  <g opacity="0.5">
    <path d="M155 240 Q180 220 200 210" stroke="#b8410f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M198 208 L200 210 L198 214" stroke="#b8410f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 案内 ラベル -->
  <g transform="translate(170,310)">
    <rect x="-90" y="-14" width="180" height="24" fill="#faf5e6" stroke="#1a1712" stroke-width="1.4"/>
    <text x="0" y="3.5" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="11" font-weight="900" fill="#1a1712" letter-spacing="0.5">QR を 読み取って 硬券 を 押印</text>
  </g>

  <!-- 右下 桜 花びら 舞う -->
  <g opacity="0.7">
    <circle cx="300" cy="120" r="2.5" fill="#e8a598"/>
    <circle cx="310" cy="150" r="2" fill="#e8a598"/>
    <circle cx="290" cy="180" r="2.2" fill="#e8a598"/>
    <circle cx="320" cy="200" r="1.8" fill="#e8a598"/>
    <circle cx="295" cy="230" r="2" fill="#e8a598"/>
  </g>
</svg>
