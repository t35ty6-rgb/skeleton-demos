<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 影 -->
  <path d="M18 30 L84 30 L84 78 L18 78 Z" fill="#3a3025" opacity="0.15" transform="translate(3,3)"/>

  <!-- 券本体 (福鉄1日フリーきっぷ 再現) -->
  <path d="M14 26 L82 26 L82 74 L14 74 Z"
        fill="#faf5e6" stroke="#1a1712" stroke-width="1.8"/>

  <!-- 上部 濃色 帯 -->
  <path d="M14 26 L82 26 L82 36 L14 36 Z" fill="#1a1712"/>

  <!-- 券タイトル 上帯 -->
  <text x="48" y="33" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="6.5" font-weight="900" fill="#f5eddc" letter-spacing="1">福 鉄 1日 フリーきっぷ</text>

  <!-- 中央 縦切取線 (perforation) -->
  <path d="M60 26 L60 74" stroke="#1a1712" stroke-width="0.6" stroke-dasharray="1.5 1.8"/>

  <!-- 左側 メイン情報 -->
  <text x="18" y="46" font-family="'JetBrains Mono',monospace" font-size="4" font-weight="700" fill="#5a4a35" letter-spacing="0.8">ORIGINAL</text>
  <text x="18" y="56" font-family="'Noto Sans JP',sans-serif" font-size="8" font-weight="900" fill="#1a1712">たけふ新</text>
  <text x="18" y="63" font-family="'JetBrains Mono',monospace" font-size="4" fill="#5a4a35">↓</text>
  <text x="18" y="70" font-family="'Noto Sans JP',sans-serif" font-size="8" font-weight="900" fill="#1a1712">田原町</text>

  <!-- 右側 半券 -->
  <text x="70" y="44" font-family="'JetBrains Mono',monospace" font-size="4" font-weight="700" fill="#5a4a35" letter-spacing="0.8">FARE</text>
  <text x="70" y="53" font-family="'Noto Sans JP',sans-serif" font-size="9" font-weight="900" fill="#b8410f" text-decoration="line-through">¥1,000</text>
  <text x="70" y="63" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="900" fill="#1a1712">¥500</text>
  <text x="70" y="70" font-family="'JetBrains Mono',monospace" font-size="3.6" fill="#5a4a35">HALF PRICE</text>

  <!-- 下部 罫線 と 券番 -->
  <path d="M14 74 L82 74" stroke="#1a1712" stroke-width="1.5"/>
  <path d="M17 76 L79 76" stroke="#1a1712" stroke-width="0.5"/>

  <!-- 左端 pinch (穴) -->
  <circle cx="14" cy="50" r="2.5" fill="#f5eddc" stroke="#1a1712" stroke-width="0.6"/>

  <!-- 通常価格の 割引スタンプ (赤 印章 斜め) -->
  <g transform="translate(48,58) rotate(-18)">
    <circle r="9" fill="none" stroke="#b8410f" stroke-width="1.4" opacity="0.85"/>
    <circle r="7" fill="none" stroke="#b8410f" stroke-width="0.4" opacity="0.85" stroke-dasharray="1 1.2"/>
    <text x="0" y="-1" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="4.5" font-weight="900" fill="#b8410f">半額</text>
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="2.6" font-weight="800" fill="#b8410f" letter-spacing="0.4">RALLY</text>
  </g>
</svg>
