<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" preserveAspectRatio="xMidYMid slice">
  <!-- 遠景 山影 (最も薄く) -->
  <g opacity="0.09" fill="#f5eddc">
    <path d="M0 260 L100 180 L180 220 L280 160 L380 210 L480 150 L580 220 L680 160 L800 200 L800 400 L0 400 Z"/>
  </g>

  <!-- 中景 山 -->
  <g opacity="0.14" fill="#f5eddc">
    <path d="M0 300 L120 240 L220 270 L340 220 L440 260 L560 200 L680 240 L800 210 L800 400 L0 400 Z"/>
  </g>

  <!-- 線路 (水平 スケッチ) -->
  <g opacity="0.16" stroke="#f5eddc">
    <path d="M0 340 L800 340" stroke-width="1.2"/>
    <path d="M0 348 L800 348" stroke-width="1"/>
    <path d="M40 340 L40 350 M80 340 L80 350 M120 340 L120 350 M160 340 L160 350 M200 340 L200 350 M240 340 L240 350 M280 340 L280 350 M320 340 L320 350 M360 340 L360 350 M400 340 L400 350 M440 340 L440 350 M480 340 L480 350 M520 340 L520 350 M560 340 L560 350 M600 340 L600 350 M640 340 L640 350 M680 340 L680 350 M720 340 L720 350 M760 340 L760 350" stroke-width="0.8"/>
  </g>

  <!-- 走る電車 (右から左へ · 大きめ) -->
  <g transform="translate(520,275)" opacity="0.18">
    <!-- 車体 -->
    <path d="M0 0 L0 40 L140 40 L140 0 Q140 -14 128 -14 L12 -14 Q0 -14 0 0 Z" fill="#f5eddc"/>
    <path d="M3 8 L137 8" stroke="#1a1712" stroke-width="1.4"/>
    <path d="M3 12 L137 12" stroke="#1a1712" stroke-width="0.8"/>
    <!-- 前面 窓 -->
    <path d="M8 -10 L48 -10 L48 4 L8 4 Z" fill="none" stroke="#1a1712" stroke-width="1"/>
    <!-- 側面 窓 -->
    <path d="M60 -10 L76 -10 L76 4 L60 4 Z M84 -10 L100 -10 L100 4 L84 4 Z M108 -10 L124 -10 L124 4 L108 4 Z" fill="none" stroke="#1a1712" stroke-width="1"/>
    <!-- ドア -->
    <path d="M52 16 L52 40 M56 16 L56 40" stroke="#1a1712" stroke-width="0.7"/>
    <!-- 車輪 -->
    <circle cx="26" cy="46" r="8" fill="none" stroke="#1a1712" stroke-width="1.4"/>
    <circle cx="26" cy="46" r="3" fill="#1a1712"/>
    <circle cx="112" cy="46" r="8" fill="none" stroke="#1a1712" stroke-width="1.4"/>
    <circle cx="112" cy="46" r="3" fill="#1a1712"/>
    <!-- ヘッドライト -->
    <circle cx="6" cy="16" r="3" fill="none" stroke="#1a1712" stroke-width="1"/>
    <!-- スピード線 -->
    <path d="M-14 10 L-40 10 M-10 20 L-32 20 M-14 30 L-40 30" stroke="#1a1712" stroke-width="1"/>
  </g>

  <!-- 左側 桜 -->
  <g transform="translate(80,260)" opacity="0.14">
    <path d="M0 40 L0 -4" stroke="#f5eddc" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="#f5eddc"/>
    <circle cx="-14" cy="10" r="12" fill="#f5eddc"/>
    <circle cx="14" cy="10" r="12" fill="#f5eddc"/>
    <circle cx="-6" cy="-14" r="10" fill="#f5eddc"/>
    <circle cx="10" cy="-12" r="8" fill="#f5eddc"/>
  </g>

  <!-- 空 に 雲 (右上) -->
  <g opacity="0.08">
    <path d="M580 60 Q600 44 630 52 Q650 40 668 60 Q660 76 640 68 Q616 82 600 70 Q580 74 580 60 Z" fill="#f5eddc"/>
  </g>

  <!-- 舞う 花びら -->
  <g opacity="0.16" fill="#f5eddc">
    <circle cx="200" cy="90" r="3"/>
    <circle cx="280" cy="140" r="2.5"/>
    <circle cx="380" cy="80" r="2"/>
    <circle cx="440" cy="120" r="2.8"/>
    <circle cx="700" cy="90" r="2.5"/>
    <circle cx="730" cy="150" r="2"/>
  </g>
</svg>
