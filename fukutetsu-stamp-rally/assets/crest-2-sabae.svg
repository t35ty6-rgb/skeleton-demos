<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <clipPath id="c2clip"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>
  <path d="M48 4 C71 4 91 24 91 47 C91 71 71 91 48 91 C25 91 5 71 5 47 C5 24 25 4 48 4 Z"
        stroke="#1a1712" stroke-width="2" fill="#f5eddc"/>
  <path d="M48 8 C68 8 87 27 87 47 C87 68 68 87 48 87 C28 87 9 68 9 47 C9 27 28 8 48 8"
