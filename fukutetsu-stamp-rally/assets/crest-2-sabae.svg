<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <clipPath id="c2clip"><circle cx="48" cy="48" r="42"/></clipPath>
  </defs>
  <path d="M48 4 C71 4 91 24 91 47 C91 71 71 91 48 91 C25 91 5 71 5 47 C5 24 25 4 48 4 Z"
        stroke="#1a1712" stroke-width="2" fill="#f5eddc"/>
  <path d="M48 8 C68 8 87 27 87 47 C87 68 68 87 48 87 C28 87 9 68 9 47 C9 27 28 8 48 8"
        stroke="#1a1712" stroke-width="0.6" fill="none" stroke-dasharray="1.8 2.4"/>

  <g clip-path="url(#c2clip)">
    <!-- 芝生 の 遠景 -->
    <path d="M0 72 L96 72 L96 96 L0 96 Z" fill="#c9d8b3" opacity="0.5"/>

    <!-- ツツジ 5輪 手描き ふんわり -->
    <g>
      <g transform="translate(20,32)">
        <circle r="5" fill="#e8a598" stroke="#b8410f" stroke-width="0.9"/>
        <circle r="1.5" fill="#b8410f"/>
        <path d="M0 -5 Q-3 -3 -2 -1 M0 -5 Q3 -3 2 -1 M-5 0 Q-3 3 -1 2 M5 0 Q3 3 1 2 M0 5 Q-1 2 -3 3 M0 5 Q1 2 3 3"
              stroke="#b8410f" stroke-width="0.4" fill="none" opacity="0.6"/>
      </g>
      <g transform="translate(72,26)">
        <circle r="4" fill="#e8a598" stroke="#b8410f" stroke-width="0.8"/>
        <circle r="1.2" fill="#b8410f"/>
      </g>
      <g transform="translate(78,50)">
        <circle r="3.4" fill="#e8a598" stroke="#b8410f" stroke-width="0.7"/>
        <circle r="1" fill="#b8410f"/>
      </g>
      <g transform="translate(18,54)">
        <circle r="3" fill="#e8a598" stroke="#b8410f" stroke-width="0.7"/>
        <circle r="0.9" fill="#b8410f"/>
      </g>
      <g transform="translate(30,20)">
        <circle r="2.6" fill="#e8a598" stroke="#b8410f" stroke-width="0.6"/>
      </g>
    </g>

    <!-- 眼鏡 中央 (もっと大きく · 精密に) -->
    <g transform="translate(48,44)" stroke="#1a1712" stroke-linecap="round" stroke-linejoin="round">
      <!-- 左レンズ -->
      <path d="M-19 -3 Q-19 7 -11 7 Q-3 7 -3 -3 Q-3 -7 -11 -7 Q-19 -7 -19 -3 Z"
            fill="#faf5e6" stroke-width="1.8"/>
      <!-- 右レンズ -->
      <path d="M3 -3 Q3 7 11 7 Q19 7 19 -3 Q19 -7 11 -7 Q3 -7 3 -3 Z"
            fill="#faf5e6" stroke-width="1.8"/>
      <!-- ブリッジ -->
      <path d="M-3 -1 Q0 -4 3 -1" stroke-width="1.6" fill="none"/>
      <!-- テンプル (耳掛け) -->
      <path d="M-19 -2 Q-22 -3 -23 -6 Q-23 -8 -21 -8" stroke-width="1.6" fill="none"/>
      <path d="M19 -2 Q22 -3 23 -6 Q23 -8 21 -8" stroke-width="1.6" fill="none"/>
      <!-- 反射光 -->
      <path d="M-15 -4 Q-13 -5 -12 -3" stroke-width="0.8" opacity="0.5" fill="none"/>
      <path d="M7 -4 Q9 -5 10 -3" stroke-width="0.8" opacity="0.5" fill="none"/>
      <!-- 鼻当て -->
      <ellipse cx="-11" cy="-1" rx="1.5" ry="1" fill="none" stroke-width="0.5" opacity="0.4"/>
      <ellipse cx="11" cy="-1" rx="1.5" ry="1" fill="none" stroke-width="0.5" opacity="0.4"/>
    </g>

    <!-- レッサーパンダ silhouette 手描き 小 (下右) -->
    <g transform="translate(66,74)">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#b8410f" opacity="0.7"/>
      <circle cx="-2" cy="-3" r="2.5" fill="#b8410f" opacity="0.85"/>
      <path d="M-4 -5 L-5 -7 L-3 -6 Z M0 -5 L1 -7 L-1 -6 Z" fill="#b8410f"/>
      <circle cx="-3" cy="-3" r="0.4" fill="#faf5e6"/>
      <circle cx="-1" cy="-3" r="0.4" fill="#faf5e6"/>
      <path d="M4 0 Q7 -1 8 -3 Q7 -2 5 -2" fill="#b8410f" opacity="0.6"/>
    </g>
  </g>
</svg>
