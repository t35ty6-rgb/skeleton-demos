  <!-- 中央 弐 stamp -->
  <circle cx="48" cy="68" r="14" fill="#1a1712" opacity="0.95"/>
  <text x="48" y="74" text-anchor="middle" font-family="'Noto Serif JP','Yu Mincho',serif" font-size="17" font-weight="900" fill="#f5eddc" letter-spacing="0">弐</text>

  <text x="48" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" font-weight="800" fill="#1a1712" letter-spacing="1.4">CHAPTER II</text>
