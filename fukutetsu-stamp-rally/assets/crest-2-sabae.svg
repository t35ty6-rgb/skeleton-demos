    </g>

    <!-- 眼鏡 手描き (中央上部) -->
    <g transform="translate(48,38)" stroke="#1a1712" stroke-width="1.6" fill="#faf1d8" stroke-linecap="round" stroke-linejoin="round">
      <!-- 左レンズ -->
      <path d="M-16 -2 Q-16 6 -10 6 Q-4 6 -4 -2 Q-4 -5 -10 -5 Q-16 -5 -16 -2 Z"/>
      <!-- 右レンズ -->
      <path d="M4 -2 Q4 6 10 6 Q16 6 16 -2 Q16 -5 10 -5 Q4 -5 4 -2 Z"/>
      <!-- ブリッジ -->
      <path d="M-4 -1 Q0 -3 4 -1"/>
      <!-- テンプル -->
      <path d="M-16 -1 Q-19 -2 -20 -4 M16 -1 Q19 -2 20 -4"/>
      <!-- 反射光 -->
      <path d="M-13 -3 Q-11 -3 -10 -1" stroke-width="0.6" opacity="0.6" fill="none"/>
      <path d="M7 -3 Q9 -3 10 -1" stroke-width="0.6" opacity="0.6" fill="none"/>
    </g>

    <!-- レッサーパンダ silhouette 小 (右下) -->
    <g transform="translate(66,66)" fill="#b8410f" opacity="0.5">
      <ellipse cx="0" cy="1" rx="4" ry="3"/>
      <circle cx="-1.5" cy="-2.5" r="2"/>
      <path d="M-3 -4 L-4 -6 L-2 -5 Z M0 -4 L1 -6 L-1 -5 Z" fill="#b8410f"/>
