  <g clip-path="url(#c2clip)">
    <!-- ツツジ 花 5輪 手描き (背景) -->
    <g>
      <g transform="translate(22,32)">
        <circle r="4" fill="#e8a598" stroke="#b8410f" stroke-width="0.8"/>
        <circle r="1.2" fill="#b8410f"/>
        <path d="M-4 0 L-2.5 -3 L1 -3.5 L3.5 -1 L2 3 L-2 3.5 Z" fill="none" stroke="#b8410f" stroke-width="0.5"/>
      </g>
      <g transform="translate(70,26)">
        <circle r="3.6" fill="#e8a598" stroke="#b8410f" stroke-width="0.8"/>
        <circle r="1" fill="#b8410f"/>
      </g>
      <g transform="translate(78,44)">
        <circle r="3" fill="#e8a598" stroke="#b8410f" stroke-width="0.7"/>
        <circle r="0.9" fill="#b8410f"/>
      </g>
      <g transform="translate(20,50)">
        <circle r="2.6" fill="#e8a598" stroke="#b8410f" stroke-width="0.7"/>
