    <path d="M4 86 L92 86" stroke="#3a3025" stroke-width="1"/>
    <path d="M10 82 L10 88 M20 82 L20 88 M30 82 L30 88 M40 82 L40 88 M50 82 L50 88 M60 82 L60 88 M70 82 L70 88 M80 82 L80 88" stroke="#3a3025" stroke-width="0.6"/>
