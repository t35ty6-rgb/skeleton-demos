      <!-- 三階 -->
      <path d="M-7 -15 L-7 -20 L7 -20 L7 -15 Z" fill="#faf5e6" stroke-width="1.4"/>
      <!-- 天守 屋根 -->
      <path d="M-9 -20 L-5 -25 L5 -25 L9 -20 Z" fill="#1a1712" stroke-width="1.2"/>
      <!-- 鯱 (金色) -->
      <path d="M-4 -25 Q-4 -28 -3 -28 Q-2 -28 -2 -26" fill="#d97a3f" stroke-width="0.8"/>
      <path d="M4 -25 Q4 -28 3 -28 Q2 -28 2 -26" fill="#d97a3f" stroke-width="0.8"/>
      <!-- 一階 窓 -->
      <path d="M-11 7 L-4 7 L-4 12 L-11 12 Z M4 7 L11 7 L11 12 L4 12 Z" fill="#3a3025" stroke-width="0.5"/>
      <path d="M-9 7 L-9 12 M-7 7 L-7 12 M-5 7 L-5 12 M5 7 L5 12 M7 7 L7 12 M9 7 L9 12" stroke="#faf5e6" stroke-width="0.4"/>
