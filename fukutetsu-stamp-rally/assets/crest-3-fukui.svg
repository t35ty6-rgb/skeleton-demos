      <path d="M-14 14 L-14 5 L14 5 L14 14 Z" fill="#faf5e6" stroke-width="1.4"/>
      <!-- 一階 屋根 -->
      <path d="M-17 5 L-12 -2 L12 -2 L17 5 Z" fill="#1a1712" stroke-width="1.2"/>
      <!-- 二階 -->
      <path d="M-10 -2 L-10 -9 L10 -9 L10 -2 Z" fill="#faf5e6" stroke-width="1.4"/>
      <!-- 二階 屋根 -->
