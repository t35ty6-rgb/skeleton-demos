<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIO ご来場アンケート ｜ 大野商工会議所</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6;
  --paper:#fff;
  --ink:#1A1A1A;
  --ink-2:#3A3A3A;
  --ink-3:#6A6A6A;
  --ink-4:#A8A8A8;
  --line:#E5E1D7;
  --sky:#5B9CA7;
  --sky-deep:#2E6E7A;
  --sky-pale:#E4EEF0;
  --gold:#C9A66B;
  --red:#C7472D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  font-weight:500;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt";
  min-height:100dvh;
  display:flex;flex-direction:column;
}
.num{font-family:'Inter','Noto Sans JP',sans-serif}

header{
  padding:20px 20px 16px;
  text-align:center;
  border-bottom:1px solid var(--line);
}
.brand{
  font-size:11px;font-weight:900;letter-spacing:0.32em;color:var(--sky-deep);
}
.brand b{display:block;font-size:18px;letter-spacing:0.06em;color:var(--ink);margin-top:4px}

main{flex:1;padding:24px 20px 40px;max-width:480px;margin:0 auto;width:100%}

.progress{
  display:flex;gap:6px;margin-bottom:28px;
}
.progress-dot{
  flex:1;height:4px;background:var(--line);border-radius:99px;
  transition:background 0.3s;
}
.progress-dot.active{background:var(--sky)}
.progress-dot.done{background:var(--sky-deep)}

.step{display:none;animation:slideIn 0.35s cubic-bezier(0.2,0.8,0.3,1)}
.step.active{display:block}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

.step-num{font-family:'Inter';font-size:11px;font-weight:700;color:var(--sky-deep);letter-spacing:0.18em;margin-bottom:8px}
.step-q{font-size:22px;font-weight:900;line-height:1.5;letter-spacing:-0.01em;margin-bottom:24px;color:var(--ink)}
.step-q small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-top:6px;letter-spacing:0.02em}

/* Options as big touch buttons */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  width:100%;padding:18px 22px;
  background:var(--paper);border:2px solid var(--line);
  font-size:16px;font-weight:700;color:var(--ink);
  text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  transition:border-color 0.15s,background 0.15s,transform 0.1s;
  letter-spacing:0.02em;
  border-radius:4px;
  font-family:inherit;
}
.opt:active{transform:scale(0.98)}
.opt:hover{border-color:var(--sky)}
.opt.sel{border-color:var(--sky-deep);background:var(--sky-pale);color:var(--sky-deep)}
.opt::after{
  content:"";
  width:20px;height:20px;border:2px solid var(--ink-4);border-radius:50%;
  flex-shrink:0;transition:all 0.15s;
}
.opt.sel::after{
  border-color:var(--sky-deep);background:var(--sky-deep);
  box-shadow:inset 0 0 0 4px var(--paper);
}

/* Prefecture grid */
.pref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pref{
  padding:12px 6px;background:var(--paper);border:1.5px solid var(--line);
  font-size:13px;font-weight:700;color:var(--ink);text-align:center;cursor:pointer;
  transition:all 0.12s;border-radius:3px;font-family:inherit;
}
.pref:active{transform:scale(0.96)}
.pref.sel{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}

.cta-row{margin-top:28px;display:flex;gap:10px}
.btn{
  flex:1;padding:18px;
  font-size:15px;font-weight:900;letter-spacing:0.08em;
  border:2px solid var(--ink);
  cursor:pointer;
  background:var(--ink);color:#fff;
  border-radius:3px;font-family:inherit;
  transition:transform 0.1s;
}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-back{
  background:transparent;color:var(--ink);flex:0 0 90px;border-color:var(--ink);
}

.loading{
  text-align:center;padding:60px 20px;
}
.spinner{
  width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--sky-deep);
  border-radius:50%;margin:0 auto 18px;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--ink-3);font-weight:700}

.err{
  padding:14px 16px;background:#FCE7E0;border:1.5px solid var(--red);color:var(--red);
  font-size:13px;font-weight:700;margin-top:16px;border-radius:3px;
}

footer{
  text-align:center;padding:24px 20px;
  font-size:10.5px;color:var(--ink-4);letter-spacing:0.08em;
  border-top:1px solid var(--line);
}
footer b{display:block;color:var(--ink-3);font-weight:700;margin-bottom:4px}
</style>
</head>
<body>

<header>
  <div class="brand">MIO ／ MADE IN ONO<b>ご来場アンケート</b></div>
</header>

<main>
  <div class="progress" id="progress">
    <div class="progress-dot active"></div>
    <div class="progress-dot"></div>
    <div class="progress-dot"></div>
  </div>

  <!-- STEP 1 年齢層 -->
  <section class="step active" data-step="1">
    <div class="step-num">QUESTION 01 / 03</div>
    <div class="step-q">年齢を 教えてください<small>該当する 年代を ひとつ お選びください</small></div>
    <div class="opts" data-field="age_band">
      <button class="opt" data-val="20代">20代</button>
      <button class="opt" data-val="30代">30代</button>
      <button class="opt" data-val="40代">40代</button>
      <button class="opt" data-val="50代">50代</button>
      <button class="opt" data-val="60代以上">60代 以上</button>
    </div>
    <div class="cta-row">
      <button class="btn" data-next disabled>次へ</button>
    </div>
  </section>

  <!-- STEP 2 性別 -->
  <section class="step" data-step="2">
    <div class="step-num">QUESTION 02 / 03</div>
    <div class="step-q">性別を 教えてください<small>差し支えなければ お選びください</small></div>
    <div class="opts" data-field="gender">
      <button class="opt" data-val="男">男性</button>
      <button class="opt" data-val="女">女性</button>
      <button class="opt" data-val="答えたくない">答えたくない</button>
    </div>
    <div class="cta-row">
      <button class="btn btn-back" data-back>戻る</button>
      <button class="btn" data-next disabled>次へ</button>
    </div>
  </section>

  <!-- STEP 3 都道府県 -->
  <section class="step" data-step="3">
    <div class="step-num">QUESTION 03 / 03</div>
    <div class="step-q">お住まいの 都道府県は？<small>該当する 都道府県を ひとつ お選びください</small></div>
    <div class="pref-grid" data-field="prefecture"></div>
    <div class="cta-row">
      <button class="btn btn-back" data-back>戻る</button>
      <button class="btn" data-submit disabled>送信 → ルーレットへ</button>
    </div>
    <div class="err" id="err" style="display:none"></div>
  </section>

  <!-- Loading -->
  <section class="step" data-step="loading">
    <div class="loading">
      <div class="spinner"></div>
      <p>送信中…<br>ルーレットページへ移動します</p>
    </div>
  </section>
</main>

<footer>
  <b>MIO ／ Made in Ono</b>
  運営: 大野商工会議所　・　福井県大野市
</footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const LIFF_ID = '2010490911-nTMU39VA';

const firebaseConfig = {
  apiKey: "AIzaSyAmVAEe9l9e1Yo_dzzJdbTVU35wWKd2sH4",
  authDomain: "skeleton-fp-compass-632026.firebaseapp.com",
  projectId: "skeleton-fp-compass-632026"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 都道府県
const PREFS = ['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
const prefGrid = document.querySelector('[data-field="prefecture"]');
PREFS.forEach(p => {
  const b = document.createElement('button');
  b.className = 'pref';
  b.dataset.val = p;
  b.textContent = p;
  prefGrid.appendChild(b);
});

// State
const answers = { age_band: null, gender: null, prefecture: null };
let currentStep = 1;
const totalSteps = 3;

function showStep(n) {
  document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
  document.querySelector(`.step[data-step="${n}"]`).classList.add('active');
  // progress
  document.querySelectorAll('.progress-dot').forEach((d, i) => {
    d.classList.remove('active','done');
    if (i+1 < n || n === 'loading') d.classList.add('done');
    else if (i+1 === n) d.classList.add('active');
  });
  if (n !== 'loading') currentStep = n;
  window.scrollTo(0, 0);
}

function updateNextBtn() {
  const stepEl = document.querySelector(`.step[data-step="${currentStep}"]`);
  const field = stepEl.querySelector('[data-field]').dataset.field;
  const filled = answers[field] !== null;
  stepEl.querySelectorAll('[data-next],[data-submit]').forEach(b => b.disabled = !filled);
}

// Option selection
document.addEventListener('click', e => {
  const opt = e.target.closest('.opt, .pref');
  if (opt) {
    const container = opt.closest('[data-field]');
    const field = container.dataset.field;
    container.querySelectorAll('.opt, .pref').forEach(b => b.classList.remove('sel'));
    opt.classList.add('sel');
    answers[field] = opt.dataset.val;
    updateNextBtn();
    return;
  }
  if (e.target.matches('[data-next]')) { showStep(currentStep + 1); updateNextBtn(); }
  if (e.target.matches('[data-back]')) { showStep(currentStep - 1); updateNextBtn(); }
  if (e.target.matches('[data-submit]')) submit();
});

// ── LIFF + 既存回答チェック ──
let lineUserId = null;

async function initLiffAndCheckExisting() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) {
      const profile = await liff.getProfile();
      lineUserId = profile.userId;
    } else if (liff.isInClient()) {
      liff.login();
      return;
    }
  } catch (e) {
    console.warn('LIFF init skipped (likely direct browser access):', e?.message);
  }

  if (!lineUserId) return; // anon mode (PC直アクセス等)

  // 既存回答チェック (この LINE userId で すでにアンケ済か)
  try {
    await signInAnonymously(auth);
    await new Promise(r => onAuthStateChanged(auth, u => u && r()));
    const ref = doc(db, 'mio_line_survey', lineUserId);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const data = snap.data();
      if (data.coupon) {
        // すでに当選済 → ルーレット結果画面へ
        location.replace(`roulette.html?session=${lineUserId}&existing=1`);
      } else {
        // アンケート済だが ルーレット未消化 → ルーレットへ
        location.replace(`roulette.html?session=${lineUserId}`);
      }
    }
  } catch (e) {
    console.warn('既存チェックspip:', e?.message);
  }
}
initLiffAndCheckExisting();

async function submit() {
  document.getElementById('err').style.display = 'none';
  showStep('loading');
  try {
    await signInAnonymously(auth);
    await new Promise(r => onAuthStateChanged(auth, u => u && r()));
    // docId は LINE userId (LIFF経由) or anon fallback
    const docId = lineUserId || `anon_${auth.currentUser.uid}`;
    await setDoc(doc(db, 'mio_line_survey', docId), {
      age_band: answers.age_band,
      gender: answers.gender,
      prefecture: answers.prefecture,
      created_at: serverTimestamp(),
      uid: auth.currentUser.uid,
      line_user_id: lineUserId,
      coupon: null,
      won_at: null,
      user_agent: navigator.userAgent.slice(0, 200)
    });
    location.href = `roulette.html?session=${docId}`;
  } catch (err) {
    console.error(err);
    showStep(currentStep);
    const e = document.getElementById('err');
    e.textContent = `送信に失敗しました: ${err.message}`;
    e.style.display = 'block';
  }
}
</script>

</body>
</html>
