<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIO クーポンルーレット ｜ 大野商工会議所</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6;
  --paper:#fff;
  --ink:#1A1A1A;
  --ink-3:#6A6A6A;
  --line:#E5E1D7;
  --sky:#5B9CA7;
  --sky-deep:#2E6E7A;
  --sky-pale:#E4EEF0;
  --gold:#C9A66B;
  --gold-deep:#9A7A3F;
  --red:#C7472D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  font-weight:500;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt";
  min-height:100dvh;display:flex;flex-direction:column;
}
.num{font-family:'Inter','Noto Sans JP',sans-serif}

header{
  padding:20px 20px 16px;text-align:center;border-bottom:1px solid var(--line);
}
.brand{font-size:11px;font-weight:900;letter-spacing:0.32em;color:var(--sky-deep)}
.brand b{display:block;font-size:18px;letter-spacing:0.06em;color:var(--ink);margin-top:4px}

main{flex:1;padding:24px 20px 40px;max-width:480px;margin:0 auto;width:100%;text-align:center}

.title{
  font-size:13px;font-weight:900;letter-spacing:0.2em;color:var(--gold-deep);margin-bottom:6px;
}
.subtitle{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:8px;letter-spacing:-0.005em}
.lead{font-size:13px;color:var(--ink-3);font-weight:500;margin-bottom:24px;letter-spacing:0.02em}

.wheel-wrap{
  position:relative;width:300px;height:300px;margin:10px auto 28px;
}
.wheel-wrap::before{
  content:"";
  position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:24px solid var(--red);
  z-index:5;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.wheel{
  width:100%;height:100%;
  border-radius:50%;
  position:relative;
  transition:transform 6s cubic-bezier(0.15,0.85,0.25,1);
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.15));
}
.wheel-hub{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;background:#fff;border:3px solid var(--ink);border-radius:50%;
  z-index:3;display:grid;place-items:center;
  font-family:'Inter';font-weight:900;font-size:11px;color:var(--ink);letter-spacing:0.08em;
}

.spin-btn{
  background:var(--ink);color:#fff;
  font-size:16px;font-weight:900;letter-spacing:0.12em;
  padding:18px 40px;border:none;cursor:pointer;
  border-radius:99px;font-family:inherit;
  box-shadow:0 6px 16px rgba(26,26,26,0.25);
  transition:transform 0.15s, box-shadow 0.15s;
}
.spin-btn:active{transform:translateY(2px);box-shadow:0 2px 4px rgba(26,26,26,0.2)}
.spin-btn:disabled{opacity:0.4;cursor:not-allowed}

.result{display:none;margin-top:24px}
.result.show{display:block;animation:popIn 0.5s cubic-bezier(0.2,1.4,0.4,1)}
@keyframes popIn{from{opacity:0;transform:scale(0.6)}to{opacity:1;transform:none}}

.result-pct{
  font-family:'Inter';font-size:64px;font-weight:900;letter-spacing:-0.03em;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;margin-bottom:4px;
}
.result-pct small{font-size:24px;color:var(--gold-deep);-webkit-text-fill-color:var(--gold-deep);background:none;margin-left:4px}
.result-label{font-size:13px;font-weight:900;color:var(--gold-deep);letter-spacing:0.2em;margin-bottom:18px}

.result-code{
  display:inline-flex;align-items:center;gap:14px;
  background:var(--paper);border:2px dashed var(--ink);
  padding:18px 28px;margin-bottom:8px;
  font-family:'Inter';font-weight:900;font-size:32px;letter-spacing:0.08em;color:var(--ink);
  cursor:pointer;transition:transform 0.1s,background 0.2s;
  -webkit-user-select:none;user-select:none;
}
.result-code:active{transform:scale(0.97)}
.result-code.copied{background:var(--gold);color:#fff;border-color:var(--gold)}
.result-code-tap{
  font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:900;letter-spacing:0.16em;
  color:var(--sky-deep);padding:6px 12px;background:var(--sky-pale);border-radius:99px;
}
.result-code.copied .result-code-tap{background:#fff;color:var(--gold-deep)}
.copied-flash{
  display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:0.16em;
  color:var(--gold-deep);background:var(--gold);color:#fff;padding:4px 12px;
  opacity:0;transition:opacity 0.3s;
}
.copied-flash.show{opacity:1}
.result-howto{font-size:12.5px;color:var(--ink-3);font-weight:500;line-height:1.85;margin-bottom:24px;letter-spacing:0.02em}

.cta-shop{
  display:inline-block;background:var(--sky-deep);color:#fff;
  font-size:15px;font-weight:900;letter-spacing:0.06em;
  padding:16px 32px;text-decoration:none;border-radius:3px;
}

.err{
  padding:14px 16px;background:#FCE7E0;border:1.5px solid var(--red);color:var(--red);
  font-size:13px;font-weight:700;margin-top:16px;border-radius:3px;
}

footer{text-align:center;padding:24px 20px;font-size:10.5px;color:#A8A8A8;letter-spacing:0.08em;border-top:1px solid var(--line)}
footer b{display:block;color:var(--ink-3);font-weight:700;margin-bottom:4px}
</style>
</head>
<body>

<header>
  <div class="brand">MIO ／ MADE IN ONO<b>クーポンルーレット</b></div>
</header>

<main>
  <div id="pre">
    <div class="title">CONGRATULATIONS</div>
    <div class="subtitle">アンケート ありがとうございました</div>
    <p class="lead">下のボタンを 押すと ルーレットが 回ります。<br>当たった割引コードは MIO オンラインストアで お使いいただけます。</p>

    <div class="wheel-wrap">
      <svg class="wheel" id="wheel" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- 6 segments alternating to make 3 visible pie slices feel richer.
             Order CW from top: 5%, 10%, 5%, 20%, 5%, 10% -->
        <g id="segments"></g>
        <!-- labels -->
        <g id="labels" font-family="Inter" font-weight="900" fill="#1A1A1A"></g>
      </svg>
      <div class="wheel-hub">MIO</div>
    </div>

    <button class="spin-btn" id="spinBtn">ルーレットを 回す</button>
    <div class="err" id="err" style="display:none"></div>
  </div>

  <div class="result" id="result">
    <div class="result-pct" id="rPct">5<small>% OFF</small></div>
    <div class="result-label" id="rLabel">あたり！</div>
    <div class="result-code" id="rCode" title="タップでコピー">
      <span id="rCodeText">MIO-05</span>
      <span class="result-code-tap">タップでコピー</span>
    </div>
    <div class="copied-flash" id="copiedFlash">クリップボードに コピーしました</div>
    <div class="result-howto">
      決済画面の「プロモコード」欄に<br>
      <b style="color:var(--ink)">上のコード</b>を 入力するだけで 割引適用。
    </div>
    <a class="cta-shop" href="https://t35ty6-rgb.github.io/skeleton-demos/mio-ec/" target="_top">MIO ストアへ →</a>
  </div>
</main>

<footer>
  <b>MIO ／ Made in Ono</b>
  運営: 大野商工会議所　・　福井県大野市
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import { getFirestore, doc, updateDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmVAEe9l9e1Yo_dzzJdbTVU35wWKd2sH4",
  authDomain: "skeleton-fp-compass-632026.firebaseapp.com",
  projectId: "skeleton-fp-compass-632026"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Wheel: 6 segments alternating to look fuller
// segments order (CW from 12 o'clock): 5,10,5,20,5,10
// coupon distribution from segments: 5% in 3 slots, 10% in 2 slots, 20% in 1 slot
// Weighted pick (more 5%, fewer 20%) for product safety.
const SEGMENTS = [
  { pct: 5, color:'#E4EEF0', label:'5%' },
  { pct: 10, color:'#5B9CA7', label:'10%', textColor:'#fff' },
  { pct: 5, color:'#E4EEF0', label:'5%' },
  { pct: 20, color:'#C9A66B', label:'20%', textColor:'#fff' },
  { pct: 5, color:'#E4EEF0', label:'5%' },
  { pct: 10, color:'#5B9CA7', label:'10%', textColor:'#fff' },
];
const SEG_DEG = 360 / SEGMENTS.length;

function buildWheel() {
  const cx = 100, cy = 100, r = 100;
  const segG = document.getElementById('segments');
  const labelG = document.getElementById('labels');
  SEGMENTS.forEach((s, i) => {
    const start = i * SEG_DEG - 90; // 0 at top
    const end = start + SEG_DEG;
    const startRad = (start * Math.PI) / 180;
    const endRad = (end * Math.PI) / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const large = SEG_DEG > 180 ? 1 : 0;
    const d = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute('d', d);
    path.setAttribute('fill', s.color);
    path.setAttribute('stroke', '#fff');
    path.setAttribute('stroke-width', '1.5');
    segG.appendChild(path);

    // label at mid-angle
    const mid = start + SEG_DEG / 2;
    const midRad = (mid * Math.PI) / 180;
    const lx = cx + r * 0.65 * Math.cos(midRad);
    const ly = cy + r * 0.65 * Math.sin(midRad);
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute('x', lx);
    txt.setAttribute('y', ly);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('dominant-baseline','central');
    txt.setAttribute('font-size','16');
    txt.setAttribute('fill', s.textColor || '#1A1A1A');
    txt.setAttribute('transform', `rotate(${mid + 90} ${lx} ${ly})`);
    txt.textContent = s.label;
    labelG.appendChild(txt);
  });
}
buildWheel();

// ── Weighted draw (オーナー指定) ──
// 5%:80%, 10%:18%, 20%:2%
function drawCoupon() {
  const r = Math.random();
  if (r < 0.80) return 5;
  if (r < 0.98) return 10;
  return 20;
}

// ── Spin animation ──
// We need to land on a segment matching the drawn coupon.
function spinTo(targetPct) {
  // find segments matching pct
  const candidates = [];
  SEGMENTS.forEach((s, i) => { if (s.pct === targetPct) candidates.push(i); });
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  // center of chosen segment angle (CW from top)
  const segCenter = chosen * SEG_DEG + SEG_DEG / 2;
  // wheel needs to rotate so that segCenter ends up at top (0deg)
  // rotation = -segCenter (mod 360) + extra spins
  const spins = 5; // full rotations
  const offset = (Math.random() - 0.5) * (SEG_DEG * 0.6); // jitter within seg
  const finalDeg = spins * 360 + (360 - segCenter) + offset;
  const wheel = document.getElementById('wheel');
  wheel.style.transform = `rotate(${finalDeg}deg)`;
}

// ── Session loading ──
const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const isExisting = params.get('existing') === '1';
const spinBtn = document.getElementById('spinBtn');
const errEl = document.getElementById('err');
const preEl = document.getElementById('pre');

// 当選結果はページロード時に確定させ、ボタン押下時はアニメーションだけにする。
// 旧実装はクリック時に signIn → getDoc → updateDoc の3往復が走り、
// LINE内蔵ブラウザ/低速回線で「ボタン押してもホイールが回らない」体感バグ多発。
const SPIN_BTN_LABELS = {
  preparing: '準備中…',
  ready: 'ルーレットを 回す',
  existing: 'コードを 表示する'
};
const state = { pct: null, firstTime: true, ready: false };
const originalBtnText = spinBtn.textContent;
spinBtn.disabled = true;
spinBtn.textContent = SPIN_BTN_LABELS.preparing;

if (!sessionId) {
  errEl.textContent = 'セッションIDがありません。 アンケートから やり直してください。';
  errEl.style.display = 'block';
  spinBtn.textContent = originalBtnText;
}

async function prepareCoupon() {
  if (!sessionId) return;
  try {
    await signInAnonymously(auth);
    await new Promise(r => onAuthStateChanged(auth, u => u && r()));
    const ref = doc(db, 'mio_line_survey', sessionId);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw new Error('セッションが見つかりません');

    let pct = snap.data().coupon;
    if (pct == null) {
      pct = drawCoupon();
      await updateDoc(ref, { coupon: pct, won_at: serverTimestamp() });
      state.firstTime = true;
      spinBtn.textContent = SPIN_BTN_LABELS.ready;
    } else {
      state.firstTime = false;
      preEl.querySelector('.subtitle').textContent = 'すでに 当選済みです';
      preEl.querySelector('.lead').innerHTML = '一度 ルーレットで 当選した コードを 再表示します。<br><b style="color:var(--ink)">同じ LINE アカウント で 何度も 引くことは できません。</b>';
      spinBtn.textContent = SPIN_BTN_LABELS.existing;
    }
    state.pct = pct;
    state.ready = true;
    spinBtn.disabled = false;
  } catch (e) {
    console.error('prepareCoupon:', e);
    errEl.textContent = `準備に失敗しました: ${e.message}`;
    errEl.style.display = 'block';
    spinBtn.textContent = originalBtnText;
    spinBtn.disabled = false;
  }
}
prepareCoupon();

spinBtn.addEventListener('click', async () => {
  if (spinBtn.disabled) return;
  spinBtn.disabled = true;
  errEl.style.display = 'none';

  if (state.ready && state.pct != null) {
    spinTo(state.pct);
    const wait = state.firstTime ? 6300 : 3500;
    setTimeout(() => showResult(state.pct), wait);
    return;
  }

  // フォールバック: prepareCoupon が失敗していた場合のみ旧フローで再試行
  try {
    await signInAnonymously(auth);
    await new Promise(r => onAuthStateChanged(auth, u => u && r()));
    const ref = doc(db, 'mio_line_survey', sessionId);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw new Error('セッションが見つかりません');
    let pct = snap.data().coupon;
    const firstTime = pct == null;
    if (firstTime) {
      pct = drawCoupon();
      await updateDoc(ref, { coupon: pct, won_at: serverTimestamp() });
    }
    spinTo(pct);
    const wait = firstTime ? 6300 : 3500;
    setTimeout(() => showResult(pct), wait);
  } catch (err) {
    console.error(err);
    errEl.textContent = `失敗: ${err.message}`;
    errEl.style.display = 'block';
    spinBtn.disabled = false;
  }
});

function showResult(pct) {
  const code = `MIO-${String(pct).padStart(2,'0')}`;
  document.getElementById('rPct').innerHTML = `${pct}<small>% OFF</small>`;
  document.getElementById('rCodeText').textContent = code;
  document.getElementById('pre').style.display = 'none';
  document.getElementById('result').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Tap-to-copy on coupon code
document.getElementById('rCode').addEventListener('click', async () => {
  const code = document.getElementById('rCodeText').textContent.trim();
  try {
    await navigator.clipboard.writeText(code);
  } catch (e) {
    // Fallback for older browsers / iOS in some contexts
    const ta = document.createElement('textarea');
    ta.value = code; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  const codeEl = document.getElementById('rCode');
  const flash = document.getElementById('copiedFlash');
  codeEl.classList.add('copied');
  flash.classList.add('show');
  setTimeout(() => {
    codeEl.classList.remove('copied');
    flash.classList.remove('show');
  }, 1800);
});
</script>

</body>
</html>
