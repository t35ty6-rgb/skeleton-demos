<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B'up Gym — D1 Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0A0A0A;
    --paper: #F5F1EA;
    --copper: #B87333;
    --copper-hi: #D69456;
    --smoke: #1A1A1A;
    --hair: rgba(245,241,234,0.14);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    background: var(--ink);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  .hero {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 40px;
  }
  /* header rail */
  .rail {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    gap: 40px;
    z-index: 10;
  }
  .rail-left, .rail-right {
    display: flex; gap: 22px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(245,241,234,0.55);
  }
  .rail-right { justify-content: flex-end; }
  .rail-brand {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--paper);
  }
  .rail em {
    font-style: normal;
    color: var(--copper-hi);
    font-weight: 600;
  }
  /* photo stage */
  .stage {
    position: relative;
    margin-top: 40px;
    display: grid;
    grid-template-columns: 1fr;
    align-items: end;
    z-index: 5;
  }
  .stage-photo {
    position: absolute;
    top: 0; right: 40px;
    width: min(50vw, 640px);
    aspect-ratio: 3/4;
    background:
      linear-gradient(180deg, transparent 45%, rgba(10,10,10,0.85) 100%),
      url('https://tsunagaru-marche.net/wp-content/uploads/95FDF9D4-EB1C-42EC-9843-33F31882CB26_0.jpg') center 20% / cover no-repeat;
    filter: grayscale(1) contrast(1.05);
    z-index: 2;
    -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 60%, transparent 100%);
  }
  .stage-photo::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, transparent 45%, rgba(10,10,10,0.7) 100%);
    mix-blend-mode: multiply;
  }
  /* massive display */
  .display {
    position: relative;
    z-index: 6;
    padding-top: 22vh;
  }
  .display h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: clamp(72px, 15vw, 240px);
    line-height: 0.86;
    letter-spacing: -0.055em;
    color: var(--paper);
    text-wrap: balance;
    margin: 0;
  }
  .display h1 .jp {
    display: block;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 3.6vw, 56px);
    letter-spacing: -0.03em;
    color: rgba(245,241,234,0.85);
    margin-top: 26px;
    line-height: 1.15;
  }
  .display h1 em {
    color: var(--copper-hi);
    font-style: italic;
    font-weight: 300;
    font-family: 'Inter', sans-serif;
  }
  /* bottom caption + cta */
  .bottom {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 40px;
    align-items: end;
    margin-top: 60px;
    z-index: 8;
    position: relative;
    padding-top: 30px;
    border-top: 1px solid var(--hair);
  }
  .caption {
    max-width: 460px;
    color: var(--copper-hi);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.9;
  }
  .caption strong {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--paper);
    margin-bottom: 8px;
    text-transform: none;
  }
  .cta-cluster {
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .price {
    text-align: right;
    color: rgba(245,241,234,0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-right: 18px;
    border-right: 1px solid var(--hair);
    line-height: 1.6;
  }
  .price strong {
    display: block;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    color: var(--paper);
    margin-bottom: 4px;
    text-transform: none;
    font-variant-numeric: tabular-nums;
  }
  .cta {
    background: var(--copper);
    color: var(--ink);
    padding: 16px 26px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 700; font-size: 13.5px;
    letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 10px;
    transition: all 0.2s ease-out;
    box-shadow: 0 0 0 1px var(--copper-hi), 0 20px 40px -12px rgba(184,115,51,0.4);
  }
  .cta:hover {
    background: var(--copper-hi);
    transform: translateY(-1px);
    box-shadow: 0 0 0 1px var(--copper-hi), 0 26px 50px -12px rgba(214,148,86,0.55);
  }
  .cta::after {
    content: ''; width: 6px; height: 6px;
    border-right: 1.5px solid var(--ink);
    border-top: 1.5px solid var(--ink);
    transform: rotate(45deg);
  }
  .cta-ghost {
    color: var(--paper);
    padding: 14px 22px;
    border-radius: 999px;
    border: 1px solid var(--hair);
    font-family: 'Inter', sans-serif;
    font-weight: 500; font-size: 12.5px;
    letter-spacing: 0.06em;
    transition: all 0.2s;
  }
  .cta-ghost:hover { border-color: var(--copper-hi); color: var(--copper-hi); }

  /* film grain overlay */
  .grain {
    position: fixed; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.09;
    mix-blend-mode: overlay;
    z-index: 100;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    z-index: 99;
  }

  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomin { from { transform: scale(1.08); filter: grayscale(1) contrast(0.9); } to { transform: scale(1); filter: grayscale(1) contrast(1.05); } }
  .rail { animation: fadein 1.4s ease-out both; }
  .stage-photo { animation: zoomin 2.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .display h1 { animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both; }
  .bottom { animation: rise 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }

  @media (max-width: 900px) {
    .hero { padding: 24px 22px; }
    .rail-left, .rail-right { display: none; }
    .rail { justify-items: start; }
    .stage-photo { position: relative; right: auto; top: auto; width: 100%; margin-bottom: -80px; }
    .display { padding-top: 10vh; }
    .bottom { grid-template-columns: 1fr; }
    .cta-cluster { justify-content: flex-start; }
    .price { border-right: none; padding-right: 0; text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rail, .stage-photo, .display h1, .bottom { animation: none; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="rail">
      <div class="rail-left">
        <span>Vol.03</span>
        <span>Autumn 2026</span>
      </div>
      <div class="rail-brand">B'up Gym</div>
      <div class="rail-right">
        <span>Toyama <em>·</em> Imizu</span>
        <span>Female-only Private</span>
      </div>
    </div>

    <div class="stage">
      <div class="stage-photo" role="img" aria-label="Megumi, trainer at B'up Gym"></div>

      <div class="display">
        <h1>
          Body,
          <em>reimagined.</em>
          <span class="jp">産後 の 体、 もう 一度 私 の ペース で。</span>
        </h1>
      </div>
    </div>

    <div class="bottom">
      <div class="caption">
        <strong>A film about coming back.</strong>
        女性トレーナー1人 の 完全プライベート パーソナル。 産後 · 40代 · 大手 が 続かなかった 人 の ため の、 マシン に 頼らない 60分。
      </div>
      <div class="cta-cluster">
        <div class="price">
          <strong>¥33,600 / mo</strong>
          60min × 4 · Toyama Imizu
        </div>
        <a class="cta-ghost" href="https://www.instagram.com/bimajyobody">Instagram</a>
        <a class="cta" href="https://lin.ee/NRarajY">LINE で 初回体験</a>
      </div>
    </div>
  </section>

  <div class="grain"></div>
  <div class="vignette"></div>
</body>
</html>
