<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARASHIMA HOSTEL / アラシマホステル — 旅舎・學舎 二つの戸口</title>
<meta name="description" content="福井県大野市 元町8-17。商店街の一隅にある二つのゲストハウス。泊まる「荒島旅舎」、滞在しながら学ぶ「荒島學舎」。">
<meta property="og:title" content="ARASHIMA HOSTEL — 旅舎・學舎">
<meta property="og:description" content="商店街の隣り合う二軒。夜の宿と、朝の学び舎。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marcellus&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Shippori+Mincho+B1:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="entrance.css">
</head>
<body>

<!-- 上部 thin band -->
<header class="topband">
  <div class="topband__brand">
    <span class="topband__brand-en">ARASHIMA HOSTEL</span>
    <span class="topband__brand-jp">アラシマホステル · 動く人とこもる人の宿</span>
  </div>
  <div class="topband__meta">
    <span>福井県大野市 元町商店街</span>
    <span class="topband__dot">·</span>
    <span class="topband__year">since 2022</span>
  </div>
</header>

<!-- 二軒の戸口 -->
<main class="gate" role="main">

  <!-- 左: 旅舎 (黒地・朱) — 登山・アウトドア・早立ち -->
  <div class="door door--ryosha" data-href="./ryosha/" tabindex="0" role="link" aria-label="荒島旅舎 たびしゃ ホームページへ">
    <div class="door__bg" aria-hidden="true">
      <img class="door__bg-slide" src="./assets/photos/p09.webp" alt="" loading="eager" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p14.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p18.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p15.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p11.webp" alt="" loading="lazy" decoding="async">
    </div>
    <div class="door__overlay" aria-hidden="true"></div>

    <!-- 上端 eyebrow -->
    <div class="door__eyebrow">
      <span class="door__num">01</span>
      <span class="door__type">INN · 宿</span>
    </div>

    <!-- 中央 brand block (写真の上に静かに) -->
    <div class="door__center">
      <div class="seal seal--ryosha" aria-hidden="true">
        <span class="seal__char">旅</span>
        <span class="seal__en">RYOSHA</span>
      </div>
      <span class="door__kana">たびしゃ</span>
      <h2 class="door__title">荒島旅舎</h2>
      <p class="door__line">商店街の、登山者の宿。</p>
    </div>

    <!-- 下端 CTA -->
    <a class="door__cta" href="./ryosha/" onclick="event.stopPropagation();">
      <span>たびしゃをみる</span>
      <svg width="32" height="10" viewBox="0 0 32 10" fill="none" aria-hidden="true">
        <path d="M0 5 H30 M26 1 L30 5 L26 9" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>
    </a>
  </div>

  <!-- 右: 學舎 (雪明かり地・苔) — 執筆・リモートワーク・中長期滞在 -->
  <div class="door door--gakusha" data-href="./gakusha/" tabindex="0" role="link" aria-label="荒島學舎 がくしゃ ホームページへ">
    <div class="door__bg" aria-hidden="true">
      <img class="door__bg-slide" src="./assets/photos/p02.webp" alt="" loading="eager" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p08.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p13.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p03.webp" alt="" loading="lazy" decoding="async">
      <img class="door__bg-slide" src="./assets/photos/p07.webp" alt="" loading="lazy" decoding="async">
    </div>
    <div class="door__overlay" aria-hidden="true"></div>

    <div class="door__eyebrow">
      <span class="door__num">02</span>
      <span class="door__type">STUDY · 学び舎</span>
    </div>

    <div class="door__center">
      <div class="seal seal--gakusha" aria-hidden="true">
        <span class="seal__char">學</span>
        <span class="seal__en">GAKUSHA</span>
      </div>
      <span class="door__kana">がくしゃ</span>
      <h2 class="door__title">荒島學舎</h2>
      <p class="door__line">城下町の、長期滞在の書斎。</p>
    </div>

    <a class="door__cta" href="./gakusha/" onclick="event.stopPropagation();">
      <span>がくしゃをみる</span>
      <svg width="32" height="10" viewBox="0 0 32 10" fill="none" aria-hidden="true">
        <path d="M0 5 H30 M26 1 L30 5 L26 9" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>
    </a>
  </div>

</main>

<script>
  // door 全体クリック で sub-site へ遷移 (内側のリンクは個別に動く)
  document.querySelectorAll('.door[data-href]').forEach((d) => {
    d.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      window.location.href = d.dataset.href;
    });
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.location.href = d.dataset.href;
      }
    });
  });
</script>

<!-- 下部 footer band -->
<footer class="botband">
  <div class="botband__line">
    <span class="botband__label">荒島の麓、商店街の一隅にて。</span>
    <span class="botband__sep">—</span>
    <span class="botband__label">どちらの戸口も、LINE でお迎えします。</span>
  </div>
  <div class="botband__copy">© ARASHIMA HOSTEL</div>
</footer>

</body>
</html>
