<?xml version="1.0" encoding="UTF-8"?>
<!--
  荒島ホテル LINE リッチメニュー (Noto Sans JP オンリー / 明朝禁止)
  サイズ: 2500 x 1686 / 3列x2行 = 6マス
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1686" width="2500" height="1686">
  <defs>
    <style>
      .label-jp    { font-family: 'Noto Sans JP', sans-serif; font-weight: 900; letter-spacing: 0.08em; }
      .label-en    { font-family: 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.3em; }
      .label-small { font-family: 'Noto Sans JP', sans-serif; font-weight: 500; letter-spacing: 0.04em; }
    </style>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06C755"/>
      <stop offset="100%" stop-color="#05A647"/>
    </linearGradient>
  </defs>

  <rect width="2500" height="1686" fill="#1A1612"/>

  <line x1="833" y1="0" x2="833" y2="1686" stroke="#0A0807" stroke-width="4"/>
  <line x1="1666" y1="0" x2="1666" y2="1686" stroke="#0A0807" stroke-width="4"/>
  <line x1="0" y1="843" x2="2500" y2="843" stroke="#0A0807" stroke-width="4"/>

  <!-- ===== A: 予約する [Primary 緑] ===== -->
  <g transform="translate(0, 0)">
    <rect width="833" height="843" fill="url(#primaryGrad)"/>
    <rect x="60" y="60" width="713" height="723" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <g transform="translate(416.5, 290)" stroke="white" stroke-width="6" fill="none">
      <rect x="-90" y="-50" width="180" height="160" rx="6"/>
      <line x1="-90" y1="-10" x2="90" y2="-10"/>
      <line x1="-60" y1="-70" x2="-60" y2="-30"/>
      <line x1="60" y1="-70" x2="60" y2="-30"/>
      <rect x="-50" y="20" width="50" height="40" fill="white" stroke="none"/>
    </g>
    <text x="416.5" y="560" text-anchor="middle" class="label-jp" font-size="80" fill="white">予約する</text>
    <text x="416.5" y="635" text-anchor="middle" class="label-en" font-size="28" fill="rgba(255,255,255,0.85)">RESERVE</text>
    <text x="416.5" y="710" text-anchor="middle" class="label-small" font-size="24" fill="rgba(255,255,255,0.85)">30秒で完了 / 24時間以内に確定連絡</text>
  </g>

  <!-- ===== B: 客室・プラン ===== -->
  <g transform="translate(833, 0)">
    <rect width="833" height="843" fill="#F7F2E8"/>
    <rect x="60" y="60" width="713" height="723" fill="none" stroke="rgba(20,17,14,0.10)" stroke-width="2"/>
    <g transform="translate(416.5, 290)" stroke="#14110E" stroke-width="6" fill="none">
      <path d="M -90 30 L -90 100 L 90 100 L 90 30"/>
      <path d="M -110 30 L 0 -70 L 110 30"/>
      <rect x="-30" y="50" width="60" height="50" fill="#9B3A26" stroke="none"/>
    </g>
    <text x="416.5" y="560" text-anchor="middle" class="label-jp" font-size="72" fill="#14110E">客室・プラン</text>
    <text x="416.5" y="635" text-anchor="middle" class="label-en" font-size="28" fill="#9B3A26">ROOMS</text>
    <text x="416.5" y="710" text-anchor="middle" class="label-small" font-size="24" fill="#6B6356">2棟 / 全8室 / ¥4,000〜</text>
  </g>

  <!-- ===== C: アクセス ===== -->
  <g transform="translate(1666, 0)">
    <rect width="834" height="843" fill="#F7F2E8"/>
    <rect x="60" y="60" width="714" height="723" fill="none" stroke="rgba(20,17,14,0.10)" stroke-width="2"/>
    <g transform="translate(417, 290)" stroke="#14110E" stroke-width="6" fill="none">
      <path d="M 0 -70 C -50 -70, -75 -30, -75 0 C -75 50, 0 110, 0 110 C 0 110, 75 50, 75 0 C 75 -30, 50 -70, 0 -70 Z"/>
      <circle cx="0" cy="-5" r="18" fill="#9B3A26" stroke="none"/>
    </g>
    <text x="417" y="560" text-anchor="middle" class="label-jp" font-size="80" fill="#14110E">アクセス</text>
    <text x="417" y="635" text-anchor="middle" class="label-en" font-size="28" fill="#9B3A26">ACCESS</text>
    <text x="417" y="710" text-anchor="middle" class="label-small" font-size="24" fill="#6B6356">越前大野駅 徒歩12分 / マップ</text>
  </g>

  <!-- ===== D: 予約変更・キャンセル ===== -->
  <g transform="translate(0, 843)">
    <rect width="833" height="843" fill="#F7F2E8"/>
    <rect x="60" y="60" width="713" height="723" fill="none" stroke="rgba(20,17,14,0.10)" stroke-width="2"/>
    <g transform="translate(416.5, 290)" stroke="#14110E" stroke-width="6" fill="none">
      <path d="M -70 -40 A 70 70 0 1 1 -70 40"/>
      <path d="M -75 -55 L -65 -15 L -25 -25"/>
      <path d="M 70 40 A 70 70 0 0 1 -70 40"/>
    </g>
    <text x="416.5" y="560" text-anchor="middle" class="label-jp" font-size="60" fill="#14110E">予約変更・キャンセル</text>
    <text x="416.5" y="635" text-anchor="middle" class="label-en" font-size="28" fill="#9B3A26">CHANGE</text>
    <text x="416.5" y="710" text-anchor="middle" class="label-small" font-size="24" fill="#6B6356">3日前まで無料 / 履歴連動</text>
  </g>

  <!-- ===== E: 館内案内 ===== -->
  <g transform="translate(833, 843)">
    <rect width="833" height="843" fill="#F7F2E8"/>
    <rect x="60" y="60" width="713" height="723" fill="none" stroke="rgba(20,17,14,0.10)" stroke-width="2"/>
    <g transform="translate(416.5, 290)" stroke="#14110E" stroke-width="6" fill="none">
      <rect x="-70" y="-80" width="140" height="180" rx="4"/>
      <circle cx="40" cy="20" r="6" fill="#14110E" stroke="none"/>
      <line x1="-70" y1="40" x2="70" y2="40"/>
    </g>
    <text x="416.5" y="560" text-anchor="middle" class="label-jp" font-size="80" fill="#14110E">館内案内</text>
    <text x="416.5" y="635" text-anchor="middle" class="label-en" font-size="28" fill="#9B3A26">FACILITY</text>
    <text x="416.5" y="710" text-anchor="middle" class="label-small" font-size="24" fill="#6B6356">キッチン / ラウンジ / 自転車 / Wi-Fi</text>
  </g>

  <!-- ===== F: お問い合わせ ===== -->
  <g transform="translate(1666, 843)">
    <rect width="834" height="843" fill="#F7F2E8"/>
    <rect x="60" y="60" width="714" height="723" fill="none" stroke="rgba(20,17,14,0.10)" stroke-width="2"/>
    <g transform="translate(417, 290)" stroke="#14110E" stroke-width="6" fill="none">
      <path d="M -90 -50 L 90 -50 L 90 50 L 20 50 L 0 90 L -20 50 L -90 50 Z"/>
      <circle cx="-30" cy="0" r="6" fill="#14110E" stroke="none"/>
      <circle cx="0" cy="0" r="6" fill="#14110E" stroke="none"/>
      <circle cx="30" cy="0" r="6" fill="#14110E" stroke="none"/>
    </g>
    <text x="417" y="560" text-anchor="middle" class="label-jp" font-size="72" fill="#14110E">お問い合わせ</text>
    <text x="417" y="635" text-anchor="middle" class="label-en" font-size="28" fill="#9B3A26">CONTACT</text>
    <text x="417" y="710" text-anchor="middle" class="label-small" font-size="24" fill="#6B6356">9:00 - 21:00 / 通常1時間以内に返信</text>
  </g>

  <text x="1250" y="1660" text-anchor="middle" class="label-en" font-size="20" fill="rgba(247,242,232,0.4)">ARASHIMA HOTEL / @arashima-hotel</text>
</svg>
