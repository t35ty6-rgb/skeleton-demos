<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Skeleton Inc. — デモ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f7f5f1;color:#2a2a2a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .wrap{max-width:720px;width:100%}
  h1{font-size:28px;color:#1f3a5f;margin-bottom:8px;text-align:center;font-weight:600}
  .brand{font-size:12px;letter-spacing:.2em;color:#888;text-align:center;margin-bottom:32px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  a.card{display:block;background:#fff;border-radius:12px;padding:28px 24px;text-decoration:none;color:#2a2a2a;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;border-top:4px solid #1f3a5f}
  a.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
  a.card h2{font-size:18px;color:#1f3a5f;margin-bottom:8px;font-weight:600}
  a.card p{font-size:13.5px;color:#666;line-height:1.6}
  .footer{text-align:center;margin-top:32px;color:#888;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">SKELETON INC.</div>
  <h1>提案デモ</h1>
  <div class="grid">
    <a class="card" href="hp/">
      <h2>サロン向けHP制作サンプル →</h2>
      <p>業種・コンセプト別に制作した6サイトのギャラリー</p>
    </a>
    <a class="card" href="demo/">
      <h2>予約自動通知ツール デモ →</h2>
      <p>ホットペッパー予約 → Googleカレンダー登録 + LINE通知</p>
    </a>
  </div>
  <div class="footer">お問合せ: t3.5ty6@gmail.com</div>
</div>
</body>
</html>
