<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FP相談コンパス｜AI業務支援ボット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: oklch(0.985 0.003 80);
  --paper: oklch(0.97 0.005 80);
  --paper-2: oklch(0.94 0.007 80);
  --line: oklch(0.86 0.008 80);
  --line-soft: oklch(0.92 0.005 80);
  --line-strong: oklch(0.72 0.010 80);
  --ink: oklch(0.18 0.012 250);
  --ink-2: oklch(0.30 0.010 250);
  --ink-3: oklch(0.46 0.008 250);
  --ink-4: oklch(0.62 0.006 250);
  --green: oklch(0.42 0.085 158);
  --green-deep: oklch(0.28 0.060 158);
  --green-soft: oklch(0.96 0.025 158);
  --green-mid: oklch(0.58 0.090 158);
  --green-bub: oklch(0.93 0.045 165);
  --shu: oklch(0.55 0.155 32);
  --shu-deep: oklch(0.42 0.150 32);
  --shu-soft: oklch(0.96 0.030 32);
  --amber: oklch(0.72 0.140 78);
  --amber-bg: oklch(0.96 0.045 78);
  --sky:    oklch(0.85 0.060 215);
  --sky-2:  oklch(0.75 0.080 215);
  --shadow-1: 0 1px 2px rgba(20,20,20,.04);
  --shadow-2: 0 4px 12px rgba(20,20,20,.06);
  --shadow-3: 0 18px 40px rgba(20,20,20,.12), 0 4px 12px rgba(20,20,20,.06);
}
html,body{height:100%}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  font-size: 14.5px;
  line-height: 1.75;
  letter-spacing: 0.01em;
  font-feature-settings: "palt" 1;
  background-image:
    radial-gradient(ellipse 800px 400px at 10% 0%, oklch(0.97 0.020 160 / 0.5), transparent 70%),
    radial-gradient(ellipse 600px 500px at 95% 100%, oklch(0.96 0.030 32 / 0.3), transparent 70%);
  background-attachment: fixed;
}

/* ===== Layout ===== */
.shell{ display:grid; grid-template-columns: 320px 1fr; min-height:100vh; gap:0; }
@media (max-width: 880px) { .shell{ grid-template-columns: 1fr; } }

/* ===== Sidebar ===== */
.side{
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 32px 28px 28px;
  display: flex; flex-direction: column; gap: 24px;
  position: relative;
  overflow: hidden;
}
.side::before{
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 0%, oklch(0.96 0.020 160 / 0.4) 100%);
  pointer-events: none;
}
@media (max-width: 880px) { .side{ border-right:none; border-bottom:1px solid var(--line); padding:24px 20px; } }

.brand{ position:relative; }
.brand-eyebrow{
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; letter-spacing: 0.24em;
  color: var(--shu); text-transform: uppercase; font-weight: 600;
  margin-bottom: 6px;
}
.brand-title{
  font-family: "Shippori Mincho B1", "Yu Mincho", serif;
  font-size: 26px; font-weight: 700;
  color: var(--ink); letter-spacing: 0.02em;
  line-height: 1.25;
}
.brand-sub{
  font-size: 12px; color: var(--ink-3); margin-top: 8px;
  letter-spacing: 0.04em;
}

/* キャラクター枠 */
.mascot{
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  background: var(--green-soft);
  border: 1px solid oklch(0.86 0.030 160);
  border-radius: 18px;
  padding: 20px 14px 16px;
  text-align: center;
}
.mascot-img{
  width: 140px; height: 140px;
  background: radial-gradient(circle at 35% 30%, oklch(0.85 0.040 170), oklch(0.72 0.060 178) 70%);
  border-radius: 50%;
  position: relative;
  margin-bottom: 12px;
  box-shadow: inset 0 -8px 18px oklch(0.6 0.090 178 / 0.3), 0 6px 16px oklch(0.6 0.090 178 / 0.2);
}
.mascot-img::before{
  content: ''; position:absolute; left:50%; top:-22px; transform:translateX(-50%);
  width: 36px; height: 28px;
  background:
    radial-gradient(circle at 70% 50%, oklch(0.74 0.150 100) 8px, transparent 9px) -2px -5px,
    radial-gradient(ellipse 14px 8px at 30% 60%, oklch(0.66 0.130 158), transparent 70%) 0 5px,
    radial-gradient(ellipse 14px 8px at 50% 70%, oklch(0.7 0.140 155), transparent 70%) 5px 8px;
  background-repeat: no-repeat;
}
.mascot-img::after{
  content: '$';
  position:absolute; left:50%; top:-30px; transform:translateX(-50%);
  width: 18px; height: 18px;
  background: oklch(0.78 0.150 95);
  color: oklch(0.30 0.080 80);
  border-radius: 50%;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px oklch(0.6 0.150 95 / 0.4);
}
.mascot-eyes{ position:absolute; top:42%; left:0; right:0; display:flex; justify-content:center; gap:18px; }
.mascot-eyes span{ width:14px; height:18px; background:oklch(0.20 0.050 250); border-radius:50%; position:relative; }
.mascot-eyes span::after{ content:''; position:absolute; top:3px; left:3px; width:5px; height:5px; background:#fff; border-radius:50%; }
.mascot-mouth{ position:absolute; top:60%; left:50%; transform:translateX(-50%); width:18px; height:9px; border-bottom:2px solid oklch(0.25 0.050 30); border-radius:0 0 12px 12px; }
.mascot-cheek{ position:absolute; top:55%; width:14px; height:8px; border-radius:50%; background:oklch(0.84 0.060 25 / 0.7); }
.mascot-cheek.l{ left:18%; }
.mascot-cheek.r{ right:18%; }

.mascot-name{
  font-family: "Shippori Mincho B1", serif;
  font-size: 17px; font-weight: 700;
  color: var(--green-deep);
}
.mascot-role{
  font-size: 10.5px; letter-spacing: 0.16em;
  color: var(--ink-3); margin-top: 3px; text-transform: uppercase;
  font-family: "JetBrains Mono", monospace;
}

.preset{ position:relative; z-index:1; display:flex; flex-direction:column; gap:8px; }
.preset-label{
  font-family: "JetBrains Mono", monospace;
  font-size: 10px; letter-spacing: 0.22em; color: var(--ink-4);
  text-transform: uppercase; margin-bottom: 4px;
}
.preset-btn{
  text-align: left;
  background: #fff;
  border: 1px solid var(--line);
  padding: 11px 14px;
  border-radius: 10px;
  font-family: inherit;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .15s ease;
  display: flex; align-items: center; gap: 9px;
  line-height: 1.5;
}
.preset-btn:hover{
  background: var(--green-soft);
  border-color: oklch(0.72 0.060 160);
  color: var(--green-deep);
  transform: translateX(2px);
}
.preset-btn .ico{
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  color: var(--shu);
  font-weight: 700;
  letter-spacing: 0.08em;
  flex-shrink: 0;
}

.foot{ margin-top:auto; padding-top:18px; border-top:1px solid var(--line-soft); font-size: 10.5px; color: var(--ink-4); line-height:1.7; letter-spacing:0.02em; position:relative; z-index:1; }
.foot strong{ color: var(--shu); font-weight: 700; letter-spacing: 0.1em; font-family: "JetBrains Mono", monospace; font-size: 9.5px; }

/* ===== Main chat ===== */
.main{
  display: grid; grid-template-rows: auto 1fr auto;
  background: var(--bg);
  height: 100vh;
  position: relative;
}
@media (max-width: 880px) { .main{ height:auto; min-height:60vh; } }

.topbar{
  padding: 22px 36px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--bg);
  display: flex; align-items: baseline; justify-content: space-between;
  position: relative;
}
.topbar::after{
  content:''; position:absolute; left:36px; right:36px; bottom:-1px; height:1px;
  background: linear-gradient(90deg, var(--shu) 0%, var(--shu) 60px, transparent 60px);
}
.topbar-title{
  font-family: "Shippori Mincho B1", serif;
  font-size: 18px; font-weight: 700; color: var(--ink);
  letter-spacing: 0.04em;
}
.topbar-meta{
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.14em;
}
.topbar-meta .dot{ display:inline-block; width:6px; height:6px; background:var(--green-mid); border-radius:50%; margin-right:6px; box-shadow: 0 0 0 3px oklch(0.58 0.090 158 / 0.2); animation: pulse 2s infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.5;} }

.chat{
  overflow-y: auto;
  padding: 32px 36px 24px;
  display: flex; flex-direction: column; gap: 24px;
}
.chat-empty{
  text-align: center;
  padding: 60px 20px 40px;
  color: var(--ink-3);
}
.chat-empty-mark{
  font-family: "Shippori Mincho B1", serif;
  font-size: 42px; color: oklch(0.85 0.020 160);
  margin-bottom: 18px; letter-spacing: 0.1em;
}
.chat-empty-text{
  font-family: "Shippori Mincho B1", serif;
  font-size: 15px; color: var(--ink-3); line-height: 2;
  letter-spacing: 0.06em;
}
.chat-empty-hint{
  margin-top: 22px;
  font-size: 11px; color: var(--ink-4);
  letter-spacing: 0.16em;
  font-family: "JetBrains Mono", monospace;
}

.msg{
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 14px;
  align-items: start;
  max-width: 760px;
}
.msg.user{
  grid-template-columns: 1fr 44px;
  margin-left: auto;
}
.msg-avatar{
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.msg.bot .msg-avatar{
  background: var(--green-soft);
  color: var(--green-deep);
  border: 1px solid oklch(0.82 0.040 160);
  font-family: "Shippori Mincho B1", serif;
  font-size: 18px;
}
.msg.user .msg-avatar{
  background: var(--shu-soft);
  color: var(--shu-deep);
  border: 1px solid oklch(0.82 0.060 32);
  letter-spacing: 0.04em;
}
.msg-bubble{
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 13.5px;
  line-height: 1.85;
  white-space: pre-wrap;
}
.msg.bot .msg-bubble{
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
  border-top-left-radius: 4px;
}
.msg.user .msg-bubble{
  background: var(--ink);
  color: oklch(0.96 0.005 80);
  border-top-right-radius: 4px;
  grid-column: 1;
  grid-row: 1;
}
.msg.user .msg-avatar{
  grid-column: 2;
  grid-row: 1;
}
.msg-meta{
  grid-column: 2; grid-row: 2;
  font-size: 10.5px; color: var(--ink-4);
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.08em; margin-top: 4px;
}
.msg.user .msg-meta{ grid-column: 1; text-align: right; }

.msg-typing{
  display: inline-flex; gap: 4px; align-items: center;
  padding: 4px 0;
}
.msg-typing span{
  width: 6px; height: 6px;
  background: var(--green-mid);
  border-radius: 50%;
  animation: typing 1.4s infinite;
}
.msg-typing span:nth-child(2){ animation-delay: 0.2s; }
.msg-typing span:nth-child(3){ animation-delay: 0.4s; }
@keyframes typing{
  0%, 60%, 100%{ transform: translateY(0); opacity: 0.4; }
  30%{ transform: translateY(-4px); opacity: 1; }
}

/* ===== Composer ===== */
.composer{
  border-top: 1px solid var(--line-soft);
  background: var(--paper);
  padding: 18px 36px 22px;
}
.composer-wrap{
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 4px 4px 4px 16px;
  display: flex; align-items: flex-end; gap: 8px;
  transition: border-color .2s ease;
}
.composer-wrap:focus-within{
  border-color: var(--green-mid);
  box-shadow: 0 0 0 3px oklch(0.58 0.090 158 / 0.15);
}
.composer-input{
  flex: 1;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.7;
  resize: none;
  padding: 12px 4px;
  background: transparent;
  color: var(--ink);
  min-height: 24px;
  max-height: 200px;
}
.composer-input::placeholder{ color: var(--ink-4); font-family: "Shippori Mincho B1", serif; letter-spacing: 0.04em; }

.send-btn{
  background: var(--green-deep);
  color: oklch(0.97 0.020 160);
  border: none;
  padding: 11px 18px;
  border-radius: 10px;
  font-family: "Shippori Mincho B1", serif;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.08em;
  flex-shrink: 0;
  transition: all .15s ease;
  display: flex; align-items: center; gap: 6px;
}
.send-btn:hover{ background: var(--green); transform: translateY(-1px); box-shadow: 0 4px 12px oklch(0.42 0.085 158 / 0.3); }
.send-btn:disabled{ opacity: 0.4; cursor: not-allowed; }
.send-btn::after{ content: '送る'; }
.send-btn .arrow{ font-family: "JetBrains Mono", monospace; font-size: 11px; }

.composer-hint{
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: "JetBrains Mono", monospace;
  letter-spacing: 0.14em;
  margin-top: 8px;
  text-align: right;
}
.composer-hint kbd{
  background: var(--paper-2);
  border: 1px solid var(--line);
  padding: 1px 6px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 10px;
}
</style>
</head>
<body>
<div class="shell">

  <!-- ============ サイドバー ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand-eyebrow">FP COMPASS · CHAT</div>
      <h1 class="brand-title">相談コンパス</h1>
      <div class="brand-sub">FP事業者の業務支援AI</div>
    </div>

    <div class="mascot">
      <div class="mascot-img">
        <div class="mascot-eyes"><span></span><span></span></div>
        <div class="mascot-cheek l"></div>
        <div class="mascot-cheek r"></div>
        <div class="mascot-mouth"></div>
      </div>
      <div class="mascot-name">芽吹くん</div>
      <div class="mascot-role">YOUR FINANCE PAL</div>
    </div>

    <div class="preset">
      <div class="preset-label">よく聞かれること</div>
      <button class="preset-btn" data-q="40代の主婦・子供2人(中学生・小学生) のお客様 に 教育資金 の提案 をするとき、 押さえるべきポイントは?"><span class="ico">Q.1</span>40代主婦・教育資金 提案</button>
      <button class="preset-btn" data-q="新NISA の最適な配分 を 30代会社員 (年収600万 共働き) の場合 で 教えて"><span class="ico">Q.2</span>新NISA 配分 (30代会社員)</button>
      <button class="preset-btn" data-q="50代経営者 が iDeCo・小規模企業共済 を 併用する場合 のメリット・デメリット は?"><span class="ico">Q.3</span>50代経営者 iDeCo</button>
      <button class="preset-btn" data-q="保険見直し で 「医療保険 が もう要らない」 と言うお客様 への 答え方 (引き止めるか/解約後押しか)"><span class="ico">Q.4</span>保険見直し 切返し</button>
      <button class="preset-btn" data-q="住宅ローン 変動金利 と 固定金利 の 比較資料 で 押さえるべき 数字 は 何?"><span class="ico">Q.5</span>住宅ローン 比較資料</button>
    </div>

    <div class="foot">
      <strong>POWERED BY</strong><br>
      Claude (Anthropic) · FP特化 prompt 内蔵
    </div>
  </aside>

  <!-- ============ メイン (チャット) ============ -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-title">業務 相談 — お客様 対応 サジェスト</div>
      <div class="topbar-meta"><span class="dot"></span>BOT READY</div>
    </div>

    <div class="chat" id="chat">
      <div class="chat-empty" id="empty">
        <div class="chat-empty-mark">芽</div>
        <div class="chat-empty-text">
          お客様の ご相談 内容 を 入力してください<br>
          芽吹くん が FP視点 で 答えます
        </div>
        <div class="chat-empty-hint">SAMPLE QUESTIONS — LEFT SIDE</div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-wrap">
        <textarea class="composer-input" id="input" rows="1" placeholder="例: 60代夫婦 退職後の年金繰下げ 受給戦略 を 教えて"></textarea>
        <button class="send-btn" id="send" disabled><span class="arrow">→</span></button>
      </div>
      <div class="composer-hint">
        <kbd>⌘</kbd> + <kbd>Enter</kbd> で 送信
      </div>
    </div>
  </main>
</div>

<script>
const chat = document.getElementById('chat');
const empty = document.getElementById('empty');
const input = document.getElementById('input');
const send = document.getElementById('send');

function autoresize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  send.disabled = !input.value.trim();
}
input.addEventListener('input', autoresize);

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.q;
    autoresize();
    input.focus();
  });
});

function nowLabel() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function addMessage(role, text, isTyping) {
  if (empty) empty.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'bot' ? '芽' : 'YOU';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (isTyping) {
    bubble.innerHTML = '<div class="msg-typing"><span></span><span></span><span></span></div>';
  } else {
    bubble.textContent = text;
  }
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = nowLabel();
  if (role === 'bot') {
    msg.appendChild(avatar); msg.appendChild(bubble); msg.appendChild(meta);
  } else {
    msg.appendChild(bubble); msg.appendChild(avatar); msg.appendChild(meta);
  }
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

// ★ Cloud Function URL (Firebase httpsCallable 互換 の 直 POST 形式)
const CF_URL = 'https://asia-northeast1-skeleton-fp-compass-632026.cloudfunctions.net/chatFpCounselor';

// 会話履歴 (直近 10 件 まで CF に送る)
const conversationHistory = [];

async function sendMessage() {
  const q = input.value.trim();
  if (!q) return;
  addMessage('user', q);
  conversationHistory.push({ role: 'user', content: q });
  input.value = ''; autoresize();
  send.disabled = true;
  const botBubble = addMessage('bot', '', true);
  botBubble.textContent = '…';

  try {
    // Firebase httpsCallable 互換 ペイロード
    const res = await fetch(CF_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        data: {
          message: q,
          history: conversationHistory.slice(-11, -1), // 直前の 5往復 = 10msgs
        },
      }),
    });
    const json = await res.json();
    if (!res.ok || !json?.result?.ok) {
      const errMsg = json?.error?.message || json?.result?.error || res.status;
      throw new Error(errMsg);
    }
    const reply = json.result.reply || '(空の返答)';
    botBubble.textContent = reply;
    conversationHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    botBubble.innerHTML = '<span style="color:var(--shu-deep);">⚠ 通信エラー: ' + (e.message || e) + '</span>';
    // 失敗時 は history から ロールバック
    conversationHistory.pop();
  } finally {
    send.disabled = !input.value.trim();
  }
}

send.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
