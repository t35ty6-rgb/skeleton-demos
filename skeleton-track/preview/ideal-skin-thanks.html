<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>IDEAL SKIN by Hikaru</title>
<style>
  :root {
    --bg: #0e0c0a;
    --ink: #efe7d6;
    --gold: #c9a64a;
    --gold-soft: #8e7a3f;
    --line: rgba(201, 166, 74, 0.35);
    --muted: rgba(239, 231, 214, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
    padding: 56px 28px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .mark {
    font-family: "Cormorant Garamond", "Hiragino Mincho ProN", serif;
    font-size: 11px;
    letter-spacing: 0.42em;
    color: var(--gold);
    margin-bottom: 28px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.18em;
    line-height: 1.9;
    margin: 0 0 28px;
  }
  .greet {
    font-size: 14px;
    line-height: 2;
    letter-spacing: 0.08em;
    color: var(--ink);
    margin: 0 0 36px;
  }
  .name {
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 0.12em;
  }
  .hair {
    width: 56px;
    height: 1px;
    background: var(--gold-soft);
    margin: 32px auto;
  }
  .sub {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 2;
    letter-spacing: 0.06em;
  }
  .sig {
    margin-top: 40px;
    font-family: "Cormorant Garamond", "Hiragino Mincho ProN", serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.12em;
    color: var(--gold);
  }
</style>
</head>
<body>
<main class="card">
  <div class="mark">IDEAL SKIN BY HIKARU</div>
  <h1>お仕立ての準備が<br>整いました</h1>
  <p class="greet">
    <span class="name">吉田 様</span> 様<br>
    お繋ぎいただき、ありがとうございます。
  </p>
  <div class="hair"></div>
  <p class="sub">
    今後、あなただけにお届けする<br>
    お肌のお仕立てのご案内を<br>
    LINE よりお送りいたします。
  </p>
  <div class="sig">— Hikaru</div>
</main>
</body>
</html>
