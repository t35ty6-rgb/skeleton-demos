<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>FEMOON 予約管理ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbf5f2;--paper:#fff;--ink:#3d2a2a;--ink2:#7a5d5d;--ink3:#a89090;--rose:#c89d96;--rose-deep:#a4756d;--rose-soft:#fbf0eb;--gold:#b08770;--line:#e8d8d0;--ok:#4a7a5a;--warn:#c0392b;--info:#3a6ea5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;line-height:1.7}
  .wrap{max-width:1300px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px}
  header .title{font-family:"Noto Serif JP",serif;font-size:22px;color:var(--ink);font-weight:500;letter-spacing:.05em;margin:0}
  header .title .badge{display:inline-block;background:var(--rose-deep);color:#fff;font-size:11px;padding:3px 10px;border-radius:3px;margin-left:10px;letter-spacing:.1em;vertical-align:middle;font-family:"Cormorant Garamond",serif;font-weight:600}
  header .actions{display:flex;gap:8px;align-items:center}
  .btn{background:var(--rose-deep);color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500}
  .btn:hover{background:#7a5651}
  .btn.alt{background:#fff;color:var(--rose-deep);border:1px solid var(--rose-deep)}

  /* KPI */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .kpi{background:var(--paper);border-radius:8px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-top:3px solid var(--rose-deep)}
  .kpi .l{font-family:"Cormorant Garamond",serif;font-size:11px;letter-spacing:.2em;color:var(--ink2);text-transform:uppercase;margin-bottom:6px}
  .kpi .v{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;color:var(--rose-deep);line-height:1}
  .kpi .v small{font-size:13px;color:var(--ink2);margin-left:4px;font-weight:400}
  .kpi.green{border-top-color:var(--ok)} .kpi.green .v{color:var(--ok)}
  .kpi.gold{border-top-color:var(--gold)} .kpi.gold .v{color:var(--gold)}

  /* Tabs */
  .tabs{display:flex;gap:2px;background:var(--paper);border-radius:8px 8px 0 0;border-bottom:1px solid var(--line);padding:0 8px;margin-bottom:0}
  .tab{padding:14px 22px;cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:500;letter-spacing:.05em;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--rose-deep);border-bottom-color:var(--rose-deep)}
  .tab:hover{color:var(--ink)}

  /* Panel */
  .panel{background:var(--paper);border-radius:0 0 8px 8px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.04);min-height:400px}
  .panel.hidden{display:none}

  /* Table */
  table.list{width:100%;border-collapse:collapse;font-size:13px}
  table.list th,table.list td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
  table.list th{background:var(--rose-soft);font-weight:600;color:var(--rose-deep);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-family:"Cormorant Garamond",serif}
  table.list tr:hover td{background:#fafafa}
  table.list td.num{font-family:"Cormorant Garamond",serif;font-weight:500}
  table.list td.price{color:var(--rose-deep);font-weight:600;font-family:"Cormorant Garamond",serif}
  table.list td.status select{padding:4px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;background:#fff;cursor:pointer}
  table.list td.notes{color:var(--ink2);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status-tag{display:inline-block;padding:2px 10px;border-radius:11px;font-size:11px;font-weight:500;letter-spacing:.05em}
  .status-tag.受付済{background:#fff4e6;color:#7a4a16}
  .status-tag.確定{background:#e3f2fd;color:#1565c0}
  .status-tag.完了{background:#eaf3eb;color:#2e7d32}
  .status-tag.キャンセル{background:#fdecea;color:#c0392b}

  /* Filter */
  .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid var(--line);border-radius:4px;font-size:13px;background:#fff;font-family:inherit}

  /* Calendar view */
  .cal-wrap{margin-top:8px}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--rose-soft);border-radius:4px 4px 0 0;padding:8px 0}
  .cal-head>div{text-align:center;font-family:"Cormorant Garamond",serif;font-size:12px;letter-spacing:.1em;color:var(--rose-deep);font-weight:600}
  .cal-head>div.sat{color:var(--info)}
  .cal-head>div.sun{color:var(--warn)}
  .cal-body{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-radius:0 0 4px 4px}
  .cal-cell{background:#fff;min-height:100px;padding:6px 8px}
  .cal-cell.other{background:#fafafa;opacity:.5}
  .cal-cell.today{background:#fffaf6;border:1px solid var(--rose)}
  .cal-cell .d{font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--ink);font-size:13px;margin-bottom:4px}
  .cal-cell .d.sat{color:var(--info)} .cal-cell .d.sun{color:var(--warn)}
  .cal-cell .ev{background:var(--rose-soft);border-left:3px solid var(--rose-deep);padding:3px 6px;font-size:11px;margin:2px 0;border-radius:2px;cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-cell .ev:hover{background:var(--rose);color:#fff}
  .cal-cell .ev .t{font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--rose-deep);margin-right:4px}
  .cal-cell .ev:hover .t{color:#fff}

  /* Summary */
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .summary-card{background:var(--rose-soft);padding:18px 22px;border-radius:6px}
  .summary-card h3{font-family:"Noto Serif JP",serif;margin:0 0 12px;font-size:15px;color:var(--rose-deep)}
  .bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .bar-row .label{width:120px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .bar{flex:1;height:18px;background:rgba(164,117,109,.15);border-radius:2px;overflow:hidden}
  .bar-row .bar>div{height:100%;background:var(--rose-deep)}
  .bar-row .val{width:50px;text-align:right;font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--rose-deep)}

  /* Setup */
  .setup{background:var(--paper);max-width:500px;margin:80px auto;padding:32px 36px;border-radius:8px;box-shadow:0 4px 30px rgba(0,0,0,.08);text-align:center}
  .setup h1{font-family:"Noto Serif JP",serif;font-size:22px;color:var(--ink);margin:0 0 14px;letter-spacing:.05em}
  .setup p{color:var(--ink2);font-size:13.5px;margin-bottom:20px}
  .setup input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:14px;font-family:Menlo,monospace}
  .setup .btn{width:100%;padding:13px;font-size:14px}

  .loading{text-align:center;padding:40px;color:var(--ink2)}
  .empty{text-align:center;padding:40px;color:var(--ink3);font-style:italic}

  @media(max-width:900px){
    .kpi-row{grid-template-columns:repeat(2,1fr)}
    .summary-grid{grid-template-columns:1fr}
    table.list{font-size:12px}
    .cal-cell{min-height:60px;padding:4px}
    .cal-cell .ev{font-size:9.5px}
  }
</style>
</head>
<body>

<!-- 認証セットアップ画面 -->
<div id="setup" class="setup" style="display:none">
  <h1>🌙 FEMOON 管理ダッシュボード</h1>
  <p>アクセストークンを入力してください<br><span style="font-size:11px;color:#a89090">(初回のみ。次回からはブラウザに保存されます)</span></p>
  <input type="password" id="token-input" placeholder="アクセストークン">
  <button class="btn" onclick="saveToken()">ログイン</button>
</div>

<!-- メイン画面 -->
<div class="wrap" id="main" style="display:none">
  <header>
    <h1 class="title">🌙 FEMOON 予約管理 <span class="badge">DASHBOARD</span></h1>
    <div class="actions">
      <button class="btn alt" onclick="reload()">↻ 更新</button>
      <button class="btn alt" onclick="logout()">ログアウト</button>
    </div>
  </header>

  <div class="kpi-row">
    <div class="kpi"><div class="l">本日の予約</div><div class="v" id="kpi-today">—<small>件</small></div></div>
    <div class="kpi green"><div class="l">今週の予約</div><div class="v" id="kpi-week">—<small>件</small></div></div>
    <div class="kpi gold"><div class="l">今月の予約</div><div class="v" id="kpi-month">—<small>件</small></div></div>
    <div class="kpi"><div class="l">今月の売上</div><div class="v" id="kpi-revenue">—<small>円</small></div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="list">予約リスト</div>
    <div class="tab" data-tab="cal">カレンダー</div>
    <div class="tab" data-tab="summary">月次サマリー</div>
  </div>

  <!-- 予約リスト -->
  <div class="panel" data-panel="list">
    <div class="filter-bar">
      <select id="filter-status">
        <option value="">全ステータス</option>
        <option value="受付済">受付済</option>
        <option value="確定">確定</option>
        <option value="完了">完了</option>
        <option value="キャンセル">キャンセル</option>
      </select>
      <select id="filter-period">
        <option value="upcoming">これから (本日以降)</option>
        <option value="today">今日</option>
        <option value="week">今週</option>
        <option value="month">今月</option>
        <option value="all">全期間</option>
      </select>
      <input type="text" id="filter-search" placeholder="お名前・電話で検索">
    </div>
    <div id="list-content"><div class="loading">読み込み中...</div></div>
  </div>

  <!-- カレンダー -->
  <div class="panel hidden" data-panel="cal">
    <div class="filter-bar">
      <button class="btn alt" onclick="changeMonth(-1)">‹ 先月</button>
      <div id="cal-month-label" style="font-family:'Noto Serif JP',serif;font-size:16px;color:var(--ink);font-weight:500;flex:1;text-align:center">—</div>
      <button class="btn alt" onclick="changeMonth(1)">翌月 ›</button>
      <button class="btn alt" onclick="goToday()">今月</button>
    </div>
    <div class="cal-wrap">
      <div class="cal-head"><div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div></div>
      <div class="cal-body" id="cal-body"></div>
    </div>
  </div>

  <!-- 月次サマリー -->
  <div class="panel hidden" data-panel="summary">
    <div class="summary-grid">
      <div class="summary-card">
        <h3>月別 予約件数</h3>
        <div id="summary-monthly"></div>
      </div>
      <div class="summary-card">
        <h3>コース別 内訳 (今月)</h3>
        <div id="summary-course"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzrj27u5Wcs9Vl0CigKDJUbfo6q6oUFwCBEJEzI6P-iFYwuYj3JoZza-oml_DWGBTJMHA/exec';
let TOKEN = localStorage.getItem('femoon-admin-token') || '';
let DATA = [];
let CAL_DATE = new Date();

if(!TOKEN){
  document.getElementById('setup').style.display='block';
} else {
  bootMain();
}

function saveToken(){
  TOKEN = document.getElementById('token-input').value.trim();
  if(!TOKEN){return}
  localStorage.setItem('femoon-admin-token', TOKEN);
  document.getElementById('setup').style.display='none';
  bootMain();
}
function logout(){
  localStorage.removeItem('femoon-admin-token');
  location.reload();
}

async function bootMain(){
  document.getElementById('main').style.display='block';
  await fetchData();
}

async function fetchData(){
  document.getElementById('list-content').innerHTML = '<div class="loading">読み込み中...</div>';
  try{
    const r = await fetch(`${GAS_URL}?action=list&token=${encodeURIComponent(TOKEN)}`);
    const j = await r.json();
    if(!j.ok){
      if(j.error==='unauthorized'){
        alert('トークンが正しくありません');
        logout();
        return;
      }
      throw new Error(j.error||'failed');
    }
    DATA = j.rows;
    renderAll();
  }catch(e){
    document.getElementById('list-content').innerHTML = '<div class="empty">読み込み失敗: '+e.message+'</div>';
  }
}
function reload(){ fetchData(); }

function parseDate(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  return new Date(v);
}
function fmtJ(d){
  if(!d) return '—';
  return `${d.getMonth()+1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`;
}
function renderAll(){
  renderKPI();
  renderList();
  renderCal();
  renderSummary();
}

function renderKPI(){
  const today = new Date(); today.setHours(0,0,0,0);
  const weekEnd = new Date(today); weekEnd.setDate(today.getDate()+7);
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth()+1, 1);
  let tCnt=0, wCnt=0, mCnt=0, mRev=0;
  DATA.forEach(r=>{
    const d = parseDate(r['希望日']);
    if(!d) return;
    if(d.getTime()===today.getTime()) tCnt++;
    if(d>=today && d<weekEnd) wCnt++;
    if(d>=monthStart && d<monthEnd){ mCnt++; mRev += Number(r['料金'])||0; }
  });
  document.getElementById('kpi-today').innerHTML = tCnt+'<small>件</small>';
  document.getElementById('kpi-week').innerHTML = wCnt+'<small>件</small>';
  document.getElementById('kpi-month').innerHTML = mCnt+'<small>件</small>';
  document.getElementById('kpi-revenue').innerHTML = '¥'+mRev.toLocaleString();
}

function applyFilter(){
  const status = document.getElementById('filter-status').value;
  const period = document.getElementById('filter-period').value;
  const search = document.getElementById('filter-search').value.trim().toLowerCase();
  const today = new Date(); today.setHours(0,0,0,0);
  return DATA.filter(r=>{
    if(status && r['状態']!==status) return false;
    const d = parseDate(r['希望日']);
    if(d){
      if(period==='today' && d.getTime()!==today.getTime()) return false;
      else if(period==='week'){const we=new Date(today);we.setDate(today.getDate()+7);if(d<today||d>=we)return false;}
      else if(period==='month'){if(d.getMonth()!==today.getMonth()||d.getFullYear()!==today.getFullYear())return false;}
      else if(period==='upcoming' && d<today) return false;
    }
    if(search){
      const blob = ((r['お名前']||'')+' '+(r['電話']||'')+' '+(r['フリガナ']||'')).toLowerCase();
      if(!blob.includes(search)) return false;
    }
    return true;
  });
}

function renderList(){
  const rows = applyFilter();
  if(rows.length===0){
    document.getElementById('list-content').innerHTML = '<div class="empty">該当する予約がありません</div>';
    return;
  }
  rows.sort((a,b)=>{
    const da = parseDate(a['希望日'])||new Date(0);
    const db = parseDate(b['希望日'])||new Date(0);
    if(da.getTime()!==db.getTime()) return da-db;
    return (a['時間']||'').localeCompare(b['時間']||'');
  });
  let html = '<table class="list"><thead><tr><th>予約ID</th><th>日付</th><th>時間</th><th>コース</th><th>お名前</th><th>電話</th><th>来店</th><th>料金</th><th>ご要望</th><th>状態</th></tr></thead><tbody>';
  rows.forEach(r=>{
    const d = parseDate(r['希望日']);
    const status = r['状態']||'受付済';
    html += `<tr>
      <td class="num">${r['予約ID']||'-'}</td>
      <td>${fmtJ(d)}</td>
      <td class="num">${r['時間']||'-'}</td>
      <td>${r['コース名']||'-'} <small style="color:#a89090">(${r['所要時間']||'?'}分)</small></td>
      <td>${r['お名前']||'-'}</td>
      <td>${r['電話']||'-'}</td>
      <td>${r['来店回数']||'-'}</td>
      <td class="price">¥${Number(r['料金']||0).toLocaleString()}</td>
      <td class="notes" title="${(r['ご要望']||'').replace(/"/g,'&quot;')}">${r['ご要望']||''}</td>
      <td class="status"><select onchange="updateStatus('${r['予約ID']}',this.value)">
        <option ${status==='受付済'?'selected':''}>受付済</option>
        <option ${status==='確定'?'selected':''}>確定</option>
        <option ${status==='完了'?'selected':''}>完了</option>
        <option ${status==='キャンセル'?'selected':''}>キャンセル</option>
      </select></td>
    </tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('list-content').innerHTML = html;
}
['filter-status','filter-period','filter-search'].forEach(id=>{
  setTimeout(()=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', renderList);
    if(el && id==='filter-search') el.addEventListener('input', renderList);
  },100);
});

async function updateStatus(id, status){
  try{
    await fetch(`${GAS_URL}?action=update&id=${encodeURIComponent(id)}&status=${encodeURIComponent(status)}&token=${encodeURIComponent(TOKEN)}`);
    const row = DATA.find(r=>r['予約ID']===id);
    if(row) row['状態'] = status;
    renderKPI();
  }catch(e){alert('更新失敗: '+e.message)}
}

function renderCal(){
  const y = CAL_DATE.getFullYear(), m = CAL_DATE.getMonth();
  document.getElementById('cal-month-label').textContent = `${y}年${m+1}月`;
  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);
  const start = new Date(first); start.setDate(1-first.getDay());
  const today = new Date(); today.setHours(0,0,0,0);
  const body = document.getElementById('cal-body');
  body.innerHTML = '';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const isOther = d.getMonth()!==m;
    const isToday = d.getTime()===today.getTime();
    const wd = d.getDay();
    const cls = ['cal-cell'];
    if(isOther) cls.push('other');
    if(isToday) cls.push('today');
    const dCls = wd===6?'sat':wd===0?'sun':'';
    const evs = DATA.filter(r=>{
      const pd = parseDate(r['希望日']);
      return pd && pd.getFullYear()===d.getFullYear() && pd.getMonth()===d.getMonth() && pd.getDate()===d.getDate() && r['状態']!=='キャンセル';
    });
    evs.sort((a,b)=>(a['時間']||'').localeCompare(b['時間']||''));
    let html = `<div class="${cls.join(' ')}"><div class="d ${dCls}">${d.getDate()}</div>`;
    evs.slice(0,3).forEach(r=>{
      const short = (r['お名前']||'').split(' ')[0]||'予約';
      html += `<div class="ev" title="${r['時間']||''} ${r['コース名']||''} / ${r['お名前']||''} ${r['電話']||''}"><span class="t">${r['時間']||''}</span>${short}</div>`;
    });
    if(evs.length>3) html += `<div style="font-size:10px;color:#a89090;text-align:center;margin-top:2px">+${evs.length-3}件</div>`;
    html += '</div>';
    body.insertAdjacentHTML('beforeend', html);
  }
}
function changeMonth(d){ CAL_DATE = new Date(CAL_DATE.getFullYear(),CAL_DATE.getMonth()+d,1); renderCal(); }
function goToday(){ CAL_DATE = new Date(); renderCal(); }

function renderSummary(){
  const monthly = {};
  const courses = {};
  const thisMonth = new Date(); thisMonth.setHours(0,0,0,0);
  DATA.forEach(r=>{
    const d = parseDate(r['希望日']);
    if(!d || r['状態']==='キャンセル') return;
    const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    monthly[ym] = monthly[ym] || {cnt:0, rev:0};
    monthly[ym].cnt++;
    monthly[ym].rev += Number(r['料金'])||0;
    if(d.getFullYear()===thisMonth.getFullYear() && d.getMonth()===thisMonth.getMonth()){
      const c = r['コース名']||'(未分類)';
      courses[c] = (courses[c]||0) + 1;
    }
  });
  const maxCnt = Math.max(1, ...Object.values(monthly).map(v=>v.cnt));
  let mh = '';
  Object.keys(monthly).sort().reverse().slice(0,12).forEach(k=>{
    const v = monthly[k];
    mh += `<div class="bar-row"><div class="label">${k}</div><div class="bar"><div style="width:${v.cnt/maxCnt*100}%"></div></div><div class="val">${v.cnt}件</div></div>`;
    mh += `<div class="bar-row"><div class="label"></div><div style="flex:1;color:#a89090;font-size:11px">¥${v.rev.toLocaleString()}</div></div>`;
  });
  document.getElementById('summary-monthly').innerHTML = mh || '<div class="empty">データなし</div>';

  const maxCourse = Math.max(1, ...Object.values(courses));
  let ch = '';
  Object.entries(courses).sort((a,b)=>b[1]-a[1]).forEach(([name,cnt])=>{
    ch += `<div class="bar-row"><div class="label" title="${name}">${name}</div><div class="bar"><div style="width:${cnt/maxCourse*100}%"></div></div><div class="val">${cnt}件</div></div>`;
  });
  document.getElementById('summary-course').innerHTML = ch || '<div class="empty">今月の予約なし</div>';
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const name = t.dataset.tab;
    document.querySelectorAll('.panel').forEach(p=>{
      p.classList.toggle('hidden', p.dataset.panel!==name);
    });
  });
});
</script>
</body>
</html>
