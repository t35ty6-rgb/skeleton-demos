<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MapsLeads · サイト案 8 style プレビュー (owner 確認 用)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mockup.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="side-head">
          <div class="side-brand">MapsLeads</div>
          <div class="side-sub">サイト案 プレビュー v1.0.0</div>
        </div>
        <div class="side-hint">
          <strong>owner 確認 用 プレビュー</strong>。 サンプル 5 店舗 と 8 style を 触って 「客 に 出せる 品質 か」 判定 して ください。 style chip を 手動 で 切替 も 可能。
        </div>
        <div class="style-picker">
          <div class="sp-label">デザイン スタイル (店 選択 で 業種 に 応じて 自動選択、 手動 切替 可)</div>
          <div class="sp-grid" id="stylePickerGrid">
            <button class="sp-chip" data-style="A" title="Signature (BtoB SaaS / 医療)">A · Signature</button>
            <button class="sp-chip" data-style="B" title="Luxury Black×Gold (高級 salon/エステ)">B · Luxury</button>
            <button class="sp-chip" data-style="C" title="White Minimal (医療/歯科)">C · Minimal</button>
            <button class="sp-chip" data-style="D" title="Warm Cream (カフェ/古民家)">D · Warm</button>
            <button class="sp-chip" data-style="E" title="和 Kimono (日本料理/着物)">E · 和</button>
            <button class="sp-chip" data-style="F" title="Editorial Deep Teal (ブランディング)">F · Editorial</button>
            <button class="sp-chip" data-style="G" title="Pastel Pink (ネイル/まつげ)">G · Pastel</button>
            <button class="sp-chip" data-style="H" title="Photo Bold (ジム/大衆)">H · Bold</button>
          </div>
        </div>
        <div class="side-list" id="storeList"></div>
        <div class="side-foot">
          <button class="btn-print" id="btnPrint">🖨 印刷 / PDF 保存</button>
          <div class="side-foot-note">現在 表示中 の サイト案 だけ を A4 で 印刷 します。</div>
        </div>
      </aside>

      <main class="main" id="main">
        <div class="empty" id="emptyState">
          <div class="empty-emoji">👈</div>
          <div class="empty-title">左 の 店舗 を 選んでください</div>
          <div class="empty-sub">選ぶ と、そのお店 用 の 1ページ サイト案 を 生成 します。</div>
        </div>
        <div class="preview" id="preview" hidden></div>
      </main>
    </div>

    <script>
      // 5 サンプル 店 (design-reviewer 検証 時 と 同じ データ)
      window.SAMPLE_ROWS = [
        { name: "SALON LUMIÈRE", category: "美容室", area: "福井市中央", phone: "0776-12-3456", addressFull: "福井県福井市中央1-2-3", hours: "10:00-20:00", rating: "4.8", reviewCount: "124" },
        { name: "銀座 天寿司", category: "寿司 · 日本料理", area: "福井市大手", phone: "0776-22-4567", addressFull: "福井県福井市大手2-4-5", hours: "17:00-23:00", rating: "4.7", reviewCount: "89" },
        { name: "cafe ainu", category: "カフェ", area: "福井市松本", phone: "0776-33-5678", addressFull: "福井県福井市松本3-5-7", hours: "9:00-18:00", rating: "4.6", reviewCount: "203" },
        { name: "Bloom Nail", category: "ネイルサロン", area: "福井市中央", phone: "0776-44-6789", addressFull: "福井県福井市中央4-6-8", hours: "10:00-19:00", rating: "4.9", reviewCount: "156" },
        { name: "STRONG FIT", category: "パーソナルジム", area: "福井市西木田", phone: "0776-55-7890", addressFull: "福井県福井市西木田5-7-9", hours: "6:00-23:00", rating: "4.7", reviewCount: "78" }
      ];
    </script>
    <script src="mockup.js"></script>
  </body>
</html>
