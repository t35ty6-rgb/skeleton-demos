<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEAL SKIN | 投稿管理 (Hikaru版 SaaS モック)</title>
<style>
:root {
  --black: #0E0B09;
  --black-soft: #15110D;
  --paper: #F5F0E6;
  --gold: #C5A472;
  --gold-deep: #8E703F;
  --gold-faint: rgba(197,164,114,0.25);
  --line: rgba(245,240,230,0.12);
  --text: #F5F0E6;
  --muted: rgba(245,240,230,0.55);
  --reel: #C5A472;
  --story: #B89172;
  --threads: #9A9685;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--black); color: var(--text); font-family: 'Shippori Mincho', 'Noto Serif JP', serif; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; }

/* ── header ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 32px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--black-soft), var(--black));
}
.brand { display: flex; align-items: center; gap: 16px; }
.brand-mark {
  font-family: 'Cinzel', serif; font-weight: 500; letter-spacing: 4px;
  font-size: 14px; color: var(--gold);
}
.brand-divider { width: 1px; height: 16px; background: var(--gold-faint); }
.brand-app { font-size: 13px; color: var(--muted); letter-spacing: 2px; }

.topbar-nav { display: flex; gap: 26px; }
.topbar-nav a {
  color: var(--text); text-decoration: none; font-size: 12px;
  letter-spacing: 2px; padding: 6px 2px; border-bottom: 1px solid transparent;
}
.topbar-nav a.active { border-bottom-color: var(--gold); color: var(--gold); }
.topbar-meta { display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px;}

/* ── layout ── */
.app { flex: 1; display: grid; grid-template-columns: 360px 1fr; min-height: 0; }

/* ── left: topic list ── */
.sidebar {
  background: var(--black-soft); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.sidebar-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.sidebar-title { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; color: var(--gold); }
.sidebar-sub { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.search { width: 100%; margin-top: 10px; padding: 8px 12px; background: var(--black); color: var(--text);
  border: 1px solid var(--line); font-family: inherit; font-size: 12px; outline: none; }
.search:focus { border-color: var(--gold-faint); }
.filter-tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.filter-tab { padding: 4px 10px; font-size: 10px; letter-spacing: 1px; color: var(--muted);
  border: 1px solid var(--line); cursor: pointer; background: transparent; font-family: inherit; }
.filter-tab.active { color: var(--gold); border-color: var(--gold-faint); }

.topic-list { overflow-y: auto; flex: 1; }
.topic-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 22px; border-bottom: 1px solid var(--line); cursor: pointer;
  transition: background .15s;
}
.topic-row:hover { background: rgba(197,164,114,0.04); }
.topic-row.selected { background: rgba(197,164,114,0.08); border-left: 2px solid var(--gold); padding-left: 20px; }
.topic-mark { font-size: 13px; color: var(--gold); width: 16px; flex-shrink: 0; padding-top: 2px; }
.topic-title { font-size: 12.5px; line-height: 1.55; color: var(--text); }
.topic-row.has-script .topic-title::before {
  content: "✓ "; color: var(--gold); font-weight: bold;
}

/* ── right: detail ── */
.detail { display: flex; flex-direction: column; min-height: 0; }
.detail-head { padding: 22px 32px 16px; border-bottom: 1px solid var(--line); background: var(--black-soft); }
.breadcrumb { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
.detail-title { font-size: 24px; font-weight: 400; letter-spacing: 1px; line-height: 1.35; }
.detail-meta { display: flex; gap: 18px; margin-top: 12px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
.detail-meta b { color: var(--gold); font-weight: 400; }

.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 32px; background: var(--black-soft); }
.tab {
  padding: 14px 22px; font-size: 12px; letter-spacing: 3px; cursor: pointer;
  color: var(--muted); border-bottom: 2px solid transparent; font-family: 'Cinzel', serif;
}
.tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab .tag { display: inline-block; font-size: 8px; padding: 2px 6px; margin-left: 8px;
  background: var(--gold-faint); color: var(--gold); border-radius: 2px; letter-spacing: 0; }

.tab-body { flex: 1; overflow-y: auto; padding: 26px 32px; }

/* ── reel rendering ── */
.section { margin-bottom: 28px; }
.section-title {
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px; color: var(--gold);
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--gold-faint);
}
.cover-card {
  background: var(--black-soft); border: 1px solid var(--gold-faint);
  padding: 24px; display: flex; gap: 24px; align-items: center;
}
.cover-art {
  width: 120px; height: 213px; flex-shrink: 0; background: var(--black);
  border: 1px solid var(--gold-faint); display: flex; align-items: center; justify-content: center;
  font-family: 'Shippori Mincho', serif; font-size: 18px; color: var(--gold); text-align: center;
  padding: 12px; line-height: 1.4; letter-spacing: 2px;
}
.cover-meta { font-size: 12px; line-height: 1.8; color: var(--text); }
.cover-meta dt { color: var(--muted); font-size: 10px; letter-spacing: 1px; margin-top: 6px; }
.cover-meta dd { margin-bottom: 4px; }

.scene-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.scene-table th, .scene-table td { text-align: left; padding: 14px 16px; vertical-align: top; border-bottom: 1px solid var(--line); }
.scene-table th { background: var(--black-soft); color: var(--gold); font-weight: 400; letter-spacing: 1px; font-size: 10px; text-transform: uppercase;}
.scene-table .t { color: var(--gold); width: 80px; font-family: 'Cormorant Garamond', serif; font-size: 13px;}
.scene-table .label { width: 140px; color: var(--muted); font-size: 11px; }
.scene-table .lines { line-height: 1.7; }
.scene-table .telop { color: var(--gold-deep); font-size: 11px; margin-top: 6px; font-style: italic;}

.tag-line { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.8;}

/* ── story rendering ── */
.story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.story-slide { background: var(--black-soft); border: 1px solid var(--line); padding: 20px 16px; min-height: 280px;
  display: flex; flex-direction: column; justify-content: space-between; }
.story-slide .num { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 11px; letter-spacing: 1px; }
.story-slide .type { font-size: 9px; color: var(--muted); letter-spacing: 2px; margin-top: 4px; text-transform: uppercase; }
.story-slide .txt { font-size: 13px; line-height: 1.7; margin: 16px 0; white-space: pre-line; }
.story-slide .design { font-size: 10px; color: var(--gold-deep); margin-top: auto; font-style: italic; line-height: 1.5; }

/* ── threads rendering ── */
.threads-thread { max-width: 580px; }
.threads-post { background: var(--black-soft); border: 1px solid var(--line); padding: 18px 22px; margin-bottom: 10px;
  position: relative; }
.threads-post .num { position: absolute; top: 16px; right: 18px; font-family: 'Cormorant Garamond', serif;
  color: var(--gold); font-size: 13px; letter-spacing: 1px; }
.threads-post .text { font-size: 13.5px; line-height: 1.8; white-space: pre-line; }

/* ── empty ── */
.empty-state { text-align: center; padding: 80px 32px; color: var(--muted); }
.empty-state h3 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; letter-spacing: 3px; margin-bottom: 16px; }
.empty-state p { font-size: 12.5px; line-height: 1.8; }
.empty-state .gen-btn { margin-top: 24px; padding: 12px 32px; background: transparent;
  border: 1px solid var(--gold); color: var(--gold); font-family: 'Cinzel', serif; letter-spacing: 3px;
  font-size: 11px; cursor: pointer; }
.empty-state .gen-btn:hover { background: var(--gold-faint); }

/* ── footer KPI bar ── */
.kpi-bar {
  display: flex; gap: 32px; padding: 14px 32px; border-top: 1px solid var(--line);
  background: var(--black-soft); font-size: 11px; color: var(--muted); letter-spacing: 1px;
}
.kpi-bar b { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 14px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}

/* ── DAILY view ── */
.daily-view { padding: 40px 56px; max-width: 1080px; margin: 0 auto; }
.daily-head {
  border: 1px solid var(--gold-faint); padding: 28px 32px; margin-bottom: 32px;
  background: linear-gradient(180deg, var(--black-soft), var(--black));
  position: relative;
}
.daily-head .badge {
  position: absolute; top: -10px; left: 32px;
  background: var(--gold); color: var(--black);
  padding: 4px 14px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 4px;
}
.daily-head h1 { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 5px; color: var(--gold); margin-bottom: 12px;}
.daily-head .date { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: var(--text); letter-spacing: 2px; font-weight: 300;}
.daily-head .date .weekday { color: var(--gold-deep); font-size: 18px; margin-left: 12px;}
.daily-head .summary {
  font-size: 14px; color: var(--text); margin-top: 18px; line-height: 1.8;
  padding: 14px 16px; background: var(--black); border-left: 2px solid var(--gold);
}
.daily-head .meta { display: flex; gap: 24px; margin-top: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px;}
.daily-head .meta b { color: var(--gold); font-family: 'Cormorant Garamond', serif; font-size: 14px;}

.daily-proposals { display: flex; flex-direction: column; gap: 24px;}
.proposal {
  background: var(--black-soft); border: 1px solid var(--line); padding: 0;
  border-left: 4px solid var(--gold);
  transition: border-left-color .2s;
  overflow: hidden;
}
.proposal.adopted { border-left-color: #6BB87A; opacity: 0.85;}
.proposal.skipped { border-left-color: #555; opacity: 0.5;}

.proposal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 28px; background: var(--black); border-bottom: 1px solid var(--line);
}
.proposal .rank {
  font-family: 'Cinzel', serif; color: var(--gold); font-size: 12px; letter-spacing: 4px;
  display: flex; align-items: center; gap: 12px;
}
.proposal .rank::before {
  content: ""; display: inline-block; width: 32px; height: 32px;
  background: var(--gold); color: var(--black);
  font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400;
  text-align: center; line-height: 32px; letter-spacing: 0;
}
.proposal[data-rank="1"] .rank::before { content: "1"; }
.proposal[data-rank="2"] .rank::before { content: "2"; }
.proposal[data-rank="3"] .rank::before { content: "3"; }
.proposal-status { font-size: 10px; letter-spacing: 2px; color: var(--muted); font-family: 'Cinzel', serif;}
.proposal.adopted .proposal-status { color: #6BB87A; }
.proposal.skipped .proposal-status { color: #888; }

.proposal-body { padding: 24px 28px;}

.news-block {
  margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line);
}
.news-block .label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 8px;
}
.news-block .news-title {
  font-size: 16px; line-height: 1.55; color: var(--text); margin-bottom: 8px;
}
.news-block .news-source {
  font-size: 11px; color: var(--muted); letter-spacing: 1px;
}
.news-block .news-source a { color: var(--gold-deep); text-decoration: none; margin-left: 8px;}
.news-block .news-source a:hover { color: var(--gold); text-decoration: underline;}

.cross-block { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--line);}
.cross-arrow {
  text-align: center; font-family: 'Cormorant Garamond', serif; color: var(--gold);
  font-size: 24px; margin: -8px 0 10px; letter-spacing: 8px;
}
.cross-block .label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 8px;
}
.linked {
  font-size: 14px; color: var(--text); padding: 14px 16px;
  background: var(--black); border: 1px solid var(--gold-faint);
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.linked:hover { background: rgba(197,164,114,0.08); border-color: var(--gold);}
.linked .id { color: var(--gold); font-family: 'Cormorant Garamond', serif; margin-right: 12px; font-size: 16px;}
.linked .open-hint { font-size: 10px; color: var(--muted); letter-spacing: 1px;}

.angle-block { margin-bottom: 18px; }
.angle-block .label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 8px;
}
.angle-text { font-size: 13px; line-height: 1.8; color: var(--muted);}

.hook-block { margin-bottom: 18px;}
.hook-block .label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
.hook-block .copy-btn {
  background: transparent; border: 1px solid var(--gold-faint); color: var(--gold);
  padding: 4px 10px; font-size: 9px; letter-spacing: 1px; cursor: pointer; font-family: 'Cinzel', serif;
}
.hook-block .copy-btn:hover { background: var(--gold-faint); }
.hook-block .copy-btn.copied { background: #6BB87A; border-color: #6BB87A; color: var(--black);}
.hook {
  background: var(--black); padding: 18px 20px; border-left: 3px solid var(--gold);
  font-size: 17px; line-height: 1.7; color: var(--text); font-family: 'Shippori Mincho', serif;
}

.why-block { margin-bottom: 20px;}
.why-block .label {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 8px;
}
.why-text { font-size: 12.5px; line-height: 1.8; color: var(--muted); font-style: italic;}

.proposal-actions {
  margin: 0; padding: 16px 28px; background: var(--black);
  border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-end;
}
.proposal-actions button, .proposal-actions a.btn {
  padding: 10px 18px; background: transparent; border: 1px solid var(--gold-faint);
  color: var(--gold); font-family: 'Cinzel', serif; letter-spacing: 2px; font-size: 10px;
  cursor: pointer; transition: all .15s; text-decoration: none; display: inline-block;
}
.proposal-actions button:hover, .proposal-actions a.btn:hover { background: var(--gold-faint); }
.proposal-actions button.primary, .proposal-actions a.btn.primary { background: var(--gold); color: var(--black);}
.proposal-actions button.primary:hover, .proposal-actions a.btn.primary:hover { background: var(--gold-deep); color: var(--paper); }
.proposal-actions button.skip { color: var(--muted); border-color: var(--line);}

.daily-empty { text-align: center; padding: 100px 30px; color: var(--muted); }
.daily-empty h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 14px; letter-spacing: 4px; margin-bottom: 18px;}
.daily-empty p { font-size: 13px; line-height: 1.9; max-width: 540px; margin: 0 auto;}
.daily-empty code { background: var(--black-soft); padding: 2px 8px; color: var(--gold); }
.daily-loading { text-align: center; padding: 80px 30px; color: var(--muted); font-size: 12px; letter-spacing: 2px;}
.daily-error { text-align: center; padding: 40px 30px; color: #c97a7a; font-size: 13px; line-height: 1.8;}

/* ── help guide ── */
.help-bar {
  background: var(--black-soft); border: 1px solid var(--gold-faint);
  padding: 18px 24px; margin-bottom: 24px; font-size: 12.5px; line-height: 1.8;
  position: relative;
}
.help-bar h3 {
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 4px;
  color: var(--gold); margin-bottom: 10px;
}
.help-bar ol { padding-left: 22px; color: var(--text);}
.help-bar ol li { margin-bottom: 6px;}
.help-bar ol li b { color: var(--gold-deep); font-weight: 400;}
.help-bar .close-help {
  position: absolute; top: 12px; right: 14px; background: transparent;
  border: none; color: var(--muted); cursor: pointer; font-size: 16px;
}

/* ── Jobs request form ── */
.jobs-request {
  margin-top: 40px; padding: 28px 32px; background: var(--black-soft);
  border: 1px solid var(--gold-faint); position: relative;
}
.jobs-request .badge {
  position: absolute; top: -10px; left: 32px;
  background: var(--gold-deep); color: var(--paper);
  padding: 4px 14px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 4px;
}
.jobs-request h2 {
  font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 4px;
  color: var(--gold); margin-bottom: 6px; margin-top: 4px;
}
.jobs-request .desc { font-size: 12px; color: var(--muted); line-height: 1.8; margin-bottom: 18px;}
.jobs-request textarea {
  width: 100%; min-height: 120px; padding: 14px 16px;
  background: var(--black); color: var(--text);
  border: 1px solid var(--line); font-family: 'Shippori Mincho', serif;
  font-size: 14px; line-height: 1.7; outline: none; resize: vertical;
}
.jobs-request textarea:focus { border-color: var(--gold-faint);}
.jobs-request .send-row { display: flex; gap: 10px; margin-top: 12px; align-items: center;}
.jobs-request .send-btn {
  background: var(--gold); color: var(--black); border: none;
  padding: 12px 28px; font-family: 'Cinzel', serif; letter-spacing: 3px; font-size: 11px;
  cursor: pointer; flex-shrink: 0;
}
.jobs-request .send-btn:hover { background: var(--gold-deep); color: var(--paper);}
.jobs-request .send-btn:disabled { opacity: 0.5; cursor: not-allowed;}
.jobs-request .send-hint { font-size: 10px; color: var(--muted); letter-spacing: 1px;}
.jobs-request .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;}
.jobs-request .examples button {
  background: transparent; border: 1px dashed var(--gold-faint);
  color: var(--gold-deep); padding: 6px 12px; font-size: 11px; cursor: pointer;
  font-family: inherit;
}
.jobs-request .examples button:hover { background: var(--gold-faint); color: var(--gold);}
.jobs-request .queue {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
}
.jobs-request .queue-title {
  font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 3px;
  color: var(--gold-deep); margin-bottom: 10px;
}
.queue-item {
  background: var(--black); padding: 10px 14px; margin-bottom: 6px;
  border-left: 2px solid var(--gold-deep); font-size: 12px; line-height: 1.6;
}
.queue-item .time { color: var(--muted); font-size: 10px; margin-right: 10px; font-family: 'Cormorant Garamond', serif;}
.queue-item .status { float: right; font-size: 9px; letter-spacing: 1px; color: var(--gold-deep);}
</style>

</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">IDEAL SKIN</span>
    <span class="brand-divider"></span>
    <span class="brand-app">投稿管理 SaaS (Hikaru版 / mock v0.1)</span>
  </div>
  <nav class="topbar-nav">
    <a href="#" id="nav-stock" class="active">ネタ庫</a>
    <a href="#" id="nav-daily">📰 今日の提案</a>
    <a href="#">投稿予約</a>
    <a href="#">配信履歴</a>
    <a href="#">KPI</a>
  </nav>
  <div class="topbar-meta">
    <span>@hikaru_ideal_skin</span>
    <span>v0.1 (mock)</span>
  </div>
</header>

<div class="app" id="app">

  <!-- ── 左サイドバー ── -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">REIKA TOPICS</div>
      <div class="sidebar-sub">れいか先生 知識ライブラリ 全229本<br>(Notion: 2c3a833f53da4acd...)</div>
      <input class="search" id="search" placeholder="キーワード検索 (例: 毛穴 / シミ / 腸)">
      <div class="filter-tabs">
        <button class="filter-tab active" data-cat="all">ALL</button>
        <button class="filter-tab" data-cat="done">✓ 生成済</button>
        <button class="filter-tab" data-cat="skin">肌・美容</button>
        <button class="filter-tab" data-cat="health">健康</button>
        <button class="filter-tab" data-cat="female">女性身体</button>
        <button class="filter-tab" data-cat="biz">経営マーケ</button>
      </div>
    </div>
    <div class="topic-list" id="topic-list">
      <!-- JS で動的描画 -->
    </div>
  </aside>

  <!-- ── 右メインペイン ── -->
  <main class="detail" id="detail">
    <!-- JS で動的描画 -->
  </main>

</div>

<footer class="kpi-bar">
  <span>選定ネタ: <b id="kpi-selected">—</b></span>
  <span>生成済3軸: <b id="kpi-generated">0</b> / <b>229</b></span>
  <span>今週投稿予定: <b>0</b></span>
  <span>LP流入(GA4過去24h): <b>—</b></span>
  <span style="margin-left:auto; color:var(--gold-deep)">SaaSモック v0.1 / 2026-05-18</span>
</footer>

<script>
// ────────────────────────────────────────
// データ: 229本のネタ + 1本完成台本
// ────────────────────────────────────────
const STATE = {
  topics: [],
  scriptsManifest: {}, // topic_id -> filename
  scripts: {}, // topic_id -> loaded script (lazy)
  selectedId: null,
  currentTab: 'reel',
  filter: { cat: 'all', q: '' }
};

// カテゴリ判定 (シンプルなキーワード)
function categorize(title) {
  if (/肌|シミ|たるみ|毛穴|ニキビ|アトピー|皮膚|UV|SPF|美肌|エステ|スキンケア/.test(title)) return 'skin';
  if (/生理|子宮|卵巣|妊娠|フェムケア|ホルモン/.test(title)) return 'female';
  if (/サロン|マーケ|集客|売上|単価|営業|HPB|経営|SNS|リール|LIVE|物販|発信|クロージング/.test(title)) return 'biz';
  if (/食|腸|肝臓|健康|アレルギー|ガン|癌|血液|腰痛|頭痛|添加|オメガ|大豆|牛乳|プロテイン|水素|白湯|栄養|デトックス|解毒/.test(title)) return 'health';
  return 'other';
}

// ────────────────────────────────────────
// ロード
// ────────────────────────────────────────
Promise.all([
  fetch('data/topics.json').then(r=>r.json()),
  fetch('data/scripts_index.json').then(r=>r.json())
]).then(([topicsData, manifest]) => {
  STATE.topics = topicsData.items.map(t => ({...t, cat: categorize(t.title)}));
  STATE.scriptsManifest = manifest.scripts || {};
  // デフォルト選択: 毛穴の黒ずみネタ (生成済の代表)
  const pore = STATE.topics.find(t => t.title.includes('毛穴の黒ずみ'));
  STATE.selectedId = pore ? pore.id : STATE.topics[0].id;
  document.getElementById('kpi-generated').textContent = Object.keys(STATE.scriptsManifest).length;
  loadScriptIfNeeded(STATE.selectedId).then(() => {
    renderTopics();
    renderDetail();
  });
});

function loadScriptIfNeeded(topicId) {
  if (STATE.scripts[topicId] !== undefined) return Promise.resolve(STATE.scripts[topicId]);
  const fname = STATE.scriptsManifest[String(topicId)];
  if (!fname) { STATE.scripts[topicId] = null; return Promise.resolve(null); }
  return fetch('data/' + fname).then(r=>r.json()).then(s => {
    STATE.scripts[topicId] = s;
    return s;
  }).catch(e => { STATE.scripts[topicId] = null; return null; });
}

// ────────────────────────────────────────
// 左サイドバー描画
// ────────────────────────────────────────
function renderTopics() {
  const list = document.getElementById('topic-list');
  const q = STATE.filter.q.toLowerCase();
  const filtered = STATE.topics.filter(t => {
    if (STATE.filter.cat === 'done') {
      if (!STATE.scriptsManifest[String(t.id)]) return false;
    } else if (STATE.filter.cat !== 'all' && t.cat !== STATE.filter.cat) {
      return false;
    }
    if (q && !t.title.toLowerCase().includes(q)) return false;
    return true;
  });
  list.innerHTML = filtered.map(t => `
    <div class="topic-row ${t.id===STATE.selectedId?'selected':''} ${STATE.scriptsManifest[String(t.id)]?'has-script':''}" data-id="${t.id}">
      <span class="topic-mark">${t.type==='video'?'▶':'♪'}</span>
      <span class="topic-title">${escapeHtml(t.title)}</span>
    </div>
  `).join('');
  list.querySelectorAll('.topic-row').forEach(el => {
    el.addEventListener('click', () => {
      STATE.selectedId = parseInt(el.dataset.id);
      loadScriptIfNeeded(STATE.selectedId).then(() => {
        renderTopics(); renderDetail();
      });
    });
  });
}

document.getElementById('search').addEventListener('input', e => {
  STATE.filter.q = e.target.value; renderTopics();
});
document.querySelectorAll('.filter-tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    STATE.filter.cat = b.dataset.cat; renderTopics();
  });
});

// ────────────────────────────────────────
// 右メインペイン描画
// ────────────────────────────────────────
function renderDetail() {
  const topic = STATE.topics.find(t => t.id === STATE.selectedId);
  if (!topic) return;
  const script = STATE.scripts[topic.id];
  const detail = document.getElementById('detail');

  document.getElementById('kpi-selected').textContent = topic.title;

  let body;
  if (!script) {
    body = `
      <div class="empty-state">
        <h3>SCRIPT NOT GENERATED</h3>
        <p>このネタはまだ3軸台本が生成されていない。<br>「生成」ボタンで れいか先生Notion本編 × IDEAL SKINブランド理論 を掛け合わせて<br>リール60秒 / ストーリー / Threads の3軸を自動生成する。</p>
        <button class="gen-btn">▷ 3軸台本を生成 (mock)</button>
      </div>
    `;
  } else {
    body = renderScript(script);
  }

  detail.innerHTML = `
    <div class="detail-head">
      <div class="breadcrumb">REIKA TOPICS &nbsp;/&nbsp; #${topic.id} &nbsp;/&nbsp; ${topic.cat.toUpperCase()}</div>
      <div class="detail-title">${escapeHtml(topic.title)}</div>
      <div class="detail-meta">
        <span><b>ソース:</b> れいか先生 Notion (${topic.type==='video'?'動画':'音声'})</span>
        <span><b>カテゴリ:</b> ${topic.cat}</span>
        <span><b>状態:</b> ${script?'台本生成済':'未生成'}</span>
      </div>
    </div>
    ${script ? `
      <div class="tabs">
        <div class="tab ${STATE.currentTab==='reel'?'active':''}" data-tab="reel">REEL <span class="tag">60s</span></div>
        <div class="tab ${STATE.currentTab==='story'?'active':''}" data-tab="story">STORY <span class="tag">${script.story.slides.length}枚</span></div>
        <div class="tab ${STATE.currentTab==='threads'?'active':''}" data-tab="threads">THREADS <span class="tag">${script.threads.posts.length}post</span></div>
      </div>
    `:''}
    <div class="tab-body">${body}</div>
  `;
  detail.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { STATE.currentTab = t.dataset.tab; renderDetail(); });
  });
}

function renderScript(s) {
  if (STATE.currentTab === 'reel') return renderReel(s.reel);
  if (STATE.currentTab === 'story') return renderStory(s.story);
  if (STATE.currentTab === 'threads') return renderThreads(s.threads);
  return '';
}

function renderReel(r) {
  return `
    <div class="section">
      <div class="section-title">REEL — ${r.duration_sec}秒 / カバー&構成</div>
      <div class="cover-card">
        <div class="cover-art">${escapeHtml(r.cover_text)}</div>
        <dl class="cover-meta">
          <dt>タイトル</dt><dd>${escapeHtml(r.title)}</dd>
          <dt>カバーデザイン</dt><dd>${escapeHtml(r.cover_design_note)}</dd>
          <dt>BGM</dt><dd>${escapeHtml(r.bgm_hint)}</dd>
        </dl>
      </div>
    </div>
    <div class="section">
      <div class="section-title">タイムライン台本</div>
      <table class="scene-table">
        <thead><tr><th>時間</th><th>パート</th><th>セリフ / テロップ</th></tr></thead>
        <tbody>
          ${r.scenes.map(sc => `
            <tr>
              <td class="t">${sc.t}</td>
              <td class="label">${escapeHtml(sc.label)}</td>
              <td class="lines">${escapeHtml(sc.lines)}<div class="telop">テロップ: ${escapeHtml(sc.telop)}</div></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="tag-line">ハッシュタグ: ${escapeHtml(r.hashtags)}</div>
    </div>
  `;
}

function renderStory(st) {
  return `
    <div class="section">
      <div class="section-title">STORY — ${st.slides.length}枚連投 / ${escapeHtml(st.title)}</div>
      <div class="story-grid">
        ${st.slides.map(sl => `
          <div class="story-slide">
            <div>
              <span class="num">#${sl.n}</span>
              <div class="type">${escapeHtml(sl.type)}</div>
              <div class="txt">${escapeHtml(sl.text)}</div>
            </div>
            <div class="design">${escapeHtml(sl.design)}</div>
          </div>
        `).join('')}
      </div>
      <div class="tag-line">ステッカー: ${escapeHtml(st.sticker_hints)} / 投稿時間: ${escapeHtml(st.post_time_hint)}</div>
    </div>
  `;
}

function renderThreads(th) {
  return `
    <div class="section">
      <div class="section-title">THREADS — ${th.posts.length}投稿スレ / ${escapeHtml(th.title)}</div>
      <div class="threads-thread">
        ${th.posts.map(p => `
          <div class="threads-post">
            <span class="num">${p.n}/${th.posts.length}</span>
            <div class="text">${escapeHtml(p.text)}</div>
          </div>
        `).join('')}
      </div>
      <div class="tag-line">投稿時間: ${escapeHtml(th.post_time_hint)} / トーン: ${escapeHtml(th.tone_note)}</div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ────────────────────────────────────────
// View 切り替え (ネタ庫 / DAILY)
// ────────────────────────────────────────
function showStockView() {
  document.getElementById('nav-stock').classList.add('active');
  document.getElementById('nav-daily').classList.remove('active');
  document.getElementById('app').style.display = 'grid';
  const dailyEl = document.getElementById('daily-view');
  if (dailyEl) dailyEl.remove();
}

function showDailyView() {
  document.getElementById('nav-stock').classList.remove('active');
  document.getElementById('nav-daily').classList.add('active');
  document.getElementById('app').style.display = 'none';
  let dailyEl = document.getElementById('daily-view');
  if (!dailyEl) {
    dailyEl = document.createElement('section');
    dailyEl.id = 'daily-view';
    dailyEl.className = 'daily-view';
    document.querySelector('.app').insertAdjacentElement('afterend', dailyEl);
  }
  dailyEl.innerHTML = '<div class="daily-loading">読み込み中…</div>';
  fetch('data/daily/latest.json?t=' + Date.now())
    .then(r => { if (!r.ok) return null; return r.text(); })
    .then(txt => txt ? JSON.parse(txt) : null)
    .catch(e => { console.error('latest.json parse error:', e.message); return 'PARSE_ERR'; })
    .then(data => {
      if (data === 'PARSE_ERR') {
        dailyEl.innerHTML = `<div class="daily-error">⚠ latest.json の読み込みに失敗。<br>JSON フォーマット不整合の可能性あり。Jobs が次回ルーチンで修正します。</div>` + renderJobsRequestForm();
        attachJobsRequestHandlers(dailyEl);
        return;
      }
    if (!data) {
      dailyEl.innerHTML = `
        <div class="daily-empty">
          <h2>DAILY PROPOSAL — まだ生成されていない</h2>
          <p>毎朝6:30に Claude Code リモートエージェントが以下を実行して<br>「今日のリール提案3本」を作る予定:</p>
          <p style="margin-top:24px;text-align:left;display:inline-block;line-height:2;">
            ① 美容/健康/食/女性系 RSS 8ソースから直近24h以内のニュースを収集<br>
            ② IDEAL SKIN 顧客 (30-50代女性) に刺さる3本を選定<br>
            ③ れいか先生 Notion 229本から「掛け合わせ候補」を紐付け<br>
            ④ ヒカル先生口調でフック試作 + なぜ今日 を出力<br>
            ⑤ JSONをこのSaaSに自動push → ここに表示
          </p>
          <p style="margin-top:28px;font-size:11px;">
            ルーチンID: <code>trig_01ETh2B3ZLYN9JfaaPkqwfBp</code><br>
            次回実行: 06:30 (Asia/Tokyo)
          </p>
        </div>` + renderJobsRequestForm();
      attachJobsRequestHandlers(dailyEl);
      return;
    }
    dailyEl.innerHTML = renderDailyProposal(data) + renderJobsRequestForm();
    attachDailyHandlers(dailyEl, data);
    attachJobsRequestHandlers(dailyEl);
  });
}

// ────────────────────────────────────────
// Jobsへの依頼フォーム
// ────────────────────────────────────────
function renderJobsRequestForm() {
  const queue = JSON.parse(localStorage.getItem('jobs_request_queue') || '[]');
  return `
    <div class="jobs-request">
      <div class="badge">▷ JOBS REQUEST</div>
      <h2>JOBS に依頼する</h2>
      <div class="desc">
        「これについてリール作りたい」「このネタを掘り下げて」など、自由に書いて送信。<br>
        Jobs が依頼を読んで、ネタ選定→3軸台本生成までやって、ここに反映する。
      </div>
      <div class="examples">
        <button data-tpl="梅雨入りの肌荒れについて、原因と対策のリール作って">梅雨×肌荒れ</button>
        <button data-tpl="自律神経とニキビの関係でリール考えて、夜更かしする人向け">自律神経×ニキビ</button>
        <button data-tpl="40代女性の更年期と肌、本人に届く言い方で">40代更年期</button>
        <button data-tpl="日焼け止め塗ってるのにシミ増える理由">UV×シミ</button>
      </div>
      <textarea id="jobs-req-text" placeholder="例: 『今週末イベントがあるから、毛穴と化粧ノリの話をリール&ストーリーで作りたい』 のように自由に書いて送って。Jobs が読んでネタ選定+台本生成までやるよ。"></textarea>
      <div class="send-row">
        <button class="send-btn" id="jobs-req-send">▷ Jobs に送る</button>
        <span class="send-hint">送信先: GitHub Issue + Gmail通知 (オーナーへ CC)</span>
      </div>
      <div class="queue">
        <div class="queue-title">過去の依頼 (このブラウザに保存)</div>
        <div id="jobs-req-queue">${queue.length===0 ? '<div style="font-size:11px;color:var(--muted)">依頼履歴なし</div>' : queue.map(q=>`
          <div class="queue-item">
            <span class="time">${escapeHtml(q.time)}</span>
            ${escapeHtml(q.text.substring(0,80))}${q.text.length>80?'…':''}
            <span class="status">${escapeHtml(q.status||'SENT')}</span>
          </div>`).join('')}</div>
      </div>
    </div>
  `;
}

function attachJobsRequestHandlers(rootEl) {
  // テンプレ
  rootEl.querySelectorAll('.jobs-request .examples button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('jobs-req-text').value = btn.dataset.tpl;
      document.getElementById('jobs-req-text').focus();
    });
  });
  // 送信
  const sendBtn = rootEl.querySelector('#jobs-req-send');
  if (sendBtn) sendBtn.addEventListener('click', () => {
    const txt = document.getElementById('jobs-req-text').value.trim();
    if (!txt) { alert('依頼内容を書いて'); return; }
    sendBtn.disabled = true; sendBtn.textContent = '送信中…';
    // 1) localStorage に履歴保存
    const queue = JSON.parse(localStorage.getItem('jobs_request_queue') || '[]');
    const now = new Date().toISOString().replace('T',' ').substring(5,16);
    queue.unshift({ time: now, text: txt, status: 'SENT' });
    localStorage.setItem('jobs_request_queue', JSON.stringify(queue.slice(0,20)));
    // 2) GitHub Issue 作成 (mailto Fallback + ガイダンス)
    const title = encodeURIComponent('[依頼] ' + txt.substring(0,50) + (txt.length>50?'…':''));
    const body = encodeURIComponent(`# IDEAL SKIN 投稿依頼\n\n${txt}\n\n---\n送信時刻: ${now}\n送信元: SaaS UI`);
    const issueUrl = `https://github.com/t35ty6-rgb/skeleton-demos/issues/new?title=${title}&body=${body}&labels=ideal-skin,jobs-request`;
    window.open(issueUrl, '_blank');
    // 3) UI更新
    document.getElementById('jobs-req-text').value = '';
    sendBtn.disabled = false; sendBtn.textContent = '▷ Jobs に送る';
    // queue 表示更新
    document.getElementById('jobs-req-queue').innerHTML = queue.map(q=>`
      <div class="queue-item">
        <span class="time">${escapeHtml(q.time)}</span>
        ${escapeHtml(q.text.substring(0,80))}${q.text.length>80?'…':''}
        <span class="status">${escapeHtml(q.status||'SENT')}</span>
      </div>`).join('');
  });
}

function buildAdoptIssueUrl(p) {
  // URL長すぎ対策で本文を最小限に。詳細はlatest.jsonをJobs側で参照させる。
  const title = encodeURIComponent(`[依頼] DAILY#${p.rank} ${(p.news_title||'').substring(0,30)}`);
  const body = encodeURIComponent(
    `DAILY提案#${p.rank} を採用 → 3軸台本生成依頼\n\n` +
    `掛け合わせネタ: #${p.linked_topic_id||''} ${p.linked_topic_title||''}\n\n` +
    `(詳細はリポ内 ideal-skin-saas/data/daily/latest.json の proposals[rank=${p.rank}] を参照)`
  );
  return `https://github.com/t35ty6-rgb/skeleton-demos/issues/new?title=${title}&body=${body}&labels=ideal-skin,jobs-request`;
}

function renderHelpBar() {
  if (localStorage.getItem('hide_help') === '1') return '';
  return `
    <div class="help-bar">
      <button class="close-help" title="閉じる">✕</button>
      <h3>📖 使い方</h3>
      <ol>
        <li><b>下の3本の提案を読む</b> — ニュース・掛け合わせネタ・フック試作・なぜ今日の理由が並んでる</li>
        <li><b>気に入った提案の「✓ 採用して台本生成」ボタンを押す</b> — 新タブで GitHub Issue 画面が開くので「Submit new issue」をクリック</li>
        <li><b>1時間以内に Jobs が3軸台本 (リール/ストーリー/Threads) を作成</b> — 完成したら左サイドの「✓生成済」フィルタに出現、内容クリックで台本見れる</li>
      </ol>
      <p style="margin-top:10px;color:var(--muted);font-size:11.5px;">

      </p>

}

function renderDailyProposal(d) {
  const date = d.date;

  const wd = !isNaN(dt.getTime()) ? weekdays[dt.getDay()] : '';
  const states = JSON.parse(localStorage.getItem('daily_states') || '{}');

  return renderHelpBar() + `
    <div class="daily-head">
      <div class="badge">TODAY</div>
      <h1>DAILY PROPOSAL</h1>
      <div class="date">${escapeHtml(date)}<span class="weekday">${wd ? '('+wd+')' : ''}</span></div>
      <div class="summary">${escapeHtml(d.summary||'(要約なし)')}</div>
      <div class="meta">
        <span>ニュース収集: <b>${d.news_count||0}</b>件</span>
        <span>提案: <b>${props.length}</b>本</span>

    <div class="daily-proposals">
      ${props.map(p => {

        return `
        <div class="proposal ${state}" data-rank="${p.rank}">
          <div class="proposal-header">
            <div class="rank">PROPOSAL ${p.rank}</div>
            <div class="proposal-status">${statusLabel}</div>
          </div>
          <div class="proposal-body">
            <div class="news-block">
              <div class="label">📰 NEWS</div>
              <div class="news-title">${escapeHtml(p.news_title)}</div>
              <div class="news-source">出典: ${escapeHtml(p.news_source)}${p.news_url?` <a href="${escapeHtml(p.news_url)}" target="_blank" rel="noopener">原文を読む →</a>`:''}</div>
            </div>
            <div class="cross-arrow">×</div>
            <div class="cross-block">
              <div class="label">🎦 REIKA LIBRARY (掛け合わせ)</div>
              <div class="linked" data-id="${p.linked_topic_id}">
                <span><span class="id">#${p.linked_topic_id}</span>${escapeHtml(p.linked_topic_title)}</span>
                <span class="open-hint">クリックでネタ庫へ →</span>
              </div>
            </div>
            <div class="angle-block">
              <div class="label">💡 ANGLE</div>
              <div class="angle-text">${escapeHtml(p.angle||'')}</div>
            </div>
            <div class="hook-block">
              <div class="label">🎤 HOOK (リール冒頭) <button class="copy-btn" data-copy="${escapeHtml(p.hook_idea)}">📋 コピー</button></div>
              <div class="hook">${escapeHtml(p.hook_idea)}</div>
            </div>
            <div class="why-block">
              <div class="label">⏰ WHY NOW</div>
              <div class="why-text">${escapeHtml(p.why_now||'')}</div>
            </div>
          </div>
          <div class="proposal-actions">
            <button class="skip" data-action="skip" data-rank="${p.rank}">⏭ スキップ</button>
            <a class="btn primary" data-action="adopt" data-rank="${p.rank}"
               href="${buildAdoptIssueUrl(p)}"
               target="_blank" rel="noopener">✓ 採用して台本生成</a>
          </div>
        </div>
        `;
      }).join('')}
    </div>
  `;
}

function attachHelpHandlers(dailyEl) {
  const btn = dailyEl.querySelector('.help-bar .close-help');
  if (btn) btn.addEventListener('click', () => {
    localStorage.setItem('hide_help', '1');
    btn.parentElement.style.display = 'none';

}

function attachDailyHandlers(dailyEl, d) {
  attachHelpHandlers(dailyEl);
  // ネタ庫へジャンプ
  dailyEl.querySelectorAll('.linked').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      showStockView();
      STATE.selectedId = id;
      loadScriptIfNeeded(id).then(() => { renderTopics(); renderDetail(); });
    });
  });
  // コピーボタン
  dailyEl.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const text = btn.dataset.copy;
      navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied'); btn.textContent = '✓ コピー済';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 コピー'; }, 2000);
      });
    });
  });
  // 採用 (a.btn) — リンク自体は href で開くので、ここでは状態保存のみ
  dailyEl.querySelectorAll('a.btn[data-action="adopt"]').forEach(el => {
    el.addEventListener('click', () => {
      const rank = parseInt(el.dataset.rank);
      const states = JSON.parse(localStorage.getItem('daily_states') || '{}');
      states[d.date] = states[d.date] || {};
      states[d.date][rank] = 'adopted';
      localStorage.setItem('daily_states', JSON.stringify(states));
      // 少し遅らせて再レンダ (新タブが先に開くように)
      setTimeout(() => {
        dailyEl.innerHTML = renderDailyProposal(d) + renderJobsRequestForm();
        attachDailyHandlers(dailyEl, d);
        attachJobsRequestHandlers(dailyEl);
      }, 100);
    });
  });
  // スキップ
  dailyEl.querySelectorAll('button[data-action="skip"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rank = parseInt(btn.dataset.rank);
      const states = JSON.parse(localStorage.getItem('daily_states') || '{}');
      states[d.date] = states[d.date] || {};
      states[d.date][rank] = 'skipped';
      localStorage.setItem('daily_states', JSON.stringify(states));
      dailyEl.innerHTML = renderDailyProposal(d) + renderJobsRequestForm();
      attachDailyHandlers(dailyEl, d);
      attachJobsRequestHandlers(dailyEl);
    });
  });
}

document.getElementById('nav-stock').addEventListener('click', e => { e.preventDefault(); showStockView(); });
document.getElementById('nav-daily').addEventListener('click', e => { e.preventDefault(); showDailyView(); });
</script>
