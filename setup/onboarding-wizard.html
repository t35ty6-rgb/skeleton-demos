<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Skeleton標準導入ウィザード｜ホットペッパーLINEツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.6;min-height:100vh}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:10}}
.sidebar{background:linear-gradient(180deg,#1f3a5f 0%,#2d527f 100%);color:#fff;padding:24px 20px}
.sidebar h1{font-size:17px;margin-bottom:4px;line-height:1.4}
.sidebar .brand{font-size:10px;letter-spacing:.25em;opacity:.7;margin-bottom:6px}
.sidebar .sub{font-size:12px;opacity:.85;margin-bottom:22px}
.progress{background:rgba(255,255,255,.15);height:6px;border-radius:3px;overflow:hidden;margin-bottom:20px}
.progress-bar{height:100%;background:linear-gradient(90deg,#ffd54f,#ff8a65);transition:width .3s}
.steps{list-style:none;counter-reset:s}
.steps li{padding:9px 12px;border-radius:8px;margin-bottom:3px;font-size:12.5px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;counter-increment:s}
.steps li:hover{background:rgba(255,255,255,.1)}
.steps li.active{background:rgba(255,255,255,.25);font-weight:600}
.steps li.done{opacity:.7}
.steps li.done::before{content:'✓';color:#80ff80;font-weight:bold;background:transparent;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.steps li:not(.done)::before{content:counter(s);background:rgba(255,255,255,.2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold}
.sidebar-foot{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2);font-size:11.5px;opacity:.85}
.sidebar-foot button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:8px}
.sidebar-foot button:hover{background:rgba(255,255,255,.2)}
.main{padding:40px 56px;overflow-y:auto;max-height:100vh}
@media(max-width:800px){.main{padding:24px 18px;max-height:none}}
.step-content{max-width:780px;margin:0 auto}
.step-content h2{font-size:26px;margin-bottom:8px;color:#1f3a5f;display:flex;align-items:center;gap:12px}
.step-content .step-num{background:#1f3a5f;color:#fff;font-size:14px;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.step-content .step-sub{color:#666;font-size:14px;margin-bottom:24px;padding-left:46px}
.who-pill{display:inline-block;background:#eef1f6;color:#1f3a5f;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600;margin-left:8px;vertical-align:middle}
.who-pill.client{background:#fff4e5;color:#a35400}
.who-pill.skeleton{background:#e3edf6;color:#1f3a5f}

.box{background:#fff;border-radius:12px;padding:22px 26px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.box h3{font-size:15px;color:#1f3a5f;margin-bottom:10px;font-weight:600}

.action-list{list-style:none;counter-reset:a}
.action-list li{padding:10px 0 10px 38px;position:relative;border-bottom:1px dashed #eee;counter-increment:a;font-size:14.5px}
.action-list li:last-child{border-bottom:none}
.action-list li::before{content:counter(a);position:absolute;left:0;top:11px;background:#1f3a5f;color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.action-list code{background:#eef1f6;padding:2px 7px;border-radius:4px;font-size:90%;font-family:'SF Mono','Menlo',monospace;color:#1f3a5f}
.action-list strong{color:#1f3a5f}

.field{margin:14px 0}
.field label{display:block;font-size:12px;color:#666;margin-bottom:6px;font-weight:600;letter-spacing:.03em}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid #d1d1d6;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#1f3a5f}
.field .hint{font-size:11.5px;color:#888;margin-top:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.field-row{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;text-decoration:none}
.btn-primary{background:#1f3a5f;color:#fff}
.btn-primary:hover{background:#163055}
.btn-secondary{background:#e5e5ea;color:#1d1d1f}
.btn-secondary:hover{background:#d1d1d6}
.btn-large{padding:14px 30px;font-size:15px}
.btn-link{background:#fff;color:#1f3a5f;border:1.5px solid #1f3a5f}
.btn-link:hover{background:#1f3a5f;color:#fff}
.btn-copy{background:#ff9800;color:#fff;font-size:12.5px;padding:7px 14px}
.btn-copy:hover{background:#e88600}
.btn-copy.copied{background:#2c8a47}

.nav-bar{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid #e5e5ea}

.warn{background:#fff4e5;border-left:4px solid #d97706;padding:13px 17px;border-radius:6px;margin:12px 0;font-size:13.5px;color:#5c3d12}
.warn strong{color:#a35400}
.note{background:#eaf3ec;border-left:4px solid #2c8a47;padding:12px 17px;border-radius:6px;margin:12px 0;font-size:13.5px;color:#1f4a2c}
.tip{background:#e3edf6;border-left:4px solid #1f3a5f;padding:12px 17px;border-radius:6px;margin:12px 0;font-size:13.5px;color:#1a3050}

.code-block{position:relative;background:#1d1d1f;color:#e5e5ea;padding:16px 18px;border-radius:8px;font-family:'SF Mono','Menlo',monospace;font-size:12.5px;line-height:1.6;margin:12px 0;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.code-block-copy{position:absolute;top:8px;right:8px}

.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 16px;margin:10px 0;font-size:14px}
.kv .k{color:#666;font-weight:600}
.kv .v{color:#1f3a5f;font-weight:600;word-break:break-all}

.checklist{list-style:none}
.checklist li{padding:8px 0;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checklist input[type="checkbox"]{margin-top:5px;width:18px;height:18px;accent-color:#1f3a5f;flex-shrink:0;cursor:pointer}
.checklist label{cursor:pointer;flex:1}
.checklist input:checked + label{color:#999;text-decoration:line-through}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">SKELETON INC.</div>
    <h1>標準導入ウィザード</h1>
    <div class="sub">ホットペッパーLINEツール</div>
    <div class="progress"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <ul class="steps" id="step-list">
      <li data-step="0">客情報入力</li>
      <li data-step="1">専用Gmail作成</li>
      <li data-step="2">LINEビジネスID</li>
      <li data-step="3">LINE公式作成</li>
      <li data-step="4">トークン取得</li>
      <li data-step="5">グループID取得</li>
      <li data-step="6">GASマスタークローン</li>
      <li data-step="7">Config.gs焼き込み</li>
      <li data-step="8">共有URL発行</li>
      <li data-step="9">引き渡しシート</li>
      <li data-step="10">当日:客作業</li>
      <li data-step="11">サロンボード</li>
      <li data-step="12">動作確認</li>
      <li data-step="13">完了</li>
    </ul>
    <div class="sidebar-foot">
      入力は自動保存されます<br>
      <button onclick="resetAll()">最初からやり直す</button>
    </div>
  </aside>
  <main class="main">
    <div id="step-container"></div>
  </main>
</div>

<script>
const KEY='skeleton_onb_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'{}');
state.cur=state.cur||0;
state.done=state.done||{};
state.salonName=state.salonName||'';
state.salonCode=state.salonCode||'';
state.ownerName=state.ownerName||'';
state.clientPhone=state.clientPhone||'';
state.address=state.address||'';
state.staffCount=state.staffCount||'';
state.sites=state.sites||{hotpepper:true,rakuten:false,minimo:false,epark:false};
state.gmail=state.gmail||'';
state.gmailPass=state.gmailPass||'';
state.lineBizId=state.lineBizId||'';
state.lineAccountName=state.lineAccountName||'';
state.lineToken=state.lineToken||'';
state.groupId=state.groupId||'';
state.gasShareUrl=state.gasShareUrl||'';

const MASTER_GAS_URL='https://script.google.com/home'; // TODO: マスタープロジェクトURLを後で差し替え

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function resetAll(){if(confirm('全部リセットしていい?')){localStorage.removeItem(KEY);location.reload()}}

const STEPS=[
  // 0
  ()=>`<div class="step-content">
    <h2><span class="step-num">0</span>客情報を入力</h2>
    <div class="step-sub">申込書から転記。後の全ステップで使う値の元データ。<span class="who-pill skeleton">Skeleton</span></div>
    <div class="box">
      <h3>サロン基本情報</h3>
      <div class="field"><label>サロン名(屋号)</label><input id="i-salonName" value="${esc(state.salonName)}" placeholder="例: BLOOM"><div class="hint">LINE公式名やレポート表記に使う</div></div>
      <div class="field-row">
        <div class="field"><label>サロン略号(半角英数3〜6文字)</label><input id="i-salonCode" value="${esc(state.salonCode)}" placeholder="例: bloom"><div class="hint">専用Gmailアドレスに使う(<code>skeleton.bloom@gmail.com</code>)</div></div>
        <div class="field"><label>代表者氏名</label><input id="i-ownerName" value="${esc(state.ownerName)}" placeholder="山田 太郎"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>客側電話番号(SMS受信可)</label><input id="i-clientPhone" value="${esc(state.clientPhone)}" placeholder="090-XXXX-XXXX"><div class="hint">Gmail新規作成の番号認証で使う</div></div>
        <div class="field"><label>スタッフ人数(目安)</label><input id="i-staffCount" value="${esc(state.staffCount)}" placeholder="3"></div>
      </div>
      <div class="field"><label>店舗住所</label><input id="i-address" value="${esc(state.address)}" placeholder="福井県大野市..."></div>
      <h3 style="margin-top:18px">使ってる予約サイト</h3>
      <ul class="checklist">
        <li><input type="checkbox" id="s-hp" ${state.sites.hotpepper?'checked':''}><label for="s-hp"><strong>ホットペッパービューティー</strong></label></li>
        <li><input type="checkbox" id="s-rk" ${state.sites.rakuten?'checked':''}><label for="s-rk">楽天ビューティー</label></li>
        <li><input type="checkbox" id="s-mn" ${state.sites.minimo?'checked':''}><label for="s-mn">minimo</label></li>
        <li><input type="checkbox" id="s-ep" ${state.sites.epark?'checked':''}><label for="s-ep">EPARK Beauty</label></li>
      </ul>
    </div>
    <div class="nav-bar">
      <div></div>
      <button class="btn btn-primary" onclick="saveStep0()">次へ:専用Gmail作成 →</button>
    </div>
  </div>`,
  // 1
  ()=>`<div class="step-content">
    <h2><span class="step-num">1</span>専用Gmail新規作成</h2>
    <div class="step-sub">客の本業Gmailと分けるための専用アカウント。客の電話番号でSMS認証する。<span class="who-pill skeleton">Skeleton</span> 所要: 約10分</div>
    <div class="box">
      <h3>このサロン用に作るGmail</h3>
      <div class="kv"><div class="k">アドレス候補</div><div class="v" id="suggestedGmail">skeleton.${state.salonCode||'(略号未設定)'}@gmail.com</div></div>
      <div class="tip">パスワードは1Password等で管理。客には引き渡し時に渡す。</div>
    </div>
    <div class="box">
      <h3>作業手順</h3>
      <ol class="action-list">
        <li><a href="https://accounts.google.com/signup" target="_blank" class="btn btn-link" style="font-size:13px;padding:7px 14px">Googleアカウント作成画面を開く →</a></li>
        <li>姓: <code>${esc(state.salonName||'(サロン名)')}</code>、名: <code>予約通知</code> で入力</li>
        <li>ユーザー名: <code>skeleton.${esc(state.salonCode||'(略号)')}</code> を入力(末尾 <code>@gmail.com</code> は自動)</li>
        <li>パスワードを生成 → 下のフィールドに記録</li>
        <li>電話番号認証 → <strong>客の電話番号 <code>${esc(state.clientPhone||'(未入力)')}</code></strong> を入力 → 客にSMSコード(6桁)を読み上げてもらう</li>
        <li>生年月日・性別など適当に入力(代表者情報でOK)</li>
        <li>作成完了 → 下に記録</li>
      </ol>
    </div>
    <div class="box">
      <h3>記録</h3>
      <div class="field"><label>作成したGmailアドレス</label><input id="i-gmail" value="${esc(state.gmail)}" placeholder="skeleton.${state.salonCode||'xxx'}@gmail.com"></div>
      <div class="field"><label>パスワード(1Password にも保存)</label><input id="i-gmailPass" value="${esc(state.gmailPass)}" placeholder="生成パスワード"></div>
    </div>
    <div class="warn"><strong>2段階認証はこのタイミングで設定する</strong> — 客の電話番号で認証アプリ or SMS。乗っ取られ対策。</div>
    <div class="warn"><strong>同一電話番号でGmail新規作成は3〜4個まで</strong>。客ごとに必ず客の番号で。</div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="goPrev()">← 戻る</button>
      <button class="btn btn-primary" onclick="saveStep1()">次へ:LINEビジネスID →</button>
    </div>
  </div>`,
  // 2
  ()=>`<div class="step-content">
    <h2><span class="step-num">2</span>LINEビジネスIDを客名義で作成</h2>
    <div class="step-sub">LINE公式アカウントを作るための事業者ID。<span class="who-pill skeleton">Skeleton</span> 所要: 約10分</div>
    <div class="box">
      <h3>作業手順</h3>
      <ol class="action-list">
        <li><a href="https://www.lycbiz.com/jp/login/" target="_blank" class="btn btn-link" style="font-size:13px;padding:7px 14px">LINEヤフー for Business を開く →</a></li>
        <li>「アカウント新規作成」 → 「メールアドレスで登録」</li>
        <li>登録メールアドレス: <code>${esc(state.gmail||'(Step1のGmail)')}</code> を入力</li>
        <li>パスワードはStep1のGmailと同じか、別途生成して1Passwordに保存</li>
        <li>事業者情報入力 — 屋号: <code>${esc(state.salonName||'(サロン名)')}</code> / 住所: <code>${esc(state.address||'(住所)')}</code> / 代表者: <code>${esc(state.ownerName||'(代表者)')}</code></li>
        <li>登録完了 → 下に記録</li>
      </ol>
    </div>
    <div class="box">
      <h3>記録</h3>
      <div class="field"><label>LINEビジネスIDのログインメール</label><input id="i-lineBizId" value="${esc(state.lineBizId||state.gmail)}" placeholder="${state.gmail||'登録メール'}"></div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="goPrev()">← 戻る</button>
      <button class="btn btn-primary" onclick="saveStep2()">次へ:LINE公式アカウント作成 →</button>
    </div>
  </div>`,
  // 3
  ()=>`<div class="step-content">
    <h2><span class="step-num">3</span>LINE Official Account 作成</h2>
    <div class="step-sub">通知を受け取る専用の公式LINE。<span class="who-pill skeleton">Skeleton</span> 所要: 約5分</div>
    <div class="box">
      <h3>このサロン用に作る公式アカウント</h3>
      <div class="kv"><div class="k">アカウント名</div><div class="v">${esc(state.salonName||'(サロン名)')} 予約通知</div></div>
    </div>
    <div class="box">
      <h3>作業手順</h3>
      <ol class="action-list">
        <li><a href="https://manager.line.biz/" target="_blank" class="btn btn-link" style="font-size:13px;padding:7px 14px">LINE Official Account Manager を開く →</a></li>
        <li>Step2 のビジネスIDでログイン</li>
        <li>「新規アカウント作成」をクリック</li>
        <li>アカウント名: <code>${esc(state.salonName||'(サロン名)')} 予約通知</code></li>
        <li>業種: 「美容・健康」→ 「サロン」</li>
        <li>会社名: <code>${esc(state.salonName||'(サロン名)')}</code></li>
        <li>作成 → アカウント一覧に表示されたら完了</li>
      </ol>
    </div>
    <div class="box">
      <h3>記録</h3>
      <div class="field"><label>作成したLINE公式アカウント名</label><input id="i-lineAccountName" value="${esc(state.lineAccountName||(state.salonName?state.salonName+' 予約通知':''))}" placeholder="${state.salonName||'サロン名'} 予約通知"></div>
    </div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="goPrev()">← 戻る</button>
      <button class="btn btn-primary" onclick="saveStep3()">次へ:トークン取得 →</button>
    </div>
  </div>`,
  // 4
  ()=>`<div class="step-content">
    <h2><span class="step-num">4</span>Messaging API有効化 + 長期トークン発行</h2>
    <div class="step-sub">プログラムからLINEに通知を送るための鍵。<span class="who-pill skeleton">Skeleton</span> 所要: 約5分</div>
    <div class="box">
      <h3>作業手順</h3>
      <ol class="action-list">
        <li><a href="https://manager.line.biz/" target="_blank" class="btn btn-link" style="font-size:13px;padding:7px 14px">LINE Official Account Manager を開く →</a></li>
        <li>左上で <code>${esc(state.lineAccountName||'(LINE公式)')}</code> を選択</li>
        <li>右上「設定」(歯車) → 左メニュー「Messaging API」</li>
        <li>「Messaging APIを利用する」をクリック → プロバイダー選択 or 新規作成 → 同意</li>
        <li>有効化後、自動で <a href="https://developers.line.biz/console/" target="_blank">LINE Developers Console</a> に飛ぶ(飛ばなければ手動で開く)</li>
        <li>「Messaging API設定」タブ → 下の方の「チャネルアクセストークン(長期)」セクション → <strong>「発行」ボタン</strong></li>
        <li>発行された文字列(60〜200文字)をコピー → 下に貼り付け</li>
        <li>続けて「応答設定」タブ → 応答メッセージ: オフ、Webhook: オン</li>
      </ol>
    </div>
    <div class="box">
      <h3>記録</h3>
      <div class="field"><label>チャネルアクセストークン(長期)</label><textarea id="i-lineToken" rows="3" placeholder="ここに発行されたトークンを貼り付け">${esc(state.lineToken)}</textarea><div class="hint">短期トークンはNG。必ず「長期」のボタンを押す</div></div>
    </div>
    <div class="warn"><strong>長期トークンの有効期限は最大期間で発行</strong> — 発行時に期間が選べる(デフォルト最大)。1Passwordにも保存。</div>
    <div class="nav-bar">
      <button class="btn btn-secondary" onclick="goPrev()">← 戻る</button>
      <button class="btn btn-primary" onclick="saveStep4()">次へ:グループID取得 →</button>
    </div>
  </div>`,
  // 5
  ()=>`<div class="step-content">
    <h2><span class="step-num">5</span>通知先LINEグループのID取得</h2>
    <div class="step-sub">スタッフのLINEグループに公式LINEを参加させて、グループIDを取り出す。<span class="who-pill skeleton">Skeleton</span>+<span class="who-pill client">客</span> 所要: 約15分</div>
    <div class="box">
      <h3>事前準備</h3>
      <ol class="action-list">
        <li>客のスマホでスタッフ用LINEグループを作る(無ければ。グループ名: <code>${esc(state.salonName||'')} 予約通知</code>)</li>
        <li>LINE Developers Console で「Messaging API設定」タブを開く → QRコード表示</li>
        <li>客スタッフ全員にQRコードを読み込ませる → 公式LINEを友達追加</li>
        <li>客のスマホで上記グループに公式LINE(<code>${esc(state.lineAccountName||'(LINE公式)')}</code>)を招待</li>
      </ol>
    </div>
    <div class="box">
      <h3>グループID取得手順</h3>
      <ol class="action-list">

function esc(s){return(s||'').toString().replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escHtml(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function generateConfig(){
  const sites=Object.entries(state.sites).filter(([k,v])=>v).map(([k])=>k);
  return `/**
 * ${state.salonName||'(サロン名)'} 予約通知ツール 設定
 * Generated by Skeleton onboarding-wizard
 */
const CONFIG = {
  LINE_CHANNEL_ACCESS_TOKEN: '${state.lineToken||'（Step4で取得）'}',

  LINE_TO_IDS: [
    '${state.groupId||'（Step5で取得）'}'
  ],

  SALON_NAME: '${state.salonName||''}',

  // サイト別カレンダーは setupSiteCalendars() 実行で自動作成される
  CALENDAR_IDS: {
    hotpepper: '',
    rakuten:   '',
    minimo:    '',
    epark:     ''
  },

  // 既知バグ回避: FROM_ADDRESS は空のまま
  FROM_ADDRESS: '',

  // 監視対象サイト
  ENABLED_SITES: ${JSON.stringify(sites)},

  PROCESSED_LABEL: 'HotPepper-処理済み',
  ENABLE_HEALTHCHECK: true,
  ENABLE_MONTHLY_REPORT: true
};`;
}

function generateHandover(){
  return `■ ${state.salonName||'(サロン名)'} 様 ホットペッパーLINEツール 引き渡し情報

【専用Gmail】
  アドレス: ${state.gmail||''}
  パスワード: ${state.gmailPass||''}
  ※2段階認証あり(客電話 ${state.clientPhone||''})

【LINE公式アカウント】
  アカウント名: ${state.lineAccountName||''}
  管理画面: https://manager.line.biz/
  ログイン: ${state.lineBizId||state.gmail||''}

【GAS(予約通知ツール本体)】
  共有URL(コピー用): ${state.gasShareUrl||''}
  ※当日このURLを開いて「コピーを作成」ボタンを押す

【納品手順】
  1) 専用Gmailにログイン
  2) GAS共有URLを開く → コピーを作成
  3) installTriggers 関数を実行 → 認可
  4) setupSiteCalendars 関数を実行
  5) testLine 関数を実行 → スタッフLINEで着信確認

【サポート窓口】
  Skeleton Inc. / hello@skeleton.example
  通知が止まった/おかしい時はご連絡ください`;
}

function render(){
  const i=state.cur;
  document.getElementById('step-container').innerHTML=STEPS[i]();
  document.querySelectorAll('#step-list li').forEach((li,idx)=>{
    li.classList.toggle('active',idx===i);
    li.classList.toggle('done',!!state.done[idx]&&idx!==i);
  });
  document.getElementById('progress-bar').style.width=((i)/(STEPS.length-1)*100)+'%';
  window.scrollTo(0,0);
}
function goNext(){state.done[state.cur]=true;state.cur=Math.min(state.cur+1,STEPS.length-1);save();render()}
function goPrev(){state.cur=Math.max(state.cur-1,0);save();render()}

function saveStep0(){
  state.salonName=val('i-salonName');
  state.salonCode=val('i-salonCode').toLowerCase().replace(/[^a-z0-9]/g,'');
  state.ownerName=val('i-ownerName');
  state.clientPhone=val('i-clientPhone');
  state.address=val('i-address');
  state.staffCount=val('i-staffCount');
  state.sites={hotpepper:document.getElementById('s-hp').checked,rakuten:document.getElementById('s-rk').checked,minimo:document.getElementById('s-mn').checked,epark:document.getElementById('s-ep').checked};
  if(!state.salonName||!state.salonCode){alert('サロン名と略号は必須');return}
  goNext();
}
function saveStep1(){state.gmail=val('i-gmail');state.gmailPass=val('i-gmailPass');goNext()}
function saveStep2(){state.lineBizId=val('i-lineBizId');goNext()}
function saveStep3(){state.lineAccountName=val('i-lineAccountName');goNext()}
function saveStep4(){state.lineToken=val('i-lineToken');goNext()}
function saveStep5(){state.groupId=val('i-groupId');goNext()}
function saveStep8(){state.gasShareUrl=val('i-gasShareUrl');goNext()}
function val(id){return(document.getElementById(id)||{}).value||''}

function copyCode(id,btn){
  const t=document.getElementById(id).innerText;
  navigator.clipboard.writeText(t).then(()=>{
    btn.textContent='✓ コピーしました';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 コピー';btn.classList.remove('copied')},1800);
  });
}

document.querySelectorAll('#step-list li').forEach(li=>{
  li.addEventListener('click',()=>{state.cur=parseInt(li.dataset.step);save();render()});
});
render();
</script>
