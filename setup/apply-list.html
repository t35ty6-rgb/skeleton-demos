<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>申込一覧｜Skeleton Inc.</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/app-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/app-icon-192.png">
<meta name="theme-color" content="#c44569">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skeleton 申込一覧">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f7;color:#1d1d1f;padding:20px}
.wrap{max-width:1400px;margin:0 auto}
.brand{font-size:11px;letter-spacing:.25em;color:#888;text-align:center;margin-bottom:6px}
h1{font-size:22px;text-align:center;font-weight:600;color:#c44569;margin-bottom:16px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-top:4px solid #c44569}
.kpi.kpi-1{border-top-color:#c44569}
.kpi.kpi-2{border-top-color:#06c755}
.kpi.kpi-3{border-top-color:#1f3a5f}
.kpi.kpi-4{border-top-color:#ff9800}
.kpi .label{font-size:12px;color:#888;letter-spacing:.05em;margin-bottom:6px}
.kpi .value{font-size:28px;font-weight:700;color:#1d1d1f;line-height:1.1}
.kpi .unit{font-size:13px;color:#888;margin-left:4px}
.kpi .delta{font-size:12px;margin-top:6px}
.kpi .delta.up{color:#06a050}
.kpi .delta.down{color:#d04040}

/* Chart */
.chart-card{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:16px}
.chart-card h3{font-size:14px;color:#1f3a5f;margin-bottom:14px;font-weight:600}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px;border-bottom:2px solid #e0e0e0;position:relative}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:24px}
.bar{width:80%;background:linear-gradient(180deg,#ff6b9d,#c44569);border-radius:6px 6px 0 0;min-height:2px;transition:all .3s;position:relative}
.bar:hover{filter:brightness(1.1)}
.bar-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:#c44569;font-weight:bold;white-space:nowrap}
.bar-label{font-size:11px;color:#666;margin-top:6px;white-space:nowrap}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;background:#fff;padding:12px 16px;border-radius:10px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px;padding:8px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px}
.toolbar .search:focus{outline:none;border-color:#c44569}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:linear-gradient(135deg,#ff6b9d,#c44569);color:#fff}
.btn-primary:hover{transform:translateY(-1px)}
.btn-secondary{background:#f0f0f0;color:#555}
.btn-secondary:hover{background:#e0e0e0}
.btn-dl{background:#06c755;color:#fff;padding:6px 12px;font-size:12px;white-space:nowrap}
.btn-dl:hover{background:#04a945}

.summary-line{font-size:13px;color:#666;margin-bottom:10px}

/* Table */
.table-wrap{background:#fff;border-radius:10px;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.05);max-height:calc(100vh - 540px);min-height:200px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#fff0f5;color:#c44569;font-weight:700;padding:12px 14px;text-align:left;border-bottom:2px solid #c44569;cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{background:#ffe0eb}
thead th.no-sort{cursor:default}
thead th.no-sort:hover{background:#fff0f5}
thead th .arrow{opacity:0;margin-left:4px}
thead th.sorted .arrow{opacity:1}
tbody td{padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:top}
tbody tr:hover{background:#fffafa}
tbody tr:nth-child(even){background:#fafafa}
tbody tr:nth-child(even):hover{background:#fff5f7}

.empty{text-align:center;padding:40px;color:#999;font-size:14px}
.error{background:#fff3cd;color:#856404;padding:14px;border-radius:8px;margin:14px 0}
.loading{text-align:center;padding:40px;color:#666}

.cell-secret{font-family:'SF Mono',Menlo,monospace;font-size:11px;color:#555}
.cell-secret.hidden-content{filter:blur(4px);cursor:pointer}
.cell-secret.hidden-content:hover{filter:none}

.footer{text-align:center;font-size:11px;color:#999;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">SKELETON INC.</div>
  <h1>📋 ホットペッパーLINEツール 申込一覧</h1>

  <!-- KPIサマリー -->
  <div class="kpi-grid" id="kpi-grid">
    <div class="kpi kpi-1"><div class="label">📥 全申込件数</div><div class="value" id="kpi-total">-</div></div>
    <div class="kpi kpi-2"><div class="label">📅 今月の申込</div><div class="value" id="kpi-this-month">-</div><div class="delta" id="kpi-this-delta">-</div></div>
    <div class="kpi kpi-3"><div class="label">💰 今月の売上見込</div><div class="value" id="kpi-this-rev">-</div><div class="delta" id="kpi-rev-delta">-</div></div>
    <div class="kpi kpi-4"><div class="label">📝 契約プラン内訳</div><div class="value" id="kpi-plan-mix" style="font-size:14px;line-height:1.6">-</div></div>
  </div>

  <!-- グラフ -->
  <div class="chart-card">
    <h3>📊 月別申込件数(直近6ヶ月)</h3>
    <div class="chart" id="chart"></div>
  </div>

  <!-- ツールバー -->
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="🔍 サロン名・電話・メールで絞り込み...">
    <button class="btn btn-secondary" onclick="toggleSecrets()">👁 パスワード表示切替</button>
    <button class="btn btn-secondary" onclick="exportCSV()">📥 CSVダウンロード</button>
    <button class="btn btn-primary" onclick="loadList()">🔄 再読み込み</button>
  </div>

  <div class="summary-line" id="summary">読み込み中...</div>

  <div class="table-wrap" id="table-wrap">
    <div class="loading" id="loading">⏳ 読み込み中…</div>
  </div>

  <div class="footer">
    <strong>Skeleton Inc.</strong> — 申込内容は自動でこの一覧に集約されます
  </div>
</div>

<script>
const PARAMS = new URLSearchParams(location.search);
const VIEWER_KEY = PARAMS.get('key') || '';
const API = 'https://asia-northeast1-skeleton-pricer-130118.cloudfunctions.net/skeleton-intake';
const TEMPLATE_URL = 'setup-template.html';

// プラン単価
const PLAN_PRICE = {
  'demo': 0,
  'light': 6980,
  'standard': 13800,
  'pro': 18800,
};
function priceFromText(t){
  if(!t) return 0;
  if(t.includes('デモ')) return 0;
  if(t.includes('ライト')) return 6980;
  if(t.includes('スタンダード')) return 13800;
  if(t.includes('プロ')) return 18800;
  return 0;
}
function planCodeFromText(t){
  if(!t) return 'unknown';
  if(t.includes('デモ')) return 'demo';
  if(t.includes('ライト')) return 'light';
  if(t.includes('スタンダード')) return 'standard';
  if(t.includes('プロ')) return 'pro';
  return 'unknown';
}

let DATA = { header: [], rows: [] };
let SECRETS_VISIBLE = false;
let SORT_COL = null;
let SORT_DIR = 1;

const SECRET_COLS = new Set(['Gmail PW', 'LINE PW']);

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function parseDate(s){
  // "2026-05-13 16:21" 形式から Date オブジェクトへ
  if(!s) return null;
  const m = s.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})\D+(\d{1,2}):(\d{1,2})/);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
}
function ymKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function fmtYen(n){
  return '¥' + Math.round(n).toLocaleString();
}

async function loadList(){
  if(!VIEWER_KEY){
    document.getElementById('table-wrap').innerHTML =
      '<div class="error">URLに <code>?key=司に渡されたトークン</code> を追加してください</div>';
    document.getElementById('summary').textContent = '';
    return;
  }
  document.getElementById('table-wrap').innerHTML = '<div class="loading">⏳ 読み込み中…</div>';
  try {
    const res = await fetch(`${API}?key=${encodeURIComponent(VIEWER_KEY)}`);
    const j = await res.json();
    if(!j.ok){
      document.getElementById('table-wrap').innerHTML =
        `<div class="error">エラー: ${esc(j.error || 'unknown')}</div>`;
      return;
    }
    DATA = j;
    updateKPIs();
    drawChart();
    render();
  } catch(e){
    document.getElementById('table-wrap').innerHTML =
      `<div class="error">通信エラー: ${esc(e.message)}</div>`;
  }
}

function updateKPIs(){
  const rows = DATA.rows;
  const now = new Date();
  const thisYM = ymKey(now);
  const lastMonth = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastYM = ymKey(lastMonth);

  let thisMonthCount = 0, lastMonthCount = 0;
  let thisMonthRev = 0, lastMonthRev = 0;
  const planMix = {};
  for(const r of rows){
    const d = parseDate(r['受付日時(JST)']);
    const ym = d ? ymKey(d) : '';
    const price = priceFromText(r['プラン']);
    const planCode = planCodeFromText(r['プラン']);
    planMix[planCode] = (planMix[planCode]||0) + 1;
    if(ym === thisYM){
      thisMonthCount++;
      thisMonthRev += price;
    } else if(ym === lastYM){
      lastMonthCount++;
      lastMonthRev += price;
    }
  }

  document.getElementById('kpi-total').textContent = rows.length;
  document.getElementById('kpi-this-month').innerHTML = `${thisMonthCount}<span class="unit">件</span>`;
  document.getElementById('kpi-this-rev').innerHTML = fmtYen(thisMonthRev);

  const dCount = thisMonthCount - lastMonthCount;
  const dCountEl = document.getElementById('kpi-this-delta');
  dCountEl.textContent = `先月比: ${dCount>=0?'+':''}${dCount} 件 (先月${lastMonthCount}件)`;
  dCountEl.className = 'delta ' + (dCount>0?'up':dCount<0?'down':'');

  const dRev = thisMonthRev - lastMonthRev;
  const dRevEl = document.getElementById('kpi-rev-delta');
  dRevEl.textContent = `先月比: ${dRev>=0?'+':''}${fmtYen(Math.abs(dRev))} (先月${fmtYen(lastMonthRev)})`;
  dRevEl.className = 'delta ' + (dRev>0?'up':dRev<0?'down':'');

  const mixLabel = { demo:'🎁デモ', light:'💴ライト', standard:'💎スタンダ', pro:'🏆プロ', unknown:'❓その他' };
  const mixStr = Object.entries(planMix).map(([k,v]) => `${mixLabel[k]||k}: ${v}件`).join('<br>');
  document.getElementById('kpi-plan-mix').innerHTML = mixStr || '-';
}

function drawChart(){
  const rows = DATA.rows;
  const now = new Date();
  // 直近6ヶ月のキー
  const months = [];
  for(let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ key: ymKey(d), label: `${d.getMonth()+1}月`, count:0 });
  }
  for(const r of rows){
    const d = parseDate(r['受付日時(JST)']);
    if(!d) continue;
    const key = ymKey(d);
    const m = months.find(x => x.key === key);
    if(m) m.count++;
  }
  const max = Math.max(1, ...months.map(m => m.count));
  document.getElementById('chart').innerHTML = months.map(m => {
    const h = (m.count / max) * 140;
    return `<div class="bar-col">
      <div class="bar-val">${m.count>0?m.count:''}</div>
      <div class="bar" style="height:${h}px"></div>
      <div class="bar-label">${m.label}</div>
    </div>`;
  }).join('');
}

function render(){
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  let rows = DATA.rows;
  if(q){
    rows = rows.filter(r => Object.values(r).some(v => String(v).toLowerCase().includes(q)));
  }
  if(SORT_COL){
    rows = [...rows].sort((a,b)=>{
      const va=String(a[SORT_COL]||''), vb=String(b[SORT_COL]||'');
      return va.localeCompare(vb,'ja')*SORT_DIR;
    });
  }
  document.getElementById('summary').textContent =
    `件数: ${rows.length} / 全${DATA.rows.length}件` +
    (q ? ` (🔍「${q}」で絞り込み中)` : '');

  if(rows.length===0){
    document.getElementById('table-wrap').innerHTML =
      '<div class="empty">該当する申込はありません</div>';
    return;
  }

  // ヘッダー + 「専用ウィザード」列
  const ths = DATA.header.map(h => {
    const sorted = (SORT_COL===h) ? ' sorted' : '';
    const arrow = (SORT_COL===h) ? (SORT_DIR>0?'▲':'▼') : '';
    return `<th class="${sorted}" onclick="sortBy('${esc(h)}')">${esc(h)} <span class="arrow">${arrow}</span></th>`;
  }).join('') + `<th class="no-sort">📥 専用ウィザード</th>`;

  const trs = rows.map((r,idx) => {
    const tds = DATA.header.map(h => {
      const v = r[h] || '';
      const isSecret = SECRET_COLS.has(h);
      if(isSecret){
        const cls = SECRETS_VISIBLE ? 'cell-secret' : 'cell-secret hidden-content';
        return `<td><span class="${cls}" onclick="this.classList.remove('hidden-content')">${esc(v)}</span></td>`;
      }
      return `<td>${esc(v)}</td>`;
    }).join('');
    // データ属性で行データを埋め込み
    const rowDataAttr = encodeURIComponent(JSON.stringify(r));
    return `<tr>${tds}<td><button class="btn btn-dl" onclick='downloadWizard(${JSON.stringify(rowDataAttr)})'>📥 DL</button></td></tr>`;
  }).join('');

  document.getElementById('table-wrap').innerHTML =
    `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
}

// ローマ字化(簡易): 日本語サロン名 → 英数3-6字
function genSalonCode(salonName){
  if(!salonName) return 'client';
  // 英数だけ抜き取って、無ければ「client」+ハッシュ
  const ascii = salonName.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(ascii.length >= 3) return ascii.slice(0, 6);
  let h = 0;
  for(let i=0; i<salonName.length; i++) h = (h*31 + salonName.charCodeAt(i)) >>> 0;
  return 'client' + (h % 10000).toString().padStart(4,'0');
}

async function downloadWizard(rowDataEnc){
  try {
    const rowData = JSON.parse(decodeURIComponent(rowDataEnc));
    const salonName = rowData['サロン名'] || '客先';
    const salonCode = genSalonCode(salonName);
    const planText = rowData['プラン'] || '';
    const planCode = planCodeFromText(planText);
    const gmail = rowData['Gmail'] || '';
    const lineAccount = rowData['LINE公式'] || `${salonName} 予約通知`;
    const fromAddress = (rowData['予約サイト']||'').includes('ホットペッパー') ?
      'beauty.hotpepper.jp salonboard.com' : 'beauty.hotpepper.jp salonboard.com';

    // スタッフ: メール列に複数あれば分解、なければお店メアドのみ
    const ownerMail = rowData['メール'] || gmail;
    const staffList = [{ name: rowData['代表者']||'代表', mail: ownerMail }];
    if(gmail && gmail !== ownerMail) staffList.push({ name:'お店', mail: gmail });

    const clientData = {
      salonName: salonName,
      salonCode: salonCode,
      ownerName: rowData['代表者'] || '(代表者)',
      address: rowData['住所'] || '',
      contractPlan: planCode === 'unknown' ? 'demo' : planCode,
      gmailAddress: gmail,
      lineAccountName: lineAccount,
      fromAddress: fromAddress,
      siteAddrs: { hotpepper: fromAddress },
      adjustStaff: staffList
    };

    const res = await fetch(TEMPLATE_URL);
    let html = await res.text();
    // CLIENT_DATA を JSON.stringify で置換
    const replacement = 'CLIENT_DATA = /*__CLIENT_DATA__*/ ' + JSON.stringify(clientData);
    html = html.replace(/CLIENT_DATA = \/\*__CLIENT_DATA__\*\/ \{[\s\S]*?\}\s*;/m,
                         replacement + ';');
    const blob = new Blob([html], { type:'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `setup-${salonCode}.html`;
    a.click();
    URL.revokeObjectURL(url);
  } catch(e){
    alert('ダウンロード失敗: ' + e.message);
  }
}

function sortBy(col){
  if(SORT_COL===col) SORT_DIR = -SORT_DIR;
  else { SORT_COL = col; SORT_DIR = 1; }
  render();
}

function toggleSecrets(){
  SECRETS_VISIBLE = !SECRETS_VISIBLE;
  render();
}

function exportCSV(){
  const rows = DATA.rows;
  if(rows.length===0){ alert('データがありません'); return; }
  const head = DATA.header.join(',');
  const body = rows.map(r =>
    DATA.header.map(h => `"${String(r[h]||'').replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const csv = '﻿' + head + '\n' + body;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `申込一覧_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

document.getElementById('search').addEventListener('input', render);
loadList();
</script>
</body>
</html>
