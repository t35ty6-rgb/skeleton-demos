<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サロンワークス 営業提案動画 · Skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:    oklch(0.985 0.005 130);
    --ink:   oklch(0.18 0.010 130);
    --ink2:  oklch(0.35 0.015 130);
    --ink3:  oklch(0.55 0.018 130);
    --line:  oklch(0.86 0.012 130);
    --leaf:  oklch(0.36 0.085 145);
    --leaf-tint: oklch(0.96 0.020 145);
    --f-body: 'Noto Sans JP','Hiragino Sans',system-ui,sans-serif;
    --f-num:  'Inter Tight','Inter',system-ui,sans-serif;
    --alert:  oklch(0.32 0.12 20);
    --alert-tint: oklch(0.96 0.020 27);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--f-body);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'palt' 1;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 40px 56px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
  }
  .brand {
    font-family: var(--f-num);
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 400;
  }
  .title {
    font-weight: 900;
    font-size: clamp(22px, 3vw, 32px);
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1.15;
  }
  .title span { color: var(--leaf); }
  .header-rule { flex: 1; }
  .meta {
    font-family: var(--f-num);
    font-size: 12px;
    color: var(--ink3);
    letter-spacing: 0.06em;
  }

  /* ── Layout ── */
  main {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 85px);
  }

  /* ── Sidebar ── */
  aside {
    width: 240px;
    flex: 0 0 240px;
    border-right: 1px solid var(--line);
    padding: 28px 0;
  }
  .sidebar-label {
    font-family: var(--f-num);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink3);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0 24px 14px;
  }
  .ch-list {
    list-style: none;
  }
  .ch-list li {
    border-top: 1px solid var(--line);
  }
  .ch-list button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    cursor: pointer;
    padding: 14px 24px;
    display: flex;
    gap: 12px;
    align-items: baseline;
    color: var(--ink2);
    font-family: var(--f-body);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    transition: background 0.15s;
  }
  .ch-list button:hover { background: oklch(0.972 0.008 130); }
  .ch-list button.active {
    background: var(--leaf-tint);
    color: oklch(0.22 0.075 145);
  }
  .ch-num {
    font-family: var(--f-num);
    font-size: 10px;
    font-weight: 500;
    color: var(--ink3);
    letter-spacing: 0.10em;
    flex: 0 0 auto;
    padding-top: 1px;
  }
  .ch-list button.active .ch-num { color: var(--leaf); }

  /* ── Video area ── */
  .video-area {
    flex: 1;
    padding: 40px 48px 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .video-wrap {
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
  }
  video {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── Chapter info ── */
  .ch-info {
    max-width: 720px;
  }
  .ch-info-title {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .ch-info-body {
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink2);
    max-width: 58ch;
  }

  /* ── Timeline bar ── */
  .timeline {
    display: flex;
    gap: 3px;
    align-items: center;
    max-width: 960px;
  }
  .tl-seg {
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    flex: 1;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .tl-seg:hover { background: var(--ink3); }
  .tl-seg.passed { background: var(--leaf); opacity: 0.6; }
  .tl-seg.active { background: var(--leaf); opacity: 1; }

  /* ── Footer ── */
  footer {
    padding: 20px 56px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .footer-brand {
    font-family: var(--f-num);
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .footer-rule { flex: 1; }
  .footer-meta {
    font-family: var(--f-num);
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.06em;
  }

  /* ── Mobile 390px ── */
  @media (max-width: 640px) {
    header { padding: 20px 20px 16px; }
    main { flex-direction: column; }
    aside {
      width: 100%;
      flex: none;
      border-right: none;
      border-bottom: 1px solid var(--line);
      padding: 16px 0;
    }
    .video-area { padding: 12px; }
    video { width: 100%; height: auto; }
    .video-wrap { aspect-ratio: 16/9; }
    footer { padding: 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Skeleton Inc.</div>
  <h1 class="title">サロンワークス <span>営業提案動画</span></h1>
  <div class="header-rule"></div>
  <div class="meta">2026 · 07</div>
</header>

<main>
  <aside>
    <div class="sidebar-label">章構成</div>
    <ul class="ch-list" id="chList">
      <li><button class="active" data-t="0" data-id="ch01" onclick="seekTo(this)"><span class="ch-num">01</span>冒頭 · 全体像</button></li>
      <li><button data-t="30.8" data-id="ch02" onclick="seekTo(this)"><span class="ch-num">02</span>現状の課題 · 3つ</button></li>
      <li><button data-t="88.5" data-id="ch03" onclick="seekTo(this)"><span class="ch-num">03</span>LINE予約 · 手数料ゼロ</button></li>
      <li><button data-t="138.4" data-id="ch04" onclick="seekTo(this)"><span class="ch-num">04</span>LINE販売 · 物販自動化</button></li>
      <li><button data-t="194.8" data-id="ch05" onclick="seekTo(this)"><span class="ch-num">05</span>顧客管理 · 一枚カルテ</button></li>
      <li><button data-t="242.7" data-id="ch06" onclick="seekTo(this)"><span class="ch-num">06</span>狙撃配信 · 6パターン</button></li>
      <li><button data-t="338.8" data-id="ch07" onclick="seekTo(this)"><span class="ch-num">07</span>経営ダッシュボード</button></li>
      <li><button data-t="373.5" data-id="ch08" onclick="seekTo(this)"><span class="ch-num">08</span>料金 · 先行3店舗</button></li>
      <li><button data-t="427.2" data-id="ch09" onclick="seekTo(this)"><span class="ch-num">09</span>締め · CTA</button></li>
    </ul>
  </aside>

  <div class="video-area">
    <div class="video-wrap">
      <video id="vid" controls preload="metadata" playsinline>
        <source src="salonworks-proposal.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Chapter timeline bar -->
    <div class="timeline" id="timeline">
      <div class="tl-seg active" data-t="0" data-end="30.8" title="冒頭" onclick="seekSeg(this)"></div>
      <div class="tl-seg" data-t="30.8" data-end="88.5" title="課題3つ" onclick="seekSeg(this)" style="flex:1.87;"></div>
      <div class="tl-seg" data-t="88.5" data-end="138.4" title="LINE予約" onclick="seekSeg(this)" style="flex:1.62;"></div>
      <div class="tl-seg" data-t="138.4" data-end="194.8" title="LINE販売" onclick="seekSeg(this)" style="flex:1.83;"></div>
      <div class="tl-seg" data-t="194.8" data-end="242.7" title="顧客管理" onclick="seekSeg(this)" style="flex:1.56;"></div>
      <div class="tl-seg" data-t="242.7" data-end="338.8" title="狙撃配信" onclick="seekSeg(this)" style="flex:3.12;"></div>
      <div class="tl-seg" data-t="338.8" data-end="373.5" title="ダッシュボード" onclick="seekSeg(this)" style="flex:1.13;"></div>
      <div class="tl-seg" data-t="373.5" data-end="427.2" title="料金" onclick="seekSeg(this)" style="flex:1.74;"></div>
      <div class="tl-seg" data-t="427.2" data-end="445.8" title="締め" onclick="seekSeg(this)" style="flex:0.60;"></div>
    </div>

    <!-- Chapter info card -->
    <div class="ch-info" id="chInfo">
      <div class="ch-info-title" id="chTitle">冒頭 · 全体像</div>
      <div class="ch-info-body" id="chBody">サロンワークスの立ち位置を宣言する30秒。予約管理ツールでも配信ツールでもない「LINE 1本に全部集約する装置」というコアメッセージ。</div>
    </div>
  </div>
</main>

<footer>
  <div class="footer-brand">Skeleton Inc.</div>
  <div class="footer-rule"></div>
  <div class="footer-meta">Salon Works Proposal · 7m 26s · 2026-07</div>
</footer>

<script>
const vid = document.getElementById('vid');
const CHAPTERS = [
  { t: 0,     end: 30.8,  id: 'ch01', title: '冒頭 · 全体像',          body: 'サロンワークスの立ち位置を宣言する30秒。予約管理ツールでも配信ツールでもない「LINE 1本に全部集約する装置」というコアメッセージ。' },
  { t: 30.8,  end: 88.5,  id: 'ch02', title: '現状の課題 · 3つ',        body: 'ホットペッパー手数料 / 施術中しか物販できない / 顧客情報がスタイリストの頭の中。3つの痛みを1つずつ深掘り。' },
  { t: 88.5,  end: 138.4, id: 'ch03', title: 'LINE予約 · 手数料ゼロ',   body: '24時間LINE予約完結。実際の管理画面を初公開。導入サロンでHP依存が70%→45%に下がった実測データを提示。' },
  { t: 138.4, end: 194.8, id: 'ch04', title: 'LINE販売 · 物販自動化',   body: 'LINE内ショップで施術室の外でも物販。消費目安リマインドで再購入率 15%→34%。マイページで来店前習慣を作る。' },
  { t: 194.8, end: 242.7, id: 'ch05', title: '顧客管理 · 一枚カルテ',   body: '312名の顧客情報が1画面に。スタイリスト依存からサロン依存への転換。退職しても顧客は消えない。' },
  { t: 242.7, end: 338.8, id: 'ch06', title: '狙撃配信 · 6パターン',    body: '休眠掘り起こし(反応率18-25%・全員送信の5倍)・クロスセル(客単価1.4-1.8倍)・物販リマインド(再購入率34%)の3つを深掘り。全6パターン設定後は自動。' },
  { t: 338.8, end: 373.5, id: 'ch07', title: '経営ダッシュボード',       body: '8つのKPIを1画面で。曜日ヒートマップで稼働の薄い時間帯を特定し、そこにターゲット配信を入れる経営ループ。' },
  { t: 373.5, end: 427.2, id: 'ch08', title: '料金 · 先行3店舗',        body: '初期費用ゼロ・月額18,800円・縛りなし。IT導入補助金で実質9,400円〜。今月スタートの3店舗に限り¥15,800永久固定+機能優先実装。' },
  { t: 427.2, end: 445.8, id: 'ch09', title: '締め · CTA',              body: '北陸で最初にこの統合形態に到達する3店舗に。LINEをそのままCRMにする仕組みを持つか否かで3年後に大きな差が出る。' },
];

function seekTo(btn) {
  const t = parseFloat(btn.dataset.t);
  vid.currentTime = t;
  vid.play().catch(() => {});
}
function seekSeg(seg) {
  vid.currentTime = parseFloat(seg.dataset.t);
  vid.play().catch(() => {});
}

function updateActiveChapter(t) {
  const idx = CHAPTERS.findIndex((c, i) => {
    const next = CHAPTERS[i + 1];
    return t >= c.t && (!next || t < next.t);
  });
  if (idx < 0) return;
  const ch = CHAPTERS[idx];

  // Sidebar
  document.querySelectorAll('#chList button').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  // Timeline segments
  document.querySelectorAll('#timeline .tl-seg').forEach((seg, i) => {
    seg.classList.toggle('active', i === idx);
    seg.classList.toggle('passed', i < idx);
  });

  // Info card
  document.getElementById('chTitle').textContent = ch.title;
  document.getElementById('chBody').textContent = ch.body;
}

vid.addEventListener('timeupdate', () => updateActiveChapter(vid.currentTime));
vid.addEventListener('loadedmetadata', () => updateActiveChapter(0));

// URL fragment 対応 (#ch01 〜 #ch09)
if (location.hash) {
  const fragId = location.hash.slice(1); // e.g. "ch06"
  const ch = CHAPTERS.find(c => c.id === fragId);
  if (ch) {
    const applySeek = () => {
      vid.currentTime = ch.t;
      updateActiveChapter(ch.t);
      vid.play().catch(() => {});
    };
    if (vid.readyState >= 1) {
      applySeek();
    } else {
      vid.addEventListener('loadedmetadata', applySeek, { once: true });
    }
  }
}
</script>
</body>
</html>
