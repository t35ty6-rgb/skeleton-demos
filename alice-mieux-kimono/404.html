<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お探しのページが見つかりませんでした ｜ Hair atelier Alice mieux</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/alice/concept-main.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@500;600;700&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1310;--ink-2:#4a3d35;--ink-3:#9b8c80;--bg:#fff;--bg-2:#fbf6f3;--line:#e6dcd3;--red:#b53b3b;--serif:'Shippori Mincho',serif;--sans:'Noto Sans JP',sans-serif;--ui:'Inter Tight',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--sans);background:var(--bg-2);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:40px 20px}
.box{background:#fff;max-width:560px;width:100%;padding:64px 40px;text-align:center;border:1px solid var(--line)}
.num{font-family:var(--ui);font-size:88px;font-weight:700;letter-spacing:.04em;color:var(--red);line-height:1;margin-bottom:8px}
.lab{font-family:var(--ui);font-size:11px;letter-spacing:.32em;color:var(--ink-3);font-weight:700;text-transform:uppercase;margin-bottom:28px}
h1{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.12em;line-height:1.6;color:var(--ink);margin-bottom:14px}
p{font-size:13.5px;color:var(--ink-2);line-height:1.95;letter-spacing:.04em}
.actions{margin-top:32px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:14px 28px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em;border:1px solid var(--ink);color:var(--ink);text-decoration:none;transition:.2s}
.btn:hover{background:var(--ink);color:#fff}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.p:hover{background:#8c2929;border-color:#8c2929}
@media(max-width:520px){.box{padding:48px 26px}.num{font-size:64px}h1{font-size:17px}}
</style>
</head>
<body>
<div class="box">
  <div class="num">404</div>
  <div class="lab">PAGE NOT FOUND</div>
  <h1>お探しのページが<br>見つかりませんでした</h1>
  <p>URL がお間違えでないかご確認のうえ、 トップページからお探しくださいませ。 お急ぎの場合は、 お電話・LINE よりお気軽にお問い合わせいただけます。</p>
  <div class="actions">
    <a href="/skeleton-demos/alice-mieux-kimono/" class="btn p">トップへ戻る ›</a>
    <a href="tel:0776733633" class="btn">0776 - 73 - 3633</a>
  </div>
</div>
</body>
</html>
