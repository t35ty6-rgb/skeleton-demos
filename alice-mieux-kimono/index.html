<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きもの｜Hair atelier Alice mieux</title>
<meta name="description" content="あわら市の美容室 Hair atelier Alice mieux の着物レンタル。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:        oklch(0.99 0 0);
  --ink:       oklch(0.16 0 0);
  --ink-2:     oklch(0.40 0 0);
  --ink-3:     oklch(0.60 0 0);
  --line:      oklch(0.92 0 0);
  --line-soft: oklch(0.95 0 0);

  --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
  --ui:    'Inter Tight', 'Helvetica Neue', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:var(--ui);
  font-weight:400;
  font-size:14px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'palt';
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:400;text-wrap:balance;letter-spacing:-.005em}
p{text-wrap:pretty}

/* ============ Header ============ */
.h{
  padding:28px max(28px, 4vw) 24px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:32px;
}
.h .l, .h .r{display:flex;gap:24px;font-size:12px;color:var(--ink-2)}
.h .r{justify-content:flex-end}
.h .l a, .h .r a{transition:color .25s}
.h .l a:hover, .h .r a:hover{color:var(--ink)}
.h .c{
  font-family:var(--serif);
  font-weight:500;
  font-size:15px;
  letter-spacing:.36em;
  color:var(--ink);
  white-space:nowrap;
}

/* ============ Hero ============ */
.hero{
  padding:120px max(28px, 4vw) 130px;
  text-align:center;
  max-width:1200px;
  margin:0 auto;
}
.hero h1{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(40px, 6.4vw, 76px);
  line-height:1.3;
  letter-spacing:.02em;
}
.hero .sub{
  margin-top:36px;
  font-size:14px;
  color:var(--ink-2);
  line-height:2;
  max-width:34ch;
  margin-left:auto;
  margin-right:auto;
}

/* ============ Collection toolbar ============ */
.tools{
  max-width:1320px;
  margin:0 auto;
  padding:24px max(28px, 4vw);
  display:flex;
  align-items:center;
  gap:24px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.tools .count{
  font-family:var(--serif);
  font-size:14px;
  color:var(--ink);
  letter-spacing:.04em;
  white-space:nowrap;
}
.tools .count b{font-weight:500}
.tools .filters{
  display:flex;
  gap:6px;
  flex:1;
  flex-wrap:wrap;
  justify-content:center;
}
.tools .filters button{
  font-family:var(--ui);
  font-size:12.5px;
  color:var(--ink-3);
  padding:6px 14px;
  border-radius:999px;
  transition:color .25s, background .25s;
}
.tools .filters button:hover{color:var(--ink)}
.tools .filters button.on{color:var(--bg);background:var(--ink)}
.tools .sort{
  font-size:12.5px;
  color:var(--ink-3);
  display:flex;
  gap:8px;
  align-items:center;
  white-space:nowrap;
}
.tools .sort select{
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  border:0;
  background:transparent;
  cursor:pointer;
  appearance:none;
  padding-right:14px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 5l3 3 3-3' stroke='%23333' stroke-width='1.2' fill='none'/></svg>");
  background-repeat:no-repeat;
  background-position:right center;
  background-size:12px;
}

/* ============ Grid ============ */
.grid{
  max-width:1320px;
  margin:0 auto;
  padding:48px max(28px, 4vw) 64px;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  column-gap:32px;
  row-gap:72px;
}
.card{cursor:pointer}
.card .img{
  position:relative;
  aspect-ratio:.74/1;
  overflow:hidden;
  background:#f0ebe4;
}
.card .img .swatch{
  position:absolute;inset:0;
  background:
    linear-gradient(160deg, transparent 30%, rgba(255,255,255,.10) 50%, transparent 70%),
    linear-gradient(180deg, var(--c-l) 0%, var(--c-m) 60%, var(--c-d) 100%);
  transition:transform 1s cubic-bezier(.2,.7,.2,1);
}
.card:hover .img .swatch{transform:scale(1.04)}

.card .meta{
  margin-top:18px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
}
.card .meta .name{
  font-family:var(--serif);
  font-weight:500;
  font-size:16px;
  color:var(--ink);
  letter-spacing:.04em;
}
.card .meta .cat{
  font-size:11px;
  color:var(--ink-3);
  margin-top:3px;
  letter-spacing:.04em;
}
.card .meta .price{
  font-family:var(--serif);
  font-weight:400;
  font-size:15px;
  color:var(--ink);
  white-space:nowrap;
  letter-spacing:.02em;
}

.more{padding:24px 0 120px;text-align:center}
.more button{
  font-size:13px;
  color:var(--ink);
  letter-spacing:.06em;
  padding:14px 32px;
  border:1px solid var(--ink);
  border-radius:999px;
  transition:background .25s, color .25s;
}
.more button:hover{background:var(--ink);color:var(--bg)}
.more .n{display:block;margin-top:18px;font-size:11.5px;color:var(--ink-3);letter-spacing:.1em}

/* ============ About strip ============ */
.about{
  border-top:1px solid var(--line);
  padding:100px max(28px, 4vw);
  text-align:center;
}
.about h2{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(26px,3.2vw,38px);
  line-height:1.5;
  letter-spacing:.04em;
}
.about p{
  margin-top:28px;
  font-size:14px;
  color:var(--ink-2);
  line-height:2.05;
  max-width:42ch;
  margin-left:auto;
  margin-right:auto;
}
.about .more-link{
  display:inline-block;
  margin-top:36px;
  font-size:13px;
  color:var(--ink);
  letter-spacing:.06em;
  padding-bottom:3px;
  border-bottom:1px solid var(--ink);
}

/* ============ Footer ============ */
.foot{
  border-top:1px solid var(--line);
  padding:36px max(28px, 4vw);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--ink-3);
  gap:24px;
}
.foot .l{font-family:var(--serif);letter-spacing:.2em;color:var(--ink)}
.foot .r{display:flex;gap:18px}

/* ============ Responsive ============ */
@media (max-width: 960px){
  .h{grid-template-columns:auto 1fr auto;padding:20px max(20px, 4vw)}
  .h .l{display:none}
  .h .r{font-size:11px;gap:16px}
  .h .c{font-size:13px;letter-spacing:.32em}
  .hero{padding:80px max(20px, 4vw) 90px}
  .hero h1{font-size:clamp(32px, 7.4vw, 52px)}
  .tools{flex-wrap:wrap;gap:14px;padding:18px max(20px, 4vw)}
  .tools .count{order:0;flex:1}
  .tools .sort{order:1}
  .tools .filters{order:2;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;margin:0 calc(-1 * max(20px, 4vw));padding-left:max(20px, 4vw);padding-right:max(20px, 4vw)}
  .tools .filters::-webkit-scrollbar{display:none}
  .tools .filters button{white-space:nowrap;flex:0 0 auto}
  .grid{grid-template-columns:repeat(3, 1fr);column-gap:18px;row-gap:48px;padding:32px max(20px, 4vw) 48px}
  .about{padding:72px max(20px, 4vw)}
  .foot{flex-direction:column;text-align:center}
}
@media (max-width: 560px){
  .grid{grid-template-columns:repeat(2, 1fr);column-gap:14px;row-gap:36px}
  .card .meta{flex-direction:column;align-items:flex-start;gap:4px;margin-top:14px}
  .card .meta .name{font-size:14px}
  .card .meta .price{font-size:14px}
  .hero{padding:60px max(20px, 4vw) 70px}
  .hero h1{font-size:clamp(28px, 8.5vw, 44px)}
  .hero .sub{margin-top:24px;font-size:13px}
}
</style>
</head>
<body>

<header class="h">
  <nav class="l">
    <a href="#collection">きもの</a>
    <a href="#about">アトリエ</a>
    <a>ご案内</a>
  </nav>
  <div class="c">ALICE&nbsp;MIEUX</div>
  <nav class="r">
    <a>お気に入り</a>
    <a>お申し込み</a>
  </nav>
</header>

<section class="hero">
  <h1>百着のなかから、<br>あなたへ一着。</h1>
  <p class="sub">あわら市の美容室 Alice mieux による着物レンタル。ご来店一回で、ヘアと着付けまでお仕度いたします。</p>
</section>

<section id="collection">
  <div class="tools">
    <div class="count"><b id="ct">100</b>&nbsp;着</div>
    <div class="filters" id="filters">
      <button class="on" data-cat="all">すべて</button>
      <button data-cat="振袖">振袖</button>
      <button data-cat="訪問着">訪問着</button>
      <button data-cat="留袖">留袖</button>
      <button data-cat="小紋">小紋</button>
      <button data-cat="紬">紬</button>
      <button data-cat="浴衣">浴衣</button>
    </div>
    <div class="sort">
      <select>
        <option>新着順</option>
        <option>料金が安い順</option>
        <option>料金が高い順</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="more">
    <button id="more">さらに見る</button>
    <span class="n" id="n">12 / 100</span>
  </div>
</section>

<section id="about" class="about">
  <h2>その日に、その人だけの<br>お一着を。</h2>
  <p>結婚式、成人のお祝い、卒業、七五三。ふだん髪を担当している店主が、お一着ずつお選びいたします。ひと月に数組のかたへ、丁寧に。</p>
  <a class="more-link" href="#">アトリエについて</a>
</section>

<footer class="foot">
  <div class="l">ALICE&nbsp;MIEUX</div>
  <div class="r">
    <a>特定商取引法</a>
    <a>プライバシー</a>
    <a>Instagram</a>
  </div>
</footer>

<script>
const CATS = ['振袖','訪問着','留袖','小紋','紬','浴衣'];
const NAMES = [['紅梅','こうばい'],['夕霞','ゆうがすみ'],['野分','のわき'],['花信','かしん'],['薄氷','うすらひ'],['楓朱','ふうしゅ'],['霜華','そうか'],['初雁','はつかり'],['月白','げっぱく'],['若葉','わかば'],['露草','つゆくさ'],['撫子','なでしこ'],['桔梗','ききょう'],['菖蒲','あやめ'],['椿','つばき'],['百合','ゆり'],['藤娘','ふじむすめ'],['秋桜','こすもす'],['千代','ちよ'],['八雲','やくも'],['朝霧','あさぎり'],['宵山','よいやま'],['花筏','はないかだ'],['流水','りゅうすい'],['七宝','しっぽう'],['市松','いちまつ'],['雪輪','ゆきわ'],['牡丹','ぼたん'],['椿姫','つばきひめ'],['東雲','しののめ']];
const DYES = [
  {l:'oklch(0.78 0.10 22)',  m:'oklch(0.62 0.16 22)', d:'oklch(0.40 0.16 22)'},  // 紅梅
  {l:'oklch(0.58 0.18 18)',  m:'oklch(0.42 0.18 18)', d:'oklch(0.24 0.14 16)'},  // 蘇芳
  {l:'oklch(0.62 0.10 246)', m:'oklch(0.42 0.12 248)', d:'oklch(0.22 0.08 250)'},// 藍
  {l:'oklch(0.68 0.10 252)', m:'oklch(0.50 0.13 254)', d:'oklch(0.30 0.10 256)'},// 群青
  {l:'oklch(0.72 0.06 160)', m:'oklch(0.52 0.08 158)', d:'oklch(0.30 0.06 156)'},// 萌葱
  {l:'oklch(0.60 0.05 145)', m:'oklch(0.42 0.06 142)', d:'oklch(0.22 0.04 140)'},// 苔
  {l:'oklch(0.66 0.10 320)', m:'oklch(0.46 0.13 318)', d:'oklch(0.26 0.10 316)'},// 紫
  {l:'oklch(0.78 0.06 340)', m:'oklch(0.62 0.10 338)', d:'oklch(0.42 0.10 336)'},// 紅藤
  {l:'oklch(0.92 0.04 18)',  m:'oklch(0.82 0.07 20)',  d:'oklch(0.62 0.10 22)'}, // 桜
  {l:'oklch(0.78 0.10 75)',  m:'oklch(0.60 0.12 72)',  d:'oklch(0.38 0.10 68)'}, // 朽葉
  {l:'oklch(0.82 0.09 105)', m:'oklch(0.64 0.10 102)', d:'oklch(0.40 0.08 100)'},// 鶸
  {l:'oklch(0.42 0.01 0)',   m:'oklch(0.22 0.008 0)',  d:'oklch(0.10 0.006 0)'}, // 漆黒
  {l:'oklch(0.78 0.012 230)',m:'oklch(0.60 0.012 228)',d:'oklch(0.38 0.012 226)'},// 銀鼠
  {l:'oklch(0.92 0.012 80)', m:'oklch(0.80 0.014 75)', d:'oklch(0.60 0.018 70)'},// 生成り
  {l:'oklch(0.52 0.08 248)', m:'oklch(0.34 0.07 246)', d:'oklch(0.18 0.04 244)'},// 鉄紺
];
const PRICES = [18000,22000,26000,28000,32000,38000,44000,52000,58000,68000,78000];

function fmt(n){return n.toLocaleString('en-US')}

function gen(){
  const list=[];
  for(let i=1;i<=100;i++){
    list.push({
      cat:   CATS[(i*7)%CATS.length],
      dye:   DYES[(i*7+i%3)%DYES.length],
      name:  NAMES[(i*13)%NAMES.length],
      price: PRICES[(i*7+3)%PRICES.length],
    });
  }
  return list;
}
const CATALOG = gen();
let shown = 12, filter = 'all';

function render(){
  const items = filter==='all' ? CATALOG : CATALOG.filter(k=>k.cat===filter);
  const vis = items.slice(0, shown);
  document.getElementById('grid').innerHTML = vis.map(k=>`
    <article class="card">
      <div class="img">
        <div class="swatch" style="--c-l:${k.dye.l};--c-m:${k.dye.m};--c-d:${k.dye.d}"></div>
      </div>
      <div class="meta">
        <div>
          <div class="name">${k.name[0]}</div>
          <div class="cat">${k.cat}</div>
        </div>
        <div class="price">¥${fmt(k.price)}</div>
      </div>
    </article>
  `).join('');
  document.getElementById('ct').textContent = items.length;
  document.getElementById('n').textContent = `${Math.min(shown, items.length)} / ${items.length}`;
}

document.querySelectorAll('#filters button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    filter = b.dataset.cat;
    shown = 12;
    render();
  });
});
document.getElementById('more').addEventListener('click', ()=>{
  shown += 12;
  render();
});

render();
</script>
</body>
</html>
