<style>
/* 看板と同じ「黒×イエロー」。白文字・ゴシックのみ（明朝体なし） */
:root{
  --bg:#0E0F11;
  --bg2:#16181B;
  --card:#1C1F23;
  --line:#2C3036;
  --y:#FDC601;
  --y-deep:#E0AE00;
  --y-soft:rgba(253,198,1,.12);
  --w:#FFFFFF;
  --t:#D9DCE1;
  --mu:#9AA1AB;
  --tbd:#3DDC84;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --en:"Oswald","Noto Sans JP",sans-serif;
  --gut:max(20px,min(5vw,60px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--t);font-family:var(--jp);font-weight:500;font-size:16px;line-height:1.95;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:90}
img{display:block;max-width:100%;height:auto}
p,h1,h2,h3,h4,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:3px;border-radius:4px}
h1,h2,h3,.wb{word-break:auto-phrase;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.tbd{border:1px solid var(--tbd);color:var(--tbd);font-size:.74em;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap;letter-spacing:0;margin:0 .2em}
.y{color:var(--y)}
.hl{background:linear-gradient(transparent 62%,rgba(253,198,1,.38) 62%);color:var(--w);font-weight:700}
.sec{padding-block:clamp(80px,11vw,140px);position:relative}
.alt{background:var(--bg2)}

/* 見出し：英字ラベル＋大見出し */
.eh{display:flex;align-items:center;gap:14px;font-family:var(--en);font-weight:600;font-size:14px;letter-spacing:.32em;color:var(--y);text-transform:uppercase}
.eh::before{content:"";width:36px;height:3px;background:var(--y)}
.h2{margin-top:14px;font-weight:900;font-size:clamp(28px,4.2vw,50px);line-height:1.4;letter-spacing:.04em;color:var(--w)}
.lead{margin-top:20px;max-width:40em;font-size:15.5px;line-height:2.1;color:var(--t)}
.c{text-align:center}.c .eh{justify-content:center}.c .lead{margin-inline:auto}
.c .eh::after{content:"";width:36px;height:3px;background:var(--y)}

/* 動き */
@media (prefers-reduced-motion:no-preference){
  .js .rv.pre{opacity:0;transform:translateY(46px)}
  .js .rv{transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
  .js .rv.pre.l{transform:translateX(-60px)} .js .rv.pre.r{transform:translateX(60px)} .js .rv.pre.z{transform:scale(.92)}
  .hero-bg img{animation:kb 9s ease-out both}
  @keyframes kb{from{transform:scale(1.18)}to{transform:scale(1.02)}}
  .hero-in>*{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
  .hero-in>*:nth-child(2){animation-delay:.15s}.hero-in>*:nth-child(3){animation-delay:.3s}.hero-in>*:nth-child(4){animation-delay:.45s}.hero-in>*:nth-child(5){animation-delay:.6s}
  @keyframes up{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  .hero h1 .bar{animation:bar 1.1s .7s cubic-bezier(.7,0,.2,1) both}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .btn-y{position:relative;overflow:hidden}
  .btn-y::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.4s ease-in-out infinite}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  .ticker div{animation:tk 30s linear infinite}
  @keyframes tk{to{transform:translateX(-50%)}}
  .scroll i{animation:sc 2s ease-in-out infinite}
  @keyframes sc{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
  .dot.open{animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.5)}100%{box-shadow:0 0 0 10px rgba(61,220,132,0)}}
  .card,.why>li,.steps li,.ph-zoom img{transition:transform .45s cubic-bezier(.2,.7,.2,1),border-color .3s,background .3s}
  .card:hover,.why>li:hover,.steps li:hover{transform:translateY(-6px);border-color:var(--y)}
  .ph-zoom:hover img{transform:scale(1.06)}
}

/* ボタン */
.btn-y{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:62px;padding:0 40px;border-radius:4px;background:var(--y);color:#111;font-weight:900;font-size:17px;letter-spacing:.08em;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(253,198,1,.7);transition:transform .15s,background .2s}
.btn-y:hover{background:#FFD43A;transform:translateY(-2px)}
.btn-y.sm{min-height:44px;padding:0 20px;font-size:14px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:4px;border:1.5px solid rgba(255,255,255,.5);color:var(--w);font-weight:700;letter-spacing:.06em;white-space:nowrap;transition:border-color .2s,background .2s}
.btn-o:hover{border-color:var(--y);background:var(--y-soft)}
.arr{display:inline-block;width:18px;height:2px;background:currentColor;position:relative}
.arr::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg)}

/* ヘッダー */
.hd{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:80;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hd.solid{background:rgba(14,15,17,.92);backdrop-filter:blur(10px);border-color:var(--line)}
.hd .wrap{max-width:1280px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:96px}
.logo span{display:flex;flex-direction:column;line-height:1.3;font-size:14px;font-weight:700;color:var(--w);letter-spacing:.12em;border-left:1px solid rgba(255,255,255,.3);padding-left:12px}
.logo small{font-size:10.5px;font-weight:500;color:var(--mu);letter-spacing:.14em}
.gnav{display:flex;align-items:center;gap:28px}
.gnav a.t{font-size:13.5px;font-weight:700;color:var(--w);position:relative}
.gnav a.t::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--y);transform:scaleX(0);transition:transform .25s}
.gnav a.t:hover::after{transform:scaleX(1)}
@media(max-width:1040px){.gnav a.t{display:none}}

/* ヒーロー：看板の写真を全面に */
.hero{position:relative;min-height:min(100svh,920px);display:flex;align-items:flex-end;overflow:hidden;background:#000}
.hero-bg{position:absolute;inset:0}
@media(min-width:761px){.hero-bg{left:46%}.hero-bg img{object-position:22% 40%}.hero-bg::before{content:"";position:absolute;inset:0 auto 0 0;width:45%;background:linear-gradient(90deg,var(--bg),rgba(14,15,17,0));z-index:1}}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(14,15,17,1) 0%,rgba(14,15,17,.9) 36%,rgba(8,9,11,0) 60%),linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 28%,rgba(10,11,13,.35) 70%,rgba(14,15,17,1) 100%)}
@media(max-width:760px){.hero::before{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 25%,rgba(10,11,13,.75) 55%,rgba(14,15,17,1) 100%)}}
.hero-big{position:absolute;right:-2vw;top:14vh;z-index:1;font-family:var(--en);font-weight:700;font-size:clamp(180px,30vw,440px);line-height:.8;color:transparent;-webkit-text-stroke:2px rgba(253,198,1,.3);letter-spacing:-.02em;pointer-events:none}
.hero-in{position:relative;z-index:2;width:100%;padding-top:140px;padding-bottom:clamp(48px,7vw,90px)}
.hero-eb{display:inline-flex;align-items:center;gap:10px;background:var(--y);color:#111;font-weight:900;font-size:clamp(12.5px,1.4vw,14.5px);letter-spacing:.12em;padding:6px 14px}
.hero h1{margin-top:20px;font-weight:900;font-size:clamp(36px,6.4vw,84px);line-height:1.28;letter-spacing:.03em;color:var(--w)}
.hero h1>span{display:block}
.hero h1 em{font-style:normal;color:var(--y);position:relative;display:inline-block}
.hero h1 .bar{position:absolute;left:0;right:0;bottom:.06em;height:.12em;background:var(--y);transform-origin:left}
.hero-p{margin-top:22px;max-width:34em;font-size:clamp(14.5px,1.5vw,16.5px);line-height:2.05;color:var(--t)}
.hero-cta{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--w);border:1px solid rgba(255,255,255,.25);padding:7px 16px;border-radius:999px;background:rgba(0,0,0,.35)}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.open{background:#3DDC84}
.scroll{position:absolute;right:max(var(--gut),calc((100vw - 1180px)/2 + var(--gut)));bottom:40px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--en);font-size:11px;letter-spacing:.3em;color:var(--w);writing-mode:vertical-rl}
.scroll i{display:block;width:1px;height:64px;background:var(--y)}
@media(max-width:760px){.scroll{display:none}
  .hero{display:block;min-height:0}
  .hero-bg{position:relative;aspect-ratio:4/3.4;margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .hero::before{inset:0 0 auto;aspect-ratio:4/3.4;height:auto;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(14,15,17,0) 70%,rgba(14,15,17,1) 100%)!important}
  .hero-big{top:calc(85vw * .78 - 120px);bottom:auto;right:-4vw;font-size:150px}
  .hero-in{padding-top:6px;padding-bottom:56px}
  .hero h1{margin-top:16px}}

/* 流れる帯 */
.ticker{overflow:hidden;background:var(--y);color:#111;padding:14px 0;white-space:nowrap;transform:rotate(-1.2deg);margin:-14px -10px 0;position:relative;z-index:5}
.ticker div{display:inline-flex;gap:56px;font-weight:900;font-size:15px;letter-spacing:.14em}
.ticker span::before{content:"◆ ";font-size:.7em;vertical-align:.15em}

/* 当院について：写真と数字 */
.about{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(32px,6vw,90px);align-items:center}
.about-ph{position:relative}
.about-ph .m{border-radius:2px;overflow:hidden;aspect-ratio:4/3.1}
.about-ph .m img{width:100%;height:100%;object-fit:cover}
.about-ph .s{position:absolute;right:-6%;bottom:-14%;width:44%;aspect-ratio:3/4;overflow:hidden;border:6px solid var(--bg);box-shadow:0 30px 50px -20px rgba(0,0,0,.8)}
.about-ph .s img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.about-ph::before{content:"";position:absolute;left:-18px;top:-18px;width:44%;height:50%;border-left:4px solid var(--y);border-top:4px solid var(--y);z-index:2}
.stats{margin-top:34px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:18px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--en);font-size:clamp(30px,3.6vw,42px);font-weight:700;color:var(--y);line-height:1.15}
.stats b small{font-family:var(--jp);font-size:14px;margin-left:2px}
.stats span{font-size:12.5px;color:var(--mu);font-weight:700}
@media(max-width:860px){.about{grid-template-columns:1fr}.about-ph{margin:0 6% 60px 0}}

/* お悩み */
.chips{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,44%),1fr));gap:12px}
.chips li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:14px 14px;font-size:clamp(14px,1.5vw,15.5px);font-weight:700;color:var(--w);line-height:1.5}
.chips li i{flex:none;width:22px;height:22px;background:var(--y);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.chips li.big{grid-column:1/-1;background:var(--y);color:#111;border-color:var(--y)}
.chips li.big i{background:#111}
.note{margin-top:28px;font-size:15px;line-height:2;color:var(--t)}

/* 選ばれる理由 */
.why{margin-top:54px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.why>li{position:relative;background:var(--card);border:1px solid var(--line);padding:clamp(28px,3.4vw,42px);overflow:hidden}
.why .n{position:absolute;right:16px;top:-6px;font-family:var(--en);font-weight:700;font-size:110px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(253,198,1,.35)}
.why .k{font-family:var(--en);font-size:13px;letter-spacing:.28em;color:var(--y);font-weight:600}
.why h3{margin-top:10px;font-size:clamp(19px,2.2vw,23px);font-weight:900;color:var(--w);line-height:1.55;position:relative}
.why p{margin-top:12px;font-size:14.5px;line-height:2;position:relative}
.why ul{margin-top:14px;display:flex;flex-direction:column;gap:6px;position:relative}
.why ul li{background:none;border:0;padding:0 0 0 20px;font-size:13.5px;line-height:1.8;color:var(--t)}
.why ul li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:3px;background:var(--y)}
@media(max-width:760px){.why{grid-template-columns:1fr}}

/* 野球の帯：院長の写真を大きく */
.ball{position:relative;overflow:hidden;background:var(--y);color:#111}
.ball-g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:560px}
.ball-ph{position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,82% 100%,0 100%)}
.ball-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.ball-tx{padding:clamp(48px,7vw,90px) var(--gut) clamp(48px,7vw,90px) clamp(24px,4vw,40px);display:flex;flex-direction:column;justify-content:center;max-width:640px}
.ball .eh{color:#111}.ball .eh::before{background:#111}
.ball h2{margin-top:14px;font-weight:900;font-size:clamp(24px,2.7vw,36px);line-height:1.45;letter-spacing:.03em}
.ball p{margin-top:16px;font-size:15px;line-height:2;font-weight:700}
.ball ul{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.ball li{display:flex;gap:12px;align-items:center;font-weight:900;font-size:15.5px}
.ball li::before{content:"";flex:none;width:22px;height:22px;background:#111;clip-path:polygon(20% 50%,40% 70%,82% 24%,92% 34%,40% 88%,10% 60%)}
.ball .btn-k{margin-top:28px;align-self:flex-start;display:inline-flex;align-items:center;gap:14px;min-height:56px;padding:0 30px;background:#111;color:var(--y);font-weight:900;letter-spacing:.08em;border-radius:4px}
.ball-big{position:absolute;right:-3vw;bottom:-6vw;font-family:var(--en);font-weight:700;font-size:clamp(160px,22vw,320px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(0,0,0,.14);pointer-events:none}
@media(max-width:860px){.ball-g{grid-template-columns:1fr}.ball-ph{aspect-ratio:4/4.2;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}}

/* コース */
.cards{margin-top:54px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{position:relative;background:var(--card);border:1px solid var(--line);padding:30px 28px 26px;display:flex;flex-direction:column;gap:10px}
.card .no{font-family:var(--en);font-weight:700;font-size:44px;line-height:1;color:var(--y)}
.card .k{font-size:12.5px;font-weight:700;color:var(--mu);letter-spacing:.08em}
.card h3{font-size:clamp(18px,1.9vw,20px);font-weight:900;color:var(--w);line-height:1.55}
.card p{font-size:14px;line-height:1.95}
.card .pr{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.card.hot{background:linear-gradient(160deg,#2A2511,var(--card) 60%);border-color:rgba(253,198,1,.6)}
.card.hot::before{content:"BASEBALL";position:absolute;top:18px;right:18px;font-family:var(--en);font-size:11px;letter-spacing:.24em;background:var(--y);color:#111;padding:3px 10px;font-weight:700}
.note-s{margin-top:22px;font-size:13px;color:var(--mu)}
@media(max-width:960px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.cards{grid-template-columns:1fr}}

/* 写真の帯（院内） */
.pband{position:relative;height:clamp(280px,42vw,520px);overflow:hidden}
.pband img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.pband::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,17,.92) 0%,rgba(14,15,17,.35) 55%,rgba(14,15,17,.1) 100%)}
.pband .tx{position:absolute;inset:0;z-index:2;display:flex;align-items:center}
.pband h2{font-weight:900;font-size:clamp(26px,4vw,48px);line-height:1.45;color:var(--w)}
.pband h2 em{font-style:normal;color:var(--y)}

/* 料金シミュレーター */
.sim{margin-top:50px;background:var(--card);border:1px solid var(--line);padding:clamp(24px,4vw,46px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,50px)}
.sim h3{font-size:14px;font-weight:700;color:var(--w);letter-spacing:.08em}
.seg{display:flex;gap:8px;margin-top:10px;margin-bottom:24px}
.seg button{flex:1;min-height:54px;border:1px solid var(--line);background:var(--bg2);font-weight:900;font-size:16px;color:var(--t);border-radius:4px;transition:background .2s,color .2s,border-color .2s}
.seg button[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:#111}
.ins{display:flex;flex-direction:column;gap:8px}
.ins li{border-left:3px solid var(--y);background:var(--bg2);padding:12px 16px;font-size:13.5px;line-height:1.8}
.ins b{color:var(--w);margin-right:10px}
.bill{background:var(--bg);border:1px solid var(--line);padding:26px 28px;display:flex;flex-direction:column}
.bill-hd{font-size:13.5px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between}
.bill-hd span{color:var(--y)}
.bill-row{display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px;border-bottom:1px dashed var(--line)}
.bill-row:last-of-type{border-bottom:0}
.bill-row span{font-size:15px;font-weight:700;color:var(--w)}
.bill-row b{font-family:var(--en);font-size:clamp(34px,4vw,46px);font-weight:600;color:var(--w);font-variant-numeric:tabular-nums}
.bill-row b small{font-family:var(--jp);font-size:14px;margin-left:4px}
.bill-row.first b{color:var(--y)}
.bill-n{margin-top:8px;font-size:12.5px;line-height:1.9;color:var(--mu)}
@media(max-width:820px){.sim{grid-template-columns:1fr}}

/* 院長 */
.dir{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,6vw,90px);align-items:center}
.dir-ph{position:relative}
.dir-ph .f{aspect-ratio:3/4;overflow:hidden}
.dir-ph .f img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.dir-ph::after{content:"";position:absolute;right:-18px;bottom:-18px;width:60%;height:60%;border-right:4px solid var(--y);border-bottom:4px solid var(--y);z-index:-0;pointer-events:none}
.dir-ph .tag{position:absolute;left:0;bottom:28px;background:var(--y);color:#111;font-weight:900;padding:10px 18px;line-height:1.4;font-size:13px}
.dir-ph .tag b{display:block;font-size:22px;letter-spacing:.14em}
.dir .q{margin-top:22px;font-weight:900;font-size:clamp(20px,2.4vw,27px);line-height:1.6;color:var(--w);border-left:4px solid var(--y);padding-left:18px}
.dir-t{margin-top:20px;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:2.1}
.career{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.career li{border:1px solid var(--line);padding:4px 14px;font-size:13px;line-height:1.8}
@media(max-width:860px){.dir{grid-template-columns:1fr}.dir-ph{max-width:440px;margin-right:18px}}

/* 流れ */
.steps{margin-top:54px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:s}
.steps li{position:relative;background:var(--card);border:1px solid var(--line);padding:30px 22px 26px;display:flex;flex-direction:column;gap:8px}
.steps i{font-style:normal;font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--y)}
.steps i b{font-size:40px;letter-spacing:0;margin-left:6px}
.steps h3{font-size:16.5px;font-weight:900;color:var(--w);line-height:1.6}
.steps p{font-size:13.5px;line-height:1.9;color:var(--mu)}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* FAQ */
.faq{margin:50px auto 0;max-width:820px;display:flex;flex-direction:column;gap:10px}
.faq-i{background:var(--card);border:1px solid var(--line)}
.faq-q{width:100%;display:flex;align-items:center;gap:16px;padding:20px 22px;text-align:left}
.qa{flex:none;font-family:var(--en);font-weight:700;font-size:22px;line-height:1;width:24px;color:var(--y)}
.qa.a{color:var(--w)}
.faq-q b{flex:1;font-size:15.5px;color:var(--w);line-height:1.7}
.faq-q::after{content:"";flex:none;width:14px;height:14px;background:linear-gradient(var(--y),var(--y)) center/14px 2px no-repeat,linear-gradient(var(--y),var(--y)) center/2px 14px no-repeat;transition:transform .3s}
.faq-q[aria-expanded="true"]::after{transform:rotate(45deg)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.faq-a.open{grid-template-rows:1fr}
.faq-a>div{overflow:hidden}
.faq-a .in{display:flex;gap:16px;align-items:flex-start;padding:0 22px 20px;font-size:14.5px;line-height:2}
.faq-a em{font-style:normal;font-weight:700;color:var(--w)}

/* アクセス */
.acc{margin-top:50px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.acc-ph{overflow:hidden;aspect-ratio:16/11}
.acc-ph img{width:100%;height:100%;object-fit:cover;object-position:55% 40%}
.acc-box{background:var(--card);border:1px solid var(--line);padding:clamp(22px,3vw,36px)}
.acc dl>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.acc dt{font-size:13px;font-weight:700;color:var(--y)}
.acc dd{font-size:14.5px;line-height:1.9;color:var(--w)}
.tel{font-family:var(--en);font-size:26px;font-weight:600;letter-spacing:.06em;user-select:all}
.copy{margin-left:10px;font-size:12px;font-weight:700;color:#111;background:var(--y);padding:2px 12px;border-radius:2px}
.hours{width:100%;border-collapse:collapse;margin-top:16px;font-variant-numeric:tabular-nums}
.hours th,.hours td{padding:11px 2px;text-align:center;font-size:13.5px;border-bottom:1px solid var(--line)}
.hours thead th{color:var(--mu);font-weight:700;font-size:12.5px}
.hours thead th.today{color:#111;background:var(--y)}
.hours tbody th{text-align:left;padding-left:4px;font-weight:700;color:var(--w);white-space:nowrap}
.hours td{color:var(--y);font-size:15px}
.hours td.x{color:#555}
.hours td.s{color:var(--w)}
.hours-n{margin-top:10px;font-size:12.5px;line-height:1.95;color:var(--mu)}
.acc .btn-o{margin-top:22px}
@media(max-width:860px){.acc{grid-template-columns:1fr}}

/* 最後のCTA */
.endcta{position:relative;padding-block:clamp(90px,12vw,150px);overflow:hidden;text-align:center}
.endcta>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.endcta::after{content:"";position:absolute;inset:0;background:rgba(10,11,13,.78)}
.endcta .wrap{position:relative;z-index:2}
.endcta h2{font-weight:900;font-size:clamp(28px,4.6vw,56px);line-height:1.4;color:var(--w)}
.endcta h2 em{font-style:normal;color:var(--y)}
.endcta p{margin-top:16px;font-size:15px}
.end-btns{margin-top:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.end-tel{margin-top:20px;font-size:13px;color:var(--mu)}
.end-tel b{font-family:var(--en);font-size:24px;color:var(--w);letter-spacing:.06em;margin-left:8px;font-weight:600}

/* フッター */
.ft{background:#08090A;padding-block:48px 40px;border-top:3px solid var(--y)}
.ft-g{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;align-items:flex-start}
.ft img{width:110px}
.ft-addr{margin-top:12px;font-size:13px;line-height:2;color:var(--mu)}
.ft-nav{display:flex;flex-wrap:wrap;gap:8px 24px}
.ft-nav a{font-size:13px;color:var(--t)}
.ft-nav a:hover{color:var(--y)}
.ft-legal{margin-top:28px;font-size:11.5px;line-height:1.9;color:#6E747C}
.ft-cr{margin-top:8px;font-family:var(--en);font-size:12px;color:#6E747C;letter-spacing:.1em}

/* スマホ固定バー */
.fix{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;gap:10px;align-items:center;background:rgba(14,15,17,.96);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.fix .btn-y{flex:1;min-height:52px;font-size:15.5px;padding:0 12px}
.fix .tl{flex:none;min-height:52px;padding:0 18px;border-radius:4px;border:1px solid rgba(255,255,255,.35);color:var(--w);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
@media(max-width:760px){.fix{display:flex}body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}.gnav .btn-y{display:none}}
</style>
</head>
<body>


<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const {useState,useEffect} = React;
const html = htm.bind(React.createElement);
const IMG = {ext:"assets/ext.jpg", room:"assets/room.jpg", owner:"assets/owner.jpg", logo:"assets/logo-w.png"};
const LINE = "https://line.me/R/ti/p/@775vnnrf";
const TEL = "076-205-2121";
const TELH = "tel:0762052121";
const MAP = "https://www.google.com/maps/search/?api=1&query=%E7%9F%B3%E5%B7%9D%E7%9C%8C%E9%87%91%E6%B2%A2%E5%B8%82%E5%AF%BA%E5%9C%B01%E4%B8%81%E7%9B%AE21%E7%95%AA13%E5%8F%B7";

const HOURS = {1:[[9,13],[15,19]],2:[[9,13],[15,19]],3:[[9,13],[15,19]],4:[[9,13],[15,19]],5:[[9,13],[15,19]],6:[[9,13],[15,17]],0:[]};
function tokyoNow(){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), h:(+p.hour%24)+(+p.minute)/60};
  }catch(e){ const d=new Date(); return {wd:d.getDay(), h:d.getHours()+d.getMinutes()/60}; }
}
function status(){
  const {wd,h} = tokyoNow(); const t = HOURS[wd];
  const cur = t.find(([a,b])=>h>=a&&h<b);
  if(cur) return {open:true, wd, text:`ただいま受付中（本日${cur[1]}:00まで）`};
  const nx = t.find(([a])=>h<a);
  if(nx) return {open:false, wd, text:`本日は${nx[0]}:00から受付`};
  return {open:false, wd, text:"本日の受付は終了しました"};
}

const LineIcon = ({s=22,c="#111"}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=${c} aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5 1.1-.5 6-3.5 8.2-6.1 1.5-1.6 2.2-3.2 2.2-4.9C22.4 6.6 17.5 3 12 3z"/></svg>`;
const TelIcon = ({s=18}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>`;
const Check = ({c="#111"}) => html`<i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke=${c} stroke-width="4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></i>`;
const Tbd = ({t="要確認"}) => html`<span class="tbd">〔${t}〕</span>`;
const Eh = ({t}) => html`<p class="eh rv">${t}</p>`;

function Header(){
  const [solid,setSolid] = useState(false);
  useEffect(()=>{const f=()=>setSolid(scrollY>40);f();addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  return html`<header class=${"hd"+(solid?" solid":"")}><div class="wrap">
    <a class="logo" href="#top" aria-label="Yuu.47整骨院 トップへ"><img src=${IMG.logo} width="600" height="271" alt="Yuu.47"/><span>整骨院<small>金沢市寺地</small></span></a>
    <nav class="gnav" aria-label="ページ内メニュー">
      <a class="t" href="#about">当院について</a><a class="t" href="#course">施術コース</a><a class="t" href="#price">料金</a><a class="t" href="#director">院長紹介</a><a class="t" href="#faq">よくある質問</a><a class="t" href="#access">アクセス</a>
      <a class="btn-y sm" href=${LINE} target="_blank" rel="noopener"><${LineIcon} s=${18}/>LINEで予約</a>
    </nav>
  </div></header>`;
}

function Hero({st}){
  return html`<section class="hero" id="top">
    <div class="hero-bg"><img src=${IMG.ext} alt="Yuu.47整骨院の看板と外観" fetchpriority="high"/></div>
    <span class="hero-big" aria-hidden="true">47</span>
    <div class="wrap hero-in">
      <p class="hero-eb">元プロ野球トレーナーの整骨院</p>
      <h1><span>痛みの原因を<em>確かめて<i class="bar"></i></em>、</span><span><em>動ける身体</em>へ。</span></h1>
      <p class="hero-p">評価・施術・運動まで、院長がひとりで一貫して担当します。部活を頑張る学生さんも、毎日の肩や腰がつらい方も。</p>
      <div class="hero-cta">
        <a class="btn-y" href=${LINE} target="_blank" rel="noopener"><${LineIcon}/>LINEで予約する</a>
        <a class="btn-o" href=${TELH}><${TelIcon}/>${TEL}</a>
      </div>
      <p style=${{marginTop:"22px"}}><span class="status"><i class=${"dot"+(st.open?" open":"")}></i>${st.text}</span></p>
    </div>
    <span class="scroll" aria-hidden="true">SCROLL<i></i></span>
  </section>`;
}

function Ticker(){
  const w=["元プロ野球トレーナーの院長","評価・施術・運動まで一貫","健康保険・労災・交通事故に対応","専用駐車場4台","土曜も受付","LINEで24時間予約"];
  return html`<div class="ticker" aria-hidden="true"><div>${[...w,...w].map((t,i)=>html`<span key=${i}>${t}</span>`)}</div></div>`;
}

function About(){
  return html`<section class="sec" id="about"><div class="wrap about">
    <div class="about-ph rv l">
      <div class="m ph-zoom"><img src=${IMG.room} alt="施術ベッドが並ぶ院内" loading="lazy" style=${{objectPosition:"40% 60%"}}/></div>
      <div class="s"><img src=${IMG.owner} alt="院長 坂本祐太" loading="lazy"/></div>
    </div>
    <div>
      <${Eh} t="About"/>
      <h2 class="h2 rv">痛む場所だけで、<br/>終わらせない。</h2>
      <p class="lead rv">金沢市寺地にある、<span class="hl">元プロ野球球団トレーナー</span>の柔道整復師が営む整骨院です。関節の動きや姿勢、身体の使い方まで確かめてから施術し、<span class="hl">同じ痛みを繰り返さない身体づくり</span>までお手伝いします。</p>
      <div class="stats rv">
        <div><b>1<small>人</small></b><span>院長が最後まで担当</span></div>
        <div><b>25<small>分</small></b><span>保険施術の目安</span></div>
        <div><b>4<small>台</small></b><span>専用駐車場</span></div>
      </div>
    </div>
  </div></section>`;
}

const WORRY = ["肩こり","腰痛","坐骨神経痛","背中の痛み","猫背・巻き肩","頭痛","膝の痛み","目の疲れ","全身のだるさ","骨盤まわりの違和感"];
function Worry(){
  return html`<section class="sec alt"><div class="wrap">
    <${Eh} t="Trouble"/>
    <h2 class="h2 rv">こんな<span class="y">お悩み</span>、ありませんか？</h2>
    <ul class="chips rv">
      ${WORRY.map(t=>html`<li key=${t}><${Check}/>${t}</li>`)}
      <li class="big"><${Check} c="#FDC601"/>投球時の肩・肘の痛み（野球肩・野球肘）</li>
    </ul>
    <p class="note rv">ひとつでも当てはまったら、まずは<span class="hl">LINEでご相談</span>ください。保険が使えるかどうかも、あわせてご案内します。</p>

    <div style=${{marginTop:"clamp(80px,10vw,130px)"}}>
      <${Eh} t="Reason"/>
      <h2 class="h2 rv">選ばれる<span class="y">4つの理由</span></h2>
      <ul class="why">
        ${[
          ["LICENSE","国家資格者による、根拠のある施術","柔道整復師の国家資格と、プロスポーツの現場で積み重ねた身体評価の知識をもとに施術を組み立てます。",["関節の動き・姿勢・筋バランスを確認","整体が初めての方も安心"]],
          ["TRAINING","施術と運動をセットにした身体づくり","整えた身体を、運動・セルフケア・日常の動作へつなげ、同じ痛みを繰り返さないことを目指します。",["ご自宅でできるセルフケアをお伝え","仕事や生活のクセも一緒に見直し"]],
          ["SPORTS","プロ野球トレーナー経験を活かした対応","競技の特性を踏まえた施術に、テーピングと再発予防の指導を組み合わせます。",["投球・打撃による肩・肘・腰のトラブル","練習や試合での捻挫・打撲・肉離れ"]],
          ["ORDER MADE","その日の身体に合わせた施術","マニュアル通りには進めません。来院のたびに状態を確かめて、いま必要な施術を見極めます。",["来院のたびに状態を確認","学生から社会人スポーツまで対応"]]
        ].map(([k,t,p,l],n)=>html`<li key=${t} class="rv">
          <span class="n" aria-hidden="true">${String(n+1).padStart(2,"0")}</span>
          <p class="k">${k}</p><h3>${t}</h3><p>${p}</p><ul>${l.map(x=>html`<li key=${x}>${x}</li>`)}</ul>
        </li>`)}
      </ul>
    </div>
  </div></section>`;
}

function Ball(){
  return html`<section class="ball">
    <span class="ball-big" aria-hidden="true">47</span>
    <div class="ball-g">
      <div class="ball-ph rv l"><img src=${IMG.owner} alt="院長 坂本祐太" loading="lazy"/></div>
      <div class="ball-tx">
        <p class="eh rv">For Baseball Players</p>
        <h2 class="rv">プロ野球の現場を知る院長が、<br/>競技を続けたい気持ちに寄りそう。</h2>
        <p class="rv">投げる・打つ・走る。競技ごとの身体の使い方を踏まえて、痛みの原因を確かめます。</p>
        <ul class="rv"><li>投球・打撃による肩・肘・腰の負担を確認</li><li>テーピングと再発予防の指導</li><li>学生アスリートから社会人スポーツまで</li></ul>
        <a class="btn-k rv" href="#course">野球選手コースをみる<span class="arr"></span></a>
      </div>
    </div>
  </section>`;
}

const COURSES = [
  ["保険と組み合わせる","保険＋自費のハイブリッドコース","保険施術に、自費の施術を組み合わせるコースです。"],
  ["集中して取り組む","集中改善コース","痛みが気になる時期に、間隔をつめて集中的に通いたい方向けのコースです。"],
  ["全身を見る","全身改善コース","痛む場所だけでなく、全身のバランスまで見てほしい方向けのコースです。"],
  ["運動を中心に","体づくりコース","運動の指導を中心に、痛みを繰り返さない身体づくりに取り組むコースです。"],
  ["歩く・立つ力に","脚力改善コース","歩く・立つ・階段をのぼるといった、毎日の動作を支える脚の力に取り組むコースです。"],
  ["野球をしている方へ","野球選手コース","投球・打撃による肩や肘の負担を、プロ野球トレーナーの視点で確認します。"]
];

function App(){
  const [st,setSt] = useState(status());
  useEffect(()=>{const t=setInterval(()=>setSt(status()),60000);return()=>clearInterval(t)},[]);
  useEffect(()=>{
    if(!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    document.documentElement.classList.add("js");
    const els=[...document.querySelectorAll(".rv")];
    els.forEach((e,i)=>{ const r=e.getBoundingClientRect(); if(r.top>innerHeight*0.9){ e.classList.add("pre"); e.style.transitionDelay=((i%3)*0.08)+"s"; } });
    const io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.remove("pre"); io.unobserve(x.target); } }),{rootMargin:"0px 0px -8% 0px"});
    els.forEach(e=>io.observe(e));
    const safety=setTimeout(()=>els.forEach(e=>e.classList.remove("pre")),12000);
    return ()=>{io.disconnect();clearTimeout(safety)};
  },[]);
  return html`<${Header}/>
    <main>
      <${Hero} st=${st}/><${Ticker}/><${About}/><${Worry}/><${Ball}/><${Course}/><${PBand}/><${Price}/><${Director}/><${Flow}/><${Faq}/><${Access} st=${st}/><${EndCta}/>
    </main>
    <${Footer}/>
    <div class="fix"><a class="btn-y" href=${LINE} target="_blank" rel="noopener"><${LineIcon} s=${20}/>LINEで予約</a><a class="tl" href=${TELH}><${TelIcon} s=${16}/>電話</a></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
