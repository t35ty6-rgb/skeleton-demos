<style>
/* 心プラスの型：白とクリームの地、オレンジの差し色、LINEの緑。丸ゴシック。明朝体は使わない */
:root{
  --bg:#FFFFFF;
  --cream:#FFF7EA;
  --cream-2:#FDEFD9;
  --cream-line:#F4DFC0;
  --orange:#EE8519;
  --orange-deep:#C9670A;
  --orange-soft:#FDE9D2;
  --marker:#FFE98A;
  --ink:#3E3128;
  --text:#5A4B40;
  --muted:#87766A;
  --line:#EFE4D6;
  --green-a:#3CCB7F;
  --green-b:#17A85C;
  --green-c:#0F8C4B;
  --tbd:#1E9E5A;
  --mg:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --gut:max(20px,min(5vw,60px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mg);font-weight:500;font-size:16px;line-height:2;letter-spacing:.05em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:90}
img{display:block;max-width:100%;height:auto}
p,h1,h2,h3,h4,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
h1,h2,h3,.wb{word-break:auto-phrase;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.tbd{border:1px solid var(--tbd);color:var(--tbd);font-size:.78em;font-weight:700;padding:1px 8px;border-radius:4px;white-space:nowrap;letter-spacing:0;margin:0 .2em}
.mk{background:linear-gradient(transparent 60%,var(--marker) 60%);font-weight:700;color:var(--ink)}
.or{color:var(--orange)}

/* 見出し：\ ○○ / と、小ラベル＋見出し */
.sh{display:flex;justify-content:center;align-items:center;gap:22px;font-weight:700;font-size:clamp(24px,3vw,32px);color:var(--ink);letter-spacing:.08em;text-align:center}
.sh::before,.sh::after{content:"";flex:none;width:2px;height:28px;background:var(--orange);border-radius:2px}
.sh::before{transform:rotate(-25deg)}
.sh::after{transform:rotate(25deg)}
.lab{display:block;text-align:center;font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--orange)}
.h2{text-align:center;margin-top:8px;font-weight:700;font-size:clamp(24px,3vw,32px);letter-spacing:.08em;color:var(--ink);line-height:1.6}
.lead{margin:22px auto 0;max-width:40em;text-align:center;font-size:15px;line-height:2.15;color:var(--text)}
.sec{padding-block:clamp(64px,9vw,104px)}

/* 大きな角丸のクリーム面 */
.panel{background:var(--cream);border-radius:clamp(40px,8vw,110px) clamp(40px,8vw,110px) 0 0;margin-inline:max(0px,calc((100vw - 1240px)/2));padding-block:clamp(56px,8vw,96px)}
.panel--both{border-radius:clamp(40px,8vw,110px)}
@media(max-width:1300px){.panel{margin-inline:clamp(0px,3vw,40px)}}
@media(max-width:600px){.panel{margin-inline:0}}

/* スクロールで少し浮き上がる（静止時は常に表示） */
@media (prefers-reduced-motion:no-preference){@supports (animation-timeline:view()){.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 20%}}}
@keyframes rv{from{transform:translateY(32px)}to{transform:none}}

/* ボタン */
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:64px;padding:0 44px;border-radius:999px;color:#fff;font-weight:700;font-size:17px;letter-spacing:.08em;
  background:linear-gradient(180deg,var(--green-a) 0%,var(--green-b) 100%);box-shadow:0 5px 0 var(--green-c),0 14px 24px -12px rgba(15,140,75,.6);transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-line:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--green-c),0 10px 18px -12px rgba(15,140,75,.6)}
.btn-line:active{transform:translateY(5px);box-shadow:0 0 0 var(--green-c)}
.btn-line.sm{min-height:44px;padding:0 22px;font-size:14px;box-shadow:0 3px 0 var(--green-c)}
.btn-or{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:999px;background:#fff;border:2px solid var(--orange);color:var(--orange-deep);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.btn-or:hover{background:var(--orange-soft)}
.bubble{position:relative;display:inline-block;border:1.5px solid var(--orange);color:var(--orange-deep);background:#fff;font-size:13px;font-weight:700;padding:5px 18px;border-radius:999px;margin-bottom:16px;letter-spacing:.06em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;margin-left:-6px;background:#fff;border-right:1.5px solid var(--orange);border-bottom:1.5px solid var(--orange);transform:rotate(45deg)}

/* ヘッダー */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd .wrap{max-width:1240px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:72px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:88px}
.logo span{display:flex;flex-direction:column;line-height:1.35;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.08em}
.logo small{font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:.12em}
.gnav{display:flex;align-items:center;gap:26px}
.gnav a.t{font-size:14px;font-weight:700;color:var(--orange-deep)}
.gnav a.t:hover{color:var(--orange)}
@media(max-width:1020px){.gnav a.t{display:none}}

/* ヒーロー：写真の右下を大きな曲線で切る */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);background:var(--cream);min-height:520px}
.hero-ph{position:relative;overflow:hidden;border-radius:0 0 72% 0 / 0 0 46% 0}
.hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s ease}
.hero-ph img.on{opacity:1}
.hero-dots{position:absolute;left:24px;bottom:22px;display:flex;gap:8px;z-index:2}
.hero-dots button{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.hero-dots button.on{background:var(--orange)}
.hero-tx{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(40px,5vw,72px) max(var(--gut),calc((100vw - 1240px)/2 + var(--gut))) clamp(40px,5vw,72px) clamp(32px,4vw,64px)}
.hero-eb{font-size:clamp(13px,1.4vw,15.5px);font-weight:700;color:var(--orange-deep);letter-spacing:.08em}
.hero h1{margin-top:14px;font-weight:700;font-size:clamp(30px,3.7vw,48px);line-height:1.55;letter-spacing:.06em;color:var(--ink)}
.hero h1>span{display:block}
.hero-p{margin-top:18px;font-size:clamp(14px,1.4vw,15.5px);line-height:2.1;color:var(--text)}
.hero-cta{margin-top:30px;display:flex;flex-direction:column;align-items:center}
.status{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--text);background:#fff;border:1px solid var(--cream-line);padding:6px 16px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#BBB}
.dot.open{background:#17A85C;box-shadow:0 0 0 4px rgba(23,168,92,.18)}
@media(max-width:860px){
  .hero{grid-template-columns:1fr;min-height:0}
  .hero-ph{aspect-ratio:4/3.2;border-radius:0 0 0 0 / 0 0 0 0;border-bottom-right-radius:60% 28%}
  .hero-tx{align-items:center;text-align:center;padding:30px var(--gut) 44px}
  .hero h1>span{display:inline}
}

/* ○○とは：丸写真＋丸写真＋丸写真 */
.about-tx{margin:30px auto 0;max-width:36em;text-align:center;font-size:15.5px;line-height:2.25}
.trio{margin-top:44px;display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,2.4vw,28px)}
.trio figure{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(96px,16vw,150px);text-align:center}
.trio .c{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 2px var(--cream-line)}
.trio .c img{width:100%;height:100%;object-fit:cover}
.trio figcaption{font-size:clamp(12px,1.4vw,14px);font-weight:700;color:var(--ink);line-height:1.6}
.trio .plus{align-self:center;margin-top:calc(-1 * clamp(20px,3vw,30px));font-size:26px;font-weight:700;color:var(--orange)}

/* お悩み */
.chips{margin-top:40px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.chips li{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--cream-line);border-radius:999px;padding:9px 20px 9px 12px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.5}
.chips li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.chips li.hl{background:var(--orange-soft);border-color:var(--orange)}
.note{margin:34px auto 0;max-width:720px;background:#fff;border-radius:24px;padding:22px 30px;font-size:15px;line-height:2;text-align:center;border:1.5px solid var(--cream-line)}

/* 番号バッジ付きカード（理由・コース） */
.cards{margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;background:#fff;border:1.5px solid var(--cream-line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.card-ph{aspect-ratio:16/10;overflow:hidden;border-radius:0 0 50% 50% / 0 0 18% 18%}
.card-ph img{width:100%;height:100%;object-fit:cover}
.card-no{width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:16px;display:grid;place-items:center;border:4px solid #fff;margin:-23px auto 0;position:relative;z-index:2;letter-spacing:0}
.card-no.top{margin:26px auto 0}
.card-bd{padding:12px 28px 28px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-bd .k{font-size:12.5px;font-weight:700;color:var(--orange-deep);letter-spacing:.06em}
.card-bd h3{font-size:clamp(17px,1.9vw,19.5px);font-weight:700;color:var(--ink);text-align:center;line-height:1.6;letter-spacing:.06em}
.card-bd p{font-size:14px;line-height:2;color:var(--text)}
.card-bd ul{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.card-bd li{position:relative;padding-left:18px;font-size:13.5px;line-height:1.8;color:var(--text)}
.card-bd li::before{content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.price-tag{margin-top:auto;padding-top:14px;text-align:center;font-size:22px;font-weight:700;color:var(--orange-deep);letter-spacing:.02em}
.price-tag small{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:6px}
.note-s{margin-top:22px;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.cards,.cards.two{grid-template-columns:1fr}}

/* 写真背景＋白カード */
.photoband{position:relative;padding-block:clamp(48px,7vw,80px);overflow:hidden}
.photoband>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.photoband::after{content:"";position:absolute;inset:0;background:rgba(255,250,242,.38)}
.pb-card{position:relative;z-index:2;background:#fff;border-radius:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);overflow:hidden;box-shadow:0 30px 60px -36px rgba(80,50,20,.45)}
.pb-card>.ph{min-height:320px;position:relative}
.pb-card>.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.pb-card>.tx{padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.ribbon{position:relative;display:inline-block;background:var(--orange);color:#fff;font-size:13.5px;font-weight:700;padding:6px 26px;letter-spacing:.08em;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.pb-card h3{font-size:clamp(20px,2.4vw,26px);font-weight:700;color:var(--ink);line-height:1.6;letter-spacing:.06em}
.pb-card ul{display:flex;flex-direction:column;gap:8px}
.pb-card li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.85}
.pb-card li::before{content:"";position:absolute;left:2px;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--orange)}
@media(max-width:760px){.pb-card{grid-template-columns:1fr}.pb-card>.ph{min-height:0;aspect-ratio:4/3.2}}

/* 料金シミュレーター */
.sim{margin-top:44px;background:#fff;border:1.5px solid var(--cream-line);border-radius:32px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(22px,4vw,48px);box-shadow:0 24px 50px -40px rgba(120,70,20,.5)}
.sim h3{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.08em}
.seg{display:flex;gap:8px;margin-top:10px;margin-bottom:22px}
.seg button{flex:1;min-height:52px;border-radius:999px;border:1.5px solid var(--cream-line);background:var(--cream);font-weight:700;font-size:15.5px;color:var(--text);transition:background .2s,color .2s,border-color .2s}
.seg button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-deep)}
.ins{display:flex;flex-direction:column;gap:8px}
.ins li{background:var(--cream);border-radius:16px;padding:12px 16px;font-size:13.5px;line-height:1.8}
.ins b{color:var(--orange-deep);margin-right:8px}
.bill{background:var(--cream);border-radius:24px;padding:24px 28px;display:flex;flex-direction:column}
.bill-hd{text-align:center;font-size:14px;font-weight:700;color:var(--ink)}
.bill-hd span{display:inline-block;background:#fff;border-radius:999px;padding:4px 16px;margin-left:6px;color:var(--orange-deep)}
.bill-row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px;border-bottom:1.5px dashed var(--cream-line)}
.bill-row:last-of-type{border-bottom:0}
.bill-row span{font-size:15px;font-weight:700}
.bill-row b{font-size:clamp(28px,3.4vw,38px);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bill-row b small{font-size:14px;margin-left:4px}
.bill-row.first b{color:var(--orange-deep)}
.bill-n{margin-top:8px;font-size:12.5px;line-height:1.9;color:var(--muted)}
@media(max-width:820px){.sim{grid-template-columns:1fr}}

/* 院長 */
.prof{margin:44px auto 0;max-width:960px;background:#fff;border:1.5px solid var(--cream-line);border-radius:32px;padding:clamp(26px,4vw,48px);display:grid;grid-template-columns:clamp(160px,24vw,250px) minmax(0,1fr);gap:clamp(22px,4vw,48px);align-items:start}
.prof-ph{aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid var(--cream);box-shadow:0 0 0 2px var(--cream-line)}
.prof-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 24%}
.prof .k{font-size:13px;font-weight:700;color:var(--orange-deep);letter-spacing:.08em}
.prof h3{margin-top:4px;font-size:clamp(22px,2.6vw,28px);font-weight:700;color:var(--ink);letter-spacing:.14em}
.prof h3 small{font-size:13px;color:var(--muted);margin-left:12px;letter-spacing:.06em}
.prof-t{margin-top:16px;display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:2.1}
.career{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.career li{background:var(--cream);border-radius:999px;padding:4px 14px;font-size:13px;line-height:1.8}
@media(max-width:700px){.prof{grid-template-columns:1fr;text-align:left}.prof-ph{width:180px;justify-self:center}.prof-hd{text-align:center}}

/* 流れ */
.steps{margin-top:44px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.steps li{background:#fff;border:1.5px solid var(--cream-line);border-radius:22px;padding:24px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.steps i{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center;letter-spacing:0}
.steps b{font-size:15.5px;color:var(--ink);letter-spacing:.04em;line-height:1.6;margin-top:4px}
.steps p{font-size:13px;line-height:1.85;color:var(--muted)}
@media(max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* FAQ */
.faq{margin:44px auto 0;max-width:760px;display:flex;flex-direction:column;gap:12px}
.faq-i{background:var(--cream);border:1.5px solid var(--cream-line);border-radius:18px;overflow:hidden}
.faq-q{width:100%;display:flex;align-items:center;gap:14px;padding:16px 20px;text-align:left}
.qa{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:0}
.qa.q{background:var(--orange)}
.qa.a{background:#17A85C}
.faq-q b{flex:1;font-size:15.5px;color:var(--ink);line-height:1.7}
.faq-q::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--orange);border-bottom:2px solid var(--orange);transform:rotate(45deg);margin:-4px 4px 0;transition:transform .25s}
.faq-q[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease;background:#fff}
.faq-a.open{grid-template-rows:1fr}
.faq-a>div{overflow:hidden}
.faq-a .in{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;font-size:14.5px;line-height:2}
.faq-a .in em{font-style:normal;font-weight:700;color:var(--orange-deep)}

/* アクセス */
.acc{margin-top:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.acc-ph{border-radius:28px;overflow:hidden;aspect-ratio:16/11}
.acc-ph img{width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.acc-box{background:#fff;border:1.5px solid var(--cream-line);border-radius:28px;padding:clamp(22px,3vw,34px)}
.acc dl>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1.5px dashed var(--cream-line)}
.acc dt{font-size:13px;font-weight:700;color:var(--orange-deep)}
.acc dd{font-size:14.5px;line-height:1.9;color:var(--ink)}
.tel{font-size:22px;font-weight:700;letter-spacing:.06em;user-select:all}
.copy{margin-left:10px;font-size:12px;font-weight:700;color:var(--orange-deep);background:var(--orange-soft);padding:2px 12px;border-radius:999px}
.hours{width:100%;border-collapse:separate;border-spacing:0;margin-top:20px;font-variant-numeric:tabular-nums;background:var(--cream);border-radius:18px;overflow:hidden}
.hours th,.hours td{padding:10px 2px;text-align:center;font-size:13.5px}
.hours thead th{background:var(--orange);color:#fff;font-weight:700}
.hours thead th.today{background:var(--orange-deep)}
.hours tbody th{text-align:left;padding-left:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.hours tbody tr+tr th,.hours tbody tr+tr td{border-top:1.5px dashed var(--cream-line)}
.hours td{color:var(--orange)}
.hours td.x{color:#C9BBAE}
.hours td.s{color:#17A85C}
.hours-n{margin-top:10px;font-size:12.5px;line-height:1.95;color:var(--muted)}
.acc .btn-or{margin-top:22px}
@media(max-width:860px){.acc{grid-template-columns:1fr}}

/* 最後のCTA：写真背景＋白カード＋丸バッジ */
.endcta{position:relative;padding-block:clamp(64px,9vw,104px);overflow:hidden}
.endcta>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.endcta::after{content:"";position:absolute;inset:0;background:rgba(255,248,236,.45)}
.end-card{position:relative;z-index:2;max-width:720px;margin:0 auto;background:rgba(255,255,255,.97);border-radius:32px;padding:clamp(40px,5vw,56px) clamp(24px,4vw,56px) clamp(32px,4vw,44px);text-align:center}
.badge{position:absolute;left:-26px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--orange);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.2;border:4px solid #fff;box-shadow:0 10px 20px -10px rgba(120,60,0,.5)}
.badge small{font-size:12px}
.badge b{font-size:19px;letter-spacing:.02em}
.end-card .k{font-size:13.5px;font-weight:700;color:var(--orange-deep);letter-spacing:.1em}
.end-card h2{margin-top:8px;font-size:clamp(22px,2.8vw,30px);font-weight:700;color:var(--ink);letter-spacing:.08em;line-height:1.6}
.end-card p{margin-top:12px;font-size:14.5px;color:var(--text);line-height:2}
.end-btns{margin-top:26px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.end-tel{margin-top:16px;font-size:13px;color:var(--muted)}
.end-tel b{font-size:18px;color:var(--ink);letter-spacing:.06em;margin-left:6px}
@media(max-width:600px){.badge{left:50%;margin-left:-44px;top:-44px;width:88px;height:88px}.end-card{margin-top:40px}}

/* フッター */
.ft{background:var(--cream-2);padding-block:40px 36px;text-align:center}
.ft img{width:100px;margin:0 auto}
.ft-addr{margin-top:14px;font-size:13px;line-height:2;color:var(--text)}
.ft-nav{margin-top:18px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px}
.ft-nav a{font-size:13px;color:var(--text)}
.ft-legal{margin:18px auto 0;max-width:46em;font-size:11.5px;line-height:1.9;color:var(--muted)}
.ft-cr{margin-top:10px;font-size:12px;color:var(--muted)}

/* スマホ固定バー */
.fix{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;gap:10px;align-items:center;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.fix .btn-line{flex:1;min-height:52px;font-size:15.5px;padding:0 12px;box-shadow:0 4px 0 var(--green-c)}
.fix .tl{flex:none;min-height:52px;padding:0 18px;border-radius:999px;background:var(--orange-soft);color:var(--orange-deep);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
@media(max-width:760px){.fix{display:flex}body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}.gnav .btn-line{display:none}}
</style>
</head>
<body>


<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function(){
const {useState,useEffect} = React;
const html = htm.bind(React.createElement);
const IMG = {hero:"assets/hero.jpg", room:"assets/room.jpg", owner:"assets/owner.jpg", logo:"assets/logo.png"};
const LINE = "https://line.me/R/ti/p/@775vnnrf";
const TEL = "076-205-2121";
const TELH = "tel:0762052121";
const MAP = "https://www.google.com/maps/search/?api=1&query=%E7%9F%B3%E5%B7%9D%E7%9C%8C%E9%87%91%E6%B2%A2%E5%B8%82%E5%AF%BA%E5%9C%B01%E4%B8%81%E7%9B%AE21%E7%95%AA13%E5%8F%B7";

const HOURS = {1:[[9,13],[15,19]],2:[[9,13],[15,19]],3:[[9,13],[15,19]],4:[[9,13],[15,19]],5:[[9,13],[15,19]],6:[[9,13],[15,17]],0:[]};
function tokyoNow(){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), h:(+p.hour%24)+(+p.minute)/60};
  }catch(e){ const d=new Date(); return {wd:d.getDay(), h:d.getHours()+d.getMinutes()/60}; }
}
function status(){
  const {wd,h} = tokyoNow(); const t = HOURS[wd];
  const cur = t.find(([a,b])=>h>=a&&h<b);
  if(cur) return {open:true, wd, text:`ただいま受付中（本日${cur[1]}:00まで）`};
  const nx = t.find(([a])=>h<a);
  if(nx) return {open:false, wd, text:`本日は${nx[0]}:00から受付`};
  return {open:false, wd, text:"本日の受付は終了しました"};
}

const LineIcon = ({s=22}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5 1.1-.5 6-3.5 8.2-6.1 1.5-1.6 2.2-3.2 2.2-4.9C22.4 6.6 17.5 3 12 3z"/></svg>`;
const TelIcon = ({s=18}) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>`;
const Check = () => html`<i><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></i>`;
const Tbd = ({t="要確認"}) => html`<span class="tbd">〔${t}〕</span>`;

function Header(){
  return html`<header class="hd"><div class="wrap">
    <a class="logo" href="#top" aria-label="Yuu.47整骨院 トップへ"><img src=${IMG.logo} width="360" height="163" alt="Yuu.47"/><span>整骨院<small>金沢市寺地</small></span></a>
    <nav class="gnav" aria-label="ページ内メニュー">
      <a class="t" href="#about">当院について</a><a class="t" href="#course">施術コース</a><a class="t" href="#price">料金</a><a class="t" href="#director">院長紹介</a><a class="t" href="#faq">よくある質問</a><a class="t" href="#access">アクセス</a>
      <a class="btn-line sm" href=${LINE} target="_blank" rel="noopener">LINEで予約</a>
    </nav>
  </div></header>`;
}

const SL = [["room","施術ベッドが並ぶ院内"],["hero","Yuu.47整骨院の外観"]];
function Hero({st}){
  const [i,setI] = useState(0);
  useEffect(()=>{const t=setTimeout(()=>setI((i+1)%SL.length),6000);return()=>clearTimeout(t)},[i]);
  return html`<section class="hero" id="top">
    <div class="hero-ph">
      ${SL.map(([k,a],n)=>html`<img key=${k} class=${n===i?"on":""} src=${IMG[k]} alt=${a} style=${k==="hero"?{objectPosition:"60% 40%"}:{objectPosition:"40% 60%"}}/>`)}
      <div class="hero-dots">${SL.map(([k],n)=>html`<button key=${k} class=${n===i?"on":""} aria-label=${(n+1)+"枚目の写真"} onClick=${()=>setI(n)}></button>`)}</div>
    </div>
    <div class="hero-tx">
      <p class="hero-eb">元プロ野球トレーナーの整骨院</p>
      <h1><span>痛みの原因を<span class="or">確かめて</span>、</span><span><span class="or">動ける身体</span>へ。</span></h1>
      <p class="hero-p">評価・施術・運動まで、院長がひとりで一貫して担当します。<br/>部活を頑張る学生さんも、毎日の肩や腰がつらい方も。</p>
      <div class="hero-cta">
        <span class="bubble">ご予約・ご相談はLINEから</span>
        <a class="btn-line" href=${LINE} target="_blank" rel="noopener"><${LineIcon}/>LINEで予約する</a>
      </div>
      <span class="status"><i class=${"dot"+(st.open?" open":"")}></i>${st.text}</span>
    </div>
  </section>`;
}

function About(){
  return html`<section class="sec" id="about"><div class="wrap">
    <h2 class="sh rv"><span><span class="or">Yuu.47整骨院</span>とは？</span></h2>
    <p class="about-tx rv">金沢市寺地にある、<span class="mk">元プロ野球球団トレーナー</span>の柔道整復師が営む整骨院です。痛む場所だけでなく、関節の動きや姿勢、身体の使い方まで確かめてから施術し、<span class="mk">同じ痛みを繰り返さない身体づくり</span>までお手伝いします。</p>
    <div class="trio rv">
      <figure><div class="c"><img src=${IMG.owner} alt="院長 坂本祐太" style=${{objectPosition:"50% 26%"}}/></div><figcaption>院長が<br/>担当</figcaption></figure>
      <span class="plus" aria-hidden="true">＋</span>
      <figure><div class="c"><img src=${IMG.room} alt="施術ベッドが並ぶ院内"/></div><figcaption>施術と<br/>運動</figcaption></figure>
      <span class="plus" aria-hidden="true">＋</span>
      <figure><div class="c"><img src=${IMG.hero} alt="外観と看板" style=${{objectPosition:"58% 40%"}}/></div><figcaption>駐車場<br/>4台</figcaption></figure>
    </div>
  </div></section>`;
}

const WORRY = ["肩こり","腰痛","坐骨神経痛","背中の痛み","猫背・巻き肩","頭痛","膝の痛み","目の疲れ","全身のだるさ","骨盤まわりの違和感"];
function Worry(){
  return html`<div class="panel"><div class="wrap">
    <span class="lab rv">ご相談の多いお悩み</span>
    <h2 class="h2 rv">こんな<span class="or">お悩み</span>はありませんか？</h2>
    <ul class="chips rv">
      ${WORRY.map(t=>html`<li key=${t}><${Check}/>${t}</li>`)}
      <li class="hl"><${Check}/>投球時の肩・肘の痛み（野球肩・野球肘）</li>
    </ul>
    <p class="note rv">ひとつでも当てはまったら、まずは<span class="mk">LINEでご相談</span>ください。保険が使えるかどうかも、あわせてご案内します。</p>

    <div style=${{marginTop:"clamp(64px,9vw,104px)"}}>
      <span class="lab rv">当院の特長</span>
      <h2 class="h2 rv">選ばれる<span class="or">4つの理由</span></h2>
      <div class="cards two">
        ${[
          ["国家資格","国家資格者による、根拠のある施術","柔道整復師の国家資格と、プロスポーツの現場で積み重ねた身体評価の知識をもとに施術を組み立てます。",["関節の動き・姿勢・筋バランスを確認","整体が初めての方も安心"]],
          ["施術×運動","施術と運動をセットにした身体づくり","整えた身体を、運動・セルフケア・日常の動作へつなげ、同じ痛みを繰り返さないことを目指します。",["ご自宅でできるセルフケアをお伝え","仕事や生活のクセも一緒に見直し"]],
          ["スポーツ","プロ野球トレーナー経験を活かした対応","競技の特性を踏まえた施術に、テーピングと再発予防の指導を組み合わせます。",["投球・打撃による肩・肘・腰のトラブル","練習や試合での捻挫・打撲・肉離れ"]],
          ["オーダーメイド","その日の身体に合わせた施術","マニュアル通りには進めません。来院のたびに状態を確かめて、いま必要な施術を見極めます。",["来院のたびに状態を確認","学生から社会人スポーツまで対応"]]
        ].map(([k,t,p,l],n)=>html`<article key=${t} class="card rv">
          <span class="card-no top">${String(n+1).padStart(2,"0")}</span>
          <div class="card-bd"><p class="k" style=${{textAlign:"center"}}>${k}</p><h3>${t}</h3><p>${p}</p><ul>${l.map(x=>html`<li key=${x}>${x}</li>`)}</ul></div>
        </article>`)}
      </div>
    </div>
  </div></div>`;
}

function Band(){
  return html`<section class="photoband">
    <img src=${IMG.room} alt="" loading="lazy" style=${{objectPosition:"50% 60%"}}/>
    <div class="wrap"><div class="pb-card rv">
      <div class="ph"><img src=${IMG.owner} alt="院長 坂本祐太" loading="lazy"/></div>
      <div class="tx">
        <span class="ribbon">野球をしている方へ</span>
        <h3>プロ野球の現場を知る院長が、<br/>競技を続けたい気持ちに寄りそいます</h3>
        <ul><li>投球・打撃による肩・肘・腰の負担を確認</li><li>テーピングと再発予防の指導</li><li>学生アスリートから社会人スポーツまで</li></ul>
        <a class="btn-line sm" href="#course" style=${{marginTop:"8px"}}>野球選手コースをみる</a>

}

const COURSES = [
  ["保険と組み合わせる","保険＋自費のハイブリッドコース","保険施術に、自費の施術を組み合わせるコースです。"],
  ["集中して取り組む","集中改善コース","痛みが気になる時期に、間隔をつめて集中的に通いたい方向けのコースです。"],
  ["全身を見る","全身改善コース","痛む場所だけでなく、全身のバランスまで見てほしい方向けのコースです。"],
  ["運動を中心に","体づくりコース","運動の指導を中心に、痛みを繰り返さない身体づくりに取り組むコースです。"],
  ["歩く・立つ力に","脚力改善コース","歩く・立つ・階段をのぼるといった、毎日の動作を支える脚の力に取り組むコースです。"],
  ["野球をしている方へ","野球選手コース","投球・打撃による肩や肘の負担を、プロ野球トレーナーの視点で確認します。"]

function Course(){
  return html`<section class="sec" id="course"><div class="wrap">
    <span class="lab rv">施術コース</span>
    <h2 class="h2 rv">Yuu.47整骨院の<span class="or">コース</span></h2>

      ${COURSES.map(([k,t,d],n)=>html`<article key=${t} class="card rv">

const FEE = {1:{1:[1000,600,400],2:[1200,800,500],3:[1500,1000,700]},2:{1:[1200,800,500],2:[1500,1000,700],3:[2000,1500,1000]}};
function Price(){
  const [r,setR] = useState(3); const [b,setB] = useState(1); const v = FEE[b][r];
  return html`<div class="panel panel--both" id="price"><div class="wrap">
    <span class="lab rv">保険施術の料金</span>
    <h2 class="h2 rv">窓口のご負担を<span class="or">その場でチェック</span></h2>
    <p class="lead rv">原因がはっきりしている急性・亜急性のケガや痛みは、健康保険を使えます。負担割合と部位数を選んでください。</p>
    <div class="sim rv">
      <div>
        <h3>保険の負担割合</h3>
        <div class="seg">${[1,2,3].map(n=>html`<button key=${n} aria-pressed=${r===n} onClick=${()=>setR(n)}>${n}割</button>`)}</div>

        <ul class="ins"><li><b>健康保険</b>急性・亜急性のケガが対象</li><li><b>労災保険</b>お仕事中・通勤中のケガ</li><li><b>交通事故</b>自賠責保険に対応</li></ul>
      </div>
      <div class="bill" aria-live="polite">
        <p class="bill-hd">窓口負担の目安<span>${r}割・${b}部位</span></p>
        <div class="bill-row first"><span>初回</span><b>${v[0].toLocaleString("ja-JP")}<small>円</small></b></div>
        <div class="bill-row"><span>2回目</span><b>${v[1].toLocaleString("ja-JP")}<small>円</small></b></div>
        <div class="bill-row"><span>3回目以降</span><b>${v[2].toLocaleString("ja-JP")}<small>円</small></b></div>
        <p class="bill-n">施術時間は25分前後が目安です。慢性的な肩こり・腰痛など、保険の対象にならない症状は自費施術でのご案内です。<${Tbd} t="保険の説明文"/></p>
      </div>
    </div>
  </div></div>`;
}

function Director(){
  return html`<section class="sec" id="director"><div class="wrap">
    <span class="lab rv">院長紹介</span>
    <h2 class="h2 rv">院長の<span class="or">坂本</span>です</h2>
    <div class="prof rv">
      <div class="prof-ph"><img src=${IMG.owner} alt="院長 坂本祐太" loading="lazy"/></div>
      <div>
        <div class="prof-hd"><p class="k">Yuu.47整骨院 院長・柔道整復師</p><h3>坂本 祐太</h3></div>
        <div class="prof-t">
          <p>学生時代から野球に打ち込み、大学まで競技を続けました。大学時代に右肘を痛めて手術を経験し、思い描いたプレーができず競技をあきらめた経験が、いまの原点です。</p>
          <p>「<span class="mk">けがで夢をあきらめる選手を、ひとりでも減らしたい</span>」。その想いで、プロ野球の現場で選手のコンディショニングやリハビリに携わり、整骨院でも多くの施術を担当してきました。</p>
        </div>
        <ul class="career"><li>大学名・競技歴<${Tbd}/></li><li>プロ野球球団名・在籍期間<${Tbd}/></li><li>開院年月<${Tbd}/></li></ul>
      </div>
    </div>
  </div></section>`;
}

function Flow(){
  const s = [["LINEかお電話で予約","ご都合の日時をお知らせください"],["お話をうかがう","痛む場所や普段の生活を確認します"],["評価と施術","関節の動きや姿勢を確かめて施術します"],["運動・セルフケア","再発を防ぐ運動をお伝えします"]];
  return html`<div class="panel"><div class="wrap">
    <span class="lab rv">ご来院の流れ</span>
    <h2 class="h2 rv">はじめての方の<span class="or">流れ</span></h2>
    <ol class="steps">${s.map(([t,p],n)=>html`<li key=${t} class="rv"><i>${n+1}</i><b>${t}</b><p>${p}</p></li>`)}</ol>
  </div></div>`;
}

const FAQ = [
  ["専用の駐車場はありますか？","はい、専用駐車場を4台分ご用意しています。お車でも安心してお越しください。"],
  ["予約の前に、コース選びを相談できますか？","はい、できます。お悩みをうかがって、目的に合ったコースをご案内します。"],
  ["健康保険は使えますか？","原因がはっきりしている急性・亜急性のケガや痛みは使えます。労災・交通事故（自賠責保険）にも対応しています。"],
  ["施術時間はどれくらいですか？","保険施術は25分前後が目安です。自費施術はコースによって異なります。"],
  ["予約なしでも受けられますか？",null]
];
function Faq(){
  const [o,setO] = useState(0);
  return html`<section class="sec" id="faq"><div class="wrap">
    <h2 class="sh rv"><span>よくある質問</span></h2>
    <div class="faq">
      ${FAQ.map(([q,a],n)=>html`<div key=${q} class="faq-i rv">
        <button class="faq-q" aria-expanded=${o===n} aria-controls=${"fa"+n} onClick=${()=>setO(o===n?-1:n)}><span class="qa q">Q</span><b>${q}</b></button>
        <div class=${"faq-a"+(o===n?" open":"")} id=${"fa"+n}><div><p class="in"><span class="qa a">A</span><span>${a ? html`<em>${a.slice(0,a.indexOf("。")+1)}</em>${a.slice(a.indexOf("。")+1)}` : html`<${Tbd} t="予約なしの受付可否"/> 13:00〜15:00と19:00〜21:00は完全予約制です。`}</span></p></div></div>
      </div>`)}
    </div>
  </div></section>`;
}

function Access({st}){

  const addr = "石川県金沢市寺地1丁目21番13号";
  const copy = () => { try{ navigator.clipboard.writeText("〒921-8178 "+addr).then(()=>{setCp(true);setTimeout(()=>setCp(false),1800)},()=>{}); }catch(e){} };
  const days = ["月","火","水","木","金","土","日"]; const ti = st.wd===0?6:st.wd-1;
  return html`<div class="panel panel--both" id="access"><div class="wrap">
    <span class="lab rv">アクセス・受付時間</span>
    <h2 class="h2 rv">金沢市<span class="or">寺地1丁目</span></h2>
    <div class="acc">
      <div class="rv">
        <div class="acc-ph"><img src=${IMG.hero} alt="Yuu.47整骨院の外観" loading="lazy"/></div>
        <table class="hours">
          <thead><tr><th scope="col">受付時間</th>${days.map((d,n)=>html`<th key=${d} class=${n===ti?"today":""}>${d}</th>`)}</tr></thead>
          <tbody>
            <tr><th scope="row">9:00〜13:00<${Tbd} t="終了時刻"/></th><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td class="x">−</td></tr>
            <tr><th scope="row">15:00〜19:00</th><td>●</td><td>●</td><td>●</td><td>●</td><td>●</td><td class="s">▲</td><td class="x">−</td></tr>
          </tbody>
        </table>
        <p class="hours-n">▲ 土曜日の午後は17:00まで／休診日：日曜日・祝日<br/>13:00〜15:00、19:00〜21:00は完全予約制</p>
      </div>
      <div class="acc-box rv">
        <span class="status" style=${{marginTop:0,marginBottom:"10px"}}><i class=${"dot"+(st.open?" open":"")}></i>${st.text}</span>
        <dl>
          <div><dt>住所</dt><dd>〒921-8178<br/>${addr}<button class="copy" onClick=${copy}>${cp?"コピーしました":"コピー"}</button></dd></div>
          <div><dt>電話</dt><dd><span class="tel">${TEL}</span></dd></div>
          <div><dt>駐車場</dt><dd>専用駐車場 4台</dd></div>
          <div><dt>保険</dt><dd>各種健康保険・労災・交通事故</dd></div>
          <div><dt>目印</dt><dd>黄色い「Y」の看板<br/>最寄りのバス停<${Tbd}/></dd></div>
        </dl>
        <a class="btn-or" href=${MAP} target="_blank" rel="noopener">Googleマップで開く</a>
      </div>
    </div>
  </div></div>`;
}

function EndCta(){
  return html`<section class="endcta" id="reserve">
    <img src=${IMG.room} alt="" loading="lazy" style=${{objectPosition:"50% 70%"}}/>
    <div class="wrap"><div class="end-card rv">
      <span class="badge"><small>ご予約は</small><b>LINE</b></span>
      <p class="k">痛みの原因を確かめて、動ける身体へ。</p>
      <h2>Yuu.47整骨院でお待ちしています</h2>

      <div class="end-btns"><a class="btn-line" href=${LINE} target="_blank" rel="noopener"><${LineIcon}/>LINEで予約する</a></div>
      <p class="end-tel">お電話でのご予約<b>${TEL}</b></p>

}

function Footer(){
  return html`<footer class="ft"><div class="wrap">
    <img src=${IMG.logo} width="360" height="163" alt="Yuu.47" loading="lazy"/>
    <p class="ft-addr">Yuu.47整骨院　〒921-8178 石川県金沢市寺地1丁目21番13号　TEL ${TEL}</p>

    <p class="ft-legal">施術による変化の感じ方には個人差があります。健康保険の適用は、原因がはっきりしている急性・亜急性のケガに限られます。</p>
    <p class="ft-cr">© Yuu.47整骨院</p>

}

function App(){
  const [st,setSt] = useState(status());
  useEffect(()=>{const t=setInterval(()=>setSt(status()),60000);return()=>clearInterval(t)},[]);
  return html`<${Header}/>
    <main>
      <${Hero} st=${st}/><${About}/><${Worry}/><${Band}/><${Course}/><${Price}/><${Director}/><${Flow}/><${Faq}/><${Access} st=${st}/><${EndCta}/>
    </main>
    <${Footer}/>
    <div class="fix"><a class="btn-line" href=${LINE} target="_blank" rel="noopener"><${LineIcon} s=${20}/>LINEで予約</a><a class="tl" href=${TELH}><${TelIcon} s=${16}/>電話</a></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>
