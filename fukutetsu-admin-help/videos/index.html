<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福鉄 さんぽ帳 admin パネル 使い方動画</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:oklch(0.985 0.005 145);
  --bg2:oklch(0.960 0.014 145);
  --ink:oklch(0.18 0.010 145);
  --ink2:oklch(0.38 0.016 145);
  --ink3:oklch(0.55 0.018 145);
  --line:oklch(0.86 0.012 145);
  --leaf:oklch(0.34 0.090 145);
  --leaf-tint:oklch(0.96 0.022 145);
  --rail:oklch(0.52 0.140 55);
  --fb:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --fn:'Inter Tight','Inter',system-ui,sans-serif;
}
html{background:var(--bg);color:var(--ink);font-family:var(--fb);font-feature-settings:"palt" 1;}
body{min-height:100dvh;display:flex;flex-direction:column;}

/* ── Header ── */
.site-header{
  padding:20px 40px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;
}
.site-header .brand{
  font-family:var(--fn);font-size:11px;font-weight:500;
  color:var(--ink2);letter-spacing:0.12em;text-transform:uppercase;
}
.site-header .title{
  font-family:var(--fb);font-size:14px;font-weight:700;color:var(--ink);
}

/* ── Main layout ── */
.main{
  flex:1;
  max-width:1160px;margin:0 auto;
  padding:40px 40px 60px;
  width:100%;
}

/* ── Chapter nav ── */
.chapter-nav{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:28px;
}
.ch-btn{
  font-family:var(--fb);font-size:12px;font-weight:500;
  color:var(--ink2);background:transparent;
  border:1px solid var(--line);border-radius:4px;
  padding:6px 14px;cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.ch-btn:hover{background:var(--bg2);color:var(--ink);border-color:var(--ink3);}
.ch-btn.active{
  background:var(--leaf);color:#f3f6f2;
  border-color:var(--leaf);font-weight:700;
}

/* ── Video player ── */
.player-wrap{
  position:relative;
  background:#000;border-radius:8px;
  overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.18);
  margin-bottom:28px;
}
.player-wrap video{
  display:block;width:100%;
  aspect-ratio:1440/900;
}

/* ── Chapter info ── */
.ch-info{
  padding:24px 28px;
  background:var(--bg2);border-radius:6px;
  margin-bottom:28px;
}
.ch-info .ch-num{
  font-family:var(--fn);font-size:11px;font-weight:500;
  color:var(--leaf);letter-spacing:0.10em;
  margin-bottom:6px;
}
.ch-info .ch-title{
  font-family:var(--fb);font-size:20px;font-weight:700;
  color:var(--ink);line-height:1.4;
  margin-bottom:10px;
}
.ch-info .ch-desc{
  font-family:var(--fb);font-size:14px;font-weight:500;
  color:var(--ink2);line-height:1.7;max-width:72ch;
}

/* ── Chapter list ── */
.ch-list{
  display:flex;flex-direction:column;gap:0;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;
}
.ch-item{
  display:flex;align-items:center;gap:16px;
  padding:14px 20px;cursor:pointer;
  border-bottom:1px solid var(--line);
  transition:background .12s;
}
.ch-item:last-child{border-bottom:none;}
.ch-item:hover{background:var(--bg2);}
.ch-item.active{background:var(--leaf-tint);}
.ch-item .num{
  font-family:var(--fn);font-size:11px;font-weight:500;
  color:var(--leaf);letter-spacing:0.08em;
  flex-shrink:0;width:28px;
}
.ch-item .name{
  font-family:var(--fb);font-size:14px;font-weight:500;color:var(--ink);flex:1;
}
.ch-item .dur{
  font-family:var(--fn);font-size:11px;font-weight:400;color:var(--ink3);flex-shrink:0;
}

/* ── Footer ── */
.site-footer{
  padding:20px 40px;
  border-top:1px solid var(--line);
  display:flex;align-items:center;gap:20px;
}
.site-footer .note{
  font-family:var(--fb);font-size:12px;color:var(--ink2);
}
.site-footer a{color:var(--leaf);text-decoration:none;font-weight:700;}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">Fukutetsu · Sanpocho admin</div>
  <div style="flex:1;height:1px;"></div>
  <div class="title">使い方動画</div>
</header>

<main class="main">

  <!-- Chapter nav tabs -->
  <nav class="chapter-nav" id="chapterNav">
    <button class="ch-btn active" data-index="0">全章再生</button>
    <button class="ch-btn" data-index="1">01 オープニング</button>
    <button class="ch-btn" data-index="2">02 画面構成</button>
    <button class="ch-btn" data-index="3">03 タブ切替機能</button>
    <button class="ch-btn" data-index="4">04 タブ詳細設定</button>
    <button class="ch-btn" data-index="5">05 LINE への反映</button>
    <button class="ch-btn" data-index="6">06 その他セクション</button>
    <button class="ch-btn" data-index="7">07 エンディング</button>
  </nav>

  <!-- Video player -->
  <div class="player-wrap">
    <video id="mainVideo" controls preload="metadata">
      <source src="使い方動画-プロ版.mp4" type="video/mp4">
      お使いのブラウザは動画再生に対応していません。
    </video>
  </div>

  <!-- Chapter info -->
  <div class="ch-info" id="chInfo">
    <div class="ch-num">GUIDE</div>
    <div class="ch-title">福鉄 さんぽ帳 admin パネル 完全ガイド</div>
    <div class="ch-desc">
      リッチメニューのタブ切替設定から LINE への反映まで、全工程を順にご覧いただけます。
      各章ボタンで任意の場面に飛ぶことができます。
    </div>
  </div>

  <!-- Chapter list -->
  <div class="ch-list" id="chList"></div>

</main>

<footer class="site-footer">
  <div class="note">admin パネル URL: <a href="https://t35ty6-rgb.github.io/skeleton-demos/fukutetsu-stamp-rally/richmenu-admin.html?v=19" target="_blank">richmenu-admin.html?v=19</a></div>
  <div style="flex:1;"></div>
  <div class="note">Skeleton Inc. · 2026</div>
</footer>

<script>
const CHAPTERS = [
  { num:'全',  title:'全章再生 (通し)',               desc:'オープニングからエンディングまでを連続で再生します。',  start:0,    dur:'6:28' },
  { num:'01',  title:'オープニング',                   desc:'このツールで何ができるか、3つのポイントをご紹介します。', start:0,    dur:'0:35' },
  { num:'02',  title:'画面の全体構成',                 desc:'左サイドバー / 中央フォーム / 右プレビュー / 上部ボタンの3+1構成を説明します。', start:35,   dur:'0:49' },
  { num:'03',  title:'タブ切替式リッチメニュー',        desc:'1〜4個のタブを追加し、LINE底面でタップ切替できる仕組みを解説します。', start:84,   dur:'1:04' },
  { num:'04',  title:'タブごとの詳細設定',             desc:'基本情報 / テンプレート15種 / 背景画像2モード / アクション設定を順に見せます。', start:148,  dur:'1:54' },
  { num:'05',  title:'LINE への反映',                  desc:'「LINE に反映」ボタン → 自動アップロード → LINEアプリ再起動の手順を説明します。', start:262,  dur:'0:52' },
  { num:'06',  title:'その他のセクション',             desc:'景品 / ルーレット / スポット / 一般設定 の各セクションをサイドバーから確認します。', start:314,  dur:'0:47' },
  { num:'07',  title:'エンディング',                   desc:'admin URL の確認と、反映されない時のトラブルシューティングをお伝えします。', start:361,  dur:'0:27' },
];

const video = document.getElementById('mainVideo');
const nav   = document.getElementById('chapterNav');
const info  = document.getElementById('chInfo');
const list  = document.getElementById('chList');

// Build chapter list
CHAPTERS.forEach((ch, i) => {
  const item = document.createElement('div');
  item.className = 'ch-item' + (i === 0 ? ' active' : '');
  item.innerHTML = `
    <div class="num">${ch.num}</div>
    <div class="name">${ch.title}</div>
    <div class="dur">${ch.dur}</div>
  `;
  item.addEventListener('click', () => selectChapter(i));
  list.appendChild(item);
});

let currentIndex = 0;

function selectChapter(i) {
  currentIndex = i;
  const ch = CHAPTERS[i];

  // nav
  nav.querySelectorAll('.ch-btn').forEach((b, bi) => b.classList.toggle('active', bi === i));
  // list
  list.querySelectorAll('.ch-item').forEach((el, ei) => el.classList.toggle('active', ei === i));
  // info
  info.querySelector('.ch-num').textContent   = `CHAPTER ${ch.num}`;
  info.querySelector('.ch-title').textContent  = ch.title;
  info.querySelector('.ch-desc').textContent   = ch.desc;
  // seek & play
  video.currentTime = ch.start;
  video.play();
}

// Nav button clicks
nav.querySelectorAll('.ch-btn').forEach((btn, i) => {
  btn.addEventListener('click', () => selectChapter(i));
});
</script>
</body>
</html>
