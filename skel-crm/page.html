<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>読み込み中…</title>
<style>
  :root {
    --bg:         #fafafa;
    --surface:    #ffffff;
    --surface-2:  #f0f2f7;
    --ink:        #0f172a;
    --ink-2:      #3d4356;
    --ink-muted:  #6b7280;
    --rule:       #e4e7ee;
    --rule-strong:#cbd5e1;
    --primary:    #17b26a;
    --primary-hi: #0e9a5a;
    --primary-soft: #dcfce7;
    --font-jp:    "Noto Sans JP", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono:  "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-jp);
    color: var(--ink);
    background: var(--bg);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }
  @media (min-width: 900px) { .wrap { max-width: 860px; padding: 0 32px; } }

  /* Hero */
  .hero {
    position: relative;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #0f172a 100%);
    color: #fff;
    overflow: hidden;
    padding: 68px 0 88px;
  }
  .hero-image {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0.35;
    z-index: 0;
  }
  .hero-image::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(15,23,42,0.55) 0%, rgba(15,23,42,0.9) 100%);
  }
  .hero-content { position: relative; z-index: 2; }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero-eyebrow-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
    box-shadow: 0 0 0 3px rgba(23,178,106,0.25);
  }
  .hero h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 16px;
    color: #fff;
  }
  .hero-sub {
    font-size: clamp(14px, 3vw, 17px);
    font-weight: 500;
    color: rgba(255,255,255,0.78);
    line-height: 1.75;
    max-width: 620px;
    margin-bottom: 32px;
  }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 28px;
    background: var(--primary); color: #fff;
    font-size: 15px; font-weight: 800;
    border: 0; border-radius: 10px;
    cursor: pointer;
    transition: background 150ms;
  }
  .hero-cta:hover { background: var(--primary-hi); }

  /* Benefits — long-form, not cards */
  .section {
    padding: 72px 0;
    background: var(--surface);
    border-top: 1px solid var(--rule);
  }
  .section-eyebrow {
    display: inline-block;
    font-size: 11.5px; font-weight: 800;
    color: var(--primary-hi);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    padding: 4px 10px;
    background: var(--primary-soft);
    border-radius: 999px;
  }
  .section-h {
    font-size: clamp(22px, 4vw, 28px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.35;
    margin-bottom: 32px;
  }
  .benefits {
    display: flex; flex-direction: column;
    gap: 28px;
  }
  .benefit {
    padding: 24px 0;
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 20px;
  }
  .benefit:last-child { border-bottom: 0; }
  .benefit-num {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-hi);
    letter-spacing: 0.02em;
    padding-top: 2px;
  }
  .benefit-body h3 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .benefit-body p {
    font-size: 14.5px;
    color: var(--ink-2);
    line-height: 1.85;
  }

  /* Instructor — single block with photo left / bio right */
  .instructor-wrap {
    background: var(--surface-2);
    border-radius: 14px;
    padding: 32px 28px;
  }
  .instructor-eyebrow {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .instructor-name {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .instructor-title {
    font-size: 13px;
    color: var(--ink-muted);
    font-weight: 700;
    margin-bottom: 14px;
  }
  .instructor-bio {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.85;
  }

  /* Price — receipt-inspired */
  .price {
    background: var(--ink);
    color: #fff;
    padding: 72px 0;
    text-align: center;
  }
  .price-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    text-decoration: line-through;
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  .price-main {
    font-family: var(--font-mono);
    font-size: clamp(48px, 10vw, 72px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 8px;
  }
  .price-note {
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    font-weight: 500;
    margin-bottom: 32px;
  }
  .price .hero-cta {
    padding: 18px 36px;
    font-size: 16px;
    background: var(--primary);
  }

  /* FAQ — accordion (native details) */
  .faq {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .faq details {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 16px 20px;
    cursor: pointer;
    list-style: none;
  }
  .faq summary {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.005em;
    display: flex; align-items: center; justify-content: space-between;
    list-style: none;
  }
  .faq summary::marker, .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: '＋';
    font-family: var(--font-mono);
    color: var(--ink-muted);
    font-weight: 700;
    transition: transform 200ms;
  }
  .faq details[open] summary::after { content: '−'; }
  .faq details p {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.85;
    font-weight: 500;
  }

  /* Footer */
  footer {
    padding: 40px 0 80px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 11.5px;
    font-weight: 600;
    background: var(--bg);
    border-top: 1px solid var(--rule);
  }

  /* Sticky CTA on SP */
  .sticky-cta {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    z-index: 50;
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 14px; font-weight: 800;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.16);
    display: none;
    letter-spacing: -0.005em;
  }
  @media (max-width: 720px) {
    .sticky-cta.show { display: block; }
  }

  /* Preview banner */
  .preview-banner {
    background: #fbbf24;
    color: #78350f;
    text-align: center;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 800;
  }

  /* Loading state */
  .loading {
    padding: 120px 24px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  /* Error state */
  .not-found {
    padding: 120px 24px;
    text-align: center;
  }
  .not-found h1 {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .not-found p {
    color: var(--ink-muted);
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<a href="#cta" class="sticky-cta" id="sticky-cta">申し込む</a>

<script>window.__CRM_CONFIG = window.__CRM_CONFIG || {};</script>
<script src="/config.js" onerror="void 0"></script>
<script>
(async function() {
  const url = new URL(window.location.href);
  let pageId = url.searchParams.get('id');
  // /p/{id} rewrite で URL param が 空 の 場合 は pathname から 抽出
  if (!pageId) {
    const m = url.pathname.match(/^\/p\/([^\/]+)/);
    if (m) pageId = decodeURIComponent(m[1]);
  }
  const isPreview = url.searchParams.get('preview') === '1';
  const app = document.getElementById('app');

  if (!pageId) {
    app.innerHTML = '<div class="not-found"><h1>ページ が 見つかりません</h1><p>URL に ?id=xxx が 必要 です</p></div>';
    return;
  }

  let page = null;
  if (isPreview) {
    try {
      const raw = sessionStorage.getItem(`page-preview-${pageId}`);
      if (raw) page = JSON.parse(raw);
    } catch (e) {}
  }

  if (!page) {
    // Firestore から fetch (page.html は Firebase Hosting 上 で 動く 前提)
    try {
      const [{ initializeApp }, { getAuth, signInAnonymously, onAuthStateChanged }, { getFirestore, doc, getDoc }] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js'),
      ]);
      const cfg = window.__CRM_CONFIG || {};
      if (!cfg.firebase) { throw new Error('config missing'); }
      const app_ = initializeApp(cfg.firebase);
      const auth = getAuth(app_);
      const db = getFirestore(app_);
      await new Promise(res => { onAuthStateChanged(auth, u => u && res()); signInAnonymously(auth).catch(()=>{}); });
      const tenantId = url.searchParams.get('tenant') || cfg.defaultTenantId || 'demo';
      const snap = await getDoc(doc(db, 'tenants', tenantId, 'pages', pageId));
      if (snap.exists()) page = snap.data();
    } catch (e) { console.warn('page fetch failed', e); }
  }

  if (!page) {
    app.innerHTML = '<div class="not-found"><h1>ページ が 見つかりません</h1><p>この URL の ページ は 削除 された か、 まだ 公開 されて いません</p></div>';
    return;
  }
  if (!isPreview && !page.published) {
    app.innerHTML = '<div class="not-found"><h1>下書き 中 の ページ</h1><p>この ページ は まだ 公開 されて いません</p></div>';
    return;
  }

  document.title = page.heroTitle || 'ページ';

  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const heroImage = page.heroImage ? `<div class="hero-image" style="background-image:url('${esc(page.heroImage)}')"></div>` : '';
  const templateLabel = { sales: '講座 販売', seminar: 'セミナー 案内', consult: '個別 相談' }[page.template] || 'ページ';

  const benefits = (page.benefits || []).filter(b => b.title || b.body);
  const faq = (page.faq || []).filter(f => f.q || f.a);
  const ins = page.instructor || {};
  const ctaHref = page.ctaUrl || '#cta';

  const html = `
    ${isPreview ? '<div class="preview-banner">プレビュー 表示 中 (未 保存 内容 を 反映)</div>' : ''}
    <section class="hero" id="top">
      ${heroImage}
      <div class="wrap hero-content">
        <div class="hero-eyebrow"><span class="hero-eyebrow-dot"></span>${esc(templateLabel)}</div>
        <h1>${esc(page.heroTitle || '(タイトル 未設定)')}</h1>
        <p class="hero-sub">${esc(page.heroSubtitle || '')}</p>
        <a href="${esc(ctaHref)}" class="hero-cta" id="hero-cta-btn">${esc(page.ctaText || '申し込む')} →</a>
      </div>
    </section>

    ${benefits.length > 0 ? `
    <section class="section">
      <div class="wrap">
        <div class="section-eyebrow">この 講座 で 得られる もの</div>
        <h2 class="section-h">3 つ の 特徴</h2>
        <div class="benefits">
          ${benefits.map((b, i) => `
            <div class="benefit">
              <div class="benefit-num">${String(i+1).padStart(2,'0')}</div>
              <div class="benefit-body">
                <h3>${esc(b.title || '')}</h3>
                <p>${esc(b.body || '')}</p>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </section>` : ''}

    ${(ins.name || ins.bio) ? `
    <section class="section" style="background:var(--bg)">
      <div class="wrap">
        <div class="instructor-wrap">
          <div class="instructor-eyebrow">講師 · 主催</div>
          <div class="instructor-name">${esc(ins.name || '')}</div>
          ${ins.title ? `<div class="instructor-title">${esc(ins.title)}</div>` : ''}
          ${ins.bio ? `<div class="instructor-bio">${esc(ins.bio)}</div>` : ''}
        </div>
      </div>
    </section>` : ''}

    ${(page.priceMain || page.ctaText) ? `
    <section class="price" id="cta">
      <div class="wrap">
        ${page.priceLabel ? `<div class="price-label">${esc(page.priceLabel)}</div>` : ''}
        ${page.priceMain ? `<div class="price-main">${esc(page.priceMain)}</div>` : ''}
        ${page.priceNote ? `<div class="price-note">${esc(page.priceNote)}</div>` : ''}
        <a href="${esc(ctaHref)}" class="hero-cta">${esc(page.ctaText || '申し込む')} →</a>
      </div>
    </section>` : ''}

    ${faq.length > 0 ? `
    <section class="section">
      <div class="wrap">
        <div class="section-eyebrow">よく ある 質問</div>
        <h2 class="section-h">FAQ</h2>
        <div class="faq">
          ${faq.map(f => `
            <details>
              <summary>${esc(f.q || '')}</summary>
              <p>${esc(f.a || '')}</p>
            </details>`).join('')}
        </div>
      </div>
    </section>` : ''}

    <footer>
      <div class="wrap">
        Powered by Skel·CRM · Lステップ / エルメ 拡張 モジュール
      </div>
    </footer>
  `;
  app.innerHTML = html;

  // Sticky CTA: hero を 超えた ら 表示
  const heroEl = document.querySelector('.hero');
  const stickyCta = document.getElementById('sticky-cta');
  stickyCta.textContent = (page.ctaText || '申し込む') + ' →';
  if (page.ctaUrl) stickyCta.href = page.ctaUrl;
  const io = new IntersectionObserver((entries) => {
    stickyCta.classList.toggle('show', !entries[0].isIntersecting);
  }, { threshold: 0.1 });
  io.observe(heroEl);
})();
</script>
</body>
</html>
