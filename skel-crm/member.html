<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2530">
<title>会員ページ · Skel·CRM</title>
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-2: #f0efec;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-muted: #6f6f6f;
    --rule: rgba(0,0,0,0.08);
    --rule-strong: rgba(0,0,0,0.16);
    --primary: #06c755;
    --primary-hi: #048a3c;
    --primary-soft: #def5e4;
    --warn: #c63b2a;
    --side: #1c2530;
    --side-ink: #e5ecf3;
    --side-ink-muted: #98a6b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: -0.005em;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  a { color: var(--primary-hi); text-decoration: none; }
  input { font: inherit; color: inherit; }

  /* ============ Layout (2-pane after login) ============ */
  .wrap { min-height: 100%; display: flex; flex-direction: column; }

  /* Top bar (会員ヘッダ) */
  .topbar {
    background: var(--side);
    color: var(--side-ink);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 14px; letter-spacing: -0.01em;
  }
  .topbar .brand svg { color: var(--primary); }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: 12px; color: var(--side-ink-muted); font-weight: 600; }
  .topbar .logout {
    padding: 6px 12px; border: 1px solid rgba(255,255,255,0.16);
    border-radius: 8px; font-size: 12px; color: var(--side-ink-muted); font-weight: 700;
  }
  .topbar .logout:hover { color: var(--side-ink); background: rgba(255,255,255,0.05); }

  /* ============ Login screen ============ */
  #screen-login {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 36px 32px;
    max-width: 380px;
    width: 100%;
  }
  .login-card .brand-line {
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
    color: var(--ink-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  }
  .login-card .brand-line svg { color: var(--primary); }
  .login-card h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 8px; }
  .login-card .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; line-height: 1.65; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px; font-weight: 700; color: var(--ink-muted);
    letter-spacing: 0.04em; margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--rule-strong);
    border-radius: 8px;
    font-size: 14px;
    background: var(--surface);
    outline: none;
    transition: border-color 120ms;
  }
  .field input:focus { border-color: var(--ink); }
  #login-error {
    display: none;
    margin-bottom: 14px; padding: 10px 12px;
    background: #fde8e5; border-left: 3px solid var(--warn);
    color: #7a2415; font-size: 12px; font-weight: 600; border-radius: 4px;
  }
  #login-error.show { display: block; }
  #login-btn {
    width: 100%;
    padding: 11px 14px;
    background: var(--ink); color: #fff;
    border: 1px solid var(--ink); border-radius: 8px;
    font-size: 14px; font-weight: 800;
    transition: opacity 120ms;
  }
  #login-btn:hover { opacity: 0.9; }
  .login-hint {
    margin-top: 18px; font-size: 11px; color: var(--ink-muted); text-align: center; line-height: 1.6;
  }

  /* ============ Course screen ============ */
  #screen-courses {
    flex: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    width: 100%;
  }
  .page-title {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px;
  }
  .page-sub { font-size: 13px; color: var(--ink-muted); margin-bottom: 24px; }

  .course-card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: box-shadow 150ms;
  }
  .course-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  .course-title { font-size: 15px; font-weight: 800; letter-spacing: -0.005em; margin-bottom: 4px; }
  .course-desc { font-size: 12.5px; color: var(--ink-muted); line-height: 1.55; margin-bottom: 12px; }
  .course-progress {
    display: flex; align-items: center; gap: 12px; margin-top: 8px;
  }
  .progress-bar {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--primary);
    transition: width 300ms;
    border-radius: 3px;
  }
  .course-progress .n { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; letter-spacing: 0.02em; }
  .course-cta {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; padding: 10px 16px;
    background: var(--ink); color: #fff;
    border-radius: 8px; font-size: 13px; font-weight: 800;
  }
  .course-cta:hover { opacity: 0.9; }

  /* ============ Chapter list ============ */
  #screen-chapters {
    flex: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    width: 100%;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border: 1px solid var(--rule-strong); border-radius: 8px;
    font-size: 12px; color: var(--ink-soft); font-weight: 700;
    margin-bottom: 20px;
    transition: background 120ms;
  }
  .back-btn:hover { background: var(--surface-2); }
  .chapter-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .chapter-row {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 96px 46px 1fr auto;
    align-items: center;
    gap: 14px;
    transition: box-shadow 150ms;
  }
  .chapter-thumb {
    width: 96px;
    aspect-ratio: 16/9;
    border-radius: 8px;
    background-position: center;
    background-size: cover;
    background-color: var(--surface-2);
    flex-shrink: 0;
  }
  .chapter-row.unlocked { cursor: pointer; }
  .chapter-row.unlocked:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
  .chapter-row.locked { opacity: 0.55; cursor: not-allowed; }
  .chapter-no {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    color: var(--ink-muted);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
  }
  .chapter-body .title { font-size: 14px; font-weight: 700; letter-spacing: -0.005em; margin-bottom: 2px; }
  .chapter-body .desc { font-size: 12px; color: var(--ink-muted); line-height: 1.5; }
  .chapter-action { display: flex; align-items: center; gap: 8px; }
  .chapter-status {
    font-size: 11px; font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(0,0,0,0.06);
    color: var(--ink-soft);
  }
  .chapter-status.completed { background: var(--primary-soft); color: var(--primary-hi); }
  .chapter-status.locked { background: rgba(0,0,0,0.04); color: var(--ink-muted); }
  .chapter-cta {
    padding: 7px 14px; background: var(--ink); color: #fff;
    border-radius: 8px; font-size: 12px; font-weight: 800;
  }
  .chapter-cta:hover { opacity: 0.9; }
  .zoom-milestone {
    background: var(--primary-soft);
    border: 1px solid rgba(6,199,85,0.25);
    border-left: 3px solid var(--side);
    border-radius: 12px;
    padding: 14px 18px 14px 20px;
    display: flex; align-items: center; gap: 14px;
    margin-top: 14px;
  }
  .zoom-milestone svg { color: var(--primary); flex-shrink: 0; }
  .zoom-milestone .m-body { flex: 1; }
  .zoom-milestone .m-title { font-size: 13px; font-weight: 800; color: var(--primary-hi); margin-bottom: 2px; }
  .zoom-milestone .m-desc { font-size: 11.5px; color: var(--ink-soft); line-height: 1.55; }
  .zoom-cta {
    padding: 8px 14px; background: var(--primary); color: #fff;
    border-radius: 8px; font-size: 12px; font-weight: 800;
    flex-shrink: 0;
  }
  .zoom-cta:hover { opacity: 0.9; }
  .zoom-locked {
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--rule);
    color: var(--ink-muted);
  }
  .zoom-locked .m-title { color: var(--ink-soft); }
  .zoom-locked svg { color: var(--ink-muted); }

  /* ============ Player screen ============ */
  #screen-player {
    flex: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    width: 100%;
  }
  .player-frame {
    aspect-ratio: 16/9;
    background: #0a0c11;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
  }
  .player-frame video {
    width: 100%; height: 100%; display: block; background: #000;
  }
  .player-frame .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5); gap: 10px;
  }
  .player-frame .placeholder svg { color: rgba(255,255,255,0.35); }
  .player-title { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 6px; }
  .player-meta { font-size: 12px; color: var(--ink-muted); font-family: "SF Mono", monospace; letter-spacing: 0.02em; margin-bottom: 18px; }
  .player-desc {
    font-size: 13.5px; color: var(--ink-soft); line-height: 1.7;
    padding-top: 14px; border-top: 1px solid var(--rule);
    white-space: pre-wrap;
  }
  .player-complete-btn {
    margin-top: 24px;
    padding: 14px 20px; background: var(--ink); color: #fff;
    border-radius: 8px; font-size: 14px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    max-width: 420px;
  }
  .player-complete-btn.completed { background: var(--primary); }

  /* 学び ツール bar (速度) */
  .tool-bar {
    display: flex; align-items: center; gap: 20px;
    margin-top: 16px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
    flex-wrap: wrap;
  }
  .tool-label { font-size: 11.5px; color: var(--ink-muted); font-weight: 700; letter-spacing: 0.02em; }
  .speed-group { display: flex; align-items: center; gap: 10px; }
  .speed-btns { display: flex; gap: 4px; }
  .speed-btn {
    padding: 6px 12px; border: 1px solid var(--rule-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 100ms;
  }
  .speed-btn:hover { background: var(--surface-2); }
  .speed-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 学び tab */
  .tab-bar {
    display: flex; gap: 0; margin-top: 20px; border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }
  .learn-tab {
    padding: 10px 16px; background: transparent; border: 0;
    border-bottom: 2px solid transparent;
    font-size: 13px; font-weight: 700; color: var(--ink-muted);
    cursor: pointer; white-space: nowrap;
    transition: all 120ms;
  }
  .learn-tab:hover { color: var(--ink); }
  .learn-tab.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }
  .tab-panel { display: none; padding-top: 18px; min-height: 100px; }
  .tab-panel.active { display: block; }

  .tool-btn {
    padding: 6px 12px; border: 1px solid var(--rule-strong); border-radius: 6px;
    background: var(--surface); color: var(--ink); font-size: 11.5px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .tool-btn:hover { background: var(--surface-2); }

  /* 資料 list */
  .material-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 8px;
  }
  .material-row .m-ic {
    width: 36px; height: 36px; background: var(--surface-2); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; color: var(--ink-muted);
    flex-shrink: 0;
  }
  .material-row .m-body { flex: 1; min-width: 0; }
  .material-row .m-title { font-size: 13px; font-weight: 700; }
  .material-row .m-desc { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }
  .material-row .m-dl {
    padding: 6px 12px; background: var(--ink); color: #fff; border-radius: 6px;
    font-size: 12px; font-weight: 700; text-decoration: none;
  }

  /* Quiz */
  .quiz-q { margin-bottom: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
  .quiz-q-title { font-size: 14px; font-weight: 800; margin-bottom: 12px; line-height: 1.5; }
  .quiz-opt {
    display: block; padding: 10px 14px; margin-bottom: 6px;
    border: 1px solid var(--rule-strong); border-radius: 8px;
    cursor: pointer; font-size: 13px; transition: all 100ms;
    background: var(--surface);
  }
  .quiz-opt:hover { border-color: var(--ink); background: var(--surface-2); }
  .quiz-opt input { margin-right: 8px; }
  .quiz-opt.correct { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-hi); font-weight: 700; }
  .quiz-opt.wrong { background: #fde8e5; border-color: var(--warn); color: #7a1e12; font-weight: 700; }
  .quiz-result {
    padding: 14px 18px; border-radius: 8px; margin-top: 14px; font-size: 13px; font-weight: 700;
  }
  .quiz-result.pass { background: var(--primary-soft); color: var(--primary-hi); border-left: 3px solid var(--primary); }
  .quiz-result.fail { background: #fde8e5; color: #7a1e12; border-left: 3px solid var(--warn); }
  .quiz-submit {
    padding: 10px 20px; background: var(--ink); color: #fff; border: 0; border-radius: 8px;
    font-size: 13px; font-weight: 800; cursor: pointer; margin-top: 8px;
  }
  .quiz-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 640px) {
    #screen-courses, #screen-chapters, #screen-player { padding: 20px 14px 60px; }
    .topbar { padding: 12px 16px; }
    .page-title { font-size: 18px; }
    .course-card { padding: 16px 18px; }
    .chapter-row { grid-template-columns: 72px 1fr; padding: 12px 14px; gap: 10px; }
    .chapter-thumb { width: 72px; }
    .chapter-no { display: none; }
    .chapter-action { grid-column: 1 / -1; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- Topbar (after login) -->
  <div class="topbar" id="topbar" style="display:none">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9 L15 12 L10 15 Z" fill="currentColor" stroke="none"/></svg>
      <span>受講コース</span>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who">—</div>
    <button class="logout" id="logout-btn">ログアウト</button>
  </div>

  <!-- Login screen -->
  <div id="screen-login">
    <div class="login-card">
      <div class="brand-line">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9 L15 12 L10 15 Z" fill="currentColor" stroke="none"/></svg>
        <span>SKEL·CRM 受講 ページ</span>
      </div>
      <h1>ログイン</h1>
      <div class="sub">ご案内 の メール に 記載 の ID と パスワード で ログイン して ください。</div>
      <div id="login-error"></div>
      <div class="field">
        <label>会員 ID (メール or 会員番号)</label>
        <input type="text" id="login-id" autocomplete="username" placeholder="member@example.com">
      </div>
      <div class="field">
        <label>パスワード</label>
        <input type="password" id="login-pw" autocomplete="current-password" placeholder="発行 された パスワード">
      </div>
      <button id="login-btn">ログイン</button>
      <div class="login-hint">
        パスワード を お忘れ の 方 は 担当 まで お問合せ ください。<br>
        デモ アカウント: <b>demo@example.com</b> / <b>demo1234</b>
      </div>
    </div>
  </div>

  <!-- Courses screen -->
  <div id="screen-courses" style="display:none">
    <div class="page-title">受講 可能 な コース</div>
    <div class="page-sub" id="courses-sub">—</div>
    <div id="courses-list"></div>
  </div>

  <!-- Chapters screen -->
  <div id="screen-chapters" style="display:none">
    <button class="back-btn" id="back-to-courses">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      コース 一覧 に 戻る
    </button>
    <div class="page-title" id="chapters-title">—</div>
    <div class="page-sub" id="chapters-desc">—</div>
    <div class="chapter-list" id="chapters-list"></div>
    <div id="zoom-panel"></div>
  </div>

  <!-- Player screen -->
  <div id="screen-player" style="display:none">
    <button class="back-btn" id="back-to-chapters">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      章 一覧 に 戻る
    </button>
    <div class="player-frame">
      <video id="video-el" controls playsinline preload="metadata"></video>
      <div class="placeholder" id="video-placeholder" style="display:none">
        <svg viewBox="0 0 24 24" width="50" height="50" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M10 10 L15 12 L10 14 z" fill="currentColor" stroke="none"/></svg>
        <div style="font-size:12px;font-weight:700">デモ 再生 (実 file は 本番 で 差替)</div>
      </div>
    </div>
    <div class="player-title" id="player-title">—</div>
    <div class="player-meta" id="player-meta">—</div>

    <!-- 学び ツール bar (速度 / メモ / 資料 タブ) -->
    <div class="tool-bar">
      <div class="speed-group">
        <span class="tool-label">再生 速度</span>
        <div class="speed-btns" id="speed-btns">
          <button class="speed-btn" data-rate="0.75">0.75x</button>
          <button class="speed-btn active" data-rate="1">1x</button>
          <button class="speed-btn" data-rate="1.25">1.25x</button>
          <button class="speed-btn" data-rate="1.5">1.5x</button>
          <button class="speed-btn" data-rate="2">2x</button>
        </div>
      </div>
    </div>

    <div class="tab-bar">
      <button class="learn-tab active" data-tab="desc">概要</button>
      <button class="learn-tab" data-tab="memo">メモ</button>
      <button class="learn-tab" data-tab="materials">資料</button>
      <button class="learn-tab" data-tab="quiz">理解度 チェック</button>
    </div>

    <div id="tab-desc" class="tab-panel active">
      <div class="player-desc" id="player-desc"></div>
    </div>

    <div id="tab-memo" class="tab-panel">
      <div style="font-size:12px;color:var(--ink-muted);margin-bottom:8px;line-height:1.55">この 章 の 学び を 自由 に メモ。 再訪時 も 自動 で 保持 されます</div>
      <textarea id="memo-input" placeholder="ここに メモ を 書く…" style="width:100%;min-height:180px;padding:12px 14px;border:1px solid var(--rule-strong);border-radius:8px;font-family:inherit;font-size:14px;line-height:1.65;resize:vertical;background:var(--surface)"></textarea>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <span id="memo-saved" style="font-size:11px;color:var(--ink-muted);flex:1">未 変更</span>
        <button class="tool-btn" id="memo-insert-timestamp">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          現在 位置 を メモ
        </button>
      </div>
    </div>

    <div id="tab-materials" class="tab-panel">
      <div id="materials-list"></div>
    </div>

    <div id="tab-quiz" class="tab-panel">
      <div id="quiz-content"></div>
    </div>

    <button class="player-complete-btn" id="mark-complete-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="mark-complete-label">この 章 を 完走 済 に する</span>
    </button>
  </div>
</div>

<script>
// =========================================================
// Skel·CRM 会員ページ (member.html)
// URL + パスワード ゲート · コース 受講 UI · 進捗 は localStorage
// =========================================================
// Demo mode: config.js なし で localStorage 完結。
// 本番: 下部 script section で Firebase auth callable に 差替 予定 (Phase 2)。
// =========================================================

// ---- config ----
const DEMO_MEMBERS = {
  'demo@example.com': { password: 'demo1234', name: 'デモ 太郎', tagIds: ['t3'] },
  'test@example.com': { password: 'test1234', name: 'テスト 花子', tagIds: ['t3', 't4'] },
};

// 会員 が 受講 可能 な course + chapter 定義 (admin 側 の state.courses / state.videos と 同じ schema)。
// demo mode: localStorage `skel-crm-demo-lms-{tenantId}` に admin 側 で 書いた 内容 を 読む。
//   admin で 追加 された コース + 章 が 即 反映 される。 storage に 何 も 無ければ 下記 fallback 使用。
// prod mode: 本番 は Firestore + Cloud Function 経由 で 取得 (Phase 2)。
const DEMO_COURSES_FALLBACK = [
  {
    id: 'course-teiki',
    title: '定期便 マスター コース',
    description: '5 章 完結 の コース。 章 は 順番 に 解放。 CH03 完走 で 個別 mentor 面談 の Zoom link が 発行 されます。',
    memberTagIds: ['t3'],
    published: true,
    materials: [
      { title: '受講 ガイド (PDF)', desc: '進め方 と 各章 の 学習 ゴール', url: 'https://www.w3.org/WAI/WCAG21/quickref/quickref.pdf', kind: 'pdf' },
      { title: '定期便 チェック リスト', desc: '毎月 使う チェック 項目 一覧', url: 'https://www.w3.org/WAI/WCAG21/quickref/quickref.pdf', kind: 'pdf' },
    ],
    chapters: [
      { id: 'v-course-teiki-ch1', chapterNo: 1, title: 'CH01 · はじめに', description: '定期便 の 全体像 と、 この コース で 得られる 成果 の 説明。', durationSec: 180,
        quiz: [{ q: 'このコース で 学べる 内容 は?', options: ['定期便 の 全体像', '商品 の 開発 秘話', '経理 処理'], correct: 0 }] },
      { id: 'v-course-teiki-ch2', chapterNo: 2, title: 'CH02 · 商品 の 選び方', description: '4 タイプ の 定期便 商品 を どう 選ぶ か、 判定 チェック リスト 付き。', durationSec: 240,
        quiz: [
          { q: '商品 選び で 重要 な 判定 軸 は?', options: ['ライフスタイル', '価格', '色'], correct: 0 },
          { q: '定期便 に 適した 商品 タイプ は 何 個?', options: ['2 タイプ', '4 タイプ', '10 タイプ'], correct: 1 },
        ] },
      { id: 'v-course-teiki-ch3', chapterNo: 3, title: 'CH03 · 使いこなし 応用編', description: '効果 を 最大化 する 実践 テク。 完了 すると 個別 mentor 面談 の Zoom link が 発行 されます。', durationSec: 315, zoomMilestone: true,
        quiz: [{ q: '効果 最大化 の 最初 の 一手 は?', options: ['朝 使う', '夜 使う', '毎日 継続 する'], correct: 2 }] },
      { id: 'v-course-teiki-ch4', chapterNo: 4, title: 'CH04 · 継続 の コツ', description: '3ヶ月 継続 の 壁 を 乗り越える method。', durationSec: 260 },
      { id: 'v-course-teiki-ch5', chapterNo: 5, title: 'CH05 · 卒業 認定', description: '5章 全 修了 で 「定期便 マスター」 タグ 自動 付与。', durationSec: 200 },
    ],
  },
];

function loadDemoCourses(tenantId) {
  try {
    const raw = localStorage.getItem(`skel-crm-demo-lms-${tenantId}`);
    if (!raw) return DEMO_COURSES_FALLBACK;
    const data = JSON.parse(raw);
    const courses = (data.courses || []).filter(c => c.published);  // 公開済 のみ 客側 表示
    const chaptersByCourse = {};
    (data.videos || []).forEach(v => {
      if (!v.courseId) return;
      chaptersByCourse[v.courseId] = chaptersByCourse[v.courseId] || [];
      chaptersByCourse[v.courseId].push({
        id: v.id,
        chapterNo: v.chapterNo,
        title: v.title,
        description: v.description,
        durationSec: v.durationSec,
        zoomMilestone: v.zoomMilestone?.enabled || false,
        thumbUrl: v.thumbUrl || '',
        videoUrl: v.videoUrl || '',  // admin upload の 実 URL (demo mode の blob は tab 間 で 死ぬ ので、 空 なら sample MP4 fallback)
      });
    });
    const merged = courses.map(c => ({
      ...c,
      chapters: (chaptersByCourse[c.id] || []).sort((a,b) => (a.chapterNo||0) - (b.chapterNo||0)),
    })).filter(c => c.chapters.length > 0);   // 章 なし コース は 非表示
    return merged.length > 0 ? merged : DEMO_COURSES_FALLBACK;
  } catch (e) {
    console.warn('loadDemoCourses failed', e);
    return DEMO_COURSES_FALLBACK;
  }
}

// tenantId は URL の ?tenant= or 'demo'
const _tenantForCourses = new URL(window.location.href).searchParams.get('tenant') || 'demo';
const DEMO_COURSES = loadDemoCourses(_tenantForCourses);

// ---- helpers ----
const $ = (id) => document.getElementById(id);
function show(scr) {
  ['screen-login','screen-courses','screen-chapters','screen-player'].forEach(s => { $(s).style.display = 'none'; });
  $(scr).style.display = scr === 'screen-login' ? 'flex' : 'block';
  $('topbar').style.display = scr === 'screen-login' ? 'none' : 'flex';
}
function fmtDur(sec) {
  if (!sec) return '—';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function progressKey(memberId, courseId) { return `skel-member-progress-${memberId}-${courseId}`; }
function getProgress(memberId, courseId) {
  try { return JSON.parse(localStorage.getItem(progressKey(memberId, courseId)) || '{}'); }
  catch (e) { return {}; }
}
function setProgress(memberId, courseId, chapterNo, completed) {
  const p = getProgress(memberId, courseId);
  const prev = p[String(chapterNo)] || {};
  p[String(chapterNo)] = { ...prev, completed: !!completed, at: new Date().toISOString() };
  localStorage.setItem(progressKey(memberId, courseId), JSON.stringify(p));
}
function savePosition(memberId, courseId, chapterNo, sec) {
  const p = getProgress(memberId, courseId);
  const prev = p[String(chapterNo)] || {};
  p[String(chapterNo)] = { ...prev, lastPositionSec: Math.floor(sec) };
  localStorage.setItem(progressKey(memberId, courseId), JSON.stringify(p));
}
function memoKey(memberId, courseId, chapterNo) { return `skel-crm-memo-${memberId}-${courseId}-${chapterNo}`; }
function getMemo(memberId, courseId, chapterNo) { return localStorage.getItem(memoKey(memberId, courseId, chapterNo)) || ''; }
function saveMemo(memberId, courseId, chapterNo, text) { localStorage.setItem(memoKey(memberId, courseId, chapterNo), text); }
function quizKey(memberId, courseId, chapterNo) { return `skel-crm-quiz-${memberId}-${courseId}-${chapterNo}`; }
function getQuizResult(memberId, courseId, chapterNo) {
  try { return JSON.parse(localStorage.getItem(quizKey(memberId, courseId, chapterNo)) || 'null'); }
  catch (e) { return null; }
}
function saveQuizResult(memberId, courseId, chapterNo, result) {
  localStorage.setItem(quizKey(memberId, courseId, chapterNo), JSON.stringify(result));
}
function fmtTs(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `[${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}]`;
}

// ---- state ----
let currentMember = null;
let currentCourseId = null;
let currentChapterNo = null;

// ---- login ----
$('login-btn').addEventListener('click', () => {
  const id = $('login-id').value.trim().toLowerCase();
  const pw = $('login-pw').value;
  const err = $('login-error');
  err.classList.remove('show');
  if (!id || !pw) { err.textContent = 'ID と パスワード を 入力 して ください'; err.classList.add('show'); return; }
  const m = DEMO_MEMBERS[id];
  if (!m || m.password !== pw) {
    err.textContent = 'ID or パスワード が 一致 しません'; err.classList.add('show'); return;
  }
  currentMember = { id, ...m };
  sessionStorage.setItem('skel-member-session', JSON.stringify({ id }));
  $('who').textContent = m.name + ' さん';
  jumpAfterLogin();
});

// Enter key に 対応
['login-id','login-pw'].forEach(id => {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });
});

// ---- logout ----
$('logout-btn').addEventListener('click', () => {
  currentMember = null;
  sessionStorage.removeItem('skel-member-session');
  $('login-id').value = ''; $('login-pw').value = '';
  show('screen-login');
});

// ---- deep link: ?course=xxx で 目的 コース を login 後 に 直遷移 ----
const _url = new URL(window.location.href);
const _deepCourseId = _url.searchParams.get('course') || null;

function jumpAfterLogin() {
  // deep link course が 指定 されて いて、 かつ 受講 可能 なら 直遷移。
  //   不 存在 or 対象外 なら 「見つからない」 と 明示 (課ース一覧 に fallback すると 「デモ の 別 コース が 出てくる」 誤解)
  if (_deepCourseId) {
    const c = DEMO_COURSES.find(x => x.id === _deepCourseId);
    if (!c) {
      // Sorry, this specific course isn't available
      showCourseNotFound(_deepCourseId);
      return;
    }
    const need = c.memberTagIds || [];
    const allowed = need.length === 0 || need.every(t => (currentMember.tagIds || []).includes(t));
    if (!allowed) {
      showCourseNotAllowed(c);
      return;
    }
    currentCourseId = _deepCourseId;
    renderChapters();
    show('screen-chapters');
    return;
  }
  renderCourses();
  show('screen-courses');
}

function showCourseNotFound(courseId) {
  show('screen-courses');
  $('courses-sub').textContent = '';
  $('courses-list').innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--warn);border-radius:14px;padding:24px 28px">
      <div style="font-size:16px;font-weight:800;margin-bottom:8px">この コース は 見つかりません</div>
      <div style="font-size:13px;color:var(--ink-muted);line-height:1.65;margin-bottom:14px">
        指定 された コース は 現在 公開 されて いない か、 URL が 変更 された 可能性 が あります。<br>
        (id: <span style="font-family:monospace;font-size:11px">${escHtml(courseId)}</span>)<br><br>
        <b>admin ページ で コース を 作成 した 場合</b>: 「動画ホスティング → コース 詳細 → 公開 する」 を 押してから、 発行 された URL を コピー して ください。<br>
        現在 の member portal は demo 目的 で 同じ ブラウザ の localStorage を 参照 して います (同 ブラウザ で admin を 開いて 公開 する 必要 が あります)。
      </div>
      <button class="course-cta" onclick="renderCourses();show('screen-courses');" style="background:var(--ink);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer">受講 可能 な コース 一覧 を 見る →</button>
    </div>
  `;
}

function showCourseNotAllowed(course) {
  show('screen-courses');
  $('courses-sub').textContent = '';
  $('courses-list').innerHTML = `
    <div style="background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--warn);border-radius:14px;padding:24px 28px">
      <div style="font-size:16px;font-weight:800;margin-bottom:8px">受講 対象 タグ を 保有 して いません</div>
      <div style="font-size:13px;color:var(--ink-muted);line-height:1.65;margin-bottom:14px">
        「${escHtml(course.title)}」 は 特定 の タグ を 保有 する 会員 の み 受講 可能 です。<br>
        必要 タグ 保有 の 確認 は 担当 まで お問合せ ください。
      </div>
      <button class="course-cta" onclick="renderCourses();show('screen-courses');" style="background:var(--ink);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer">受講 可能 な コース 一覧 を 見る →</button>
    </div>
  `;
}

// ---- session restore ----
(function restore() {
  try {
    const s = JSON.parse(sessionStorage.getItem('skel-member-session') || 'null');
    if (s && DEMO_MEMBERS[s.id]) {
      currentMember = { id: s.id, ...DEMO_MEMBERS[s.id] };
      $('who').textContent = currentMember.name + ' さん';
      jumpAfterLogin();
      return;
    }
  } catch (e) {}
  show('screen-login');
})();

// ---- courses ----
function renderCourses() {
  const allowed = DEMO_COURSES.filter(c => {
    const need = c.memberTagIds || [];
    if (need.length === 0) return true;
    return need.every(t => (currentMember.tagIds || []).includes(t));
  });
  $('courses-sub').textContent = `${currentMember.name} さん が 受講 可能 な コース ${allowed.length} 件`;
  const list = $('courses-list');
  if (allowed.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-muted);font-size:13px">受講 可能 な コース が ありません。 タグ 付与 を 配信 元 に お問合せ ください。</div>';
    return;
  }
  list.innerHTML = allowed.map(c => {
    const p = getProgress(currentMember.id, c.id);
    const done = Object.values(p).filter(x => x.completed).length;
    const pct = c.chapters.length ? Math.round(done / c.chapters.length * 100) : 0;
    const ctaLabel = done === 0 ? '受講 を 始める →'
                    : done === c.chapters.length ? '見直す →'
                    : '続きから →';
    return `
      <div class="course-card" data-course-id="${escHtml(c.id)}">
        <div class="course-title">${escHtml(c.title)}</div>
        <div class="course-desc">${escHtml(c.description)}</div>
        <div class="course-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="n">${done} / ${c.chapters.length} 章 (${pct}%)</div>
        </div>
        <button class="course-cta">${ctaLabel}</button>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.course-card').forEach(card => {
    card.addEventListener('click', () => {
      currentCourseId = card.dataset.courseId;
      renderChapters();
      show('screen-chapters');
    });
  });
}

// ---- chapters ----
$('back-to-courses').addEventListener('click', () => { renderCourses(); show('screen-courses'); });

function renderChapters() {
  const c = DEMO_COURSES.find(x => x.id === currentCourseId);
  if (!c) { show('screen-courses'); return; }
  const p = getProgress(currentMember.id, c.id);
  $('chapters-title').textContent = c.title;
  $('chapters-desc').textContent = c.description;

  const rows = c.chapters.map(ch => {
    const prereq = ch.chapterNo > 1 ? [ch.chapterNo - 1] : [];
    const unlocked = prereq.every(n => p[String(n)]?.completed);
    const completed = !!p[String(ch.chapterNo)]?.completed;
    // サムネ (data URL or http URL、 admin で 未 設定 なら グレー デフォルト)
    const thumbBg = ch.thumbUrl
      ? `background:url('${escHtml(ch.thumbUrl)}') center/cover, linear-gradient(135deg,#1c2530,#3a4553)`
      : `background:linear-gradient(135deg,#eeece7,#e2dfd8)`;
    // 続きから: 前回 見た 秒 の 進捗
    const resumeSec = p[String(ch.chapterNo)]?.lastPositionSec || 0;
    const resumeLabel = (resumeSec > 5 && !completed) ? ` · 続き ${fmtDur(resumeSec)}` : '';
    let status = '';
    let action = '';
    if (completed) {
      status = '<span class="chapter-status completed">完了</span>';
      action = '<button class="chapter-cta">もう一度 再生 する</button>';
    } else if (unlocked) {
      status = '<span class="chapter-status">受講可</span>';
      action = '<button class="chapter-cta">再生 する →</button>';
    } else {
      status = '<span class="chapter-status locked">前 の 章 を 完了 で 開きます</span>';
      action = '';
    }
    return `
      <div class="chapter-row ${unlocked ? 'unlocked' : 'locked'}" data-ch="${ch.chapterNo}">
        <div class="chapter-thumb" style="${thumbBg}"></div>
        <div class="chapter-no">CH${String(ch.chapterNo).padStart(2,'0')}</div>
        <div class="chapter-body">
          <div class="title">${escHtml(ch.title)}</div>
          <div class="desc">${escHtml(ch.description)} · ${fmtDur(ch.durationSec)}${resumeLabel}</div>
        </div>
        <div class="chapter-action">${status}${action}</div>
      </div>
    `;
  }).join('');
  $('chapters-list').innerHTML = rows;

  // Zoom milestone panel
  const zoomCh = c.chapters.find(x => x.zoomMilestone);
  const zoomPanel = $('zoom-panel');
  if (zoomCh) {
    const zoomUnlocked = !!p[String(zoomCh.chapterNo)]?.completed;
    zoomPanel.innerHTML = `
      <div class="zoom-milestone ${zoomUnlocked ? '' : 'zoom-locked'}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        <div class="m-body">
          <div class="m-title">${zoomUnlocked ? '担当 者 と の 個別 面談 (30分) が 予約 できます' : `第${zoomCh.chapterNo}章 を 完了 する と、 担当 者 と の 1対1 面談 が 予約 できる よう に なります`}</div>
          <div class="m-desc">${zoomUnlocked ? '疑問 や 悩み を、 担当 者 に 直接 相談 して ください。 空いて いる 日時 で 予約 できます。' : 'コース で 出て きた 疑問 を、 担当 者 に 直接 相談 できる 場 を ご用意 して います。'}</div>
        </div>
        ${zoomUnlocked ? '<button class="zoom-cta" id="zoom-book-btn">面談 を 予約 する</button>' : ''}
      </div>
    `;
    const zb = $('zoom-book-btn');
    if (zb) zb.addEventListener('click', () => {
      // demo: alert + 疑似 Zoom URL 発行 (本番: Zoom API で 実 meeting 生成)
      const meetingId = Math.floor(Math.random() * 9000000000) + 1000000000;
      const url = `https://zoom.us/j/${meetingId}?pwd=${Math.random().toString(36).slice(2, 10)}`;
      alert('デモ: 個別 面談 の Zoom link を 発行 しました。\n\n' + url + '\n\n本番 では 会員 メール に 送付 + カレンダー 予約 に 連携 します。');
    });
  } else {
    zoomPanel.innerHTML = '';
  }

  // wire chapter click (unlocked のみ)
  $('chapters-list').querySelectorAll('.chapter-row.unlocked').forEach(row => {
    row.addEventListener('click', () => {
      currentChapterNo = parseInt(row.dataset.ch, 10);
      renderPlayer();
      show('screen-player');
    });
  });
}

// ---- player ----
$('back-to-chapters').addEventListener('click', () => { renderChapters(); show('screen-chapters'); });

let _posSaveTimer = null;

function renderPlayer() {
  const c = DEMO_COURSES.find(x => x.id === currentCourseId);
  const ch = c?.chapters.find(x => x.chapterNo === currentChapterNo);
  if (!ch) { show('screen-chapters'); return; }
  $('player-title').textContent = ch.title;
  $('player-meta').textContent = fmtDur(ch.durationSec) + '  ·  CH' + String(ch.chapterNo).padStart(2,'0');
  $('player-desc').textContent = ch.description;

  const vidEl = $('video-el');
  const placeholder = $('video-placeholder');
  // 動画 URL 決定 優先順:
  //   1. ch.videoUrl (admin で upload された 実 URL)
  //   2. demo mode fallback (公開 sample MP4 · 章 番号 で 複数 サンプル ローテ で 見た目 の 差別化)
  //   3. なし → placeholder
  // 公開 sample MP4 (2026-07-30 curl -I で 200 実測)。 gtv-videos-bucket は 403 で 死んで いる ので 廃止
  const DEMO_SAMPLES = [
    'https://www.w3schools.com/html/mov_bbb.mp4',
    'https://www.w3schools.com/html/movie.mp4',
    'https://www.w3schools.com/html/mov_bbb.mp4',
    'https://www.w3schools.com/html/movie.mp4',
    'https://www.w3schools.com/html/mov_bbb.mp4',
  ];
  const chIndex = Math.max(0, (ch.chapterNo || 1) - 1);
  const url = ch.videoUrl || DEMO_SAMPLES[chIndex % DEMO_SAMPLES.length];
  if (url) {
    vidEl.src = url;
    if (ch.thumbUrl) vidEl.poster = ch.thumbUrl;
    vidEl.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    vidEl.src = '';
    vidEl.style.display = 'none';
    placeholder.style.display = 'flex';
  }

  // 再生 速度 (前回 選択 を localStorage で 保持)
  const savedRate = parseFloat(localStorage.getItem('skel-crm-playback-rate') || '1') || 1;
  vidEl.playbackRate = savedRate;
  document.querySelectorAll('#speed-btns .speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === savedRate);
    b.onclick = () => {
      const rate = parseFloat(b.dataset.rate);
      vidEl.playbackRate = rate;
      localStorage.setItem('skel-crm-playback-rate', String(rate));
      document.querySelectorAll('#speed-btns .speed-btn').forEach(x => x.classList.toggle('active', x === b));
    };
  });

  // 再開 位置 復元
  const p0 = getProgress(currentMember.id, c.id);
  const lastPos = p0[String(ch.chapterNo)]?.lastPositionSec || 0;
  const onLoaded = () => {
    if (lastPos > 3 && lastPos < (vidEl.duration || Infinity) - 5) {
      vidEl.currentTime = lastPos;
    }
    vidEl.removeEventListener('loadedmetadata', onLoaded);
  };
  vidEl.addEventListener('loadedmetadata', onLoaded);

  // 定期 位置 保存 (5秒 間隔)
  if (_posSaveTimer) clearInterval(_posSaveTimer);
  _posSaveTimer = setInterval(() => {
    if (!vidEl.paused && vidEl.currentTime > 0) {
      savePosition(currentMember.id, c.id, ch.chapterNo, vidEl.currentTime);
    }
  }, 5000);

  // Tab 切替 (概要 / メモ / 資料 / 理解度)
  document.querySelectorAll('.learn-tab').forEach(t => {
    t.onclick = () => {
      const key = t.dataset.tab;
      document.querySelectorAll('.learn-tab').forEach(x => x.classList.toggle('active', x === t));
      ['desc','memo','materials','quiz'].forEach(k => {
        $('tab-' + k).classList.toggle('active', k === key);
      });
    };
  });
  // 開き 直し 時 は 概要 tab を default
  document.querySelectorAll('.learn-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'desc'));
  ['desc','memo','materials','quiz'].forEach(k => $('tab-' + k).classList.toggle('active', k === 'desc'));

  // メモ (章別 · localStorage)
  const memoEl = $('memo-input');
  const memoSaved = $('memo-saved');
  memoEl.value = getMemo(currentMember.id, c.id, ch.chapterNo);
  memoSaved.textContent = memoEl.value ? '保存 済' : '未 変更';
  memoEl.oninput = () => {
    saveMemo(currentMember.id, c.id, ch.chapterNo, memoEl.value);
    memoSaved.textContent = '保存 済';
  };
  $('memo-insert-timestamp').onclick = () => {
    const ts = fmtTs(vidEl.currentTime || 0);
    const pos = memoEl.selectionStart || memoEl.value.length;
    memoEl.value = memoEl.value.slice(0, pos) + ts + ' ' + memoEl.value.slice(pos);
    saveMemo(currentMember.id, c.id, ch.chapterNo, memoEl.value);
    memoSaved.textContent = '保存 済';
    memoEl.focus();
    memoEl.selectionStart = memoEl.selectionEnd = pos + ts.length + 1;
  };

  // 資料 (course level materials[])
  const matEl = $('materials-list');
  const mats = c.materials || [];
  if (mats.length === 0) {
    matEl.innerHTML = `<div style="text-align:center;padding:32px 20px;color:var(--ink-muted);font-size:13px">この コース に 資料 は 添付 されて いません</div>`;
  } else {
    matEl.innerHTML = mats.map(m => `
      <div class="material-row">
        <div class="m-ic">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2 H6 a2 2 0 0 0 -2 2 v16 a2 2 0 0 0 2 2 h12 a2 2 0 0 0 2 -2 V8 z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <div class="m-body">
          <div class="m-title">${escHtml(m.title)}</div>
          <div class="m-desc">${escHtml(m.desc || '')}</div>
        </div>
        <a class="m-dl" href="${escHtml(m.url)}" target="_blank" rel="noopener" download>DL</a>
      </div>
    `).join('');
  }

  // Quiz (章別 · chapter.quiz[])
  const quizEl = $('quiz-content');
  const quiz = ch.quiz || [];
  if (quiz.length === 0) {
    quizEl.innerHTML = `<div style="text-align:center;padding:32px 20px;color:var(--ink-muted);font-size:13px">この 章 に 理解度 チェック は 設定 されて いません</div>`;
  } else {
    const prev = getQuizResult(currentMember.id, c.id, ch.chapterNo);
    const renderQuiz = (result) => {
      quizEl.innerHTML = quiz.map((q, qi) => `
        <div class="quiz-q" data-q="${qi}">
          <div class="quiz-q-title">Q${qi+1}. ${escHtml(q.q)}</div>
          <div class="quiz-opts">
            ${q.options.map((opt, oi) => {
              const checked = result ? (result.answers?.[qi] === oi) : false;
              const cls = result
                ? (oi === q.correct ? ' correct' : (checked && oi !== q.correct ? ' wrong' : ''))
                : '';
              return `<label class="quiz-opt${cls}"><input type="radio" name="q${qi}" value="${oi}"${checked?' checked':''}${result?' disabled':''}> ${escHtml(opt)}</label>`;
            }).join('')}
          </div>
        </div>
      `).join('') + (result ? `
        <div class="quiz-result ${result.passed ? 'pass' : 'fail'}">
          ${result.passed
            ? `合格 · ${result.score}/${quiz.length} 正解。 次 の 章 に 進んで ください。`
            : `不合格 · ${result.score}/${quiz.length} 正解。 動画 を 見直して 再挑戦 して ください。`}
          <button class="quiz-submit" id="quiz-retry" style="margin-left:12px">もう一度 挑戦</button>
        </div>
      ` : `
        <button class="quiz-submit" id="quiz-submit">回答 する</button>
      `);
      if (result) {
        $('quiz-retry').onclick = () => {
          localStorage.removeItem(quizKey(currentMember.id, c.id, ch.chapterNo));
          renderQuiz(null);
        };
      } else {
        $('quiz-submit').onclick = () => {
          const answers = quiz.map((_, qi) => {
            const el = quizEl.querySelector(`input[name="q${qi}"]:checked`);
            return el ? parseInt(el.value, 10) : -1;
          });
          if (answers.some(a => a < 0)) { alert('全 問 に 回答 して ください'); return; }
          const score = answers.reduce((n, a, qi) => n + (a === quiz[qi].correct ? 1 : 0), 0);
          const passed = score === quiz.length;
          const res = { answers, score, passed, at: new Date().toISOString() };
          saveQuizResult(currentMember.id, c.id, ch.chapterNo, res);
          renderQuiz(res);
        };
      }
    };
    renderQuiz(prev);
  }

  // 完走 button
  const p = getProgress(currentMember.id, c.id);
  const completed = !!p[String(ch.chapterNo)]?.completed;
  const btn = $('mark-complete-btn');
  const lbl = $('mark-complete-label');
  if (completed) {
    btn.classList.add('completed');
    lbl.textContent = '完走 済 (再度 見て も 進捗 は 変わり ません)';
  } else {
    btn.classList.remove('completed');
    lbl.textContent = 'この 章 を 完走 済 に する';
  }
  btn.onclick = null;
  btn.onclick = () => {
    // Quiz あり の 章 は 合格 が 完走 条件
    if ((ch.quiz || []).length > 0) {
      const qr = getQuizResult(currentMember.id, c.id, ch.chapterNo);
      if (!qr || !qr.passed) {
        alert('この 章 は 理解度 チェック に 合格 する と 完走 と なります。 タブ の 「理解度 チェック」 から 回答 して ください。');
        // Quiz tab に 自動 切替
        document.querySelector('.learn-tab[data-tab="quiz"]')?.click();
        return;
      }
    }
    setProgress(currentMember.id, c.id, ch.chapterNo, true);

    // コース 全 章 完走 チェック → 修了証
    const allDone = c.chapters.every(x => {
      const p2 = getProgress(currentMember.id, c.id);
      return !!p2[String(x.chapterNo)]?.completed;
    });
    if (allDone) {
      showCertificate(c);
      return;
    }

    const next = c.chapters.find(x => x.chapterNo === ch.chapterNo + 1);
    if (next) {
      if (confirm(`CH${String(ch.chapterNo).padStart(2,'0')} を 完走 済 に しました。\n\n次 の 章 CH${String(next.chapterNo).padStart(2,'0')} に 進みますか?`)) {
        currentChapterNo = next.chapterNo;
        renderPlayer();
        return;
      }
    }
    renderChapters();
    show('screen-chapters');
  };
}

// 修了証 (course 全 章 完走 で 表示)
function showCertificate(course) {
  const now = new Date();
  const dateStr = `${now.getFullYear()}年 ${now.getMonth()+1}月 ${now.getDate()}日`;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(28,37,48,0.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fdfbf6;border:8px double #1c2530;padding:48px 40px;max-width:560px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,0.3)">
      <div style="font-size:11px;letter-spacing:0.24em;color:#6b7280;font-weight:700;margin-bottom:20px">CERTIFICATE OF COMPLETION</div>
      <div style="font-size:26px;font-weight:900;color:#1c2530;margin-bottom:8px;letter-spacing:-0.01em">修了 証</div>
      <div style="width:60px;height:2px;background:#06c755;margin:20px auto"></div>
      <div style="font-size:13px;color:#3d4356;margin-bottom:24px;line-height:1.8">
        あなた は 下記 コース の 全 章 を 修了 された こと を ここ に 証明 します
      </div>
      <div style="font-size:20px;font-weight:800;color:#1c2530;margin-bottom:32px;padding:16px 0;border-top:1px solid #d6d3ca;border-bottom:1px solid #d6d3ca;line-height:1.4">
        ${escHtml(course.title)}
      </div>
      <div style="font-size:14px;font-weight:700;color:#1c2530;margin-bottom:6px">${escHtml(currentMember.name)} 様</div>
      <div style="font-size:12px;color:#6b7280;margin-bottom:32px">修了 日 · ${dateStr}</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button id="cert-close" style="padding:12px 24px;background:#1c2530;color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer">閉じる</button>
        <button id="cert-print" style="padding:12px 24px;background:#fdfbf6;color:#1c2530;border:1px solid #1c2530;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer">印刷 / PDF 保存</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#cert-close').onclick = () => { overlay.remove(); renderChapters(); show('screen-chapters'); };
  overlay.querySelector('#cert-print').onclick = () => window.print();
}

// player 離脱 時 の cleanup
document.addEventListener('visibilitychange', () => {
  if (document.hidden && _posSaveTimer) {
    const vidEl = $('video-el');
    if (vidEl && currentCourseId && currentChapterNo && vidEl.currentTime > 0) {
      savePosition(currentMember.id, currentCourseId, currentChapterNo, vidEl.currentTime);
    }
  }
});
</script>
