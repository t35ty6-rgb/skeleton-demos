<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Skeleton LINE EC / 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15151a;
  --ink-soft:#5a5a66;
  --ink-faint:#9999a3;
  --paper:#faf8f3;
  --paper-card:#ffffff;
  --paper-tinted:#f3efe5;
  --paper-sunk:#ecebe3;
  --rule:#e0dcce;
  --rule-soft:#eae6d7;
  --accent:#c8412e;
  --accent-soft:#f6dcd6;
  --accent-deep:#8e2a1c;
  --ok:#2b6e3f;
  --warn:#a8770a;
  --bad:#a92424;
  --line-green:#06c755;
  --shadow:0 1px 0 rgba(20,20,30,.04);
  --serif:'Shippori Mincho B1', serif;
  --sans:'BIZ UDPGothic', system-ui, sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== 全体グリッド ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}

/* ===== サイドナビ ===== */
.side{background:var(--paper-tinted);border-right:1px solid var(--rule);padding:18px 0 60px;position:sticky;top:0;height:100vh;overflow-y:auto}
.scrim{display:none}
@media(max-width:900px){
  .side{position:fixed;top:0;left:-260px;width:240px;z-index:50;transition:left .25s;height:100vh}
  .side.open{left:0;box-shadow:6px 0 24px rgba(0,0,0,.18)}
  .scrim{position:fixed;inset:0;background:rgba(20,20,30,.4);z-index:40}
  .scrim.on{display:block}
}
.brand{padding:8px 22px 14px;border-bottom:1px solid var(--rule);margin-bottom:10px}
.brand .mark{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.06em;color:var(--ink)}
.brand .mark em{font-style:normal;color:var(--accent)}
.brand .sub{font-size:10px;letter-spacing:.32em;color:var(--ink-soft);margin-top:2px;text-transform:uppercase}
.shop-pill{margin:12px 16px;padding:10px 12px;background:#fff;border:1px solid var(--rule);border-radius:4px;display:flex;align-items:center;gap:10px}
.shop-pill .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c8412e,#8e2a1c);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700}
.shop-pill .meta{flex:1;min-width:0}
.shop-pill .name{font-size:12px;font-weight:700;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop-pill .plan{font-size:10px;color:var(--ink-soft);letter-spacing:.1em}
nav.sect{padding:6px 0 0}
nav.sect h6{font-size:10px;letter-spacing:.28em;color:var(--ink-faint);margin:14px 22px 4px;font-weight:700;text-transform:uppercase}
nav.sect a{display:flex;align-items:center;gap:10px;padding:7px 22px;color:var(--ink-soft);font-size:13px;border-left:2px solid transparent}
nav.sect a:hover{color:var(--ink);background:rgba(0,0,0,.025)}
nav.sect a.active{color:var(--ink);background:#fff;border-left-color:var(--accent);font-weight:700}
nav.sect a .ic{width:18px;text-align:center;font-size:14px;opacity:.8}
nav.sect a .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:0 6px;border-radius:8px;font-family:var(--mono);font-weight:600}

/* ===== メインエリア ===== */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
.hamburger{display:none;background:none;border:1px solid var(--rule);width:36px;height:34px;border-radius:3px;font-size:18px}
@media(max-width:900px){.hamburger{display:block}.topbar{padding:12px 16px}}
.crumbs{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.04em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs .sub{font-family:var(--sans);font-weight:400;color:var(--ink-soft);font-size:12px;margin-left:8px;letter-spacing:0}
.topbar .search{flex:0 0 280px;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);padding:6px 10px;border-radius:3px;background:#fff}
.topbar .search input{border:0;outline:0;flex:1;background:transparent}
.topbar .search .kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);padding:1px 5px;border-radius:3px;color:var(--ink-faint)}
@media(max-width:900px){.topbar .search{display:none}}
.topbar .topbtn{padding:7px 12px;background:#fff;border:1px solid var(--rule);font-size:12px;color:var(--ink-soft);border-radius:3px}
.topbar .topbtn:hover{background:var(--paper-tinted)}
.topbar .accent-btn{padding:8px 14px;background:var(--ink);color:#fff;border:0;font-size:12px;font-weight:700;letter-spacing:.08em;border-radius:3px}
.topbar .accent-btn:hover{background:var(--accent)}

.view{padding:24px 28px 80px;max-width:1280px}
@media(max-width:900px){.view{padding:18px 16px 80px}}

/* ===== KPI カード ===== */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;padding:14px 16px}
.kpi .lab{font-size:10px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase;font-weight:700}
.kpi .num{font-family:var(--serif);font-size:30px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .num .unit{font-family:var(--sans);font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:4px}
.kpi .delta{font-family:var(--mono);font-size:11px;margin-top:4px;color:var(--ok)}
.kpi .delta.dn{color:var(--bad)}
.kpi .delta .vs{color:var(--ink-faint);margin-left:6px}

/* ===== セクション ===== */
.sec{background:var(--paper-card);border:1px solid var(--rule);border-radius:3px;margin-bottom:18px}
.sec-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.sec-h h3{font-family:var(--serif);font-size:16px;font-weight:700;margin:0;letter-spacing:.04em;flex:1}
.sec-h .sub{font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
.sec-body{padding:14px 18px}
.sec-body.flush{padding:0}

/* ===== テーブル ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:var(--paper-sunk);color:var(--ink-soft);text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.tbl tbody td{padding:11px 14px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
.tbl tbody tr:hover{background:#fbfaf3;cursor:pointer}
.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl .center{text-align:center}
.tbl .id{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.tbl .strong{font-weight:700}
.tbl .nowrap{white-space:nowrap}
.tbl .thumb{width:36px;height:36px;border-radius:3px;object-fit:cover;background:var(--paper-tinted);display:inline-block;vertical-align:middle;margin-right:8px}
.tbl .empty{padding:40px;text-align:center;color:var(--ink-faint)}
.scroll-x{overflow-x:auto}

/* ===== バッジ ===== */
.bd{display:inline-block;padding:1px 7px;font-size:11px;font-family:var(--mono);border-radius:2px;letter-spacing:.04em;font-weight:600;line-height:1.55}
.bd.ok{background:#e3f0e7;color:var(--ok)}
.bd.warn{background:#fbf1d8;color:var(--warn)}
.bd.bad{background:#f7dada;color:var(--bad)}
.bd.draft{background:var(--paper-sunk);color:var(--ink-soft)}
.bd.line{background:#dff6e3;color:#03a648}
.bd.accent{background:var(--accent-soft);color:var(--accent-deep)}
.bd.cool{background:#dee9f4;color:#264e7a}

/* ===== ボタン ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:3px;font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer}
.btn:hover{background:var(--paper-tinted)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{color:var(--ink);background:var(--paper-tinted)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== フォーム ===== */
.field{display:block;margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--ink-soft);margin-bottom:4px;text-transform:uppercase}
.field label .req{color:var(--accent);margin-left:3px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;border:1px solid var(--rule);background:#fff;padding:8px 10px;border-radius:3px;color:var(--ink)
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px}
.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* ===== モーダル ===== */
.modal{display:none;position:fixed;inset:0;background:rgba(20,20,30,.55);z-index:80;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal-inner{background:#fff;border-radius:4px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--rule)}
.modal-h{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--rule)}
.modal-h h2{font-family:var(--serif);font-size:20px;font-weight:700;margin:0;flex:1}
.modal-h .x{background:none;border:0;font-size:22px;color:var(--ink-soft);cursor:pointer}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;background:var(--paper-tinted)}

/* ===== 行内 アクション ===== */
.actbar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.actbar .sp{flex:1}
.filter-pill{padding:5px 11px;background:#fff;border:1px solid var(--rule);font-size:12px;border-radius:14px;cursor:pointer;color:var(--ink-soft)}
.filter-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search-inline{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);padding:5px 9px;border-radius:3px;background:#fff;min-width:200px}
.search-inline input{border:0;outline:0;flex:1;background:transparent;font-size:13px}

/* ===== ダッシュボード 専用 ===== */
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.chart-wrap{padding:14px 18px}
.chart-wrap canvas{width:100%;height:240px;display:block}
.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-soft);margin-top:8px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tasklist{list-style:none;margin:0;padding:0}
.tasklist li{padding:10px 14px;border-bottom:1px solid var(--rule-soft);display:flex;gap:10px;align-items:center;font-size:13px}
.tasklist li:last-child{border-bottom:0}
.tasklist .ico{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:14px;font-weight:700}
.tasklist .body{flex:1;min-width:0}
.tasklist .body .t{font-weight:700}
.tasklist .body .m{font-size:11px;color:var(--ink-soft)}

/* ===== リッチメニュー エディタ ===== */
.rm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--rule);padding:2px;border:1px solid var(--rule);max-width:520px}
.rm-grid .cell{background:#fff;aspect-ratio:1.2/1;display:grid;place-items:center;font-size:11px;color:var(--ink-soft);position:relative;cursor:pointer;text-align:center;padding:6px}
.rm-grid .cell:hover{background:var(--paper-tinted)}
.rm-grid .cell .num{position:absolute;top:4px;left:6px;font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:700}
.rm-grid.layout-2x3{grid-template-columns:repeat(3,1fr)}
.rm-grid.layout-1x2{grid-template-columns:repeat(2,1fr);max-width:340px}
.rm-grid.layout-2x2{grid-template-columns:repeat(2,1fr);max-width:340px}
.rm-grid.layout-1x3{grid-template-columns:repeat(3,1fr);max-width:520px}

/* ===== ヘッドラインフッター ===== */
.foot{padding:30px 0;font-size:11px;color:var(--ink-faint);text-align:center;font-family:var(--mono);letter-spacing:.1em}
.foot em{font-style:normal;color:var(--accent)}

/* ===== utilities ===== */
.hstack{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;gap:8px}.spread .sp{flex:1}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.muted{color:var(--ink-soft)}
.tiny{font-size:11px}
.divider{height:1px;background:var(--rule);margin:14px 0}
.hide-sm{display:initial}
@media(max-width:600px){.hide-sm{display:none}}

</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">SKEL<em>·</em>EC</div>
      <div class="sub">LINE COMMERCE PLATFORM</div>
    </div>
    <div class="shop-pill">
      <div class="avatar">L</div>
      <div class="meta">
        <div class="name">Lune by Skeleton</div>
        <div class="plan">PRO PLAN</div>
      </div>
    </div>
    <nav class="sect" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="hamburger" id="ham">≡</button>
      <div class="crumbs" id="crumbs">ダッシュボード</div>
      <div class="search hide-sm">
        <span class="muted">⌕</span>
        <input placeholder="注文番号・お客様名・商品で検索">
        <span class="kbd">⌘K</span>
      </div>
      <button class="topbtn hide-sm">通知</button>
      <button class="accent-btn" id="newBtn">＋ 商品追加</button>
    </div>
    <div class="view" id="view"></div>
    <div class="foot">© Skeleton Inc. <em>·</em> LINE EC たたき台 v0.1</div>
  </main>
</div>

<!-- モーダル -->
<div class="modal" id="modal">
  <div class="modal-inner" id="modalInner"></div>
</div>

<script>
/* ============================================================
   Skeleton LINE EC — admin SPA
   完全コピー(構造) + Skeleton design
   ============================================================ */

const NAV = [
  {sect:'運営', items:[
    {key:'dashboard', icon:'◐', label:'ダッシュボード'},
    {key:'orders', icon:'▤', label:'注文管理', badge:'2'},
    {key:'customers', icon:'☻', label:'顧客 (友だち)'},
    {key:'messages', icon:'✎', label:'メッセージ配信'}
  ]},
  {sect:'商品', items:[
    {key:'products', icon:'▦', label:'商品マスタ'},
    {key:'categories', icon:'▫', label:'カテゴリ'},
    {key:'coupons', icon:'%', label:'クーポン'}
  ]},
  {sect:'LINE', items:[
    {key:'richmenu', icon:'▥', label:'リッチメニュー'},
    {key:'liff', icon:'◷', label:'LIFF 設定'}
  ]},
  {sect:'店舗設定', items:[
    {key:'shop', icon:'⌂', label:'店舗情報'},
    {key:'shipping', icon:'➤', label:'配送・送料'},
    {key:'payment', icon:'¥', label:'決済設定'},
    {key:'tokushou', icon:'§', label:'特定商取引法'}
  ]}
];

const TITLES = {
  dashboard:['ダッシュボード','本日の運営状況'],
  orders:['注文管理','注文一覧'],
  customers:['顧客 (友だち)','LINE友だち一覧'],
  messages:['メッセージ配信','一斉配信・ステップ配信'],
  products:['商品マスタ','商品一覧'],
  categories:['カテゴリ','商品カテゴリ管理'],
  coupons:['クーポン','クーポン管理'],
  richmenu:['リッチメニュー','LINE OA リッチメニュー'],
  liff:['LIFF 設定','LIFFアプリ設定'],
  shop:['店舗情報','店舗基本設定'],
  shipping:['配送・送料','配送方法・送料表'],
  payment:['決済設定','決済プロバイダ'],
  tokushou:['特定商取引法','特商法表記']
};

// ========== state ==========
let products=[], orders=[], customers=[], categories=[], coupons=[], messages=[];
const yen = n => '¥' + Number(n||0).toLocaleString('ja-JP');
const dt  = s => { if(!s) return '-'; const d=new Date(s); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const day = s => { if(!s) return '-'; const d=new Date(s); return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; };

async function loadData(){
  const f = async p => fetch(p).then(r=>r.json()).catch(()=>[]);
  [products,orders,customers,categories,coupons,messages] = await Promise.all([
    f('../demo-data/products.json'),
    f('../demo-data/orders.json'),
    f('../demo-data/customers.json'),
    f('../demo-data/categories.json'),
    f('../demo-data/coupons.json'),
    f('../demo-data/messages.json')
  ]);
}

// ========== nav ==========
function renderNav(active){
  const el = document.getElementById('nav');
  el.innerHTML = NAV.map(s=>`
    <h6>${s.sect}</h6>
    ${s.items.map(it=>`
      <a href="#/${it.key}" data-key="${it.key}" class="${it.key===active?'active':''}">
        <span class="ic">${it.icon}</span>
        <span>${it.label}</span>
        ${it.badge?`<span class="badge">${it.badge}</span>`:''}
      </a>
    `).join('')}
  `).join('');
}

// ========== modal ==========
function openModal(html){
  document.getElementById('modalInner').innerHTML = html;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id==='modal') closeModal();
});

// ========== badge helpers ==========
function statusBadge(s){
  const m={
    '公開':'ok','下書き':'draft','終了':'draft','有効':'ok','稼働中':'line',
    '送信済':'cool','送信予約':'warn',
    '決済済':'ok','未決済':'warn','未発送':'warn','発送準備中':'warn',
    '発送済':'ok','キャンセル':'bad'
  };
  return `<span class="bd ${m[s]||'draft'}">${s}</span>`;
}

// ========== views ==========
const views = {

  // ---------- ダッシュボード ----------
  dashboard(){
    const todayOrders = orders.filter(o=>o.ordered_at.startsWith('2026-06-16'));
    const todaySales  = orders.filter(o=>o.ordered_at.startsWith('2026-06-16') && o.fulfillment!=='キャンセル').reduce((s,o)=>s+o.total,0);
    const unshipped   = orders.filter(o=>o.fulfillment==='未発送' || o.fulfillment==='発送準備中').length;
    const newFriends  = customers.filter(c=>{const d=new Date(c.first_followed);return (Date.now()-d.getTime())/86400000 < 14}).length;
    const html = `
      <div class="kpi-row">
        <div class="kpi"><div class="lab">本日の売上</div><div class="num">${yen(todaySales)}</div><div class="delta">▲ +24% <span class="vs">前日比</span></div></div>
        <div class="kpi"><div class="lab">本日の注文</div><div class="num">${todayOrders.length}<span class="unit">件</span></div><div class="delta">▲ +1 <span class="vs">前日比</span></div></div>
        <div class="kpi"><div class="lab">未発送</div><div class="num">${unshipped}<span class="unit">件</span></div><div class="delta dn">▼ 要対応</div></div>

        <button class="btn" onclick="openBulkUpload()">CSV/ZIP一括登録</button>

            <tbody id="ptbody"></tbody>
          </table>
        </div>
      </div>
    `;
    const tbody = document.getElementById('ptbody');
    const draw = () => {
      const q = (document.getElementById('pq').value||'').toLowerCase();
      const fp = document.querySelector('.filter-pill.on').dataset.fp;
      const list = products.filter(p=>{
        if(q && !(p.name+p.sku).toLowerCase().includes(q)) return false;
        if(fp==='公開' && p.status!=='公開') return false;
        if(fp==='下書き' && p.status!=='下書き') return false;
        if(fp==='low' && p.stock>p.stock_alert) return false;
        return true;
      });
      if(!list.length){ tbody.innerHTML='<tr><td colspan="10" class="empty">該当する商品がありません</td></tr>'; return; }
      tbody.innerHTML = list.map(p=>`
        <tr onclick="route('#/products/${p.id}')">
          <td><img class="thumb" src="${p.thumbnail}" alt=""></td>
          <td class="strong">${p.name}<div class="tiny muted">${p.summary}</div></td>

      document.querySelectorAll('.filter-pill').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); draw();
    });

    draw();
  },

// ========== chart (canvas) ==========
function drawChart(){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const ratio = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*ratio; canvas.height = H*ratio;
  const c = canvas.getContext('2d');
  c.scale(ratio,ratio);
  const data = [12400,8200,15600,21000,9800,17200,13400,8900,24300,19800,11200,16800,22400,30360];
  const max = Math.max(...data);
  const pad = 24, gx = (W-pad*2)/(data.length-1);
  // axis
  c.strokeStyle='#e0dcce'; c.lineWidth=1;
  for(let i=0;i<5;i++){
    const y = pad + (H-pad*2)*(i/4);
    c.beginPath(); c.moveTo(pad,y); c.lineTo(W-pad,y); c.stroke();
  }
  // bars (orders) - background
  data.forEach((v,i)=>{
    const x = pad + i*gx;
    const h = (H-pad*2) * (v/max) * 0.5;
    c.fillStyle = '#15151a';
    c.fillRect(x-3, H-pad-h, 6, h);
  });
  // line
  c.strokeStyle='#c8412e'; c.lineWidth=2.5;
  c.beginPath();
  data.forEach((v,i)=>{
    const x = pad + i*gx;
    const y = H-pad - (H-pad*2)*(v/max);
    if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
  });
  c.stroke();
  // dots
  data.forEach((v,i)=>{
    const x = pad + i*gx;
    const y = H-pad - (H-pad*2)*(v/max);
    c.fillStyle='#c8412e';
    c.beginPath(); c.arc(x,y,3.5,0,Math.PI*2); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,1.5,0,Math.PI*2); c.fill();
  });
}

// ========== router ==========
function route(hash){
  if(hash) location.hash = hash;
  const h = (location.hash || '#/dashboard').replace(/^#\//,'');
  const parts = h.split('/');
  const key = parts[0] || 'dashboard';
  const sub = parts[1];

  renderNav(key);
  const t = TITLES[key] || [key,''];
  document.getElementById('crumbs').innerHTML = `${t[0]} <span class="sub">${t[1]||''}</span>`;

  if(key==='products' && sub==='new') views.productEdit('new');
  else if(key==='products' && sub) views.productEdit(sub);
  else if(views[key]) views[key]();
  else views.dashboard();

  // close drawer on mobile
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');

  // newBtn behavior
  const nb = document.getElementById('newBtn');
  if(key==='orders'){ nb.textContent = '＋ 受注追加'; }
  else if(key==='customers'){ nb.textContent = '＋ 友だち追加'; }
  else if(key==='messages'){ nb.textContent = '＋ 配信作成'; }
  else if(key==='coupons'){ nb.textContent = '＋ クーポン発行'; }
  else { nb.textContent = '＋ 商品追加'; nb.onclick = ()=>route('#/products/new'); return; }
  nb.onclick = ()=>{};
}
window.addEventListener('hashchange', ()=>route());
window.addEventListener('resize', ()=>{ if(location.hash.startsWith('#/dashboard')) drawChart(); });
window.route = route;

// ham
document.getElementById('ham').onclick = () => {

};
document.getElementById('scrim').onclick = () => {
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
};

// boot
loadData().then(()=>route());
