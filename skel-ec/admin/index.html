<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skel·EC / 管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Skel·EC 管理画面 — Lea-inspired friendly SaaS (v1.0)
   Reference: admin.lea-market.com 実観察
   = orange #F97316 primary + LINE green secondary
   = top nav with icon-illustrations
   = card-grid based sections (NOT data-table heavy)
   = bold rounded Japanese typography
   = mascot character for warmth
   ============================================================ */
:root{
  /* Palette — Lea忠実 */
  --bg: #F4F6F9;                    /* 薄いブルーグレー (Lea背景) */
  --surface: #FFFFFF;
  --surface-2: #FCFCFC;
  --ink: #2C2C2C;
  --ink-2: #555555;
  --ink-3: #8C8C8C;
  --ink-4: #BBBBBB;
  --rule: #ECECEC;
  --rule-strong: #DCDCDC;
  --hover: #F8F8F8;

  /* Primary = Lea Orange */
  --pri: #F97316;
  --pri-deep: #EA580C;
  --pri-soft: #FED7AA;
  --pri-tint: #FFF7ED;
  --pri-line: #FDBA74;

  /* Secondary = LINE Green */
  --line: #06C755;
  --line-deep: #04A648;
  --line-tint: #DFF7E5;

  /* Misc semantic */
  --pos: #16A34A;
  --pos-tint: #DCFCE7;
  --warn: #F59E0B;
  --warn-tint: #FEF3C7;
  --neg: #DC2626;
  --neg-tint: #FEE2E2;
  --info: #3B82F6;
  --info-tint: #DBEAFE;

  /* Plan badge purple (Lea uses this for contract info) */
  --plan: #8B5CF6;
  --plan-tint: #EDE9FE;

  /* Shadows — Lea uses soft surface shadows */
  --shadow-card: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
  --shadow-modal: 0 24px 60px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.08);

  --r-sm: 6px;
  --r: 10px;
  --r-lg: 14px;
  --r-xl: 18px;

  --jp: 'Noto Sans JP', system-ui, sans-serif;
  --display: 'M PLUS Rounded 1c', 'Noto Sans JP', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:'palt'}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
svg{display:block}
img{max-width:100%;display:block}

/* ============================================================
   Top Navigation Bar (Lea structure)
   ============================================================ */
.nav-top{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:50;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.nav-inner{max-width:1320px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:6px;height:70px}
@media(max-width:900px){.nav-inner{padding:0 14px;gap:0;height:64px}}

/* Brand mark */
.brand{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;border-right:1px solid var(--rule);height:46px;margin-right:8px;flex-shrink:0}
.brand .logo{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg, var(--pri) 0%, var(--pri-deep) 100%);border-radius:12px;color:#fff;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:-.04em;box-shadow:0 4px 10px rgba(249,115,22,.28), inset 0 1px 0 rgba(255,255,255,.3)}
.brand .meta{display:flex;flex-direction:column;line-height:1.1}
.brand .name{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:-.02em;color:var(--ink)}
.brand .name em{font-style:normal;color:var(--pri)}
.brand .sub{font-size:9.5px;color:var(--ink-3);letter-spacing:.12em;font-family:var(--mono);margin-top:1px}
@media(max-width:900px){.brand .meta{display:none}.brand{padding:0;border:0;margin:0}}

/* Nav items */
.nav-items{display:flex;align-items:center;gap:2px;flex:1;justify-content:center;min-width:0}
.nav-items a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;border-radius:10px;color:var(--ink-2);font-size:11.5px;font-weight:700;letter-spacing:.02em;transition:background .15s, color .15s;min-width:62px}
.nav-items a:hover{background:var(--hover);color:var(--ink)}
.nav-items a.on{color:var(--pri)}
.nav-items a.on::after{content:'';position:absolute;bottom:-23px;left:14%;right:14%;height:3px;background:var(--pri);border-radius:2px 2px 0 0}
.nav-items a .ic{width:30px;height:30px;display:grid;place-items:center;position:relative}
.nav-items a .ic svg{width:24px;height:24px}
.nav-items a .ic .badge{position:absolute;top:-3px;right:-6px;min-width:18px;height:18px;background:var(--pri);color:#fff;border-radius:9px;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 1px 4px rgba(249,115,22,.4);border:2px solid var(--surface)}
.nav-items a .ic .badge.line{background:var(--line);box-shadow:0 1px 4px rgba(6,199,85,.35)}
@media(max-width:900px){
  .nav-items{display:none}
  .nav-items.open{display:flex;position:absolute;top:64px;left:0;right:0;background:var(--surface);flex-direction:column;padding:8px;border-bottom:1px solid var(--rule);box-shadow:var(--shadow-card)}
  .nav-items.open a{flex-direction:row;width:100%;padding:10px 16px;justify-content:flex-start}
  .nav-items.open a .ic{width:24px;height:24px;margin-right:4px}
  .nav-items.open a .ic svg{width:20px;height:20px}
  .nav-items.open a.on::after{display:none}
}

/* Right side buttons */
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:12.5px;font-weight:700;border-radius:99px;border:1.5px solid;transition:all .15s;letter-spacing:.02em;white-space:nowrap}
.btn-pill svg{width:13px;height:13px}
.btn-pill.pri-out{color:var(--pri);border-color:var(--pri-line);background:var(--surface)}
.btn-pill.pri-out:hover{background:var(--pri-tint);border-color:var(--pri)}
.btn-pill.line-out{color:var(--line-deep);border-color:var(--line);background:var(--surface)}
.btn-pill.line-out:hover{background:var(--line-tint)}
.btn-pill.pri-fill{color:#fff;background:var(--pri);border-color:var(--pri)}
.btn-pill.pri-fill:hover{background:var(--pri-deep);border-color:var(--pri-deep)}
@media(max-width:900px){.btn-pill{padding:7px 11px;font-size:11.5px}.btn-pill.pri-out span,.btn-pill.line-out span{display:none}}

/* Avatar (top right) */
.avt{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg, var(--pri) 0%, var(--pri-deep) 100%);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:-.04em;cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(249,115,22,.25), inset 0 1px 0 rgba(255,255,255,.25)}
.avt::after{content:'';position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--pos);border:2px solid var(--surface)}

/* Mobile hamburger */
.hamb{display:none;width:38px;height:38px;border-radius:8px;align-items:center;justify-content:center;color:var(--ink-2)}
.hamb:hover{background:var(--hover)}
.hamb svg{width:22px;height:22px}
@media(max-width:900px){.hamb{display:flex}}

/* ============================================================
   Page Header
   ============================================================ */
.page{max-width:1320px;margin:0 auto;padding:18px 24px 80px;position:relative}
@media(max-width:900px){.page{padding:14px 14px 80px}}

.page-h{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.page-h .ico{width:30px;height:30px;display:grid;place-items:center;color:var(--pri);background:var(--pri-tint);border-radius:8px;border:1px solid var(--pri-soft)}
.page-h .ico svg{width:18px;height:18px}
.page-h h1{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--ink)}
.page-h .sub{font-size:12px;color:var(--ink-3);margin-left:auto;font-weight:500}
@media(max-width:900px){.page-h h1{font-size:18px}}

/* ============================================================
   Card primitive — Lea のメインボキャブラリ
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;transition:box-shadow .2s, transform .2s}
.card.hover{cursor:pointer}
.card.hover:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.card-h{display:flex;align-items:center;gap:11px;padding:18px 22px;border-bottom:1px solid var(--rule)}
.card-h .ic{width:34px;height:34px;display:grid;place-items:center;background:var(--pri-tint);color:var(--pri);border-radius:9px;flex-shrink:0;border:1px solid var(--pri-soft)}
.card-h .ic svg{width:18px;height:18px}
.card-h h2{font-family:var(--display);font-weight:900;font-size:14px;color:var(--pri);letter-spacing:-.005em}
.card-h .chev{margin-left:auto;color:var(--ink-3);width:20px;height:20px;display:grid;place-items:center;transition:transform .2s}
.card-h.open .chev{transform:rotate(180deg)}
.card-body{padding:6px 0}

/* Setting menu items (Lea style nested links) */
.set-list{padding:6px 0 14px}
.set-list a{display:flex;align-items:center;padding:10px 22px;font-size:13.5px;font-weight:500;color:var(--ink);transition:background .12s}
.set-list a:hover{background:var(--hover);color:var(--pri)}
.set-list a::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ink-4);margin-right:11px;flex-shrink:0;transition:background .15s}
.set-list a:hover::before{background:var(--pri)}

/* Setting grid (the 6-card layout) */
.set-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1000px){.set-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.set-grid{grid-template-columns:1fr}}

/* ============================================================
   Mypage / Dashboard widgets
   ============================================================ */
.section-title{display:flex;align-items:baseline;gap:11px;padding:6px 4px;margin:18px 0 12px}
.section-title h3{font-family:var(--display);font-weight:900;font-size:15px;color:var(--ink);letter-spacing:-.005em}
.section-title .meta{font-size:11px;color:var(--ink-3);font-weight:500}
.section-title .more{margin-left:auto;font-size:11.5px;color:var(--pri);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.section-title .more svg{width:11px;height:11px}

/* Gamified level cards (mypage signature) */
.lvl-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:8px}
@media(max-width:900px){.lvl-cards{grid-template-columns:1fr}}
.lvl{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-card);display:flex;gap:16px;align-items:flex-start;position:relative;overflow:hidden}
.lvl .mascot{width:78px;height:78px;flex-shrink:0;background:var(--pri-tint);border-radius:14px;display:grid;place-items:center;border:1px solid var(--pri-soft);overflow:hidden}
.lvl .mascot svg{width:64px;height:64px}
.lvl .body{flex:1;min-width:0}
.lvl .title{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.lvl .title h4{font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink)}
.lvl .title .lvln{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--pri);background:var(--pri-tint);padding:2px 7px;border-radius:8px;border:1px solid var(--pri-soft)}
.lvl .hint{font-size:11px;color:var(--ink-3);margin-bottom:7px}
.lvl .val-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.lvl .val{font-family:var(--display);font-weight:900;font-size:22px;color:var(--pri);letter-spacing:-.02em}
.lvl .of{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.lvl .bar{height:7px;background:var(--pri-tint);border-radius:4px;overflow:hidden;border:1px solid var(--pri-soft)}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg, var(--pri) 0%, var(--pri-deep) 100%);border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.lvl .cap{font-size:11px;color:var(--ink-2);margin-top:6px;font-weight:500}
.lvl .cap b{color:var(--pri)}

/* Info table (mypage 顧客情報 style) */
.info-tbl{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);margin-bottom:16px}
.info-tbl-h{padding:14px 22px;border-bottom:1px solid var(--rule);font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
.info-tbl-h::before{content:'';width:4px;height:18px;background:var(--pri);border-radius:2px}
.info-row{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center;padding:13px 22px;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.info-row:last-child{border-bottom:0}
.info-row .k{color:var(--ink-3);font-weight:500;font-size:12.5px}
.info-row .v{color:var(--ink);font-weight:500;display:flex;align-items:center;gap:7px}
.info-row .v .edit{width:18px;height:18px;display:grid;place-items:center;color:var(--pri);background:var(--pri-tint);border-radius:5px;cursor:pointer;border:1px solid var(--pri-soft)}
.info-row .v .edit svg{width:11px;height:11px}
.info-row .v .edit:hover{background:var(--pri);color:#fff}
.info-row .act{font-size:12px;color:var(--pri);font-weight:700;cursor:pointer}
@media(max-width:640px){.info-row{grid-template-columns:1fr;gap:4px}}

/* LINE quota bar (mypage signature) */
.quota{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-card);margin-bottom:16px}
.quota-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.quota-h .ico{width:30px;height:30px;background:var(--line-tint);color:var(--line-deep);border-radius:8px;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line)}
.quota-h .ico svg{width:17px;height:17px}
.quota-h h3{font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink);flex:1}
.quota-h .nums{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink-2)}
.quota-h .nums em{font-style:normal;color:var(--line-deep);font-size:18px}
.quota-bar{height:11px;background:var(--line-tint);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.quota-bar i{display:block;height:100%;background:linear-gradient(90deg, var(--line) 0%, var(--line-deep) 100%);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* Plan button (purple - Lea contract style) */
.btn-plan{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--plan);color:#fff;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.btn-plan:hover{background:#7C3AED}
.btn-plan svg{width:13px;height:13px}

/* ============================================================
   KPI / metric tiles (dashboard)
   ============================================================ */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--ink-3);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.kpi .k .icp{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;background:var(--pri-tint);color:var(--pri);border:1px solid var(--pri-soft)}
.kpi .k .icp svg{width:14px;height:14px}
.kpi .k .icp.line{background:var(--line-tint);color:var(--line-deep);border-color:var(--line)}
.kpi .k .icp.warn{background:var(--warn-tint);color:var(--warn);border-color:#FCD34D}
.kpi .k .icp.pos{background:var(--pos-tint);color:var(--pos);border-color:#86EFAC}
.kpi .v{font-family:var(--display);font-weight:900;font-size:28px;color:var(--ink);letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v .unit{font-family:var(--jp);font-size:13px;color:var(--ink-3);font-weight:500;margin-left:3px}
.kpi .meta{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;font-weight:600}
.kpi .meta .delta{color:var(--pos);display:inline-flex;align-items:center;gap:3px}
.kpi .meta .delta.dn{color:var(--warn)}
.kpi .meta .vs{color:var(--ink-3);font-weight:500}

/* ============================================================
   Tables (orders, products, customers list)
   ============================================================ */
.tbl-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card);margin-bottom:14px}
.tbl-h{padding:14px 22px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.tbl-h::before{content:'';width:4px;height:18px;background:var(--pri);border-radius:2px}
.tbl-h h3{font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink);flex:1}
.tbl-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:#FAFAFA;color:var(--ink-2);text-align:left;padding:11px 16px;border-bottom:1px solid var(--rule);font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tbl tbody td{padding:13px 16px;border-bottom:1px solid var(--rule-soft);vertical-align:middle;color:var(--ink-2);font-weight:500}
.tbl tbody tr:hover{background:var(--hover);cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:600}
.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tbl .strong{font-weight:700;color:var(--ink)}
.tbl .nowrap{white-space:nowrap}
.tbl .thumb{width:38px;height:38px;border-radius:7px;object-fit:cover;background:var(--hover);border:1px solid var(--rule-soft)}
.tbl .row-name{display:flex;align-items:center;gap:11px}
.tbl .row-name .meta{min-width:0}
.tbl .row-name .n{color:var(--ink);font-weight:700;font-size:13px}
.tbl .row-name .s{font-size:11px;color:var(--ink-3);margin-top:1px}
.tbl .empty{padding:60px 20px;text-align:center;color:var(--ink-3)}

/* Customer avatar */
.cust{display:flex;align-items:center;gap:10px}
.cust .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg, var(--pri) 0%, var(--pri-deep) 100%);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;flex-shrink:0;box-shadow:0 2px 4px rgba(249,115,22,.2)}
.cust .av.line{background:linear-gradient(135deg, var(--line) 0%, var(--line-deep) 100%);box-shadow:0 2px 4px rgba(6,199,85,.2)}
.cust .info .n{color:var(--ink);font-weight:700;font-size:13px}
.cust .info .s{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* Badges (Lea pill style) */
.bd{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:11px;border-radius:99px;font-weight:700;line-height:1.5;white-space:nowrap;border:1px solid}
.bd.ok{background:var(--pos-tint);color:var(--pos);border-color:#86EFAC}
.bd.warn{background:var(--warn-tint);color:var(--warn);border-color:#FCD34D}
.bd.neg{background:var(--neg-tint);color:var(--neg);border-color:#FCA5A5}
.bd.info{background:var(--info-tint);color:var(--info);border-color:#93C5FD}
.bd.pri{background:var(--pri-tint);color:var(--pri);border-color:var(--pri-line)}
.bd.line{background:var(--line-tint);color:var(--line-deep);border-color:var(--line)}
.bd.plan{background:var(--plan-tint);color:var(--plan);border-color:#C4B5FD}
.bd.draft{background:#F1F1F1;color:var(--ink-3);border-color:var(--rule-strong)}

/* Filter chips (rounded pill) */
.actbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.actbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;background:var(--surface);border:1.5px solid var(--rule-strong);border-radius:99px;font-size:12px;color:var(--ink-2);font-weight:700;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chip .cnt{font-family:var(--mono);opacity:.7;font-size:10.5px}
.chip.on .cnt{opacity:1}

/* Search inline (rounded) */
.search-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--rule-strong);border-radius:99px;padding:7px 14px;min-width:220px}
.search-pill:focus-within{border-color:var(--pri)}
.search-pill svg{width:14px;height:14px;color:var(--ink-3)}
.search-pill input{border:0;outline:0;flex:1;background:transparent;font-size:13px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface);border:1.5px solid var(--rule-strong);border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;transition:all .15s;letter-spacing:.01em}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 6px rgba(249,115,22,.25)}
.btn.pri:hover{background:var(--pri-deep);border-color:var(--pri-deep)}
.btn.line-fill{background:var(--line);color:#fff;border-color:var(--line);box-shadow:0 2px 6px rgba(6,199,85,.25)}
.btn.line-fill:hover{background:var(--line-deep);border-color:var(--line-deep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn svg{width:13px;height:13px}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field label .req{color:var(--neg);margin-left:3px}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=tel],.field select,.field textarea{width:100%;border:1.5px solid var(--rule-strong);background:var(--surface);padding:10px 13px;border-radius:8px;font-size:13.5px;color:var(--ink);transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-tint)}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(44,44,44,.55);z-index:80;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-inner{background:var(--surface);border-radius:var(--r-xl);max-width:780px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-modal);animation:modalIn .25s cubic-bezier(.2,.8,.2,1)}
@keyframes modalIn{from{transform:translateY(20px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--rule);gap:10px}
.modal-h h2{font-family:var(--display);font-weight:900;font-size:16px;margin:0;flex:1;color:var(--ink)}
.modal-h .x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.modal-h .x:hover{background:var(--hover);color:var(--ink)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;background:var(--bg)}

/* Timeline (order detail) */
.tl{position:relative;padding-left:28px;margin:14px 0}
.tl::before{content:'';position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--rule)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--rule-strong)}
.tl-item.done::before{background:var(--pos);border-color:var(--pos)}
.tl-item.cur::before{background:var(--pri);border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-tint)}
.tl-item .t{font-size:13.5px;font-weight:700;color:var(--ink)}
.tl-item .m{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* ============================================================
   Foot bar (Lea bottom bar style)
   ============================================================ */
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding:10px 24px;display:flex;align-items:center;gap:14px;z-index:40;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.foot .mascot{position:absolute;left:18px;bottom:6px;width:64px;height:64px}
.foot .quota-mini{margin-left:88px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.foot .quota-mini em{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--line-deep)}
.foot .sp{flex:1}
.foot .help{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:var(--pri);color:#fff;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 3px 10px rgba(249,115,22,.3)}
.foot .help:hover{background:var(--pri-deep)}
.foot .help svg{width:14px;height:14px}
.foot .powered{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.foot .powered em{font-style:normal;color:var(--pri)}
@media(max-width:900px){.foot{padding:10px 14px;gap:8px}.foot .mascot{display:none}.foot .quota-mini{margin-left:0;font-size:11.5px}.foot .powered{display:none}.foot .help{padding:8px 14px;font-size:11.5px}}

/* Spacer for fixed foot */
.foot-spacer{height:80px}

/* ============================================================
   Mascot character (Lea-equivalent cat)
   ============================================================ */
/* Will be inlined SVG */

/* Utility */
.muted{color:var(--ink-3)}
.tiny{font-size:11px}
.center{text-align:center}
.mb{margin-bottom:14px}
.mt{margin-top:14px}
.hstack{display:flex;align-items:center;gap:8px}
.flex-1{flex:1}

/* ============================================================
   Sub-page chrome (settings subpages)
   ============================================================ */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-bottom:10px;font-weight:500}
.breadcrumb a{color:var(--pri);font-weight:700;text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{color:var(--ink-4);font-weight:400}

.subpage-head{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.subpage-head .ico{width:28px;height:28px;display:grid;place-items:center;color:var(--pri)}
.subpage-head .ico svg{width:22px;height:22px}
.subpage-head h1{font-family:var(--display);font-weight:900;font-size:20px;color:var(--ink);letter-spacing:-.01em}
.subpage-head .ghost{margin-left:auto}

/* Settings form-style table (Lea look — 1 row = 1 setting key/value) */
.set-tbl{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.set-tbl-row{display:grid;grid-template-columns:280px 1fr auto;gap:18px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--rule-soft);font-size:13.5px}
.set-tbl-row:last-child{border-bottom:0}
.set-tbl-row .k{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.set-tbl-row .k .q{width:16px;height:16px;border-radius:50%;background:var(--rule);color:var(--ink-3);display:grid;place-items:center;font-size:10px;font-weight:700;cursor:help}
.set-tbl-row .k .q:hover{background:var(--pri-tint);color:var(--pri)}
.set-tbl-row .v{font-size:13.5px;color:var(--ink);font-weight:500}
.set-tbl-row .v.center-aligned{display:flex;align-items:center;gap:10px}
.set-tbl-row .act .btn{padding:7px 16px}
@media(max-width:700px){.set-tbl-row{grid-template-columns:1fr;gap:6px}.set-tbl-row .act{justify-self:start}}

/* Color picker swatch row */
.color-row .swatch{width:40px;height:28px;border-radius:6px;border:1px solid var(--rule-strong);display:inline-block}

/* Toggle (settings on/off) */
.toggle{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle .track{width:42px;height:24px;background:var(--rule-strong);border-radius:99px;position:relative;transition:background .2s}
.toggle .thumb{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on .track{background:var(--pri)}
.toggle.on .thumb{transform:translateX(18px)}
.toggle .lab{font-size:12.5px;color:var(--ink-2);font-weight:600}

/* Card-list (for things like 配送方法, 決済方法 listing) */
.line-card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px 20px;display:flex;align-items:center;gap:14px;margin-bottom:10px;box-shadow:var(--shadow-card);transition:all .2s}
.line-card:hover{box-shadow:var(--shadow-hover)}
.line-card .ico{width:42px;height:42px;border-radius:9px;background:var(--pri-tint);color:var(--pri);display:grid;place-items:center;border:1px solid var(--pri-soft);flex-shrink:0}
.line-card .ico svg{width:22px;height:22px}
.line-card .ico.line-bg{background:var(--line-tint);color:var(--line-deep);border-color:var(--line)}
.line-card .body{flex:1;min-width:0}
.line-card .body .t{font-family:var(--display);font-weight:900;font-size:14.5px;color:var(--ink);letter-spacing:-.005em}
.line-card .body .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.line-card .meta{font-size:11.5px;color:var(--ink-3);font-weight:600}
.line-card .meta b{color:var(--ink);font-weight:900;font-family:var(--mono)}
.line-card .actions{display:flex;gap:6px}

/* Phone preview (used in リッチメニュー設定) */
.phone-preview{width:280px;background:#1f1f1f;border-radius:38px;padding:10px;border:3px solid #333;box-shadow:0 20px 40px rgba(0,0,0,.2);position:relative;flex-shrink:0}
.phone-preview::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:80px;height:18px;background:#000;border-radius:11px;z-index:5}
.phone-screen{background:#fff;border-radius:30px;overflow:hidden;aspect-ratio:9/19.5;display:flex;flex-direction:column}
.phone-h{padding:34px 14px 8px;background:#06C755;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:space-between}
.phone-h .av{width:28px;height:28px;border-radius:50%;background:#fff;color:#06C755;display:grid;place-items:center;font-size:13px;font-weight:900}
.phone-msgs{flex:1;background:#06C755;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.phone-msg{background:#fff;padding:7px 10px;border-radius:9px;font-size:11px;max-width:80%}
.phone-msg.in{align-self:flex-start;background:#fff;color:#222}
.phone-msg.out{align-self:flex-end;background:#FEF3C7;color:#222}
.phone-rm{background:#fff;padding:6px;border-top:1px solid var(--rule)}
.phone-rm-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:46px;gap:2px}
.phone-rm-cell{background:var(--pri-tint);border:1px dashed var(--pri-line);border-radius:4px;display:grid;place-items:center;font-size:8.5px;color:var(--pri-deep);font-weight:700;text-align:center;padding:3px}
.phone-rm-cell.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.phone-input{padding:6px 10px;background:#f3f3f3;display:flex;align-items:center;gap:6px;font-size:10px;color:#888;border-top:1px solid var(--rule)}
.phone-input::before{content:'';width:20px;height:20px;background:#ddd;border-radius:50%}

/* Dual pane (settings + preview) */
.dual{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:flex-start}
@media(max-width:980px){.dual{grid-template-columns:1fr}.dual .phone-preview{justify-self:center}}

/* Template gallery (for デザイン/テンプレート設定) */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:18px}
.tpl-card{background:var(--surface);border:2px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-card)}
.tpl-card.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-tint), var(--shadow-card)}
.tpl-card:hover{transform:translateY(-2px)}
.tpl-card .preview{aspect-ratio:9/16;background:linear-gradient(135deg, var(--pri-tint), var(--surface-2));display:grid;place-items:center;position:relative;border-bottom:1px solid var(--rule-soft)}
.tpl-card .preview .label{font-family:var(--display);font-weight:900;font-size:18px;color:var(--pri);letter-spacing:-.02em}
.tpl-card .preview .badge{position:absolute;top:8px;right:8px;background:var(--pri);color:#fff;font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 6px;border-radius:99px}
.tpl-card .meta{padding:11px 14px}
.tpl-card .meta .t{font-family:var(--display);font-weight:900;font-size:13.5px;color:var(--ink)}
.tpl-card .meta .s{font-size:11px;color:var(--ink-3);margin-top:2px}

/* ============================================================
   Live LINE実機 preview phone (used across settings subpages)
   ============================================================ */
.lp-wrap{position:sticky;top:90px}
.lp-label{font-size:11.5px;color:var(--ink-3);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.lp-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--line);box-shadow:0 0 0 0 rgba(6,199,85,.5);animation:pulseLine 1.6s ease-out infinite}
@keyframes pulseLine{0%{box-shadow:0 0 0 0 rgba(6,199,85,.6)}80%,100%{box-shadow:0 0 0 8px rgba(6,199,85,0)}}
.lp{width:300px;background:#1a1a1a;border-radius:42px;padding:10px;border:3px solid #2a2a2a;box-shadow:0 24px 50px rgba(0,0,0,.22),0 6px 16px rgba(0,0,0,.1);position:relative}
.lp::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:84px;height:20px;background:#000;border-radius:12px;z-index:5}
.lp-screen{background:#fff;border-radius:32px;overflow:hidden;aspect-ratio:9/19.5;display:flex;flex-direction:column}
.lp-bar{padding:32px 14px 0;background:#06C755;color:#fff;font-size:11px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lp-bar .left{display:flex;align-items:center;gap:8px}
.lp-bar .av{width:30px;height:30px;border-radius:50%;background:#fff;color:#06C755;display:grid;place-items:center;font-size:14px;font-weight:900;overflow:hidden}
.lp-bar .av img{width:100%;height:100%;object-fit:cover}
.lp-bar .shop{font-weight:700;font-size:12px;line-height:1.1}
.lp-bar .shop .sub{font-weight:400;font-size:9.5px;opacity:.85}
.lp-bar .icons{display:flex;gap:6px;font-size:14px}
.lp-body{flex:1;background:#8FBED9;display:flex;flex-direction:column;overflow:hidden}
.lp-msgs{flex:1;padding:8px 12px 4px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.lp-msg{padding:7px 10px;border-radius:10px;font-size:11px;max-width:78%;line-height:1.5}
.lp-msg.in{align-self:flex-start;background:#fff;color:#222;border-top-left-radius:2px}
.lp-msg.out{align-self:flex-end;background:#86E07F;color:#222;border-top-right-radius:2px}
.lp-msg.notify{align-self:flex-start;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;font-size:10px;border-radius:8px}
.lp-rm{background:#fff;padding:5px 6px 6px;border-top:1px solid var(--rule)}
.lp-rm-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:42px;gap:2px}
.lp-rm-grid.layout-1x3{grid-template-columns:repeat(3,1fr);grid-auto-rows:62px}
.lp-rm-grid.layout-2x2{grid-template-columns:repeat(2,1fr);grid-auto-rows:42px}
.lp-rm-grid.layout-1x2{grid-template-columns:repeat(2,1fr);grid-auto-rows:62px}
.lp-rm-cell{border-radius:3px;display:grid;place-items:center;font-size:9px;font-weight:700;text-align:center;padding:2px;line-height:1.2;color:#fff;background:var(--pri);transition:transform .15s}
.lp-rm-cell.alt{background:var(--pri-deep)}
.lp-rm-cell.empty{background:#eee;color:#aaa;border:1px dashed #ccc}
.lp-rm-cell.active{outline:2px solid #FCD34D;outline-offset:1px;transform:scale(1.04)}
.lp-input{padding:6px 10px;background:#fff;display:flex;align-items:center;gap:6px;font-size:10px;color:#888;border-top:1px solid var(--rule)}
.lp-input .field-mock{flex:1;background:#f3f3f3;border-radius:99px;padding:5px 10px;color:#aaa;font-size:9.5px}
.lp-shop-page{flex:1;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.lp-shop-h{padding:8px 12px;background:var(--lp-pri,#F97316);color:#fff;font-family:var(--display);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:space-between}
.lp-shop-body{flex:1;padding:10px 12px;background:#FAFAFA;overflow-y:auto}
.lp-shop-card{background:#fff;border:1px solid #eee;border-radius:6px;padding:7px;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.lp-shop-card .thumb{width:38px;height:38px;background:linear-gradient(135deg,var(--lp-pri,#F97316),var(--lp-save,#FBBF24));border-radius:5px;flex-shrink:0}
.lp-shop-card .meta{flex:1;min-width:0;font-size:9.5px}
.lp-shop-card .n{font-weight:700;color:#2C2C2C;font-size:10px}
.lp-shop-card .p{color:var(--lp-pri,#F97316);font-weight:700;font-family:var(--mono);font-size:10px;margin-top:2px}
.lp-shop-cta{padding:5px 0;text-align:center;background:var(--lp-pri,#F97316);color:#fff;font-weight:700;font-size:10.5px;margin:0 12px 8px;border-radius:5px}
@media(max-width:980px){.lp-wrap{position:static;margin-top:24px}.lp{margin:0 auto}}

/* ============================================================
   Product registration form (full page, 2-column)
   ============================================================ */
.pf-layout{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:flex-start}
@media(max-width:1024px){.pf-layout{grid-template-columns:1fr}}
.pf-form{display:flex;flex-direction:column;gap:18px}
.pf-sec{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-card)}
.pf-sec-h{padding:14px 22px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.pf-sec-h::before{content:'';width:4px;height:18px;background:var(--pri);border-radius:2px}
.pf-sec-h h3{font-family:var(--display);font-weight:900;font-size:14px;color:var(--ink);flex:1}
.pf-sec-h .step{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);background:var(--bg);padding:2px 7px;border-radius:99px;font-weight:700}
.pf-sec-body{padding:18px 22px}

/* Image upload zone */
.img-zone{display:grid;grid-template-columns:160px 1fr;gap:14px;align-items:flex-start}
.img-main{position:relative;width:160px;aspect-ratio:1/1;border:2px dashed var(--rule-strong);border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:11px;cursor:pointer;overflow:hidden;background:var(--bg);text-align:center}
.img-main:hover{border-color:var(--pri);color:var(--pri)}
.img-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-main.has-img{border-style:solid;border-color:var(--rule);background:transparent}
.img-main .badge{position:absolute;top:6px;left:6px;background:var(--pri);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;letter-spacing:.02em}
.img-subs{display:grid;grid-template-columns:repeat(auto-fill, minmax(75px, 1fr));gap:8px}
.img-sub{position:relative;aspect-ratio:1/1;border:1.5px dashed var(--rule-strong);border-radius:7px;display:grid;place-items:center;color:var(--ink-4);cursor:pointer;background:var(--bg);font-size:18px;font-weight:300}
.img-sub:hover{border-color:var(--pri);color:var(--pri)}
.img-sub.filled{border-style:solid;border-color:var(--rule);overflow:hidden}
.img-sub.filled img{width:100%;height:100%;object-fit:cover;display:block}
.img-sub .rm{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;display:none;place-items:center;font-size:11px;cursor:pointer}
.img-sub.filled:hover .rm{display:grid}

/* Variant table */
.var-tbl{width:100%;border-collapse:collapse;font-size:13px}
.var-tbl th{font-size:11px;color:var(--ink-3);font-weight:700;text-align:left;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--rule)}
.var-tbl td{padding:6px 10px;border-bottom:1px solid var(--rule-soft)}
.var-tbl td input{width:100%;border:1px solid var(--rule);background:var(--surface);padding:6px 9px;border-radius:5px;font-size:12.5px}
.var-tbl td.rm-cell{width:34px;text-align:center}

<script>
/* ================================================================

/* ============= Global State Store (localStorage backed) ============= */
const STORE_KEY = 'skel-ec-state-v1';
const defaultSettings = {

    ],

  },

    ],

  },

};
let settings = {};
let userProducts = [], userOrders = [], userCustomers = [], userCoupons = [], userMessages = [];

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const s = raw ? JSON.parse(raw) : {};
    settings = Object.assign({}, defaultSettings, s.settings || {});
    settings.theme = Object.assign({}, defaultSettings.theme, settings.theme);
    settings.line = Object.assign({}, defaultSettings.line, settings.line);
    settings.line.notify = Object.assign({}, defaultSettings.line.notify, settings.line.notify);
    settings.receipt = Object.assign({}, defaultSettings.receipt, settings.receipt);
    settings.payment = Object.assign({}, defaultSettings.payment, settings.payment);
    settings.app = Object.assign({}, defaultSettings.app, settings.app);
    userProducts = s.products || null;
    userOrders = s.orders || null;
    userCustomers = s.customers || null;
    userCoupons = s.coupons || null;
    userMessages = s.messages || null;
  }catch(e){
    settings = JSON.parse(JSON.stringify(defaultSettings));
  }
}
function saveStore(){
  try{
    const s = { settings, products:userProducts, orders:userOrders, customers:userCustomers, coupons:userCoupons, messages:userMessages };
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  }catch(e){ console.warn('save failed', e); }
}
loadStore();

/* ============= Toast / Confirm / Modal helpers ============= */
function toast(msg, type='success'){
  let host = document.getElementById('toastHost');
  if(!host){ host = document.createElement('div'); host.id='toastHost'; host.style.cssText='position:fixed;top:84px;right:24px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none'; document.body.appendChild(host); }
  const el = document.createElement('div');
  const colors = {success:{bg:'#22C55E', icon:'✓'}, error:{bg:'#DC2626', icon:'!'}, info:{bg:'#0284C7', icon:'i'}};
  const c = colors[type] || colors.success;
  el.style.cssText = `pointer-events:auto;background:#fff;color:#2C2C2C;border:1px solid #ECECEC;border-radius:10px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 8px 28px rgba(0,0,0,.12);min-width:220px;max-width:380px;font-weight:500;font-size:13.5px;animation:toast-in .25s cubic-bezier(.2,.8,.2,1)`;
  el.innerHTML = `<span style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:${c.bg};color:#fff;font-weight:900;font-size:12px;flex-shrink:0">${c.icon}</span><span style="flex:1">${msg}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(), 300); }, 2400);
}
const __toastAnim = document.createElement('style');
__toastAnim.textContent = `@keyframes toast-in{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}`;
document.head.appendChild(__toastAnim);

function confirmDialog(title, msg, onYes, danger=false){
  openModal(`
    <div class="modal-h"><h2>${title}</h2></div>
    <div class="modal-body"><p style="font-size:13.5px;line-height:1.7;color:var(--ink-2);margin:0">${msg}</p></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn ${danger?'':'pri'}" id="confYes" style="${danger?'background:var(--neg);color:#fff;border-color:var(--neg)':''}">${danger?'削除する':'OK'}</button>
    </div>
  `);
  document.getElementById('confYes').onclick = ()=>{ closeModal(); onYes && onYes(); };
}

function openFormModal(title, fields, onSave, opts={}){
  const fieldsHtml = fields.map(f=>{
    if(f.type==='hidden') return '';
    if(f.type==='select') return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><select name="${f.name}">${f.options.map(o=>`<option value="${o.value||o}" ${(f.value===(o.value||o))?'selected':''}>${o.label||o}</option>`).join('')}</select></div>`;
    if(f.type==='textarea') return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><textarea name="${f.name}" rows="${f.rows||3}">${f.value||''}</textarea></div>`;
    if(f.type==='checkbox') return `<div class="field"><label style="display:flex;align-items:center;gap:7px;cursor:pointer"><input type="checkbox" name="${f.name}" ${f.value?'checked':''}>${f.label}</label></div>`;
    if(f.type==='color') return `<div class="field"><label>${f.label}</label><div style="display:flex;align-items:center;gap:12px"><input type="color" name="${f.name}" value="${f.value||'#000000'}" style="width:60px;height:36px;border-radius:6px;border:1px solid var(--rule-strong);cursor:pointer"><input type="text" name="${f.name}_text" value="${f.value||''}" style="flex:1;font-family:var(--mono)" oninput="this.previousElementSibling.value=this.value"></div></div>`;
    if(f.type==='number') return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><input type="number" name="${f.name}" value="${f.value||''}" placeholder="${f.placeholder||''}"></div>`;
    return `<div class="field"><label>${f.label}${f.required?' <span class="req">*</span>':''}</label><input type="${f.type||'text'}" name="${f.name}" value="${f.value||''}" placeholder="${f.placeholder||''}"></div>`;
  }).join('');
  openModal(`
    <div class="modal-h"><h2>${title}</h2><button class="x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <form id="modalForm" onsubmit="return false"><div class="modal-body">${fieldsHtml}</div>
    <div class="modal-foot">
      <button type="button" class="btn" onclick="closeModal()">キャンセル</button>
      <button type="submit" class="btn pri" id="modalSubmit">${opts.submitLabel||'保存'}</button>
    </div></form>
  `);
  const form = document.getElementById('modalForm');
  document.getElementById('modalSubmit').onclick = e => {
    e.preventDefault();
    const data = {};
    new FormData(form).forEach((v,k)=>{ if(!k.endsWith('_text')) data[k]=v; });
    form.querySelectorAll('input[type=checkbox]').forEach(c => { data[c.name] = c.checked; });
    if(onSave(data) !== false){ closeModal(); }
  };
}

    const draw = () => {
      const q = (document.getElementById('pq').value||'').toLowerCase();

        if(q && !(p.name+p.sku).toLowerCase().includes(q)) return false;

function updatePreview(){
  const host = document.getElementById('previewHost');

    host.innerHTML = linePreview(mode, JSON.parse(host.dataset.opts||'{}'));
  }

/* ================ Persistence helpers for settings ================ */
function set(path, value){
  const parts = path.split('.');
  let cur = settings;
  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
  saveStore();
  updatePreview();
}

function editTextSetting(path, label, kind='text'){
  // path like 'line.welcome'
  const parts = path.split('.');
  let cur = settings; for(const p of parts) cur = cur[p];
  openFormModal(label+'を編集', [
    {name:'value', label:label, value:cur, type:kind==='textarea'?'textarea':'text', rows:4, required:true}
  ], (data)=>{
    set(path, data.value);
    toast(label+'を更新しました');
    route();
  });
}

function toggleSetting(path){
  const parts = path.split('.');
  let cur = settings; for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  const k = parts[parts.length-1];
  cur[k] = !cur[k];
  saveStore();
  updatePreview();
  toast((cur[k]?'有効':'無効')+'にしました');
  route();
}

    tags: [], sold: 0, rating: 0, review_count: 0
  };
}

window.updateDraft = (key, val) => {
  if(!productDraft) return;
  if(key.startsWith('variant.')){
    const [, idx, prop] = key.split('.');
    if(productDraft.variants[+idx]) productDraft.variants[+idx][prop] = prop==='price'||prop==='stock' ? +val||0 : val;
  } else {
    productDraft[key] = (key==='price'||key==='price_member'||key==='stock'||key==='stock_alert'||key==='weight_g') ? +val||0 : val;
  }
  if(key==='price' && productDraft.variants[0]) productDraft.variants[0].price = +val||0;
  if(key==='stock' && productDraft.variants[0]) productDraft.variants[0].stock = +val||0;
  updateProductPreview();
};

/* ================ Router (nested-path aware) ================ */
function route(hash){
  if(hash) location.hash = hash;
  const h = (location.hash || '#/home').replace(/^#\//,'');
  const parts = h.split('/');
  const key = parts[0] || 'home';
  const sub = parts.slice(1).join('/');

  // top-nav active = first segment (or 'settings' when staff/* )
  const navKey = (key === 'staff') ? 'settings' : key;
  renderNav(navKey);
  document.getElementById('navItems').classList.remove('open');

  if(key === 'settings' && sub && settingsSubs[sub]){
    settingsSubs[sub]();
  } else if(key === 'staff' && staffSubs[sub]){
    staffSubs[sub]();
  } else if(key === 'products' && sub === 'new'){
    views.productForm('new');
  } else if(key === 'products' && parts[1] === 'edit' && parts[2]){
    views.productForm(parts[2]);
  } else if(views[key]) {
    views[key]();
  } else {
    views.home();
  }

  window.scrollTo(0,0);
}

window.addEventListener('hashchange', ()=>route());
window.route = route;

document.getElementById('hamb').onclick = () => {
  document.getElementById('navItems').classList.toggle('open');
};

loadData().then(()=>route());
</script>
