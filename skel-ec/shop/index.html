<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lune by Skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a20;
  --ink-soft:#5a5a66;
  --ink-faint:#9a9aa3;
  --paper:#faf6ef;
  --paper-card:#ffffff;
  --paper-tinted:#f1ecdf;
  --rule:#e6e0cd;
  --accent:#c8412e;
  --accent-soft:#f6dcd6;
  --accent-deep:#8e2a1c;
  --line-green:#06c755;
  --serif:'Shippori Mincho B1', serif;
  --sans:'BIZ UDPGothic', system-ui, sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;font-size:14px}

/* LIFFは縦長スマホ前提 → 中央寄せ */
.liff{max-width:520px;margin:0 auto;background:var(--paper-card);min-height:100vh;position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}

/* ===== ヘッダ ===== */
.shop-h{position:sticky;top:0;background:#fff;z-index:30;border-bottom:1px solid var(--rule);padding:12px 16px;display:flex;align-items:center;gap:12px}
.shop-h .logo{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.1em;flex:1}
.shop-h .logo em{font-style:normal;color:var(--accent)}
.shop-h .ic-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft);position:relative;font-size:16px}
.shop-h .ic-btn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--accent);border-radius:50%}

/* ===== ヒーロー ===== */
.hero{padding:24px 18px 28px;background:linear-gradient(180deg,#faf3e6 0%,var(--paper) 100%);border-bottom:1px solid var(--rule)}
.hero .ja{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.4;letter-spacing:.04em}
.hero .en{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase}
.hero .desc{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.7}

/* ===== カテゴリ chips ===== */
.cats{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--rule);position:sticky;top:57px;z-index:20}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:6px 14px;background:var(--paper-tinted);border-radius:14px;font-size:12px;color:var(--ink-soft);white-space:nowrap;font-weight:600}
.cat.on{background:var(--ink);color:#fff}

/* ===== 商品グリッド ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
.card{background:#fff;border:1px solid var(--rule);border-radius:4px;overflow:hidden;cursor:pointer}
.card .img{width:100%;aspect-ratio:1/1;background:var(--paper-tinted);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:9px 11px 12px}
.card .tag{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--accent);font-weight:700;text-transform:uppercase}
.card .name{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.4;margin-top:2px;color:var(--ink);min-height:38px}
.card .row{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.card .price{font-family:var(--mono);font-weight:700;font-size:14px}
.card .price-mem{font-family:var(--mono);font-size:10px;color:var(--accent)}
.card .sold{font-size:10px;color:var(--ink-faint);margin-top:2px}
.card .oos{background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:2px;display:inline-block;margin-top:4px}

/* ===== 商品詳細 ===== */
.detail{padding:0 0 100px}
.detail .gallery{position:relative;background:var(--paper-tinted)}
.detail .gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.detail .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.detail .dots i{width:6px;height:6px;border-radius:50%;background:#fff8;display:inline-block}
.detail .dots i.on{background:#fff;width:18px;border-radius:3px}
.detail-body{padding:18px}
.detail .tag{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--accent);font-weight:700;text-transform:uppercase}
.detail .name{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.5;margin-top:6px}
.detail .summary{color:var(--ink-soft);font-size:13px;margin-top:6px}
.detail .price-row{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:14px;flex-wrap:wrap}
.detail .price{font-family:var(--serif);font-size:24px;font-weight:700}
.detail .price-mem{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.detail .stars{font-size:12px;color:var(--accent);margin-left:auto}
.detail .stars span{color:var(--ink-soft)}
.detail h4{font-family:var(--serif);font-size:14px;margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink);display:inline-block;letter-spacing:.06em}
.detail .desc{font-size:13px;line-height:1.85;color:var(--ink)}
.var-list{display:grid;gap:8px;margin-top:10px}
.var-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--rule);border-radius:3px;cursor:pointer}
.var-row.on{border-color:var(--accent);background:var(--accent-soft)}
.var-row .lab{flex:1;font-weight:700;font-size:13px}
.var-row .price{font-family:var(--mono);font-size:13px;font-weight:700}
.var-row .stock{font-size:10px;color:var(--ink-faint);margin-left:auto;text-align:right}

/* ===== カート bar (sticky bottom) ===== */
.buybar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:50}
.buybar .qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:3px}
.buybar .qty button{width:32px;height:36px;font-size:18px;color:var(--ink-soft)}
.buybar .qty span{min-width:30px;text-align:center;font-family:var(--mono);font-weight:700}
.buybar .add{flex:1;background:var(--ink);color:#fff;border-radius:3px;padding:12px;font-weight:700;letter-spacing:.1em;font-size:13px}
.buybar .add:disabled{background:var(--ink-faint)}
.buybar .ic{width:42px;height:42px;border:1px solid var(--rule);border-radius:3px;display:grid;place-items:center;color:var(--ink-soft);position:relative}
.buybar .ic .cnt{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;border-radius:9px;font-size:10px;font-family:var(--mono);padding:1px 5px;font-weight:700}

/* LIFFは max-width 520px → bottom bar も同幅 */
@media(min-width:521px){.buybar{left:50%;transform:translateX(-50%);max-width:520px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}}

/* ===== カート画面 ===== */
.cart-list{padding:12px 16px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.cart-item img{width:64px;height:64px;border-radius:3px;object-fit:cover;background:var(--paper-tinted)}
.cart-item .body{flex:1;min-width:0}
.cart-item .name{font-weight:700;font-size:13px}
.cart-item .var{font-size:11px;color:var(--ink-faint)}
.cart-item .row{display:flex;align-items:center;margin-top:6px;gap:8px}
.cart-item .row .price{font-family:var(--mono);font-weight:700;font-size:13px}
.cart-item .qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:3px;margin-left:auto}
.cart-item .qty button{width:26px;height:26px;font-size:14px;color:var(--ink-soft)}
.cart-item .qty span{min-width:24px;text-align:center;font-family:var(--mono);font-size:12px;font-weight:700}
.cart-summary{padding:16px;background:var(--paper-tinted);margin-top:14px}
.cart-summary .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.cart-summary .row.total{font-family:var(--serif);font-size:18px;font-weight:700;border-top:1px solid var(--rule);margin-top:8px;padding-top:10px}
.coupon-row{display:flex;gap:6px;margin:14px 16px}
.coupon-row input{flex:1;border:1px solid var(--rule);padding:8px 10px;border-radius:3px}
.coupon-row button{padding:8px 14px;background:var(--ink);color:#fff;border-radius:3px;font-weight:700;font-size:12px}

/* ===== checkout ===== */
.checkout{padding:14px 16px 120px}
.checkout h3{font-family:var(--serif);font-size:16px;margin:20px 0 10px;letter-spacing:.04em;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.checkout .field{margin-bottom:10px}
.checkout .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--ink-soft);margin-bottom:3px;text-transform:uppercase}
.checkout .field input,.checkout .field textarea{width:100%;border:1px solid var(--rule);padding:9px 11px;border-radius:3px}
.pay-list{display:grid;gap:8px}
.pay-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--rule);border-radius:3px;cursor:pointer}
.pay-row.on{border-color:var(--accent);background:var(--accent-soft)}
.pay-row .lab{flex:1;font-weight:700}
.pay-row .fee{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

/* ===== 注文履歴 ===== */
.hist-item{padding:14px 16px;border-bottom:1px solid var(--rule)}
.hist-item .head{display:flex;justify-content:space-between;align-items:baseline}
.hist-item .id{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.hist-item .total{font-family:var(--serif);font-weight:700;font-size:16px}
.hist-item .body{font-size:12px;color:var(--ink-soft);margin-top:4px}
.hist-item .status{display:inline-block;padding:1px 7px;font-size:10px;font-family:var(--mono);border-radius:2px;font-weight:600;margin-top:4px}
.hist-item .status.ok{background:#e3f0e7;color:#2b6e3f}
.hist-item .status.warn{background:#fbf1d8;color:#a8770a}

/* ===== Tabs (footer nav for LIFF) ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);display:flex;z-index:40;height:56px}
@media(min-width:521px){.tabbar{left:50%;transform:translateX(-50%);max-width:520px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}}
.tabbar a{flex:1;display:grid;place-items:center;color:var(--ink-faint);font-size:10px;letter-spacing:.1em;font-weight:700;gap:2px;padding:6px 0}
.tabbar a.on{color:var(--accent)}
.tabbar a .ic{font-size:18px}

/* utility */
.empty{padding:50px 20px;text-align:center;color:var(--ink-faint)}
.empty .big{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:3px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.back{font-size:16px;color:var(--ink-soft);width:32px;height:32px;display:grid;place-items:center}
</style>
</head>
<body>
<div class="liff" id="app">
  <!-- 動的レンダ -->
</div>
<div class="toast" id="toast">カートに追加しました</div>

<script>
let products=[], cart=JSON.parse(localStorage.getItem('lune-cart')||'[]');
const yen = n => '¥' + Number(n||0).toLocaleString('ja-JP');
const cartCount = () => cart.reduce((s,c)=>s+c.qty,0);
const cartTotal = () => cart.reduce((s,c)=>s+c.price*c.qty,0);
const saveCart = () => localStorage.setItem('lune-cart', JSON.stringify(cart));

const toast = msg => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 1500);
};

async function loadData(){
  products = await fetch('../demo-data/products.json').then(r=>r.json()).catch(()=>[]);
}

function header(title, opt={}){
  return `
    <div class="shop-h">
      ${opt.back?`<button class="back" onclick="history.back()">←</button>`:''}
      <div class="logo">${title||'LUNE<em>·</em>'}</div>
      <button class="ic-btn" onclick="route('#/cart')">⌫${cartCount()?`<span class="dot"></span>`:''}</button>
      <button class="ic-btn">≡</button>
    </div>
  `;
}

function tabbar(active){
  const tabs = [
    {key:'home', ic:'⌂', label:'TOP', href:'#/'},
    {key:'search', ic:'⌕', label:'検索', href:'#/search'},
    {key:'cart', ic:'⌫', label:'カート', href:'#/cart'},
    {key:'history', ic:'▤', label:'履歴', href:'#/history'},
    {key:'mypage', ic:'☻', label:'マイ', href:'#/mypage'}
  ];
  return `<div class="tabbar">${tabs.map(t=>`<a href="${t.href}" class="${active===t.key?'on':''}"><span class="ic">${t.ic}</span><span>${t.label}</span></a>`).join('')}</div>`;
}

const views = {

  home(){
    const cats = [...new Set(products.filter(p=>p.status==='公開').map(p=>p.category))];
    return `
      ${header()}
      <div class="hero">
        <div class="en">FEMCARE × WHOLE BEAUTY</div>
        <div class="ja">フェムケアから<br>はじまる、私の上質。</div>
        <div class="desc">Lune (リュヌ) — サロン併用前提のプレミアムケア。膣×子宮革命をコンセプトに、全身美容を提案する4品ラインナップ。</div>
      </div>
      <div class="cats" id="cats">
        <div class="cat on" data-c="all">すべて</div>
        ${cats.map(c=>`<div class="cat" data-c="${c}">${c}</div>`).join('')}
      </div>
      <div class="grid" id="grid"></div>
      <div style="height:90px"></div>
      ${tabbar('home')}
    `;
  },

  product(id){
    const p = products.find(x=>x.id===id);
    if(!p) return `${header('商品が見つかりません',{back:true})}<div class="empty">該当する商品はありません</div>${tabbar('home')}`;
    return `
      ${header(p.name,{back:true})}
      <div class="detail">
        <div class="gallery">
          <img src="${p.images[0]||p.thumbnail}" alt="">
          ${p.images.length>1?`<div class="dots">${p.images.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
        </div>
        <div class="detail-body">
          <div class="tag">${p.category}</div>
          <div class="name">${p.name}</div>
          <div class="summary">${p.summary}</div>
          <div class="price-row">
            <div class="price">${yen(p.price)}</div>
            ${p.price_member?`<div class="price-mem">会員価格 ${yen(p.price_member)}</div>`:''}
            <div class="stars">★★★★<span>★</span> ${p.rating} <span>(${p.review_count})</span></div>
          </div>
          ${p.variants && p.variants.length>1 ? `
            <h4>バリエーション</h4>
            <div class="var-list">
              ${p.variants.map((v,i)=>`
                <div class="var-row ${i===0?'on':''}" data-vid="${v.id}" onclick="selVar(this)">
                  <div class="lab">${v.label}</div>
                  <div class="price">${yen(v.price)}</div>
                  <div class="stock">${v.stock>0?`在庫 ${v.stock}`:'在庫切れ'}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
          <h4>商品について</h4>
          <div class="desc">${p.description}</div>
          ${p.tags && p.tags.length ? `<h4>関連タグ</h4><div>${p.tags.map(t=>`<span style="display:inline-block;padding:3px 9px;margin:2px 4px 2px 0;background:var(--paper-tinted);border-radius:12px;font-size:11px">${t}</span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="buybar">
        <div class="qty"><button onclick="qChg(-1)">−</button><span id="qty">1</span><button onclick="qChg(1)">＋</button></div>
        <button class="ic" onclick="route('#/cart')">⌫${cartCount()?`<span class="cnt">${cartCount()}</span>`:''}</button>
        <button class="add" ${p.stock<=0?'disabled':''} onclick='addCart("${p.id}")'>${p.stock<=0?'在庫切れ':'カートに入れる'}</button>
      </div>
    `;
  },

  cart(){
    if(!cart.length) return `${header('カート',{back:true})}<div class="empty"><div class="big">カートは空です</div><div>商品をお選びください</div><div style="margin-top:20px"><a class="add" style="display:inline-block;background:var(--ink);color:#fff;padding:10px 22px;border-radius:3px;font-weight:700" href="#/">商品を見る</a></div></div>${tabbar('cart')}`;
    return `
      ${header('カート',{back:true})}
      <div class="cart-list">
        ${cart.map((c,i)=>`
          <div class="cart-item">
            <img src="${c.thumbnail}" alt="">
            <div class="body">
              <div class="name">${c.name}</div>
              ${c.variant_label?`<div class="var">${c.variant_label}</div>`:''}
              <div class="row">
                <span class="price">${yen(c.price)}</span>
                <div class="qty">
                  <button onclick="cartQ(${i},-1)">−</button>
                  <span>${c.qty}</span>
                  <button onclick="cartQ(${i},1)">＋</button>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="coupon-row"><input placeholder="クーポンコード"><button onclick="toast('クーポン適用しました')">適用</button></div>
      <div class="cart-summary">
        <div class="row"><span>小計</span><span>${yen(cartTotal())}</span></div>
        <div class="row"><span>送料</span><span>${cartTotal()>=10000?'¥0 (無料)':'¥770'}</span></div>
        <div class="row total"><span>合計</span><span>${yen(cartTotal()+(cartTotal()>=10000?0:770))}</span></div>
      </div>
      <div style="padding:14px 16px"><button class="add" style="width:100%;background:var(--ink);color:#fff;padding:14px;border-radius:3px;font-weight:700;font-size:13px;letter-spacing:.12em" onclick="route('#/checkout')">レジに進む</button></div>
      <div style="height:80px"></div>
      ${tabbar('cart')}
    `;
  },

  checkout(){
    return `
      ${header('ご注文',{back:true})}
      <div class="checkout">
        <h3>お届け先</h3>
        <div class="field"><label>お名前</label><input value="佐藤 美月"></div>
        <div class="field"><label>電話番号</label><input value="090-1234-5678"></div>
        <div class="field"><label>郵便番号</label><input value="910-0833"></div>
        <div class="field"><label>住所</label><input value="福井県福井市新保北1-203"></div>
        <div class="field"><label>建物・部屋番号</label><input placeholder="任意"></div>

        <h3>お支払方法</h3>
        <div class="pay-list">
          <div class="pay-row on"><span style="font-size:18px">¢</span><div class="lab">クレジットカード</div><div class="fee">Stripe</div></div>
          <div class="pay-row"><span style="font-size:18px">▣</span><div class="lab">代金引換</div><div class="fee">+¥330</div></div>
          <div class="pay-row"><span style="font-size:14px;font-family:var(--mono)">NP</span><div class="lab">NP後払い</div><div class="fee">+2.9%</div></div>
        </div>

        <h3>ご注文内容</h3>
        ${cart.length ? cart.map(c=>`
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px">
            <span>${c.name} × ${c.qty}</span>
            <span style="font-family:var(--mono);font-weight:700">${yen(c.price*c.qty)}</span>
          </div>
        `).join('') : '<div class="empty">カートが空です</div>'}
        <div style="border-top:1px solid var(--rule);margin-top:10px;padding-top:10px">
          <div style="display:flex;justify-content:space-between;font-family:var(--serif);font-size:18px;font-weight:700"><span>合計</span><span>${yen(cartTotal()+(cartTotal()>=10000?0:770))}</span></div>
        </div>

        <h3>ご要望・メモ</h3>
        <div class="field"><textarea rows="3" placeholder="サロン気付配送など"></textarea></div>

        <button class="add" style="width:100%;background:var(--accent);color:#fff;padding:14px;border-radius:3px;font-weight:700;font-size:14px;letter-spacing:.12em;margin-top:18px" onclick="placeOrder()">この内容で注文する</button>
        <div style="font-size:10px;color:var(--ink-faint);text-align:center;margin-top:10px">注文後、LINEで注文確認通知が届きます。</div>
      </div>
    `;
  },

  history(){
    const sample = [
      {id:'20260616-0007', date:'6/16 09:42', items:'リュヌ ラブミーオイル', total:9350, status:'発送準備中', cls:'warn'},
      {id:'20260612-0001', date:'6/12 16:20', items:'リュヌ エラスチン&コラーゲン', total:15950, status:'発送済', cls:'ok'},
      {id:'20260520-0033', date:'5/20 11:00', items:'リュヌ プレミアムフォーム × 1', total:13200, status:'発送済', cls:'ok'},
      {id:'20260415-0019', date:'4/15 14:30', items:'Lune スターターセット', total:19800, status:'発送済', cls:'ok'}
    ];
    return `
      ${header('注文履歴',{back:true})}
      <div>${sample.map(s=>`
        <div class="hist-item">
          <div class="head"><span class="id">${s.id}</span><span class="total">${yen(s.total)}</span></div>
          <div class="body">${s.date} / ${s.items}</div>
          <span class="status ${s.cls}">${s.status}</span>
        </div>
      `).join('')}</div>
      <div style="height:80px"></div>
      ${tabbar('history')}
    `;
  },

  mypage(){
    return `
      ${header('マイページ',{back:false})}
      <div style="padding:24px 18px;text-align:center;border-bottom:1px solid var(--rule)">
        <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#c8412e,#8e2a1c);color:#fff;display:inline-grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:26px;margin-bottom:8px">M</div>
        <div style="font-family:var(--serif);font-size:18px;font-weight:700">佐藤 美月 様</div>
        <div style="font-size:11px;color:var(--ink-soft)">VIP会員 / ポイント残高 <span style="font-family:var(--mono);font-weight:700;color:var(--accent)">1,420 pt</span></div>
      </div>
      <div>
        ${[
          ['注文履歴','#/history','▤'],
          ['お気に入り','#/fav','♡'],
          ['会員ランク','#/rank','✦'],
          ['クーポン','#/coupons','%'],
          ['住所帳','#/address','⌂'],
          ['お問い合わせ','#/contact','☎']
        ].map(([l,h,i])=>`<a href="${h}" style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule);font-size:13px"><span style="width:30px;color:var(--accent)">${i}</span><span style="flex:1">${l}</span><span style="color:var(--ink-faint)">›</span></a>`).join('')}
      </div>
      <div style="height:80px"></div>
      ${tabbar('mypage')}
    `;
  },

  search(){
    return `
      ${header('検索',{back:false})}
      <div style="padding:14px 16px"><input style="width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:3px" placeholder="商品名・キーワードで検索"></div>
      <div style="padding:0 16px"><div style="font-family:var(--serif);font-size:13px;margin-bottom:8px">人気の検索</div>
        <div>${['フェムケア','サプリ','スターター','オイル','コラーゲン','セット'].map(t=>`<span style="display:inline-block;padding:5px 11px;margin:0 6px 8px 0;background:var(--paper-tinted);border-radius:14px;font-size:12px">${t}</span>`).join('')}</div>
      </div>
      <div style="padding:14px 16px"><div style="font-family:var(--serif);font-size:13px;margin-bottom:8px">新着商品</div></div>
      <div class="grid" style="padding:0 16px">${products.filter(p=>p.status==='公開').slice(0,4).map(p=>productCard(p)).join('')}</div>
      <div style="height:80px"></div>
      ${tabbar('search')}
    `;
  }
};

function productCard(p){
  return `
    <div class="card" onclick="route('#/p/${p.id}')">
      <div class="img"><img src="${p.thumbnail}" alt=""></div>
      <div class="meta">
        <div class="tag">${p.category}</div>
        <div class="name">${p.name}</div>
        <div class="row"><span class="price">${yen(p.price)}</span></div>
        ${p.price_member?`<div class="price-mem">会員 ${yen(p.price_member)}</div>`:''}
        ${p.stock<=0?'<span class="oos">在庫切れ</span>':`<div class="sold">${p.sold}個販売</div>`}
      </div>
    </div>
  `;
}

window.selVar = el => {
  document.querySelectorAll('.var-row').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
};

window.qChg = d => {
  const e = document.getElementById('qty');
  e.textContent = Math.max(1, +e.textContent + d);
};

window.addCart = pid => {
  const p = products.find(x=>x.id===pid);
  if(!p || p.stock<=0) return;
  const qty = +document.getElementById('qty').textContent;
  const v = document.querySelector('.var-row.on');
  const variant_id = v ? v.dataset.vid : (p.variants?.[0]?.id || pid);
  const variant = p.variants?.find(x=>x.id===variant_id);
  const variant_label = variant ? variant.label : '';
  const price = variant ? variant.price : p.price;
  const existing = cart.find(c=>c.product_id===pid && c.variant_id===variant_id);
  if(existing) existing.qty += qty;
  else cart.push({product_id:pid, variant_id, name:p.name, variant_label, price, qty, thumbnail:p.thumbnail});
  saveCart();
  toast(`${p.name} をカートに追加`);
  setTimeout(()=>route(), 400);
};

window.cartQ = (i, d) => {
  cart[i].qty = Math.max(1, cart[i].qty + d);
  saveCart(); route();
};

window.placeOrder = () => {
  cart = []; saveCart();
  toast('ご注文ありがとうございます');
  setTimeout(()=>{ location.hash='#/history'; }, 1000);
};

function route(hash){
  if(hash) location.hash = hash;
  const h = (location.hash || '#/').replace(/^#\//,'');
  const parts = h.split('/');
  const key = parts[0] || '';
  const sub = parts[1];

  let html = '';
  if(!key || key==='') html = views.home();
  else if(key==='p' && sub) html = views.product(sub);
  else if(key==='cart') html = views.cart();
  else if(key==='checkout') html = views.checkout();
  else if(key==='history') html = views.history();
  else if(key==='mypage') html = views.mypage();
  else if(key==='search') html = views.search();
  else html = views.home();
  document.getElementById('app').innerHTML = html;

  // 商品グリッド描画 (homeの場合)
  if(key==='' || !key){
    drawGrid();
    document.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{
      document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); drawGrid();
    });
  }
  window.scrollTo(0,0);
}

function drawGrid(){
  const grid = document.getElementById('grid'); if(!grid) return;
  const sel = document.querySelector('.cat.on')?.dataset.c || 'all';
  const list = products.filter(p=>p.status==='公開' && (sel==='all'||p.category===sel));
  grid.innerHTML = list.map(productCard).join('');
}

window.addEventListener('hashchange', ()=>route());
window.route = route;

loadData().then(()=>route());
</script>
</body>
</html>
