<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lune by Skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.985 0.002 80);
  --surface: oklch(1 0 0);
  --soft: oklch(0.96 0.005 80);
  --ink: oklch(0.18 0.012 80);
  --ink-2: oklch(0.42 0.008 80);
  --ink-3: oklch(0.60 0.006 80);
  --ink-4: oklch(0.78 0.005 80);
  --rule: oklch(0.92 0.005 80);
  --rule-soft: oklch(0.955 0.004 80);
  --accent: oklch(0.40 0.18 18);
  --accent-deep: oklch(0.30 0.16 18);
  --accent-tint: oklch(0.96 0.04 18);
  --line-green: oklch(0.72 0.18 148);
  --serif: 'Noto Serif JP', 'Times New Roman', serif;
  --sans: 'Inter Tight', 'Noto Sans JP', system-ui, sans-serif;
  --jp: 'Noto Sans JP', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;font-feature-settings:'palt'}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:inherit}
img{display:block;max-width:100%}

.liff{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule);overflow:hidden}

/* ===== Header ===== */
.h{position:sticky;top:0;background:oklch(0.985 0.002 80 / 0.92);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);z-index:30;border-bottom:1px solid var(--rule);padding:13px 18px;display:flex;align-items:center;gap:12px}
.h .logo{font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:.14em;flex:1;color:var(--ink)}
.h .logo .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);vertical-align:middle;margin:0 4px 3px}
.h .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);position:relative}
.h .ic:hover{background:var(--soft)}
.h .ic .b{position:absolute;top:4px;right:4px;min-width:14px;height:14px;background:var(--accent);color:#fff;border-radius:7px;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.h .ic svg{width:18px;height:18px}

/* ===== Hero ===== */
.hero{padding:32px 22px 28px;border-bottom:1px solid var(--rule);position:relative}
.hero .kic{font-family:var(--mono);font-size:10px;letter-spacing:.32em;color:var(--ink-3);font-weight:500;margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.45;letter-spacing:.02em;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .desc{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.85;max-width:36ch}
.hero .info-strip{display:flex;gap:18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.hero .info-strip b{color:var(--ink);font-weight:600}

/* ===== Cat chips ===== */
.cats{display:flex;gap:6px;padding:10px 18px;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--rule);position:sticky;top:60px;z-index:20;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:6px 13px;background:var(--surface);border:1px solid var(--rule);border-radius:20px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.cat:hover{border-color:var(--ink-4)}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== Section heading ===== */
.sec-h{display:flex;align-items:baseline;padding:24px 22px 12px;gap:10px}
.sec-h h2{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
.sec-h .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:500}
.sec-h .more{margin-left:auto;font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:3px;font-weight:500}

/* ===== Featured product (single, large) ===== */
.feat{padding:0 22px 8px;position:relative}
.feat-card{position:relative;background:var(--surface);border-radius:6px;overflow:hidden;border:1px solid var(--rule-soft)}
.feat-card .img{aspect-ratio:1/1.05;background:var(--soft);overflow:hidden;position:relative}
.feat-card .img img{width:100%;height:100%;object-fit:cover}
.feat-card .img .badge{position:absolute;top:12px;left:12px;background:oklch(1 0 0 / 0.9);backdrop-filter:blur(6px);padding:5px 11px;border-radius:14px;font-size:10.5px;font-family:var(--mono);font-weight:600;color:var(--accent);letter-spacing:.04em}
.feat-card .body{padding:16px 18px 18px}
.feat-card .cat{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--ink-3);font-weight:500;text-transform:uppercase}
.feat-card .name-en{font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:.05em;margin-top:6px;color:var(--ink)}
.feat-card .name-ja{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.feat-card .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)}
.feat-card .price{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--ink)}
.feat-card .stars{font-size:11px;color:var(--ink-2)}
.feat-card .stars b{color:var(--accent);font-weight:600;font-family:var(--mono);margin-right:3px}

/* ===== Product grid (small) ===== */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 18px 8px}
.card{background:transparent;cursor:pointer}
.card .img{width:100%;aspect-ratio:1/1.05;background:var(--soft);overflow:hidden;border-radius:4px;position:relative}
.card .img img{width:100%;height:100%;object-fit:cover;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.card:hover .img img{transform:scale(1.04)}
.card .oos{position:absolute;bottom:8px;left:8px;background:oklch(0.18 0.012 80 / 0.85);color:#fff;font-size:10px;padding:3px 9px;border-radius:11px;font-weight:600}
.card .meta{padding:10px 2px 6px}
.card .cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--accent);font-weight:600;text-transform:uppercase}
.card .name{font-family:var(--serif);font-weight:500;font-size:14px;line-height:1.45;margin-top:5px;color:var(--ink);min-height:40px;letter-spacing:.03em}
.card .row{display:flex;align-items:baseline;gap:5px;margin-top:6px}
.card .price{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--ink)}
.card .price-mem{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:500}

/* ===== Section: editorial story ===== */
.story{background:var(--soft);padding:34px 22px;margin:8px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.story .kic{font-family:var(--mono);font-size:10px;letter-spacing:.32em;color:var(--ink-3);font-weight:500;margin-bottom:10px}
.story h3{font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.5;letter-spacing:.05em;color:var(--ink)}
.story p{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.95;max-width:38ch}
.story .sig{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-3);margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}

/* ===== Detail ===== */
.det{padding:0 0 100px}
.det .gallery{position:relative;background:var(--soft);aspect-ratio:1/1}
.det .gallery img{width:100%;height:100%;object-fit:cover}
.det .gallery .dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.det .gallery .dots i{width:5px;height:5px;border-radius:50%;background:#fff8;display:inline-block;transition:width .2s}
.det .gallery .dots i.on{background:#fff;width:18px;border-radius:3px}
.det .thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:3px 22px 0}
.det .thumbs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:3px;cursor:pointer;opacity:.6}
.det .thumbs img.on{opacity:1;outline:1.5px solid var(--ink);outline-offset:2px}
.det-body{padding:22px}
.det .cat{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--accent);font-weight:600;text-transform:uppercase}
.det .name-en{font-family:var(--serif);font-size:26px;font-weight:500;line-height:1.4;margin-top:8px;letter-spacing:.05em;color:var(--ink)}
.det .name-ja{font-size:13px;color:var(--ink-2);margin-top:4px}
.det .summary{color:var(--ink-2);font-size:13px;margin-top:14px;line-height:1.85}
.det .price-row{display:flex;align-items:baseline;gap:14px;padding:18px 0 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:22px;flex-wrap:wrap}
.det .price{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink);letter-spacing:.04em}
.det .price-mem{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.det .stars{font-size:11.5px;color:var(--ink-2);margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.det .stars b{color:var(--accent);font-family:var(--mono);font-weight:600}
.det h4{font-family:var(--serif);font-size:15px;font-weight:500;margin:26px 0 8px;padding-bottom:8px;border-bottom:1px solid var(--rule);letter-spacing:.06em;color:var(--ink)}
.det .desc{font-size:13px;line-height:2;color:var(--ink-2)}
.var-list{display:grid;gap:7px;margin-top:10px}
.var-row{display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid var(--rule);border-radius:4px;cursor:pointer;background:var(--surface)}
.var-row.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.var-row.on .stock{color:oklch(1 0 0 / 0.7)}
.var-row.on .price{color:var(--bg)}
.var-row .lab{flex:1;font-weight:600;font-size:13px}
.var-row .price{font-family:var(--mono);font-size:13px;font-weight:600}
.var-row .stock{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:8px}
.tags-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags-line span{display:inline-block;padding:3px 10px;background:var(--soft);border-radius:13px;font-size:10.5px;color:var(--ink-2);font-weight:500}

/* ===== Buy bar ===== */
.buybar{position:fixed;bottom:0;left:0;right:0;background:oklch(1 0 0 / 0.95);backdrop-filter:blur(12px);border-top:1px solid var(--rule);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:50}
.buybar .qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
.buybar .qty button{width:34px;height:38px;font-size:18px;color:var(--ink-2);font-weight:300}
.buybar .qty span{min-width:28px;text-align:center;font-family:var(--mono);font-weight:600;font-size:13px}
.buybar .ic{width:42px;height:42px;border:1px solid var(--rule);border-radius:4px;display:grid;place-items:center;color:var(--ink-2);position:relative;background:var(--surface)}
.buybar .ic svg{width:17px;height:17px}
.buybar .ic .cnt{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#fff;border-radius:9px;font-size:9.5px;font-family:var(--mono);padding:1px 5px;font-weight:700;min-width:16px;text-align:center}
.buybar .add{flex:1;background:var(--ink);color:#fff;border-radius:4px;padding:13px;font-weight:600;letter-spacing:.06em;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.buybar .add:disabled{background:var(--ink-4)}
.buybar .add svg{width:14px;height:14px}
@media(min-width:481px){.buybar{left:50%;transform:translateX(-50%);max-width:480px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}}

/* ===== Cart ===== */
.cart-list{padding:14px 18px 0}
.cart-item{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--rule)}
.cart-item img{width:72px;height:72px;border-radius:4px;object-fit:cover;background:var(--soft)}
.cart-item .body{flex:1;min-width:0}
.cart-item .name{font-family:var(--serif);font-weight:500;font-size:13px;line-height:1.5;color:var(--ink);letter-spacing:.03em}
.cart-item .var{font-size:11px;color:var(--ink-3);margin-top:3px}
.cart-item .row{display:flex;align-items:center;margin-top:8px;gap:10px}
.cart-item .row .price{font-family:var(--mono);font-weight:600;font-size:13px}
.cart-item .qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:4px;margin-left:auto;background:var(--surface)}
.cart-item .qty button{width:28px;height:28px;font-size:14px;color:var(--ink-2)}
.cart-item .qty span{min-width:24px;text-align:center;font-family:var(--mono);font-size:12px;font-weight:600}
.coupon-row{display:flex;gap:6px;margin:18px 18px 0}
.coupon-row input{flex:1;border:1px solid var(--rule);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:12.5px}
.coupon-row input:focus{outline:none;border-color:var(--ink)}
.coupon-row button{padding:10px 16px;background:var(--ink);color:#fff;border-radius:4px;font-weight:600;font-size:12px;letter-spacing:.04em}
.cart-summary{padding:18px;margin:18px;background:var(--soft);border-radius:6px}
.cart-summary .row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--ink-2)}
.cart-summary .row.total{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink);border-top:1px solid var(--rule);margin-top:10px;padding-top:12px;letter-spacing:.04em}
.cart-summary .row.total .v{font-family:var(--mono);font-weight:600}
.cart-cta{padding:0 18px}
.cart-cta button{width:100%;background:var(--ink);color:#fff;padding:15px;border-radius:4px;font-weight:600;font-size:13.5px;letter-spacing:.1em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.cart-cta button svg{width:14px;height:14px}

/* ===== Checkout ===== */
.checkout{padding:0 0 120px}
.checkout-sec{padding:16px 22px;border-bottom:1px solid var(--rule)}
.checkout-sec:last-of-type{border-bottom:0}
.checkout-sec h3{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:12px;letter-spacing:.05em;color:var(--ink)}
.checkout-sec h3 .step{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600;margin-right:8px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-3);margin-bottom:4px;letter-spacing:.02em}
.field input,.field textarea{width:100%;border:1px solid var(--rule);background:var(--surface);padding:11px 13px;border-radius:4px;font-size:13px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.pay-list{display:grid;gap:8px}
.pay-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--rule);border-radius:4px;cursor:pointer;background:var(--surface)}
.pay-row.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pay-row .lab{flex:1;font-weight:600;font-size:13px}
.pay-row .fee{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:500}
.pay-row.on .fee{color:oklch(1 0 0 / 0.6)}
.pay-row .pay-ic{width:30px;height:20px;background:var(--soft);border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-2)}
.pay-row.on .pay-ic{background:oklch(1 0 0 / 0.15);color:#fff}
.order-summary{padding:12px 14px;background:var(--soft);border-radius:5px;margin-top:8px}
.order-summary .item{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;color:var(--ink-2)}
.order-summary .item .name{flex:1}
.order-summary .item .price{font-family:var(--mono);font-weight:600;color:var(--ink)}
.order-summary .item.total{padding-top:10px;margin-top:6px;border-top:1px solid var(--rule);font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);letter-spacing:.04em}
.order-cta{padding:6px 22px 0}
.order-cta button{width:100%;background:var(--accent);color:#fff;padding:16px;border-radius:4px;font-weight:600;font-size:14px;letter-spacing:.12em;margin-top:14px}
.order-cta .note{font-size:11px;color:var(--ink-3);text-align:center;margin-top:10px}

/* ===== History ===== */
.hist-item{padding:16px 22px;border-bottom:1px solid var(--rule);cursor:pointer}
.hist-item:hover{background:var(--soft)}
.hist-item .head{display:flex;justify-content:space-between;align-items:baseline}
.hist-item .id{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.hist-item .total{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.04em}
.hist-item .body{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.hist-item .ftr{display:flex;align-items:center;gap:8px;margin-top:8px}
.hist-status{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font-size:10.5px;border-radius:10px;font-weight:600}
.hist-status::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.hist-status.ok{background:oklch(0.96 0.04 152);color:oklch(0.55 0.15 152)}
.hist-status.warn{background:oklch(0.96 0.05 80);color:oklch(0.62 0.15 70)}

/* ===== MyPage ===== */
.mp-hero{padding:30px 22px 24px;text-align:center;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,var(--soft) 0%,var(--bg) 100%)}
.mp-hero .av{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-family:var(--serif);font-weight:500;font-size:24px;margin-bottom:10px;letter-spacing:.03em}
.mp-hero .n{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.06em}
.mp-hero .rank{font-size:11px;color:var(--ink-3);margin-top:4px}
.mp-hero .rank .pt{font-family:var(--mono);font-weight:600;color:var(--accent)}
.mp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
.mp-stats > div{background:var(--bg);padding:14px 12px;text-align:center}
.mp-stats .lab{font-size:10px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.mp-stats .num{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);margin-top:3px}
.mp-list a{display:flex;align-items:center;padding:15px 22px;border-bottom:1px solid var(--rule-soft);font-size:13.5px;color:var(--ink)}
.mp-list a:hover{background:var(--soft)}
.mp-list a .ic{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--ink-2);display:grid;place-items:center;margin-right:12px}
.mp-list a .ic svg{width:15px;height:15px}
.mp-list a .arr{margin-left:auto;color:var(--ink-3)}

/* ===== Tabbar ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:oklch(1 0 0 / 0.96);backdrop-filter:blur(12px);border-top:1px solid var(--rule);display:flex;z-index:40;height:62px;padding-bottom:max(0px, env(safe-area-inset-bottom))}
@media(min-width:481px){.tabbar{left:50%;transform:translateX(-50%);max-width:480px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}}
.tabbar a{flex:1;display:grid;place-items:center;color:var(--ink-3);font-size:10px;letter-spacing:.04em;font-weight:600;gap:3px;padding:8px 0}
.tabbar a.on{color:var(--ink)}
.tabbar a .ic{position:relative}
.tabbar a .ic svg{width:21px;height:21px}
.tabbar a .ic .cnt{position:absolute;top:-4px;right:-7px;background:var(--accent);color:#fff;border-radius:8px;font-size:9px;font-family:var(--mono);padding:0 4px;font-weight:700;min-width:14px;text-align:center}

/* ===== Misc ===== */
.empty{padding:60px 22px;text-align:center;color:var(--ink-3)}
.empty h3{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:6px;font-weight:500;letter-spacing:.04em}
.empty .desc{font-size:12.5px;margin-bottom:20px}
.empty button{display:inline-block;background:var(--ink);color:#fff;padding:11px 24px;border-radius:4px;font-weight:600;font-size:12.5px;letter-spacing:.1em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:4px;font-size:12.5px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:500}
.toast.on{opacity:1}
.back{width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2);border-radius:50%}
.back:hover{background:var(--soft)}
.back svg{width:18px;height:18px}
.spacer{height:90px}
</style>
</head>
<body>
<div class="liff" id="app"></div>
<div class="toast" id="toast"></div>

<script>
let products=[], cart=JSON.parse(localStorage.getItem('lune-cart-v2')||'[]'), curImg=0;
const yen = n => '¥' + Number(n||0).toLocaleString('ja-JP');
const cartCount = () => cart.reduce((s,c)=>s+c.qty,0);
const cartTotal = () => cart.reduce((s,c)=>s+c.price*c.qty,0);
const saveCart = () => localStorage.setItem('lune-cart-v2', JSON.stringify(cart));
const toast = msg => { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1600); };

async function loadData(){
  products = await fetch('../demo-data/products.json').then(r=>r.json()).catch(()=>[]);
}

const ic = {
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  arr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2 7-7 7 7 2 2"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  award: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>'
};

function header(opts={}){
  return `<div class="h">
    ${opts.back?`<button class="back" onclick="history.back()">${ic.back}</button>`:''}
    <div class="logo">${opts.title||`LUNE<span class="dot"></span>`}</div>
    <button class="ic" onclick="route('#/cart')" aria-label="カート">${ic.cart}${cartCount()?`<span class="b">${cartCount()}</span>`:''}</button>
    <button class="ic" aria-label="メニュー">${ic.menu}</button>
  </div>`;
}

function tabbar(active){
  const tabs = [
    {k:'home',  ic:ic.home,   l:'TOP', h:'#/'},
    {k:'search',ic:ic.search, l:'検索', h:'#/search'},
    {k:'cart',  ic:ic.cart,   l:'カート', h:'#/cart', cnt:cartCount()},
    {k:'history',ic:ic.doc,   l:'履歴', h:'#/history'},
    {k:'mypage',ic:ic.user,   l:'マイページ', h:'#/mypage'}
  ];
  return `<div class="tabbar">${tabs.map(t=>`<a href="${t.h}" class="${active===t.k?'on':''}"><span class="ic">${t.ic}${t.cnt?`<span class="cnt">${t.cnt}</span>`:''}</span><span>${t.l}</span></a>`).join('')}</div>`;
}

function smallCard(p){
  return `<div class="card" onclick="route('#/p/${p.id}')">
    <div class="img"><img src="${p.thumbnail}" alt="${p.name}" loading="lazy">${p.stock<=0?'<span class="oos">SOLD OUT</span>':''}</div>
    <div class="meta">
      <div class="cat">${p.category}</div>
      <div class="name">${p.name}</div>
      <div class="row"><span class="price">${yen(p.price)}</span></div>
      ${p.price_member?`<div class="price-mem">会員 ${yen(p.price_member)}</div>`:''}
    </div>
  </div>`;
}

const views = {

  home(){
    const featured = products.find(p=>p.id==='P005' || p.id==='P001');
    const pub = products.filter(p=>p.status==='公開');
    const cats = [...new Set(pub.map(p=>p.category))];
    return `
      ${header()}
      <section class="hero">
        <div class="kic">FEMCARE · WHOLE BEAUTY</div>
        <h1>フェムケアから<br>はじまる、<em>私の</em><br>上質。</h1>
        <p class="desc">膣×子宮革命をコンセプトに、サロン併用前提のプレミアムケアを提案するLune. 名古屋 Liberta Create による全身美容ライン。</p>
        <div class="info-strip">
          <span><b>4品</b> ラインナップ</span>
          <span><b>11フリー</b> 処方</span>
          <span><b>日本製</b></span>
        </div>
      </section>

      <div class="cats" id="cats">
        <div class="cat on" data-c="all">すべて</div>
        ${cats.map(c=>`<div class="cat" data-c="${c}">${c}</div>`).join('')}
      </div>

      ${featured ? `
      <div class="sec-h"><h2>注目の一品</h2><span class="n">FEATURED</span></div>
      <section class="feat">
        <div class="feat-card" onclick="route('#/p/${featured.id}')">
          <div class="img">
            <img src="${featured.thumbnail}" alt="${featured.name}">
            <span class="badge">¥2,000 OFF · お得セット</span>
          </div>
          <div class="body">
            <div class="cat">${featured.category}</div>
            <div class="name-en">${featured.name_en}</div>
            <div class="name-ja">${featured.name}</div>
            <div class="row">
              <span class="price">${yen(featured.price)}</span>
              <span class="stars"><b>${featured.rating}</b> · ${featured.review_count}件のレビュー</span>
            </div>
          </div>
        </div>
      </section>
      ` : ''}

      <div class="sec-h"><h2>商品一覧</h2><span class="n">CATALOG · ${pub.length}</span></div>
      <div class="grid" id="grid"></div>

      <section class="story">
        <div class="kic">ABOUT LUNE</div>
        <h3>赤ちゃんが舐めても安心、を膣に。</h3>
        <p>植物オイル6種、11フリー処方、無香料、天然由来100%。粘膜という最もデリケートな場所だからこそ、混じり気のないシンプルな処方を選ぶ。それが、 Lune の出発点です。</p>
        <div class="sig">— Liberta Create, Inc. / 名古屋</div>
      </section>

      <div class="spacer"></div>
      ${tabbar('home')}
    `;
  },

  product(id){
    const p = products.find(x=>x.id===id);
    if(!p) return `${header({back:true, title:'商品が見つかりません'})}<div class="empty"><h3>商品が見つかりません</h3><div class="desc">該当する商品はありません</div></div>${tabbar()}`;
    return `
      ${header({back:true, title:p.name})}
      <div class="det">
        <div class="gallery">
          <img id="gimg" src="${p.images[0]||p.thumbnail}" alt="${p.name}">
          ${p.images.length>1?`<div class="dots">${p.images.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
        </div>
        ${p.images.length>1?`<div class="thumbs">${p.images.slice(0,6).map((img,i)=>`<img src="${img}" class="${i===0?'on':''}" onclick="selImg(${i},'${img}')">`).join('')}</div>`:''}
        <div class="det-body">
          <div class="cat">${p.category}</div>
          <div class="name-en">${p.name_en||p.name}</div>
          <div class="name-ja">${p.name}</div>
          <div class="summary">${p.summary}</div>
          <div class="price-row">
            <div class="price">${yen(p.price)}</div>
            ${p.price_member?`<div class="price-mem">会員価格 ${yen(p.price_member)}</div>`:''}
            ${p.rating>0?`<div class="stars"><b>★ ${p.rating}</b> ${p.review_count}件</div>`:''}
          </div>
          ${p.variants && p.variants.length>1 ? `
            <h4>容量・タイプ</h4>
            <div class="var-list">${p.variants.map((v,i)=>`
              <div class="var-row ${i===0?'on':''}" data-vid="${v.id}" onclick="selVar(this)">
                <div class="lab">${v.label}</div>
                <div class="price">${yen(v.price)}</div>
                <div class="stock">${v.stock>0?`在庫 ${v.stock}`:'在庫切れ'}</div>
              </div>`).join('')}</div>
          ` : ''}
          <h4>商品について</h4>
          <div class="desc">${p.description}</div>
          ${p.tags && p.tags.length ? `<h4>関連タグ</h4><div class="tags-line">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>` : ''}
        </div>
      </div>
      <div class="buybar">
        <div class="qty"><button onclick="qChg(-1)">−</button><span id="qty">1</span><button onclick="qChg(1)">＋</button></div>
        <button class="ic" onclick="route('#/cart')" aria-label="カート">${ic.cart}${cartCount()?`<span class="cnt">${cartCount()}</span>`:''}</button>
        <button class="add" ${p.stock<=0?'disabled':''} onclick='addCart("${p.id}")'>${p.stock<=0?'在庫切れ':'カートに入れる'}${p.stock>0?ic.arr:''}</button>
      </div>
    `;
  },

  cart(){
    if(!cart.length) return `${header({back:true,title:'カート'})}<div class="empty"><h3>カートは空です</h3><div class="desc">気になる商品をお選びください</div><button onclick="route('#/')">商品一覧へ</button></div>${tabbar('cart')}`;
    const ship = cartTotal()>=10000 ? 0 : 770;
    return `
      ${header({back:true,title:'カート'})}
      <div class="cart-list">
        ${cart.map((c,i)=>`
          <div class="cart-item">
            <img src="${c.thumbnail}" alt="">
            <div class="body">
              <div class="name">${c.name}</div>
              ${c.variant_label?`<div class="var">${c.variant_label}</div>`:''}
              <div class="row">
                <span class="price">${yen(c.price)}</span>
                <div class="qty">
                  <button onclick="cartQ(${i},-1)">−</button>
                  <span>${c.qty}</span>
                  <button onclick="cartQ(${i},1)">＋</button>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="coupon-row"><input placeholder="クーポンコード"><button onclick="toast('クーポンを適用しました')">適用</button></div>
      <div class="cart-summary">
        <div class="row"><span>小計</span><span style="font-family:var(--mono);font-weight:600;color:var(--ink)">${yen(cartTotal())}</span></div>
        <div class="row"><span>送料</span><span style="font-family:var(--mono);font-weight:600;color:var(--ink)">${ship===0?'¥0 · 送料無料':'¥770'}</span></div>
        ${ship>0?`<div class="row" style="font-size:11px;color:var(--ink-3)">あと <span style="color:var(--accent);font-weight:600">${yen(10000-cartTotal())}</span> で送料無料</div>`:''}
        <div class="row total"><span>合計</span><span class="v">${yen(cartTotal()+ship)}</span></div>
      </div>
      <div class="cart-cta"><button onclick="route('#/checkout')">レジに進む${ic.arr}</button></div>
      <div class="spacer"></div>
      ${tabbar('cart')}
    `;
  },

  checkout(){
    const ship = cartTotal()>=10000 ? 0 : 770;
    return `
      ${header({back:true,title:'ご注文'})}
      <div class="checkout">

        <div class="checkout-sec">
          <h3><span class="step">01</span>お届け先</h3>
          <div class="field"><label>お名前</label><input value="佐藤 美月"></div>
          <div class="field"><label>電話番号</label><input value="090-1234-5678"></div>
          <div class="field"><label>郵便番号</label><input value="910-0833"></div>
          <div class="field"><label>住所</label><input value="福井県福井市新保北1-203"></div>
          <div class="field"><label>建物・部屋番号</label><input placeholder="任意"></div>
        </div>

        <div class="checkout-sec">
          <h3><span class="step">02</span>お支払方法</h3>
          <div class="pay-list">
            <div class="pay-row on"><span class="pay-ic">CC</span><div class="lab">クレジットカード</div><div class="fee">Stripe</div></div>
            <div class="pay-row"><span class="pay-ic">代引</span><div class="lab">代金引換</div><div class="fee">+¥330</div></div>
            <div class="pay-row"><span class="pay-ic">NP</span><div class="lab">NP後払い</div><div class="fee">+2.9%</div></div>
          </div>
        </div>

        <div class="checkout-sec">
          <h3><span class="step">03</span>ご注文内容</h3>
          <div class="order-summary">
            ${cart.length ? cart.map(c=>`<div class="item"><span class="name">${c.name} × ${c.qty}</span><span class="price">${yen(c.price*c.qty)}</span></div>`).join('') : '<div class="item">カートが空です</div>'}
            <div class="item" style="color:var(--ink-3)"><span>小計</span><span style="font-family:var(--mono)">${yen(cartTotal())}</span></div>
            <div class="item" style="color:var(--ink-3)"><span>送料</span><span style="font-family:var(--mono)">${yen(ship)}</span></div>
            <div class="item total"><span>合計</span><span style="font-family:var(--mono);font-weight:600">${yen(cartTotal()+ship)}</span></div>
          </div>
        </div>

        <div class="checkout-sec">
          <h3><span class="step">04</span>ご要望・メモ</h3>
          <div class="field"><textarea rows="3" placeholder="サロン気付配送など"></textarea></div>
        </div>

        <div class="order-cta">
          <button onclick="placeOrder()">この内容で注文する</button>
          <div class="note">注文後、LINEで注文確認通知が届きます。</div>
        </div>
      </div>
    `;
  },

  history(){
    const sample = [
      {id:'20260616-0007', date:'2026.06.16 09:42', items:'ラブミーオイル / 30mL', total:9350, status:'発送準備中', cls:'warn'},
      {id:'20260612-0001', date:'2026.06.12 16:20', items:'エラスチン&コラーゲン', total:15950, status:'発送済', cls:'ok'},
      {id:'20260520-0033', date:'2026.05.20 11:00', items:'プレミアムフォーム × 1', total:13200, status:'発送済', cls:'ok'},
      {id:'20260415-0019', date:'2026.04.15 14:30', items:'スターターセット', total:19800, status:'発送済', cls:'ok'}
    ];
    return `
      ${header({back:true,title:'注文履歴'})}
      <div>${sample.map(s=>`
        <div class="hist-item">
          <div class="head"><span class="id">${s.id}</span><span class="total">${yen(s.total)}</span></div>
          <div class="body">${s.date} · ${s.items}</div>
          <div class="ftr"><span class="hist-status ${s.cls}">${s.status}</span></div>
        </div>
      `).join('')}</div>
      <div class="spacer"></div>
      ${tabbar('history')}
    `;
  },

  mypage(){
    return `
      ${header({back:false,title:'マイページ'})}
      <div class="mp-hero">
        <div class="av">美</div>
        <div class="n">佐藤 美月 様</div>
        <div class="rank">VIP会員 · ポイント残高 <span class="pt">1,420 pt</span></div>
      </div>
      <div class="mp-stats">
        <div><div class="lab">注文数</div><div class="num">5</div></div>
        <div><div class="lab">LTV</div><div class="num">¥47,280</div></div>
        <div><div class="lab">レビュー</div><div class="num">3</div></div>
      </div>
      <div class="mp-list">
        <a href="#/history"><span class="ic">${ic.doc}</span>注文履歴<span class="arr">›</span></a>
        <a href="#/fav"><span class="ic">${ic.heart}</span>お気に入り<span class="arr">›</span></a>
        <a href="#/rank"><span class="ic">${ic.award}</span>会員ランク<span class="arr">›</span></a>
        <a href="#/coupons"><span class="ic">${ic.ticket}</span>クーポン<span class="arr">›</span></a>
        <a href="#/address"><span class="ic">${ic.pin}</span>住所帳<span class="arr">›</span></a>
        <a href="#/contact"><span class="ic">${ic.phone}</span>お問い合わせ<span class="arr">›</span></a>
      </div>
      <div class="spacer"></div>
      ${tabbar('mypage')}
    `;
  },

  search(){
    return `
      ${header({back:false,title:'検索'})}
      <div style="padding:18px 22px 8px"><input style="width:100%;padding:13px 16px;border:1px solid var(--rule);border-radius:4px;font-size:13px;background:var(--surface)" placeholder="商品名・キーワードで検索"></div>
      <div style="padding:6px 22px">
        <div style="font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--ink-3);font-weight:500;margin:14px 0 10px">POPULAR</div>
        <div>${['フェムケア','サプリ','スターター','オイル','コラーゲン','セット'].map(t=>`<span style="display:inline-block;padding:6px 13px;margin:0 6px 8px 0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;font-size:12px;color:var(--ink-2)">${t}</span>`).join('')}</div>
      </div>
      <div class="sec-h"><h2>新着商品</h2><span class="n">NEW IN</span></div>
      <div class="grid">${products.filter(p=>p.status==='公開').slice(0,4).map(smallCard).join('')}</div>
      <div class="spacer"></div>
      ${tabbar('search')}
    `;
  }
};

window.selImg = (i, src) => {
  document.getElementById('gimg').src = src;
  document.querySelectorAll('.thumbs img').forEach((t,idx)=>t.classList.toggle('on', idx===i));
  document.querySelectorAll('.dots i').forEach((d,idx)=>d.classList.toggle('on', idx===i));
};
window.selVar = el => {
  document.querySelectorAll('.var-row').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
};
window.qChg = d => {
  const e = document.getElementById('qty');
  e.textContent = Math.max(1, +e.textContent + d);
};
window.addCart = pid => {
  const p = products.find(x=>x.id===pid);
  if(!p || p.stock<=0) return;
  const qty = +document.getElementById('qty').textContent;
  const v = document.querySelector('.var-row.on');
  const variant_id = v ? v.dataset.vid : (p.variants?.[0]?.id || pid);
  const variant = p.variants?.find(x=>x.id===variant_id);
  const variant_label = variant ? variant.label : '';
  const price = variant ? variant.price : p.price;
  const existing = cart.find(c=>c.product_id===pid && c.variant_id===variant_id);
  if(existing) existing.qty += qty;
  else cart.push({product_id:pid, variant_id, name:p.name, variant_label, price, qty, thumbnail:p.thumbnail});
  saveCart();
  toast(`${p.name}をカートに追加`);
  setTimeout(()=>route('#/cart'), 500);
};
window.cartQ = (i, d) => { cart[i].qty = Math.max(1, cart[i].qty + d); saveCart(); route(); };
window.placeOrder = () => { cart=[]; saveCart(); toast('ご注文ありがとうございます'); setTimeout(()=>{ location.hash='#/history'; }, 1100); };

function route(hash){
  if(hash) location.hash = hash;
  const h = (location.hash || '#/').replace(/^#\//,'');
  const parts = h.split('/');
  const key = parts[0] || '';
  const sub = parts[1];
  let html = '';
  if(!key) html = views.home();
  else if(key==='p' && sub) html = views.product(sub);
  else if(key==='cart') html = views.cart();
  else if(key==='checkout') html = views.checkout();
  else if(key==='history') html = views.history();
  else if(key==='mypage') html = views.mypage();
  else if(key==='search') html = views.search();
  else html = views.home();
  document.getElementById('app').innerHTML = html;

  if(!key){
    drawGrid();
    document.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{
      document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); drawGrid();
    });
  }
  window.scrollTo(0,0);
}

function drawGrid(){
  const grid = document.getElementById('grid'); if(!grid) return;
  const sel = document.querySelector('.cat.on')?.dataset.c || 'all';
  const list = products.filter(p=>p.status==='公開' && (sel==='all'||p.category===sel));
  grid.innerHTML = list.map(smallCard).join('');
}

window.addEventListener('hashchange', ()=>route());
window.route = route;
loadData().then(()=>route());
</script>
</body>
</html>
