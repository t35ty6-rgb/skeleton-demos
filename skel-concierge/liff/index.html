<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>面談 日程 の 御相談 · Skel Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7;
  --panel:#FFFFFF;
  --ink:#0B0D10;
  --ink-2:#40444C;
  --ink-3:#7A8090;
  --mute:#B3B8C2;
  --line:rgba(15,17,20,0.10);
  --green:#06C755;
  --green-2:#04A344;
  --green-tint:rgba(6,199,85,0.11);
  --alert:#E24A3D;
  --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --num:"Inter","Noto Sans JP",sans-serif;
  --ease-out:cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100dvh;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:14.5px;line-height:1.6;
  font-weight:500;font-feature-settings:"palt" 1;
  display:flex;flex-direction:column;
}
button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.head{
  padding:calc(16px + env(safe-area-inset-top)) 18px 12px;background:var(--panel);
  border-bottom:0.5px solid var(--line);text-align:center;flex-shrink:0;
}
.head .title{font-size:15px;font-weight:800;letter-spacing:0.01em}
.head .sub{
  font-family:var(--num);font-size:10.5px;color:var(--ink-3);font-weight:700;
  letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;
  display:flex;align-items:center;gap:5px;justify-content:center;
}
.head .sub::before{content:"";width:5px;height:5px;background:var(--green);border-radius:50%}

.body{flex:1;overflow-y:auto;padding:22px 18px 24px;display:flex;flex-direction:column;gap:20px}

.hero{
  background:var(--panel);border-radius:20px;padding:20px 18px;
  box-shadow:0 1px 2px rgba(15,17,20,0.04), 0 4px 16px -6px rgba(15,17,20,0.10);
  display:flex;flex-direction:column;gap:12px;
}
.hero .who{display:flex;align-items:center;gap:12px}
.hero .av{
  width:44px;height:44px;border-radius:50%;background:#3F4045;color:#FFF;
  font-size:18px;font-weight:800;display:grid;place-items:center;flex-shrink:0;
}
.hero .who-info .n{font-size:14px;font-weight:800;letter-spacing:0.01em}
.hero .who-info .r{
  font-family:var(--num);font-size:10.5px;font-weight:700;color:var(--ink-3);
  letter-spacing:0.06em;text-transform:uppercase;margin-top:1px;
}
.hero h1{font-size:19px;font-weight:800;letter-spacing:0.005em;line-height:1.4;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--green-2)}
.hero p{font-size:14px;color:var(--ink-2);line-height:1.7;font-weight:500}
.hero p b{color:var(--ink);font-weight:700}

.eye{
  font-family:var(--num);font-size:10.5px;font-weight:800;
  color:var(--ink-3);letter-spacing:0.14em;text-transform:uppercase;padding:0 4px;
  display:flex;align-items:center;gap:8px;
}
.eye::before,.eye::after{content:"";flex:1;height:1px;background:var(--line)}

.slots{display:flex;flex-direction:column;gap:10px}
.slot{
  display:grid;grid-template-columns:56px 1fr 20px;gap:14px;align-items:center;
  padding:0 16px 0 0;background:var(--panel);border:0;border-radius:16px;
  cursor:pointer;text-align:left;min-height:76px;overflow:hidden;font-family:inherit;
  box-shadow:0 1px 2px rgba(15,17,20,0.04), 0 4px 12px -6px rgba(15,17,20,0.08);
  transition:transform 140ms var(--ease-out), box-shadow 140ms var(--ease-out);
}
.slot:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(15,17,20,0.06), 0 6px 16px -4px rgba(15,17,20,0.10)}
.slot:active{transform:scale(0.985)}
.slot .band{
  align-self:stretch;background:linear-gradient(180deg,#F0F0F2,#E1E1E5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:12px 6px;color:var(--ink-3);
}
.slot .band .m{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;line-height:1}
.slot .band .d{font-family:var(--num);font-size:24px;font-weight:800;letter-spacing:-0.02em;line-height:1;color:var(--ink)}
.slot .band .dow{font-family:var(--num);font-size:10.5px;font-weight:700;letter-spacing:0.06em;line-height:1;text-transform:uppercase}
.slot .lbl{display:flex;flex-direction:column;gap:3px;min-width:0}
.slot .when{
  font-family:var(--num);font-size:17px;font-weight:800;color:var(--ink);
  letter-spacing:-0.005em;font-variant-numeric:tabular-nums;
}
.slot .m{font-size:12.5px;color:var(--ink-3);font-weight:600}
.slot .chev{
  color:var(--ink-3);background:currentColor;width:9px;height:14px;flex-shrink:0;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M8 5l7 7-7 7'/></svg>") no-repeat center/contain;
       mask:url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M8 5l7 7-7 7'/></svg>") no-repeat center/contain;
  transition:transform 140ms var(--ease-out), color 140ms var(--ease-out);
}
.slot:hover .chev{transform:translateX(2px);color:var(--ink-2)}
.slot[aria-checked="true"]{
  box-shadow:0 0 0 2px var(--green), 0 4px 16px -4px rgba(6,199,85,0.24), 0 2px 4px rgba(4,163,68,0.10);
  transform:translateY(-1px);
}
.slot[aria-checked="true"] .band{
  background:linear-gradient(180deg,var(--green),var(--green-2));color:#FFF;
}
.slot[aria-checked="true"] .band .d,.slot[aria-checked="true"] .band .m,.slot[aria-checked="true"] .band .dow{color:#FFF}
.slot[aria-checked="true"] .chev{
  color:var(--green-2);width:16px;height:16px;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' d='M5 12l5 5L20 6'/></svg>") no-repeat center/contain;
       mask:url("data:image/svg+xml;utf8,<svg viewBox='0 0 24 24'><path fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' d='M5 12l5 5L20 6'/></svg>") no-repeat center/contain;
}

.foot{
  padding:14px 18px calc(20px + env(safe-area-inset-bottom));background:var(--panel);
  box-shadow:0 -1px 0 rgba(15,17,20,0.06), 0 -10px 20px -12px rgba(15,17,20,0.10);
  flex-shrink:0;
}
.cta{
  width:100%;min-height:56px;padding:16px;
  background:linear-gradient(180deg,var(--green),var(--green-2));color:#FFF;
  border:0;border-radius:28px;font-family:inherit;
  font-size:16px;font-weight:800;letter-spacing:0.01em;
  box-shadow:0 2px 4px rgba(4,163,68,0.32), 0 12px 24px -6px rgba(4,163,68,0.44), inset 0 1px 0 rgba(255,255,255,0.28);
  transition:transform 140ms var(--ease-spring), box-shadow 140ms var(--ease-out);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.cta:hover{box-shadow:0 4px 8px rgba(4,163,68,0.36), 0 16px 32px -6px rgba(4,163,68,0.52), inset 0 1px 0 rgba(255,255,255,0.32)}
.cta:active{transform:scale(0.97)}
.cta:disabled{background:linear-gradient(180deg,#BFC3CB,#A8ACB4);cursor:not-allowed;box-shadow:none;color:rgba(255,255,255,0.85)}
.cta.confirming{background:linear-gradient(180deg,var(--green-2),#036A2E);pointer-events:none}
.cta .spin{
  display:inline-block;width:16px;height:16px;border:2.4px solid rgba(255,255,255,0.32);border-top-color:#FFF;
  border-radius:50%;animation:spin 700ms linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cta .spin{animation:none}}

.nope{text-align:center;padding:14px;font-size:13px;color:var(--ink-3);line-height:1.5;font-weight:500}
.nope a{color:var(--green-2);font-weight:700;text-decoration:underline;text-decoration-color:rgba(4,163,68,0.3);text-underline-offset:3px}

/* Success screen */
.done{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  text-align:center;padding:20px 24px;gap:20px;flex:1;
}
.done .check-wrap{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-top:12px}
.done .check-wrap::before,.done .check-wrap::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--green);opacity:0;animation:pulse-ring 1.8s var(--ease-out) infinite;
}
.done .check-wrap::after{animation-delay:0.6s}
@keyframes pulse-ring{0%{transform:scale(0.9);opacity:0.6}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.done .check-wrap::before,.done .check-wrap::after{animation:none;opacity:0}}
.done .check{
  width:80px;height:80px;background:linear-gradient(180deg,var(--green),var(--green-2));color:#FFF;border-radius:50%;
  display:grid;place-items:center;
  box-shadow:0 4px 8px rgba(4,163,68,0.36), 0 16px 32px -8px rgba(4,163,68,0.56), inset 0 1px 0 rgba(255,255,255,0.28);
  animation:check-in 480ms var(--ease-spring) both;
}
.done .check svg{width:40px;height:40px;stroke-width:3.5}
@keyframes check-in{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
.done h3{font-size:22px;font-weight:800;letter-spacing:0.005em;line-height:1.35;color:var(--ink);text-wrap:balance;padding:0 8px}
.done .b{font-size:14px;color:var(--ink-2);line-height:1.75;font-weight:500}
.done .b b{color:var(--ink);font-weight:700}
.done .zoom-card{
  margin-top:4px;padding:16px;background:var(--panel);border-radius:16px;width:100%;text-align:left;
  box-shadow:0 1px 2px rgba(15,17,20,0.04), 0 4px 16px -6px rgba(15,17,20,0.10);
  display:flex;flex-direction:column;gap:10px;
}
.done .zoom-card .row{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:baseline;font-size:13px}
.done .zoom-card .k{font-family:var(--num);font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:0.14em;text-transform:uppercase}
.done .zoom-card .v{color:var(--ink);font-weight:700;font-family:var(--num);word-break:break-all;font-size:12.5px}

.error-box{padding:14px 16px;background:rgba(226,74,61,0.08);border:1px solid rgba(226,74,61,0.28);border-radius:12px;color:var(--alert);font-size:13px;line-height:1.55;font-weight:600}
</style>
</head>
<body>

<div class="head">
  <div class="title">面談 日程 の 御相談</div>
  <div class="sub">Skel Concierge</div>
</div>

<div class="body" id="body">
  <!-- injected: select | done | error -->
  <div style="text-align:center;padding:40px 16px;color:var(--ink-3);font-size:13px">読み込み 中…</div>
</div>

<div class="foot" id="foot" style="display:none">
  <button type="button" class="cta" id="cta" disabled>この 日 で 確定 する</button>
</div>

<!-- Optional config: set window.__LIFF_ID__ / window.__API_URL__ (see config.example.js) -->
<script src="config.js" onerror="void 0"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const CFG = {
  LIFF_ID:      new URLSearchParams(location.search).get('_liffid') || (window.__LIFF_ID__ || 'PASTE_LIFF_ID'),
  API_URL:      window.__API_URL__ || (new URLSearchParams(location.search).get('_api') || ''),
};

const state = { meetingId: null, slots: [], selectedIdx: null, mode: 'select' };

const $ = s => document.querySelector(s);
const bodyEl = () => $('#body');
const footEl = () => $('#foot');

async function init(){
  const params = new URLSearchParams(location.search);
  state.meetingId = params.get('meetingId');
  if (!state.meetingId) return renderError('meetingId が URL に ありません。 LINE の 御案内 から お開き ください。');
  if (!CFG.LIFF_ID || CFG.LIFF_ID === 'PASTE_LIFF_ID') return renderError('LIFF_ID が 未 設定 です (config)');

  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  } catch(e) {
    console.error(e);
    return renderError('LIFF 初期化 に 失敗 しました: ' + e.message);
  }

  // Fetch meeting slots via API
  try {
    const idToken = liff.getIDToken();
    const profile = await liff.getProfile();
    state.name = profile.displayName || 'お客';
    const res = await fetch(CFG.API_URL + '?type=api&op=get-meeting&meetingId=' + encodeURIComponent(state.meetingId) + '&token=' + encodeURIComponent(idToken), {
      method:'GET', mode:'cors',
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API error');
    state.slots = j.meeting && j.meeting.proposedSlots || [];
    if (!state.slots.length) return renderError('候補 日程 が 見つかり ませんでした。 担当 まで お知らせ ください。');
  } catch(e) {
    // Fallback: allow LIFF to render with slots from URL param `slots=<encoded json>` (for testing without API)
    const inlineSlots = params.get('slots');
    if (inlineSlots) {
      try { state.slots = JSON.parse(decodeURIComponent(inlineSlots)); } catch(_){}
    }
    if (!state.slots.length) {
      console.error(e);
      return renderError('候補 日程 の 取得 に 失敗 しました。 通信 環境 を 御確認 ください。');
    }
  }

  renderSelect();
}

function renderSelect(){
  state.mode = 'select';
  footEl().style.display = '';
  const short = (state.name || 'お客').split(' ')[0];
  bodyEl().innerHTML = `
    <div class="hero">
      <div class="who">
        <div class="av">吉</div>
        <div class="who-info">
          <div class="n">Skel Concierge · 担当</div>
          <div class="r">面談 御案内</div>
        </div>
      </div>
      <h1>${short}さま、<br><em>面談 日時</em> を お選び ください。</h1>
      <p>一つ 選ぶ と <b>Zoom URL が 自動 発行</b> され、 この LINE トーク に 届きます。</p>
    </div>
    <div class="eye">候補 3 つ · タップ で 選択</div>
    <div class="slots">
      ${state.slots.map((s, i) => {
        const p = parseSlot(s.label || '');
        return `
          <button type="button" class="slot" data-idx="${i}" aria-checked="false" role="radio">
            <span class="band" aria-hidden="true">
              <span class="m">${p.month}</span>
              <span class="d">${p.day}</span>
              <span class="dow">${p.dow}</span>
            </span>
            <span class="lbl">
              <span class="when">${p.time || s.label}</span>
              <span class="m">${s.sub || '45 分 · Zoom'}</span>
            </span>
            <span class="chev" aria-hidden="true"></span>
          </button>
        `;
      }).join('')}
    </div>
    <div class="nope">いずれ も 難しい 方 は <a href="#" data-nope>別 の 候補 を 相談</a></div>
  `;
  document.querySelectorAll('.slot').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.slot').forEach(x => x.setAttribute('aria-checked', 'false'));
      btn.setAttribute('aria-checked', 'true');
      state.selectedIdx = parseInt(btn.dataset.idx, 10);
      $('#cta').disabled = false;
    });
  });
  document.querySelector('[data-nope]')?.addEventListener('click', (e) => {
    e.preventDefault();
    sendNope();
  });
}

$('#cta').addEventListener('click', async () => {
  if (state.mode !== 'select') return;
  if (state.selectedIdx == null) return;
  $('#cta').classList.add('confirming');
  $('#cta').innerHTML = '<span class="spin" aria-hidden="true"></span>Zoom URL を 発行 中…';

  try {
    const idToken = liff.getIDToken();
    const res = await fetch(CFG.API_URL + '?type=liff-pick', {
      method:'POST', mode:'cors',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ meetingId: state.meetingId, idToken, selectedIndex: state.selectedIdx }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'API error');
    renderDone(j);
  } catch(e) {
    console.error(e);
    renderError('確定 処理 に 失敗 しました: ' + e.message);
  }
});

async function sendNope(){
  const msg = '御案内 ありがとう ございます。 恐れ入り ます が、 その 日程 は いずれ も 難しく… 別 の 候補 を 御相談 させて 頂けます か。';
  if (liff.isInClient()) {
    try { await liff.sendMessages([{ type:'text', text: msg }]); } catch(_) {}
    liff.closeWindow();
  } else {
    alert('デモ モード: 「' + msg + '」 を 送信 したと 見なします');
  }
}

function renderDone(res){
  state.mode = 'done';
  footEl().style.display = 'none';
  bodyEl().innerHTML = `
    <div class="done">
      <div class="check-wrap">
        <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></div>
      </div>
      <h3>${res.dateLabel} ${res.time}<br>で 確定 しました。</h3>
      <div class="b">Zoom URL を <b>この LINE トーク</b> に お送り しました。<br>開始 <b>15 分前</b> に リマインド が 届き ます。</div>
      <div class="zoom-card">
        <div class="row"><span class="k">日時</span><span class="v">${res.dateLabel} ${res.time}</span></div>
        <div class="row"><span class="k">Zoom</span><span class="v">${res.zoomUrl}</span></div>
      </div>
    </div>
  `;
  setTimeout(() => { if (liff.isInClient && liff.isInClient()) liff.closeWindow(); }, 3200);
}

function renderError(msg){
  footEl().style.display = 'none';
  bodyEl().innerHTML = `<div class="error-box">${msg}</div>`;
}

function parseSlot(label){
  const dateM = label.match(/(\d{1,2})\/(\d{1,2})\s*\(([月火水木金土日])\)/);
  const timeM = label.match(/(\d{1,2}:\d{2})\s*[–\-〜]\s*(\d{1,2}:\d{2})/);
  const monthName = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const dowJp = { '月':'MON','火':'TUE','水':'WED','木':'THU','金':'FRI','土':'SAT','日':'SUN' };
  if (dateM) {
    const m = parseInt(dateM[1],10), d = parseInt(dateM[2],10);
    return { month: monthName[m-1] || '', day: String(d), dow: dowJp[dateM[3]] || '', time: timeM ? `${timeM[1]} 〜 ${timeM[2]}` : label };
  }
  return { month:'', day:'?', dow:'', time: label };
}

init();
</script>
</body>
</html>
