<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FP Compass — ファイナンシャルプランナー向け顧客管理ツール (デモ)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-title">
    <span class="logo">FP</span>
    FP Compass <span class="sub">/ Skeleton Inc.</span>
  </div>
  <div class="app-meta" id="app-meta">—</div>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="dashboard">ダッシュボード</div>
  <div class="tab" data-tab="clients">顧客一覧</div>
  <div class="tab" data-tab="timeline">ライフイベント・マップ</div>
</nav>

<div class="container">

  <!-- ===== ダッシュボード ===== -->
  <section class="view active" data-view="dashboard">
    <div class="section-title">概況</div>
    <div class="kpi-row" id="kpi-area"></div>

    <div class="section-title" style="margin-top:24px;">今週話すべき顧客 (優先度順)</div>
    <div class="action-list" id="action-list"></div>

    <div style="margin-top:24px;font-size:11.5px;color:var(--muted);">
      ※ 優先度は「ライフイベントの近さ × 重要度 × 最終接触からの経過」を組み合わせて自動算出しています。
    </div>
  </section>

  <!-- ===== 顧客一覧 ===== -->
  <section class="view" data-view="clients">
    <div class="section-title">顧客一覧 (最終接触日が古い順)</div>
    <div class="client-toolbar">
      <input type="search" id="client-search" placeholder="名前 / 職業で検索">
      <select id="status-filter">
        <option value="all">全ステータス</option>
        <option value="important">重点</option>
        <option value="active">管理中</option>
        <option value="new">新規</option>
        <option value="dormant">休眠</option>
      </select>
      <span class="count" id="client-count">—</span>
    </div>
    <table class="clients">
      <thead>
        <tr>
          <th>顧客</th>
          <th>年齢</th>
          <th class="hide-mobile">職業</th>
          <th>家族</th>
          <th>状態</th>
          <th style="text-align:right;">管理資産</th>
          <th>最終接触</th>
        </tr>
      </thead>
      <tbody id="client-tbody"></tbody>
    </table>
  </section>

  <!-- ===== ライフイベント・マップ ===== -->
  <section class="view" data-view="timeline">
    <div class="section-title">向こう15年のライフイベント・マップ</div>
    <div class="timeline-container" id="timeline-area"></div>
    <div style="margin-top:10px;font-size:11.5px;color:var(--muted);">
      ※ 顧客の家族構成と生年月日から、進学・退職・年金・後期高齢・住宅ローン完済などのイベントを自動展開。クリックで顧客詳細を開きます。
    </div>
  </section>

</div>

<!-- ===== 顧客詳細モーダル ===== -->
<div class="modal-overlay" id="modal-overlay" style="display:none;">
  <div class="modal" id="modal-content"></div>
</div>

<script src="dummy-data.js"></script>
<script src="life-events.js"></script>
<script src="recommender.js"></script>
<script src="app.js"></script>

</body>
</html>
