<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>ROSE - 予約</title><link rel="stylesheet" href="style.css">
<style>body { background: #f0f0f0; }</style>
</head>
<body>
<div class="line-page">
  <div class="line-status">
    <span>9:42</span>
    <div class="ind">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12a2 2 0 1 1 4 0v6a2 2 0 0 1-4 0zm6-4a2 2 0 1 1 4 0v10a2 2 0 0 1-4 0zm6-4a2 2 0 1 1 4 0v14a2 2 0 0 1-4 0zm6-2a2 2 0 1 1 4 0v16a2 2 0 0 1-4 0z"/></svg>
      <span style="font-size:13px;">87%</span>
    </div>
  </div>

  <div class="liff-page">
    <div class="liff-head">
      <div class="back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
      <div class="title">ご予約</div>
      <div class="salon-mini">ROSE Beauty Salon</div>
    </div>

    <div class="progress-bar"><div class="pf" style="width:66%;"></div></div>

    <div class="liff-body">

      <div class="liff-hero">
        <div class="lh-eyebrow">STEP 2 / 3 ─ DATE & TIME</div>
        <div class="lh-title">ご希望の日時を<br>お選びください</div>
        <div class="lh-sub">ヘッドスパ＋フェイシャル 90分 ／ ¥12,200</div>
      </div>

      <div class="section-ttl">6月 ─ 今週</div>
      <div class="cal-strip">
        <div class="cd dis"><div class="dow">月</div><div class="dnum">9</div></div>
        <div class="cd"><div class="dow">火</div><div class="dnum">10</div></div>
        <div class="cd"><div class="dow">水</div><div class="dnum">11</div></div>
        <div class="cd sel"><div class="dow">木</div><div class="dnum">12</div></div>
        <div class="cd"><div class="dow">金</div><div class="dnum">13</div></div>
        <div class="cd"><div class="dow">土</div><div class="dnum">14</div></div>
        <div class="cd"><div class="dow">日</div><div class="dnum">15</div></div>
      </div>

      <div class="section-ttl">6月12日（木）の空き枠</div>
      <div class="slot-grid">
        <div class="sl dis">10:00</div>
        <div class="sl">11:00</div>
        <div class="sl">13:00</div>
        <div class="sl sel">14:30</div>
        <div class="sl dis">16:00</div>
        <div class="sl">17:30</div>
        <div class="sl">19:00</div>
        <div class="sl dis">20:30</div>
      </div>

      <div class="section-ttl">担当者（任意）</div>
      <div class="opt-grid">
        <div class="opt-tile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
          指定なし
        </div>
        <div class="opt-tile sel">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
          山本 真奈
        </div>
      </div>

    </div>

    <div class="confirm-bar">
      <div class="summary">
        <span>メニュー</span><strong>ヘッドスパ＋フェイシャル</strong>
      </div>
      <div class="summary">
        <span>日時</span><strong>6/12（木）14:30〜</strong>
      </div>
      <div class="summary">
        <span>担当</span><strong>山本 真奈</strong>
      </div>
      <div class="confirm-btn">この内容で予約する　▶</div>
    </div>

  </div>
</div>
</body></html>
